const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),norm=v=>((v%P2)+P2)%P2,eio=k=>{k=cl(k,0,1);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2},eob=k=>{k=cl(k,0,1);const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)},rnd=(a,b)=>a+Math.random()*(b-a);

function tx(s,px,py,font,col,bl,al){x.save();x.font=font;x.fillStyle=col;x.textAlign=al||'center';x.textBaseline=bl||'alphabetic';x.fillText(s,px,py);x.restore()}

 else if(zi===1){circle(cx,cy,R,'#8C849E');circle(cx,cy,R*.86,'#B9B2C8');const rot=Math.sin(t*1.2)*1.4;for(let i=0;i<40;i++){const q=i/40*P2+rot;x.beginPath();x.moveTo(cx+Math.sin(q)*R*.68,cy-Math.cos(q)*R*.68);x.lineTo(cx+Math.sin(q)*R*(i%5?.77:.82),cy-Math.cos(q)*R*(i%5?.77:.82));x.strokeStyle='#5E5672';x.lineWidth=(i%5?1:2)*k;x.stroke()}circle(cx,cy,R*.5,'#D9D3E4');circle(cx,cy,R*.16,'#8C849E');x.fillStyle='#FF8E5C';x.beginPath();x.moveTo(cx,cy-R*1.04);x.lineTo(cx-5*k,cy-R*1.22);x.lineTo(cx+5*k,cy-R*1.22);x.fill()}

 for(let i=0;i<16;i++){const q=i/16*P2,card=i%4===0,inter=i%2===0,L=R*(card?.98:inter?.7:.48),wd=card?.11:inter?.09:.07;for(let h=0;h<2;h++){x.beginPath();x.moveTo(195,cy);x.lineTo(195+Math.sin(q)*L,cy-Math.cos(q)*L);x.lineTo(195+Math.sin(q+(h?wd:-wd))*R*.16,cy-Math.cos(q+(h?wd:-wd))*R*.16);x.closePath();x.fillStyle=i===0?(h?'#FFC9AC':'#FFDCC8'):card?(h?'#D5C8F6':'#E6DDFB'):inter?(h?'#E2D8FA':'#EEE8FC'):(h?'#ECE6FB':'#F4F0FD');x.fill()}}
