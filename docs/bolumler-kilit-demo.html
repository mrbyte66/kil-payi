<h2 class="sr-only">Bölümler kilit demosu: 19 kilit, Bölüm 25 görünüşü, başta, orta ve en zor adım</h2>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>#kd{width:350px;max-width:100%;margin:0 auto;user-select:none}#kc{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:0 0 8px}#kc button,#ks button{border:0;border-radius:14px;padding:5px 9px;font:800 11.5px Nunito,sans-serif;background:#EDE8FA;color:#6A5FA0;cursor:pointer}#kc button.on,#ks button.on{background:#6C55E0;color:#fff}#ks{display:flex;gap:5px;justify-content:center;margin:0 0 8px}#bz{border-radius:26px;overflow:hidden;background:#F4F1FC;touch-action:manipulation}#cv{display:block;width:100%;cursor:pointer;touch-action:none}</style>
<div id="kd"><div id="kc"></div><div id="ks"></div><div id="bz"><canvas id="cv" width="780" height="1440"></canvas></div></div>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),W=390,H=720,CX=195,CY=360,R=132,R2=88,P2=Math.PI*2,INK='#2A2347',SUB='#6A5FA0',FD='Fredoka, sans-serif',FB='Nunito, sans-serif';
const norm=v=>((v%P2)+P2)%P2,ad=(p,q)=>{const d=norm(p-q);return Math.min(d,P2-d)},sd=(p,q)=>{let d=norm(p-q);return d>Math.PI?d-P2:d},Pt=(q,r)=>[CX+Math.sin(q)*r,CY-Math.cos(q)*r];
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),eob=k=>{k=cl(k,0,1);const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)},eo=k=>1-Math.pow(1-cl(k,0,1),3),rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const LK=[['tek','Tek pim'],['cift','Çift pim'],['kayan','Kayan pim'],['nefes','Nefes pim'],['kasa','Kasa turu'],['tut','Tut-bırak'],['trafik','Trafik ışığı'],['sabir','Sabır pimi'],['gelgit','Gelgit'],['ritim','Ritim pim'],['yon','Yön değiştir'],['zirh','Zırhlı pim'],['ani','Ani pim'],['bomba','Bomba pim'],['hayalet','Hayalet pim'],['degirmen','Değirmen'],['nabiz','Nabız'],['isin','Işınlanma'],['iki','İki halka']];
const STEPS=[[1,'Başta'],[3,'Orta'],[5,'En zor']],WAVES=8;
let LI=0,STEP=1,K='tek',BASE=2.2,HW=.5,auto=true;
let st='ready',t=0,last=0,a=0,v=1,dir=1,wave=0,T=[],TR=[],lives=3,miss=0,stT=0,combo=0,best=0,lane=0,laneR=R,laneFrom=R,laneT=-9;
let PS=[],SH=[],RG=[],TX=[],XS=[],EM=[];
let shake=0,red=0,pulse=0,pulseC='#FFA77C',sweep=-9,wavePop=-9,progV=0,slosh=0,np=0,lifeFx=[-9,-9,-9];
let X={};
const late=()=>STEP>=3,hard=()=>STEP>=5;
function setup(){K=LK[LI][0];const I=LI/18,k=STEP-1;BASE=2.2+1.2*I+.12*k;HW=Math.max(.15,.5-.22*I-.035*k);if(K==='ritim')HW=.075;st='ready';stT=t;T=[];TR=[];X={};lane=0;laneR=R;dir=1;
 document.querySelectorAll('#kc button').forEach((b,i)=>b.className=i===LI?'on':'');document.querySelectorAll('#ks button').forEach((b,i)=>{if(STEPS[i])b.className=STEPS[i][0]===STEP?'on':''})}
const kc=document.getElementById('kc'),ks=document.getElementById('ks');
LK.forEach((l,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+l[1];b.onclick=()=>{LI=i;setup();start()};kc.appendChild(b)});
STEPS.forEach(s=>{const b=document.createElement('button');b.textContent=s[0]+'. adım · '+s[1];b.onclick=()=>{STEP=s[0];setup();start()};ks.appendChild(b)});
const ab=document.createElement('button');ab.textContent='Otomatik: açık';ab.className='on';ab.onclick=()=>{auto=!auto;ab.textContent='Otomatik: '+(auto?'açık':'kapalı');ab.className=auto?'on':''};ks.appendChild(ab);
const tgR=g=>K==='iki'?(g.ln?R2:R):R;
function waveSize(){const r=STEP===1?[2,3]:STEP===3?[3,4]:[4,5];return r[0]+Math.round(Math.random()*(r[1]-r[0]))}
function trapCount(){if(STEP===1)return 0;if(STEP===2)return wave>=WAVES/2?1:0;if(STEP<=4)return 1;return wave>=WAVES-3?2:1}
function freeSpot(ps,min){for(let i=0;i<60;i++){const p=Math.random()*P2;if(ps.every(q=>ad(p,q)>min)&&(K==='isin'||ad(p,a)>.9)&&(K!=='iki'||!X.gates||X.gates.every(g=>ad(p,g)>.5)))return p}return Math.random()*P2}
function newWave(first){T=[];const n=K==='ritim'?(STEP===1?4:5+(STEP===5?1:0)):waveSize();const ps=[];
 if(K==='isin'){X.gIn=norm(a+.7);X.outs=late()?[norm(X.gIn+1.0),norm(X.gIn+1.8)]:[norm(X.gIn+1.4)];}
 if(K==='iki'&&!X.gates)X.gates=[norm(a+1.4),norm(a+4.2)];
 if(K==='ritim'){const gapE=.34,gapL=[.2,.2,.55,.22,.22,.5];let p=norm(a+1.8);for(let i=0;i<n;i++){ps.push(p);p=norm(p+(late()?gapL[i%gapL.length]:gapE))}}
 else if(K==='ani'){X.aniQ=n;X.aniNext=t+.5;}
 else{const block=[];if(K==='isin'){block.push(X.gIn);X.outs.forEach(o=>{block.push(o,norm(o+.35),norm(o+.7))})}
  if(K==='isin'){const lo=norm(X.outs[X.outs.length-1]-X.gIn)+.75,hi=P2-.5,stp=(hi-lo)/n;for(let i=0;i<n;i++)ps.push(norm(X.gIn+lo+stp*(i+.5)+rnd(-.15,.15)*stp))}else for(let i=0;i<n;i++)ps.push(freeSpot(ps,HW*2+.3))}
 const order=ps.map((p,i)=>i).sort((i,j)=>norm(ps[i]-a)-norm(ps[j]-a));
 ps.forEach((p,i)=>{const g={p,p0:p,ph:Math.random()*6,born:t+i*.07,dead:-1,ln:0};
  if(K==='kayan'){g.kd=late()?(i%2?-1:1):1;g.kph=late()?Math.random()*6:0}
  if(K==='nefes')g.ph=late()?i*2.1+Math.random():0;
  if(K==='kasa'){const r=order.indexOf(i);g.num=r+1}
  if(K==='tut'&&i===0){g.hold=1;g.hw0=Math.max(HW*1.8,.42)}
  if(K==='trafik'){g.trick=late()&&Math.random()<(hard()?.6:.4);g.tp=Math.random()*6}
  if(K==='sabir'){g.need=late()?1+(i%3):(i===0?2:0);g.pass=0}
  if(K==='zirh'){g.lay=late()?1+Math.floor(Math.random()*3):3;g.max=g.lay}
  if(K==='bomba'&&(late()||i===0)){g.fuse=(late()?[7,4.6,5.8,8,6.4][i%5]:7.5)*(2.6/BASE);g.fb=t}
  if(K==='hayalet'){g.fade=late()?(Math.random()<.5?-1:t+rnd(1,2.2)):t+1.4;g.al=1}
  if(K==='iki'){if(hard())g.ln=Math.random()<.5?1:0;else{const f=norm(p-a);let c=0;X.gates.forEach(gp=>{if(norm(gp-a)<f)c++});g.ln=lane^(c%2);if(late()&&Math.random()<.3)g.ln^=1}}
  T.push(g)});
 if(K==='kasa')T.forEach(g=>{});
 if(K==='kasa'&&late()){const nums=T.map(g=>g.num);for(let i=nums.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]]}T.forEach((g,i)=>g.num=nums[i])}
 X.next=1;
 TR.forEach(r=>{if(r.dead<0)r.dead=t});TR=TR.filter(r=>t-r.dead<.4);
 const nt=K==='degirmen'?0:trapCount();for(let i=0;i<nt;i++){const p=freeSpot(ps.concat(TR.map(r=>r.p)),HW+.3);TR.push({p,w:.11,born:t+.2+i*.09,dead:-1,hit:-9,ln:K==='iki'?(Math.random()<.5?1:0):0})}
 if(K==='gelgit'){X.bands=late()?[{c:norm(a+1.2),w:.55}]:[{c:freeSpot(ps,.6),w:.55},{c:freeSpot(ps,.6),w:.55}]}
 if(K==='degirmen'&&X.mw==null){X.mw=0;X.ms=.7;X.mt=0;X.mf=-9}}
function start(){st='play';stT=t;wave=0;lives=3;miss=0;combo=0;best=0;TR=[];EM=[];X={};dir=1;lane=0;laneR=R;newWave(true);lifeFx=[-9,-9,-9];v=BASE*.5}
const live=g=>g.dead<0&&t-g.born>.12;
function hw(g){let w=HW;if(g.hold)w=g.hw0;if(K==='nefes'){const f=.5+.5*Math.sin(t*2.4+g.ph);w*=1-.62*f}if(K==='zirh')w=HW*1.5*(1-.22*(g.max-g.lay));return w}
function curP(g){if(K==='kayan')return norm(g.p0+.42*Math.sin(t*1.25+g.kph)*g.kd);return g.p}
function trafCol(g){if(!late()){return Math.floor(t/1.5+g.tp)%3===0?'r':'g'}if(!g.trick)return'g';const d=norm(dir>0?g.p-a:a-g.p);if(d<.32)return'r';if(d<.8)return'y';return'g'}
function canHit(g){if(!live(g))return false;if(K==='kasa'&&g.num!==X.next)return false;if(K==='sabir'&&g.need&&g.pass<g.need)return false;if(K==='trafik'&&trafCol(g)==='r')return false;if(K==='iki'&&(g.ln!==lane||Math.abs(laneR-(g.ln?R2:R))>8))return false;if(K==='ani'&&g.exp)return false;return true}
function txt(s,px,py,col,big){TX.push({s,x:px,y:py,t0:t,col,big})}
function sparks(px,py,n,cols,sp0,sp1){for(let i=0;i<n;i++){const q=Math.random()*P2,s=rnd(sp0||60,sp1||240);PS.push({x:px,y:py,vx:Math.cos(q)*s,vy:Math.sin(q)*s,l:1,d:rnd(1.2,2.2),c:cols[i%cols.length],r:rnd(1.5,4),k:Math.random()<.4})}}
function shatter(p,w,cols,lw,r){const n=7;for(let i=0;i<n;i++){const q=p+(i/(n-1)-.5)*2*w*.85;SH.push({p:q,w:w/n*.9,r:r||R,vr:rnd(90,260),va:rnd(-.9,.9),l:1,c:cols[i%cols.length],lw:lw||26})}}
function lose(n,s,col){if(st!=='play')return;lives-=n;miss+=n;combo=0;shake=n>1?1.3:.7;red=n>1?1:.6;for(let i=0;i<n;i++)if(lives+i>=0&&lives+i<3)lifeFx[lives+i]=t;
 const[hx,hy]=Pt(a,laneR);XS.push({x:hx,y:hy,t0:t});txt(s,hx,hy-34,col||'#E0446B',n>1);
 if(lives<=0){lives=0;st='lose';stT=t;burn()}}
function burn(){for(let i=0;i<200;i++){const q=Math.random()*P2,[px,py]=Pt(q,R+rnd(-13,13));EM.push({x:px,y:py,vx:rnd(-30,30),vy:rnd(-120,-20),l:1,d:rnd(.5,1.1),r:rnd(1,3.2),f:Math.random()*6})}
 for(let i=0;i<16;i++)SH.push({p:i/16*P2,w:P2/32*.92,r:R,vr:rnd(40,160),va:rnd(-.5,.5),l:1,c:i%2?'#E2DDF4':'#D3CAEC',lw:26});T.forEach(g=>{if(g.dead<0){g.dead=t;shatter(curP(g),hw(g),['#FFA77C','#FF7B3F'],26,tgR(g))}});TR.forEach(r=>r.dead=t)}
function waveDone(){if(!T.every(g=>g.dead>=0)||(K==='ani'&&X.aniQ>0))return;wave++;sweep=t;wavePop=t;for(let i=0;i<30;i++){const q=i/30*P2,[qx,qy]=Pt(q,R);PS.push({x:qx,y:qy,vx:Math.sin(q)*rnd(40,110),vy:-Math.cos(q)*rnd(40,110),l:1,d:rnd(1.4,2),c:i%2?'#C0B4F8':'#FFA77C',r:rnd(1.5,3),k:false})}
 if(wave>=WAVES){st='win';stT=t;pulse=1.6;sparks(CX,CY,90,['#FFA77C','#6C55E0','#F2B73C','#8FDDB5','#C0B4F8'],120,420)}else newWave(false)}
function hitTarget(g,label){const p=curP(g),w=hw(g),r=tgR(g),d=ad(a,p),perfect=d<w*.33;
 if(K==='zirh'&&g.lay>1){g.lay--;const[px,py]=Pt(p,r);shatter(p,w*.5,['#C9BEEE','#fff','#B9ADDC'],14,r);sparks(px,py,12,['#C9BEEE','#fff'],50,180);RG.push({x:px,y:py,t0:t,c:'#C9BEEE',m:50});np=.6;txt('Kırıldı! '+g.lay+' kat',...Pt(p,R+44),'#6A5FA0');return}
 g.dead=t;combo++;best=Math.max(best,combo);
 const[px,py]=Pt(p,r);shatter(p,w,perfect?['#FFD36B','#FF9A4D','#fff']:['#FFA77C','#FF7B3F','#FFD9C5'],26,r);
 sparks(px,py,perfect?34:22,perfect?['#FFD36B','#FF7B3F','#fff']:['#FFA77C','#FF7B3F','#fff']);
 RG.push({x:px,y:py,t0:t,c:perfect?'#FFC44D':'#FFA77C',m:perfect?90:65});if(perfect)RG.push({x:px,y:py,t0:t+.07,c:'#fff',m:55});
 const[tx2,ty2]=Pt(p,R+44);txt(label||(perfect?'Mükemmel!':'İyi'),tx2,ty2,perfect?'#E39A12':'#E0743C',perfect);
 pulse=perfect?1:.7;pulseC=perfect?'#FFC44D':'#FFA77C';np=1;slosh=1;
 if(K==='kasa')X.next++;if(K==='yon'){dir*=-1;X.tell=0}
 waveDone()}
function trapAt(){const r=TR.find(r=>r.dead<0&&t-r.born>.1&&ad(a,r.p)<r.w&&(K!=='iki'||(r.ln?R2:R)===laneR));if(r)return r;if(K==='degirmen'){for(let i=0;i<3;i++){const q=norm(X.mw+i*P2/3);if(ad(a,q)<.16)return{p:q,mill:1}}}return null}
function press(){
 if(st==='ready'){start();return}
 if(st==='lose'||st==='win'){if(t-stT>.8)start();return}
 if(st!=='play')return;
 if(X.tun>0)return;
 const al=trapAt();if(al){if(!al.mill)al.hit=t;const[px,py]=Pt(al.p,laneR);sparks(px,py,30,['#FF5C85','#fff','#C0436B'],80,300);RG.push({x:px,y:py,t0:t,c:'#FF5C85',m:110});lose(K==='kasa'?2:1,K==='kasa'?'Alarm! −2 can':al.mill?'Kanat!':'Tuzak!');return}
 const g=T.find(g=>canHit(g)&&ad(a,curP(g))<hw(g)+.02);
 if(g&&g.hold){const s=norm(dir>0?a-(g.p-hw(g)):(g.p+hw(g))-a);if(s<.3){X.hold=g;g.hs=t;return}lose(1,'Baştan bas!');return}
 if(g){hitTarget(g,K==='sabir'&&g.need?'×3!':K==='bomba'&&g.fuse?'Söndü!':null);return}
 const wrong=T.find(g=>live(g)&&ad(a,curP(g))<hw(g)+.02);
 if(wrong){lose(1,K==='kasa'?'Sıra '+X.next+'!':K==='sabir'?'Kilitli!':K==='trafik'?'Kırmızı!':K==='iki'?'Öbür halka!':'Olmadı!');return}
 let n=null,nd=9;T.forEach(g=>{if(g.dead<0){const d=sd(curP(g),a)*dir;if(Math.abs(d)<Math.abs(nd)){nd=d;n=g}}});lose(1,n&&nd>0?'Erken!':'Geç!')}
function release(){if(!X.hold||st!=='play')return;const g=X.hold;X.hold=null;const e=norm(dir>0?(g.p+hw(g))-a:a-(g.p-hw(g)));if(e<.3||e>P2-.15){hitTarget(g,'Tuttun!')}else{g.hs=0;lose(1,'Erken bıraktın!')}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();press()});cv.addEventListener('pointerup',e=>{e.preventDefault();release()});cv.addEventListener('pointercancel',()=>release());
function bot(){if(!auto||st!=='play'||X.tun>0)return;if(X.hold){const g=X.hold;const e=norm(dir>0?(g.p+hw(g))-a:a-(g.p-hw(g)));if(e<.08)release();return}
 if(trapAt())return;const g=T.find(g=>canHit(g)&&ad(a,curP(g))<hw(g)*(g.hold?1:.3));if(!g)return;if(g.hold){const s=norm(dir>0?a-(g.p-hw(g)):(g.p+hw(g))-a);if(s<.15)press();return}
 if(Math.random()<.92)press()}
function arc(p,w,col,lw,r){if(w<=0)return;x.beginPath();x.arc(CX,CY,r||R,p-Math.PI/2-w,p-Math.PI/2+w);x.strokeStyle=col;x.lineWidth=lw;x.lineCap='butt';x.stroke()}
function circle(px,py,r,f){x.beginPath();x.arc(px,py,Math.max(.1,r),0,P2);x.fillStyle=f;x.fill()}
function tx(s,px,py,font,col,bl,sc){x.save();x.translate(px,py);if(sc)x.scale(sc,sc);x.font=font;x.fillStyle=col;x.textAlign='center';x.textBaseline=bl||'alphabetic';x.fillText(s,0,0);x.restore()}
function rr(px,py,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}
function star(px,py,r,col){x.beginPath();for(let i=0;i<10;i++){const q=i/10*P2-Math.PI/2,k=i%2?r*.45:r;x.lineTo(px+Math.cos(q)*k,py+Math.sin(q)*k)}x.closePath();x.fillStyle=col;x.fill()}
function step(dt){t+=dt;
 let mul=1;
 if(st==='play'){
  if(K==='gelgit'){X.bands.forEach(b=>{if(late()){const ahead=T.filter(g=>g.dead<0).map(g=>({g,d:norm(dir>0?g.p-a:a-g.p)})).filter(o=>o.d>.9).sort((p,q)=>p.d-q.d)[0];if(ahead){const tg=norm(ahead.g.p-.6*dir);b.c=norm(b.c+cl(sd(tg,b.c),-1.1*dt,1.1*dt))}}if(ad(a,b.c)<b.w/2)mul=2.3})}
  if(K==='nabiz'){X.bt=(X.bt||0)+dt;const per=1.15;if(X.bt>per){X.bt-=per;X.extra=late()&&Math.random()<(hard()?.6:.4)}const beats=[0,.24].concat(X.extra?[.62]:[]);let bo=0;beats.forEach(b=>{const d=X.bt-b;if(d>=0&&d<.15)bo=Math.max(bo,1-d/.15)});X.beat=bo;X.htell=X.extra&&X.bt>.32&&X.bt<.62;mul=.55+2.4*bo}
  if(K==='yon'&&late()&&!X.tell){const ahead=T.find(g=>g.dead<0&&(()=>{const d=norm(dir>0?g.p-a:a-g.p);return d>.42&&d<.5})());if(ahead&&!ahead.tried){ahead.tried=1;if(Math.random()<(hard()?.6:.35))X.tell=t}}
  if(K==='yon'&&X.tell&&t-X.tell>.3){dir*=-1;X.tell=0;T.forEach(g=>g.tried=0)}
  if(K==='degirmen'){X.mt+=dt;if(late()&&X.mt>2.2){X.mt=0;X.mf=t;X.mn=pick(hard()?[1.6,-.8,-1.2,.5]:[1.2,-.7,.7])}if(X.mf>0&&t-X.mf>.35){X.ms=X.mn;X.mf=-9}X.mw=norm(X.mw+X.ms*dt)}
  if(K==='iki'){const tr=(t-laneT)/.14;laneR=tr<1?laneFrom+((lane?R2:R)-laneFrom)*eo(tr):(lane?R2:R);
   const sw=()=>{laneFrom=laneR;lane^=1;laneT=t};
   if(!hard()){X.gates.forEach((gp,i)=>{const pv=X.pa==null?a:X.pa;if(Math.sign(sd(a,gp))!==Math.sign(sd(pv,gp))&&ad(a,gp)<.3)sw()});if(late()){X.rs=(X.rs||0)-dt;if(X.rs<=0&&!X.itell){X.rs=rnd(2.5,4);X.itell=t}}}
   else{X.rs=(X.rs||1.5)-dt;if(X.rs<=0&&!X.itell){X.rs=rnd(1.2,2.6);X.itell=t}const ah=T.find(g=>g.dead<0&&(g.ln?R2:R)===(lane?R2:R)&&(()=>{const d=norm(dir>0?g.p-a:a-g.p);return d>.5&&d<.6})());if(ah&&!ah.tr){ah.tr=1;if(Math.random()<.5&&!X.itell)X.itell=t}}
   if(X.itell&&t-X.itell>.3){sw();X.itell=0}X.pa=a}
  if(K==='isin'){if(X.tun>0){X.tun-=dt;if(X.tun<=0){a=X.out;X.outT=t}}else{const pv=X.pa==null?a:X.pa;if(Math.sign(sd(a,X.gIn))!==Math.sign(sd(pv,X.gIn))&&ad(a,X.gIn)<.3){X.tun=.55;X.out=X.outs.length>1?pick(X.outs):X.outs[0];X.outLit=t}}X.pa=a}
  if(K==='ani'&&X.aniQ>0&&!T.some(g=>g.dead<0)){if(t>X.aniNext){const lead=late()?.55:1.0;const p=norm(a+dir*v*lead);if(late()&&!X.spk){X.spk={p,t0:t}}else if(!late()||t-X.spk.t0>.25){const pp=late()?X.spk.p:p;X.spk=null;T.push({p:pp,ph:0,born:t-.1,dead:-1,ln:0,life:late()?.95:1.25});X.aniQ--}}}
