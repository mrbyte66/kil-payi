<h2 class="sr-only">Bölümlerin içi dünyanın aletine bürünürse: aynı oyun beş farklı alet görünümünde (Pusula, Kasa, Saat kulesi, Radar, Cehennem)</h2>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>#iw{max-width:360px;margin:0 auto;font-family:Nunito,sans-serif}#tb{display:flex;gap:5px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}#tb button{border:1px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary);font:800 12px Nunito,sans-serif;padding:5px 10px;border-radius:14px;cursor:pointer}#tb button.on{background:#6C55E0;border-color:#6C55E0;color:#fff}#bz{border-radius:26px;overflow:hidden}#cv{display:block;width:100%}#cap{margin:8px 4px 0;font:700 13px/1.45 Nunito,sans-serif;color:var(--color-text-secondary);text-align:center;min-height:38px}</style>
<div id="iw"><div id="tb"></div><div id="bz"><canvas id="cv" width="780" height="1200"></canvas></div><div id="cap"></div></div>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),W=390,H=600,CX=195,CY=320,R=128,P2=Math.PI*2,HP=Math.PI/2,INK='#2A2347',FD='Fredoka, sans-serif',FB='Nunito, sans-serif';
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),norm=v=>((v%P2)+P2)%P2,sd=(p,q)=>{let d=norm(p-q);return d>Math.PI?d-P2:d},rnd=(a,b)=>a+Math.random()*(b-a),Pt=(q,r)=>[CX+Math.sin(q)*r,CY-Math.cos(q)*r];
function circle(px,py,r,f){x.beginPath();x.arc(px,py,Math.max(.1,r),0,P2);x.fillStyle=f;x.fill()}
function tx(s,px,py,font,col,bl){x.save();x.font=font;x.fillStyle=col;x.textAlign='center';x.textBaseline=bl||'alphabetic';x.fillText(s,px,py);x.restore()}
function arc(p,w,col,lw,r){if(w<=0)return;x.beginPath();x.arc(CX,CY,r||R,p-HP-w,p-HP+w);x.strokeStyle=col;x.lineWidth=lw;x.lineCap='butt';x.stroke()}
function rr(px,py,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}
const TH=[
 {n:'Pusula',cap:'<b>Pusula.</b> Halkanın çevresinde yön harfleri ve derece çizgileri, ortada pusula gülü. İbre pusula iğnesi: bir ucu şeftali, öbür ucu lila.',bg:['#FBF8FF','#EDE5FC'],track:'#E6DEF8',tgt:['#FFD9C5','#FFA77C','#FF7B3F'],dark:0},
 {n:'Kasa',cap:'<b>Kasa.</b> Halka fırçalanmış çelik bir kasa kadranı: 0-90 rakamları, çentikler, perçinler. İbre kadranın işaret oku, vuruşta "tık" diye kilit sesi.',bg:['#EEEBF3','#C7C1D4'],track:'#B9B2C8',tgt:['#FFD9C5','#FFA77C','#FF7B3F'],dark:0},
 {n:'Saat Kulesi',cap:'<b>Saat kulesi.</b> Halka saat kadranı: Romen rakamları, dakika çizgileri. İbre bir yelkovan. Ortadaki camdan dişliler görünür, vurdukça dişliler bir diş döner.',bg:['#FFF9F0','#F3DEC0'],track:'#EAD6B8',tgt:['#FFE2C2','#F2A65A','#D9772E'],dark:0},
 {n:'Radar',cap:'<b>Radar.</b> Ekran koyu, ibre radarın tarama ışını: arkasında yeşil bir iz bırakır. Hedefler ekranda yanan bölgeler gibi parlar.',bg:['#103340','#071A22'],track:'rgba(120,230,210,.16)',tgt:['rgba(255,170,120,.35)','#FF9E66','#FF7B3F'],dark:1},
 {n:'Cehennem',cap:'<b>Cehennem.</b> Oyundaki Cehennem görünümü: çatlak, kor ve ateş ışığı. Final dünyası.',bg:['#2A0F17','#5A1E16'],track:'#5A2430',tgt:['#FFB98A','#FF8E5C','#FF6A2B'],dark:1}];
let th=0,t=0,last=0,a=0,T=[],PS=[],RG=[],pulse=0,gearKick=0,gearA=0,autoT=0,hitsN=0;
function wave(){const b=norm(a+1.4+Math.random()*.8);T=[0,1,2].map(i=>({p:norm(b+i*1.05),dead:-1,born:t+i*.08}))}
function hit(g){g.dead=t;hitsN++;const[px,py]=Pt(g.p,R),c=TH[th];for(let i=0;i<22;i++){const q=Math.random()*P2,s=rnd(60,220);PS.push({x:px,y:py,vx:Math.cos(q)*s,vy:Math.sin(q)*s,l:1,c:th===3?(i%2?'#5FE3C9':'#FFB98A'):th===2?(i%2?'#F3CD86':'#fff'):(i%2?c.tgt[1]:'#fff'),r:rnd(1.5,3.5)})}RG.push({x:px,y:py,t0:t,c:th===3?'#5FE3C9':c.tgt[1]});pulse=1;gearKick=1;if(T.every(g=>g.dead>=0))wave()}
function setTh(i){th=i;document.querySelectorAll('#tb button').forEach((b,j)=>b.classList.toggle('on',j===i));document.getElementById('cap').innerHTML=TH[i].cap;PS=[];RG=[];wave();autoT=t}
function bg(){const c=TH[th],g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,c.bg[0]);g.addColorStop(1,c.bg[1]);x.fillStyle=g;x.fillRect(0,0,W,H)}
function decor(){const c=TH[th];
 if(th===0){for(let i=0;i<16;i++){const q=i/16*P2,card=i%4===0,L=card?250:i%2?120:180,wd=card?.1:.07;for(let h=0;h<2;h++){x.beginPath();x.moveTo(CX,CY);x.lineTo(CX+Math.sin(q)*L,CY-Math.cos(q)*L);x.lineTo(CX+Math.sin(q+(h?wd:-wd))*60,CY-Math.cos(q+(h?wd:-wd))*60);x.closePath();x.fillStyle=h?'#EDE6FC':'#F4F0FD';x.fill()}}
  for(let d=0;d<360;d+=5){const q=d*Math.PI/180,l=d%30?5:11;x.beginPath();x.moveTo(CX+Math.sin(q)*(R+30),CY-Math.cos(q)*(R+30));x.lineTo(CX+Math.sin(q)*(R+30+l),CY-Math.cos(q)*(R+30+l));x.strokeStyle=d%30?'#D6CCF2':'#B6A7E4';x.lineWidth=d%30?1:2;x.stroke()}
  ['K','D','G','B'].forEach((s,j)=>{const q=j*HP;tx(s,CX+Math.sin(q)*(R+60),CY-Math.cos(q)*(R+60)+8,'700 24px '+FD,j?'#C3B4EE':'#FF9E73')})}
 if(th===1){for(let yy=0;yy<H;yy+=2){const h=Math.sin(yy*12.9898)*43758.5453,f=h-Math.floor(h);x.fillStyle=f>.5?'rgba(255,255,255,'+(f-.5)*.2+')':'rgba(60,50,80,'+(.5-f)*.06+')';x.fillRect(0,yy,W,1)}
  const rg=x.createRadialGradient(CX-40,CY-60,20,CX,CY,R+44);rg.addColorStop(0,'#FAF9FD');rg.addColorStop(.8,'#C2BCD0');rg.addColorStop(1,'#8E87A2');circle(CX,CY,R+44,rg);
  for(let i=0;i<100;i++){const q=i/100*P2,l=i%10?6:12;x.beginPath();x.moveTo(CX+Math.sin(q)*(R+40),CY-Math.cos(q)*(R+40));x.lineTo(CX+Math.sin(q)*(R+40-l),CY-Math.cos(q)*(R+40-l));x.strokeStyle=i%10?'#8C859F':'#5E5672';x.lineWidth=i%10?1:2;x.stroke();if(i%10===0)tx(String(i),CX+Math.sin(q)*(R+22),CY-Math.cos(q)*(R+22)+4,'700 11px '+FD,'#6E6880')}
  for(const [rx,ry] of [[24,40],[W-24,40],[24,H-30],[W-24,H-30]]){const g2=x.createRadialGradient(rx-2,ry-2,1,rx,ry,9);g2.addColorStop(0,'#fff');g2.addColorStop(1,'#7A7490');circle(rx,ry,8,g2)}}
 if(th===2){x.beginPath();x.arc(CX,CY,R+50,0,P2);x.strokeStyle='#D9B27A';x.lineWidth=5;x.stroke();for(let i=0;i<60;i++){const q=i/60*P2,l=i%5?5:12;x.beginPath();x.moveTo(CX+Math.sin(q)*(R+44),CY-Math.cos(q)*(R+44));x.lineTo(CX+Math.sin(q)*(R+44-l),CY-Math.cos(q)*(R+44-l));x.strokeStyle=i%5?'#E3C9A2':'#C9A06A';x.lineWidth=i%5?1.2:3;x.stroke()}
  ['XII','III','VI','IX'].forEach((n,i)=>{const q=i*HP;tx(n,CX+Math.sin(q)*(R+72),CY-Math.cos(q)*(R+72)+8,'700 22px Georgia, serif','#C9A06A')})}
 if(th===3){x.strokeStyle='rgba(120,230,210,.07)';x.lineWidth=1;for(let gx=15;gx<W;gx+=30){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,H);x.stroke()}for(let gy=0;gy<H;gy+=30){x.beginPath();x.moveTo(0,gy);x.lineTo(W,gy);x.stroke()}
  for(let r=50;r<=260;r+=50){x.beginPath();x.arc(CX,CY,r,0,P2);x.strokeStyle='rgba(120,230,210,.12)';x.stroke()}}
 if(th===4){const hg=x.createRadialGradient(CX,H+60,30,CX,H+60,520);hg.addColorStop(0,'rgba(255,100,40,.5)');hg.addColorStop(1,'rgba(255,100,40,0)');x.fillStyle=hg;x.fillRect(0,0,W,H);
  [[30,80,90,200,60,300],[340,60,300,180,360,260],[60,420,120,520,40,600],[330,430,280,520,350,600]].forEach((c2,ci)=>{const pul=.55+.45*Math.sin(t*2+ci);x.beginPath();x.moveTo(c2[0],c2[1]);x.lineTo(c2[2],c2[3]);x.lineTo(c2[4],c2[5]);x.lineCap='round';x.strokeStyle='rgba(255,90,30,'+.2*pul+')';x.lineWidth=10;x.stroke();x.strokeStyle='rgba(255,170,90,'+.7*pul+')';x.lineWidth=2;x.stroke()})}}
function ringAndTargets(){const c=TH[th];
 if(pulse>0){x.globalAlpha=pulse*.4;x.beginPath();x.arc(CX,CY,R,0,P2);x.strokeStyle=th===3?'#5FE3C9':c.tgt[1];x.lineWidth=26+pulse*20;x.stroke();x.globalAlpha=1}
 if(th===1){const g=x.createLinearGradient(CX,CY-R,CX,CY+R);g.addColorStop(0,'#D4CFDF');g.addColorStop(1,'#A39CB6');x.beginPath();x.arc(CX,CY,R,0,P2);x.strokeStyle=g;x.lineWidth=26;x.stroke();x.beginPath();x.arc(CX,CY,R+13,0,P2);x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=1;x.stroke()}
 else if(th===4){x.beginPath();x.arc(CX,CY,R,0,P2);x.strokeStyle=c.track;x.lineWidth=26;x.stroke();for(let i=0;i<6;i++)arc(i/6*P2+t*.3,.16,'rgba(255,123,63,'+(.35+.35*Math.sin(t*3+i))+')',26)}
 else{x.beginPath();x.arc(CX,CY,R,0,P2);x.strokeStyle=c.track;x.lineWidth=26;x.stroke()}
 T.forEach(g=>{if(g.dead>=0)return;const s=cl((t-g.born)/.25,0,1),w=.3*s;if(th===3){const gl=.6+.4*Math.sin(t*6);arc(g.p,w+.08,'rgba(255,140,90,'+.18*gl+')',40);arc(g.p,w,'#FF7B3F',26);arc(g.p,w*.4,'#FFC29A',26)}else{arc(g.p,w+.03,c.tgt[0],32);arc(g.p-w*2/3,w/3,c.tgt[1],26);arc(g.p,w/3,c.tgt[2],26);arc(g.p+w*2/3,w/3,c.tgt[1],26)}
  if(th===1){for(let k=-2;k<=2;k++){const q=g.p+k*w*.4;x.beginPath();x.moveTo(CX+Math.sin(q)*(R-13),CY-Math.cos(q)*(R-13));x.lineTo(CX+Math.sin(q)*(R-6),CY-Math.cos(q)*(R-6));x.strokeStyle='rgba(120,50,20,.35)';x.lineWidth=1.5;x.stroke()}}})}
function center(){const c=TH[th],rv=R-18;
 if(th===0){circle(CX,CY,rv,'#fff');x.save();x.beginPath();x.arc(CX,CY,rv,0,P2);x.clip();const ly=CY+rv-rv*2*.45;x.beginPath();x.moveTo(CX-rv,CY+rv);for(let u=-rv;u<=rv;u+=4)x.lineTo(CX+u,ly+Math.sin(u/22+t*2.6)*4);x.lineTo(CX+rv,CY+rv);x.fillStyle='#C0B4F8';x.fill();x.restore();
  for(let i=0;i<8;i++){const q=i/8*P2,L=i%2?40:70;x.beginPath();x.moveTo(CX,CY);x.lineTo(CX+Math.sin(q)*L,CY-Math.cos(q)*L);x.strokeStyle='rgba(108,85,224,.12)';x.lineWidth=i%2?2:4;x.stroke()}}
 else if(th===1){const kg=x.createRadialGradient(CX-20,CY-30,10,CX,CY,rv);kg.addColorStop(0,'#F4F2F8');kg.addColorStop(1,'#B3ACC4');circle(CX,CY,rv,kg);for(let i=0;i<48;i++){const q=i/48*P2;x.beginPath();x.moveTo(CX+Math.sin(q)*rv,CY-Math.cos(q)*rv);x.lineTo(CX+Math.sin(q)*(rv-9),CY-Math.cos(q)*(rv-9));x.strokeStyle='rgba(80,70,100,.3)';x.lineWidth=2;x.stroke()}circle(CX,CY,rv*.45,'#D9D3E4');x.beginPath();x.arc(CX,CY,rv*.45,0,P2);x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2;x.stroke()}
 else if(th===2){x.save();x.beginPath();x.arc(CX,CY,rv,0,P2);x.clip();const g=x.createRadialGradient(CX,CY,5,CX,CY,rv);g.addColorStop(0,'#5A3E26');g.addColorStop(1,'#2E1F14');x.fillStyle=g;x.fillRect(CX-rv,CY-rv,rv*2,rv*2);
  const gear=(gx,gy,r,n,an)=>{x.save();x.translate(gx,gy);x.rotate(an);const gg=x.createLinearGradient(-r,-r,r,r);gg.addColorStop(0,'#F3CD86');gg.addColorStop(1,'#A86F2C');x.fillStyle=gg;x.beginPath();for(let i=0;i<n*2;i++){const q=i/(n*2)*P2,r2=i%2?r:r*.82;x.lineTo(Math.cos(q)*r2,Math.sin(q)*r2)}x.closePath();x.fill();circle(0,0,r*.55,'rgba(70,45,20,.55)');for(let k=0;k<5;k++){const q=k/5*P2;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(q)*r*.55,Math.sin(q)*r*.55);x.strokeStyle=gg;x.lineWidth=r*.13;x.stroke()}circle(0,0,r*.16,'#F3CD86');x.restore()};
  gear(CX-18,CY-10,58,16,gearA);gear(CX+58,CY+50,38,10,-gearA*1.6);gear(CX-60,CY+62,28,8,-gearA*2.2);x.restore();x.beginPath();x.arc(CX,CY,rv,0,P2);x.strokeStyle='#C7924C';x.lineWidth=6;x.stroke()}
 else if(th===3){circle(CX,CY,rv,'#0B222B');for(let r=20;r<rv;r+=24){x.beginPath();x.arc(CX,CY,r,0,P2);x.strokeStyle='rgba(120,230,210,.2)';x.lineWidth=1;x.stroke()}x.beginPath();x.moveTo(CX-rv,CY);x.lineTo(CX+rv,CY);x.moveTo(CX,CY-rv);x.lineTo(CX,CY+rv);x.strokeStyle='rgba(120,230,210,.15)';x.stroke()}
 else{circle(CX,CY,rv,'#2A1018');x.save();x.beginPath();x.arc(CX,CY,rv,0,P2);x.clip();const ly=CY+rv-rv*2*.45;x.beginPath();x.moveTo(CX-rv,CY+rv);for(let u=-rv;u<=rv;u+=4)x.lineTo(CX+u,ly+Math.sin(u/22+t*2.6)*4);x.lineTo(CX+rv,CY+rv);x.fillStyle='#B8442A';x.fill();x.restore()}
 const num=String(4+hitsN%9),lc=c.dark||th===2?'#fff':INK;if(th!==2)tx(num,CX,CY+16,'700 52px '+FD,th===1?'#4E4762':lc);else{rr(CX-34,CY+rv-58,68,40,12,'rgba(255,248,235,.92)');tx(num,CX,CY+rv-28,'700 30px Georgia, serif','#5A3812')}}
function needle(){const c=TH[th],[hx,hy]=Pt(a,R);
 if(th===0){x.save();x.translate(CX,CY);x.rotate(a);x.fillStyle='#FF8E5C';x.beginPath();x.moveTo(0,-R-6);x.lineTo(9,-R+40);x.lineTo(-9,-R+40);x.fill();x.fillStyle='#C0B4F8';x.beginPath();x.moveTo(0,-R+40);x.lineTo(5,-R+64);x.lineTo(-5,-R+64);x.fill();x.restore()}
 else if(th===1){for(let i=1;i<10;i++){x.globalAlpha=.3-i*.03;arc(a-i*.04,.025,'#8C859F',14)}x.globalAlpha=1;x.save();x.translate(CX,CY);x.rotate(a);const g=x.createLinearGradient(-8,0,8,0);g.addColorStop(0,'#FF9E73');g.addColorStop(1,'#E0602C');x.fillStyle=g;x.beginPath();x.moveTo(0,-R-10);x.lineTo(11,-R+20);x.lineTo(-11,-R+20);x.fill();x.restore()}
 else if(th===2){x.save();x.translate(CX,CY);x.rotate(a);x.fillStyle='#3A2412';x.beginPath();x.moveTo(-4,18);x.lineTo(-2.5,-R+30);x.lineTo(0,-R+8);x.lineTo(2.5,-R+30);x.lineTo(4,18);x.closePath();x.fill();x.beginPath();x.ellipse(0,-R+40,6,10,0,0,P2);x.strokeStyle='#3A2412';x.lineWidth=2.5;x.stroke();x.restore();circle(CX,CY,8,'#3A2412');circle(CX,CY,3,'#F3CD86')}
 else if(th===3){for(let i=0;i<40;i++){x.globalAlpha=(1-i/40)*.4;x.beginPath();x.moveTo(CX,CY);x.arc(CX,CY,R+14,a-HP-i*.025,a-HP-i*.025+.027);x.closePath();x.fillStyle='#5FE3C9';x.fill()}x.globalAlpha=1;x.beginPath();x.moveTo(CX,CY);x.lineTo(CX+Math.sin(a)*(R+14),CY-Math.cos(a)*(R+14));x.strokeStyle='#AFFFEF';x.lineWidth=2.5;x.stroke();circle(hx,hy,7,'#AFFFEF')}
 else{for(let i=1;i<12;i++){x.globalAlpha=.32-i*.025;arc(a-i*.045,.03,'#FF8E5C',18)}x.globalAlpha=1;const[bx,by]=Pt(a,R-44);x.beginPath();x.moveTo(bx,by);x.lineTo(hx,hy);x.strokeStyle='#fff';x.lineWidth=3.5;x.lineCap='round';x.stroke();circle(hx,hy,15,'#fff');circle(hx,hy,5,'#2A1018')}}
function hud(){const c=TH[th],dk=c.dark,col=dk?'#fff':INK;tx('Bölüm 24',CX,62,'600 23px '+FD,col);tx(c.n,CX,84,'800 12px '+FB,dk?'rgba(255,255,255,.6)':'#6A5FA0');
 rr(16,22,72,30,15,dk?'rgba(255,255,255,.12)':'#fff');for(let i=0;i<3;i++)circle(34+i*18,37,6,th===3?'#5FE3C9':'#6C55E0')}
function frame(ts){requestAnimationFrame(frame);const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;t+=dt;const pa=a;a+=(th===2?2.4:2.9)*dt;
 const g=T.find(g=>g.dead<0&&t-g.born>.15&&sd(g.p,pa)>0&&sd(g.p,a)<=0);if(g)hit(g);
 pulse=Math.max(0,pulse-dt*2.5);gearKick=Math.max(0,gearKick-dt*4);gearA+=dt*(.15+gearKick*2.5);
 PS.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-2*dt;p.vy*=1-2*dt;p.l-=dt*1.6});PS=PS.filter(p=>p.l>0);RG=RG.filter(r=>t-r.t0<.55);
 if(t-autoT>6&&!window.__stop)setTh((th+1)%5);
 x.setTransform(2,0,0,2,0,0);bg();decor();ringAndTargets();center();needle();
 RG.forEach(r=>{const k=(t-r.t0)/.55;x.globalAlpha=1-k;x.beginPath();x.arc(r.x,r.y,8+k*60,0,P2);x.strokeStyle=r.c;x.lineWidth=5*(1-k)+1;x.stroke()});x.globalAlpha=1;
 PS.forEach(p=>{x.globalAlpha=p.l;circle(p.x,p.y,p.r*p.l,p.c)});x.globalAlpha=1;
 if(th===3){for(let yy=0;yy<H;yy+=3){x.fillStyle='rgba(0,0,0,.14)';x.fillRect(0,yy,W,1)}}
 hud();x.globalAlpha=.6;tx('kurallar aynı, yalnız görünüş değişir',CX,H-20,'800 11px '+FB,TH[th].dark?'rgba(255,255,255,.7)':'#8E84B8');x.globalAlpha=1}
const tb=document.getElementById('tb');TH.forEach((c,i)=>{const b=document.createElement('button');b.textContent=['I','II','III','IV','V'][i]+' '+c.n;b.onclick=()=>{setTh(i);autoT=t+1e9};tb.appendChild(b)});
setTh(0);
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('600 24px Fredoka'),document.fonts.load('800 12px Nunito')]).catch(()=>{}):Promise.resolve()).finally(()=>requestAnimationFrame(frame));
</script>
