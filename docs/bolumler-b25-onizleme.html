<h2 class="sr-only">Bölüm 25 denemesi: Kasa turu, kesintisiz dalgalar, güçlü vuruş efektleri</h2>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>#bz{width:350px;max-width:100%;margin:0 auto;border-radius:24px;overflow:hidden;background:#F4F1FC;user-select:none;touch-action:manipulation}#cv{display:block;width:100%;cursor:pointer;touch-action:none}#sk{display:block;margin:6px auto 0;border:0;background:none;color:#8D84B5;font:800 12px Nunito,sans-serif;text-decoration:underline;cursor:pointer}</style>
<div id="bz"><canvas id="cv" width="780" height="1160"></canvas></div><button id="sk">Sonunu göster</button>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),W=390,H=580,CX=195,CY=300,R=132,P2=Math.PI*2,INK='#2A2347',SUB='#6A5FA0',FD='Fredoka, sans-serif',FB='Nunito, sans-serif';
const norm=v=>((v%P2)+P2)%P2,ad=(p,q)=>{const d=norm(p-q);return Math.min(d,P2-d)},sd=(p,q)=>{let d=norm(p-q);return d>Math.PI?d-P2:d},Pt=(q,r)=>[CX+Math.sin(q)*r,CY-Math.cos(q)*r];
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),eob=k=>{k=cl(k,0,1);const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)},eo=k=>1-Math.pow(1-cl(k,0,1),3),rnd=(a,b)=>a+Math.random()*(b-a);
const I=4/18,BASE=2.2+1.2*I+.12*4,HW=Math.max(.15,.5-.22*I-.035*4),WAVES=24,GOLD=68;
let st='ready',t=0,last=0,a=0,v=BASE*.4,wave=0,T=[],TR=[],hitsW=0,lives=3,miss=0,stT=0,combo=0,best=0;
let PS=[],SH=[],RG=[],TX=[],CF=[],EM=[],XS=[];

let spin=0,spinV=0,prize=null,prT=-9,kick=0,lastSeg=0;
function newWave(first){const base=norm(a+(first?1.9:1.7)+Math.random()*1.1),al=wave>1&&Math.random()<.45,gap=al?1.4:1.05;
 T=[0,1,2].map(i=>({p:norm(base+i*gap),ph:Math.random()*6,born:t+i*.09,dead:-1}));
 TR.forEach(r=>{if(r.dead<0)r.dead=t});TR=TR.filter(r=>t-r.dead<.4);
 if(al)TR.push({p:norm(base+gap/2),w:.12,born:t+.2,dead:-1,hit:-9},{p:norm(base+gap*1.5),w:.12,born:t+.29,dead:-1,hit:-9});hitsW=0}
function start(){st='play';stT=t;wave=0;lives=3;miss=0;combo=0;best=0;starsDone=0;coinsOut=0;TR=[];CF=[];EM=[];newWave(true);lifeFx=[-9,-9,-9]}
const sp=g=>cl((t-g.born)/.32,0,1),hw=g=>HW*(.72+.5*(Math.sin(t*2.2+g.ph)+1)/2);
const live=g=>g.dead<0&&t-g.born>.12;
function txt(s,px,py,col,big){TX.push({s,x:px,y:py,t0:t,col,big})}
function sparks(px,py,n,cols,sp0,sp1){for(let i=0;i<n;i++){const q=Math.random()*P2,s=rnd(sp0||60,sp1||240);PS.push({x:px,y:py,vx:Math.cos(q)*s,vy:Math.sin(q)*s,l:1,d:rnd(1.2,2.2),c:cols[i%cols.length],r:rnd(1.5,4),k:Math.random()<.4})}}
function shatter(p,w,cols,lw){const n=7;for(let i=0;i<n;i++){const q=p+(i/(n-1)-.5)*2*w*.85;SH.push({p:q,w:w/n*.9,r:R,vr:rnd(90,260),va:rnd(-.9,.9),l:1,c:cols[i%cols.length],lw:lw||26})}}
function lose(n,s,col){lives-=n;miss+=n;combo=0;shake=n>1?1.3:.7;red=n>1?1:.6;for(let i=0;i<n;i++)if(lives+i>=0&&lives+i<3)lifeFx[lives+i]=t;
 const[hx,hy]=Pt(a,R);XS.push({x:hx,y:hy,t0:t});txt(s,hx,hy-34,col||'#E0446B',n>1);
 if(lives<=0){lives=0;st='lose';stT=t;burn()}}
function burn(){for(let i=0;i<200;i++){const q=Math.random()*P2,[px,py]=Pt(q,R+rnd(-13,13));EM.push({x:px,y:py,vx:rnd(-30,30),vy:rnd(-120,-20),l:1,d:rnd(.5,1.1),r:rnd(1,3.2),f:Math.random()*6})}
 for(let i=0;i<16;i++)SH.push({p:i/16*P2,w:P2/32*.92,r:R,vr:rnd(40,160),va:rnd(-.5,.5),l:1,c:i%2?'#E2DDF4':'#D3CAEC',lw:26});T.forEach(g=>{if(g.dead<0){g.dead=t;shatter(g.p,hw(g),['#FFA77C','#FF7B3F'])}});TR.forEach(r=>r.dead=t)}
function hitTarget(g){const w=hw(g),d=ad(a,g.p),perfect=d<w*.33;g.dead=t;hitsW++;combo++;best=Math.max(best,combo);
 const[px,py]=Pt(g.p,R);shatter(g.p,w,perfect?['#FFD36B','#FF9A4D','#fff']:['#FFA77C','#FF7B3F','#FFD9C5']);
 sparks(px,py,perfect?34:22,perfect?['#FFD36B','#FF7B3F','#fff']:['#FFA77C','#FF7B3F','#fff']);
 RG.push({x:px,y:py,t0:t,c:perfect?'#FFC44D':'#FFA77C',m:perfect?90:65});if(perfect)RG.push({x:px,y:py,t0:t+.07,c:'#fff',m:55});
 const[tx2,ty2]=Pt(g.p,R+44);txt(perfect?'Mükemmel!':'İyi',tx2,ty2,perfect?'#E39A12':'#E0743C',perfect);
 pulse=perfect?1:.7;pulseC=perfect?'#FFC44D':'#FFA77C';np=1;slosh=1;if(combo>=3)comboT=t;
 if(T.every(g=>g.dead>=0)){wave++;sweep=t;wavePop=t;for(let i=0;i<30;i++){const q=i/30*P2,[qx,qy]=Pt(q,R);PS.push({x:qx,y:qy,vx:Math.sin(q)*rnd(40,110),vy:-Math.cos(q)*rnd(40,110),l:1,d:rnd(1.4,2),c:i%2?'#C0B4F8':'#FFA77C',r:rnd(1.5,3),k:false})}
  if(wave>=WAVES){st='win';stT=t;pulse=1.6;for(let i=0;i<160;i++){const q=rnd(-Math.PI*.95,-Math.PI*.05),s=rnd(220,560);CF.push({x:CX,y:CY,vx:Math.cos(q)*s,vy:Math.sin(q)*s,rot:Math.random()*6,vr:rnd(-10,10),c:['#FFA77C','#6C55E0','#F2B73C','#8FDDB5','#FF5C85','#C0B4F8'][i%6],w:rnd(5,9),h:rnd(8,13),l:1})}}
  else newWave(false)}}
function tap(){
 if(st==='ready'){start();return}

 if(st==='win'){if(t-stT>2.6){st='group';stT=t;spin=0;spinV=0;prize=null}return}
 if(st==='group'){if(t-stT<.5)return;if(!spinV&&!prize){spinV=rnd(13,17)}else if(prize&&t-prT>.8){st='intro';stT=t}return}
 if(st==='intro'){if(t-stT>.6)st='ready';return}
 if(st!=='play')return;
 const al=TR.find(r=>r.dead<0&&t-r.born>.1&&ad(a,r.p)<r.w);if(al){al.hit=t;const[px,py]=Pt(al.p,R);sparks(px,py,30,['#FF5C85','#fff','#C0436B'],80,300);RG.push({x:px,y:py,t0:t,c:'#FF5C85',m:110});lose(2,'Alarm! −2 can');return}
 const g=T.find(g=>live(g)&&ad(a,g.p)<hw(g)+.02);if(g){hitTarget(g);return}
 let n=null,nd=9;T.forEach(g=>{if(g.dead<0){const d=sd(g.p,a);if(Math.abs(d)<Math.abs(nd)){nd=d;n=g}}});lose(1,n&&nd>0?'Erken!':'Geç!')}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});
document.getElementById('sk').onclick=()=>{if(st!=='play')start();wave=WAVES-1;T.forEach(g=>{g.dead=t});T=[{p:a,ph:0,born:t-1,dead:-1}];hitTarget(T[0])};
function arc(p,w,col,lw,r){if(w<=0)return;x.beginPath();x.arc(CX,CY,r||R,p-Math.PI/2-w,p-Math.PI/2+w);x.strokeStyle=col;x.lineWidth=lw;x.lineCap='butt';x.stroke()}

function tx(s,px,py,font,col,bl,sc){x.save();x.translate(px,py);if(sc)x.scale(sc,sc);x.font=font;x.fillStyle=col;x.textAlign='center';x.textBaseline=bl||'alphabetic';x.fillText(s,0,0);x.restore()}
function rr(px,py,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}

 if(st==='group'&&spinV>0){spin+=spinV*dt;spinV=Math.max(0,spinV-5.5*dt);const sg=Math.floor(norm(spin)/(P2/8));if(sg!==lastSeg){lastSeg=sg;kick=1}

 shake=Math.max(0,shake-dt*3.2);red=Math.max(0,red-dt*2.4);pulse=Math.max(0,pulse-dt*2.6);np=Math.max(0,np-dt*5);slosh=Math.max(0,slosh-dt*1.6);kick=Math.max(0,kick-dt*7);

 for(let i=0;i<5;i++){const on=i<4||st==='win'||st==='group'||st==='intro';circle(CX-28+i*14,80,i===4?5.5+Math.sin(t*4)*.8:4.5,on?'#6C55E0':'#C0B4F8')}
 rr(14,16,74,30,15,'#fff');for(let i=0;i<3;i++){const k=t-lifeFx[i],cx2=33+i*18;if(i<lives)circle(cx2,31,6,'#6C55E0');else{circle(cx2,31,6,'#DAD3F2');if(k<.5){x.globalAlpha=1-k/.5;circle(cx2,31,6+k*22,'rgba(255,92,133,.5)');circle(cx2+rnd(-2,2),31+k*30,6*(1-k),'#6C55E0');x.globalAlpha=1}}}
 const gl='+'+GOLD,cb=t-chip<.25?1+.25*Math.sin((t-chip)/.25*Math.PI):1;x.font='700 15px '+FD;const gw=x.measureText(gl).width+36;x.save();x.translate(W-14-gw/2,31);x.scale(cb,cb);rr(-gw/2,-15,gw,30,15,'#FFF3D6');coin(-gw/2+16,0,9);x.font='700 15px '+FD;x.fillStyle='#8A6210';x.textAlign='left';x.textBaseline='middle';x.fillText(gl,-gw/2+28,1);x.restore();
 x.save();x.translate(sx,sy);
 const ringA=st==='lose'?Math.max(0,1-(t-stT)/.35):1;
 x.globalAlpha=ringA;
 for(let i=0;i<60;i++){const q=i/60*P2,m=i%5===0,[a1,b1]=Pt(q,R+19),[a2,b2]=Pt(q,R+(m?33:26));x.beginPath();x.moveTo(a1,b1);x.lineTo(a2,b2);x.strokeStyle=m?'#B9ADDC':'#D3CAEC';x.lineWidth=m?3:2;x.lineCap='round';x.stroke()}
 if(pulse>0){x.globalAlpha=ringA*Math.min(1,pulse)*.45;x.beginPath();x.arc(CX,CY,R,0,P2);x.strokeStyle=pulseC;x.lineWidth=26+pulse*22;x.stroke();x.globalAlpha=ringA}
 x.beginPath();x.arc(CX,CY,R,0,P2);x.strokeStyle='#E2DDF4';x.lineWidth=26;x.stroke();
 const sk=(t-sweep)/.55;if(sk>=0&&sk<1){for(let i=0;i<14;i++){x.globalAlpha=ringA*(1-sk)*(1-i/14)*.8;arc(a+sk*P2-i*.06,.04,'#fff',26)}x.globalAlpha=ringA}
 TR.forEach(r=>{const s=eob((t-r.born)/.3),f=r.dead>=0?1-cl((t-r.dead)/.3,0,1):1;if(s<=0||f<=0)return;x.globalAlpha=ringA*f;const hk=t-r.hit<.5?1-(t-r.hit)/.5:0,bl=.5+.5*Math.sin(t*9);
  arc(r.p,r.w*s+.03,'rgba(255,92,133,'+(.18+.12*bl+hk*.4)+')',34+hk*16);arc(r.p,r.w*s,'#FF5C85',26);const[px,py]=Pt(r.p,R);tx('!',px,py+1,'800 14px '+FB,'#fff','middle',s*(1+hk*.5));x.globalAlpha=ringA});
 T.forEach((g,i)=>{if(g.dead>=0)return;const s=eob((t-g.born)/.32);if(s<=0)return;const w=hw(g)*s,br=(Math.sin(t*2.2+g.ph)+1)/2;
  arc(g.p,w+.05,'rgba(255,167,124,'+(.18+.2*br)+')',38);arc(g.p,w+.03,'#FFD9C5',32);arc(g.p-w*2/3,w/3,'#FFA77C',26);arc(g.p,w/3,'#FF7B3F',26);arc(g.p+w*2/3,w/3,'#FFA77C',26);
  const[px,py]=Pt(g.p,R-27);circle(px,py,8*s,'#fff');tx(String(i+1),px,py+.5,'800 10.5px '+FB,'#C77A4E','middle',s)});
 x.globalAlpha=1;
 SH.forEach(s=>{x.globalAlpha=Math.max(0,s.l);arc(s.p,s.w*(.4+.6*s.l),s.c,s.lw*(.35+.65*s.l),s.r)});x.globalAlpha=ringA;
 const rv=R-18,ly=CY+rv-rv*2*progV;x.save();x.beginPath();x.arc(CX,CY,rv,0,P2);x.fillStyle='#fff';x.fill();x.clip();
 const amp=3+slosh*9;x.beginPath();x.moveTo(CX-rv,CY+rv+2);for(let u=-rv;u<=rv;u+=4)x.lineTo(CX+u,ly+Math.sin(u/22+t*2.6)*amp+Math.sin(u/9-t*5)*slosh*3);x.lineTo(CX+rv,CY+rv+2);x.closePath();x.fillStyle='#C0B4F8';x.fill();
 x.beginPath();x.moveTo(CX-rv,CY+rv+2);for(let u=-rv;u<=rv;u+=4)x.lineTo(CX+u,ly+6+Math.sin(u/17-t*2)*amp*.7);x.lineTo(CX+rv,CY+rv+2);x.closePath();x.fillStyle='#AE9FF5';x.fill();
 for(let i=0;i<6;i++){const bx=CX+Math.sin(i*2.1)*rv*.6,by=CY+rv-((t*30+i*37)%(rv*2*progV+1));if(by>ly+6)circle(bx+Math.sin(t*3+i)*3,by,2+i%2,'rgba(255,255,255,.5)')}
 x.restore();x.beginPath();x.arc(CX,CY,rv+4,0,P2);x.strokeStyle='#DAD3F8';x.lineWidth=2.5;x.stroke();
 if(st==='play'){const wp=t-wavePop<.4?1+.35*Math.sin((t-wavePop)/.4*Math.PI):1;tx(String(Math.min(wave+1,WAVES)),CX,CY+14,'700 56px '+FD,INK,'alphabetic',wp);tx('/ '+WAVES+' dalga',CX,CY+40,'800 13px '+FB,SUB);
  if(combo>=3){const k=t-comboT,s=k<.3?1+.4*Math.sin(k/.3*Math.PI):1,lbl='×'+combo+' seri';x.font='800 13px '+FB;const w=x.measureText(lbl).width+22;x.save();x.translate(CX,CY-52);x.scale(s,s);rr(-w/2,-13,w,26,13,'#FFE3D3');tx(lbl,0,1,'800 13px '+FB,'#D9622B','middle');x.restore()}}
 if(st!=='lose'||t-stT<.35){for(let i=1;i<16;i++){x.globalAlpha=ringA*(.34-i*.021);arc(a-i*.045*(v/BASE),.03,'#8E7BF2',18)}x.globalAlpha=ringA;
  const[hx,hy]=Pt(a,R),[bx,by]=Pt(a,R-44);x.beginPath();x.moveTo(bx,by);x.lineTo(hx,hy);x.strokeStyle=INK;x.lineWidth=3.5;x.lineCap='round';x.stroke();const hr=15*(1+np*.35);if(np>0)circle(hx,hy,hr+10*np,'rgba(255,167,124,'+np*.5+')');circle(hx,hy,hr,INK);circle(hx,hy,5*(1+np*.4),'#fff')}
 x.globalAlpha=1;

 EM.forEach(e=>{x.globalAlpha=Math.max(0,e.l)*(.6+.4*Math.sin(t*20+e.f));circle(e.x,e.y,e.r*(.5+e.l*.5),e.l>.6?'#FFD36B':e.l>.3?'#FF7B3F':'#9C4A3A')});x.globalAlpha=1;
 XS.forEach(q=>{const k=(t-q.t0)/.6,s=eob(k/.4);x.globalAlpha=1-cl((k-.5)*2,0,1);x.save();x.translate(q.x,q.y);x.rotate(Math.sin(k*30)*.25*(1-k));x.scale(s,s);x.strokeStyle='#E0446B';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(-9,-9);x.lineTo(9,9);x.moveTo(9,-9);x.lineTo(-9,9);x.stroke();x.restore()});x.globalAlpha=1;
 TX.forEach(q=>{const k=(t-q.t0)/.9,s=eob(k/.25)*(q.big?1.25:1);x.globalAlpha=1-cl((k-.55)/.45,0,1);x.lineWidth=5;x.strokeStyle='#fff';x.save();x.translate(q.x,q.y-eo(k)*26);x.scale(s,s);x.font='700 '+(q.big?19:16)+'px '+FD;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.strokeText(q.s,0,0);x.fillStyle=q.col;x.fillText(q.s,0,0);x.restore()});x.globalAlpha=1;
 x.restore();
 if(red>0){const gr=x.createRadialGradient(CX,CY,120,CX,CY,380);gr.addColorStop(0,'rgba(255,92,133,0)');gr.addColorStop(1,'rgba(255,92,133,'+red*.45+')');x.fillStyle=gr;x.fillRect(0,0,W,H)}
 CF.forEach(c=>{x.save();x.translate(c.x,c.y);x.rotate(c.rot);x.scale(1,Math.cos(c.rot*1.7));x.fillStyle=c.c;x.fillRect(-c.w/2,-c.h/2,c.w,c.h);x.restore()});
