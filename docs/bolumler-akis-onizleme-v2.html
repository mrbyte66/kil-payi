<h2 class="sr-only">Bölümler modu akış turu V2: ana menü, bölüm listesi, bölüm oynanışı, kutlama, yanma ve ikinci şans, grup kartı ve Şans çarkı, yeni kilit tanıtımı</h2>

<style>

<div id="tw"><div id="ch"></div><div id="bz"><canvas id="cv" width="780" height="1440"></canvas></div><div id="cap"></div><button id="pp">Duraklat</button></div>
<script>
const cv=document.getElementById('cv'),x=cv.getContext('2d'),W=390,H=720,CX=195,CY=360,R=132,P2=Math.PI*2,INK='#2A2347',SUB='#6A5FA0',FD='Fredoka, sans-serif',FB='Nunito, sans-serif',HP=Math.PI/2;
const norm=v=>((v%P2)+P2)%P2,ad=(p,q)=>{const d=norm(p-q);return Math.min(d,P2-d)},sd=(p,q)=>{let d=norm(p-q);return d>Math.PI?d-P2:d},Pt=(q,r)=>[CX+Math.sin(q)*r,CY-Math.cos(q)*r];
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),eob=k=>{k=cl(k,0,1);const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)},eo=k=>1-Math.pow(1-cl(k,0,1),3),rnd=(a,b)=>a+Math.random()*(b-a);
const CAPS=['<b>1 · Ana menü.</b> Halkada yeni dilim: Bölümler.','<b>2 · Bölüm listesi.</b> Her kilit bir kadran: 5 dilim = 5 bölüm. Ortada kilidin kendisi canlı oynar. Sıradaki kilit soluk ve kilitli görünür, ondan sonrakiler sürpriz.','<b>3 · Bölüm 24.</b> Dalgalar molasız gelir, 3 can. Demo için dalgalar kısaltıldı.','<b>4 · Bölüm bitti.</b> 1 saniyelik kutlama, yıldız ve altın. Sonraki bölüm aynı halkada hemen başlar.','<b>5 · Bölüm 25.</b> Boşa basmak 1 can, "!" alarmı 2 can götürür.','<b>6 · Canlar bitti: ikinci şans.</b> Reklam ya da altınla kaldığın dalgadan devam (bölüm başına 2 kez). Devamla geçilen bölüm 1 yıldız alır.','<b>7 · Grup bitti.</b> Grup kartı ve Şans çarkı.','<b>8 · Yeni kilit.</b> Kilit kırılır, kadran renklenir, kural üç adımda (Bas · Tut · Bırak). Sonra Hayalet gösteri adımları sırayla yakar, ardından sıra sende.'];
const CHIPS=['Menü','Liste','Bölüm','Kutlama','Hata','İkinci şans','Grup','Yeni kilit'];
let t=0,last=0,ss=0,sc=-1,paused=false,a=0,v=1,pa=0,flash=0;
let PS=[],SH=[],RG=[],TX=[],CF=[],EM=[],XS=[],FG=null;
let shake=0,red=0,pulse=0,pulseC='#FFA77C',sweep=-9,wavePop=-9,progV=0,slosh=0,np=0,lifeFx=[-9,-9,-9],chip=-9,gold=1240,goldShow=1240;
let G=null;
const st=()=>t-ss;
function txt(s,px,py,col,big){TX.push({s,x:cl(px,62,W-62),y:py,t0:t,col,big})}
function sparks(px,py,n,cols,s0,s1){for(let i=0;i<n;i++){const q=Math.random()*P2,s=rnd(s0||60,s1||240);PS.push({x:px,y:py,vx:Math.cos(q)*s,vy:Math.sin(q)*s,l:1,d:rnd(1.2,2.2),c:cols[i%cols.length],r:rnd(1.5,4),k:Math.random()<.4})}}
function shatter(p,w,cols){for(let i=0;i<7;i++){const q=p+(i/6-.5)*2*w*.85;SH.push({p:q,w:w/7*.9,r:R,vr:rnd(90,260),va:rnd(-.9,.9),l:1,c:cols[i%cols.length],lw:26})}}
function arc(p,w,col,lw,r){if(w<=0)return;x.beginPath();x.arc(CX,CY,r||R,p-HP-w,p-HP+w);x.strokeStyle=col;x.lineWidth=lw;x.lineCap='butt';x.stroke()}
function circle(px,py,r,f){x.beginPath();x.arc(px,py,Math.max(.1,r),0,P2);x.fillStyle=f;x.fill()}
function tx(s,px,py,font,col,bl,sc){x.save();x.translate(px,py);if(sc)x.scale(sc,sc);x.font=font;x.fillStyle=col;x.textAlign='center';x.textBaseline=bl||'alphabetic';x.fillText(s,0,0);x.restore()}
function rr(px,py,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}
function star(px,py,r,col){x.beginPath();for(let i=0;i<10;i++){const q=i/10*P2-HP,k=i%2?r*.45:r;x.lineTo(px+Math.cos(q)*k,py+Math.sin(q)*k)}x.closePath();x.fillStyle=col;x.fill()}
function coin(px,py,r){circle(px,py,r,'#E9A92B');circle(px,py,r*.7,'#F7CE5B');circle(px-r*.25,py-r*.25,r*.2,'#FFF1B8')}
function finger(px,py,down,al){x.save();x.globalAlpha=al==null?1:al;const s=down?.82:1;circle(px,py,24*s,'rgba(108,85,224,.18)');circle(px,py,15*s,'#fff');x.lineWidth=2.5;x.strokeStyle=INK;x.beginPath();x.arc(px,py,15*s,0,P2);x.stroke();circle(px,py,5*s,INK);x.restore()}
function tapFx(px,py){RG.push({x:px,y:py,t0:t,c:'#8E7BF2',m:40})}
// ---- oyun motoru ----
function gInit(n,sub,k,waves,script,gr){const I=4/18;G={n,sub,base:2.2+1.2*I+.12*k,hw:Math.max(.15,.5-.22*I-.035*k),waves,wave:0,T:[],TR:[],lives:3,miss:0,hitsW:0,script:script||[],done:{},cont:0,dead:false,win:false,gr:gr,lastHit:-9,gold:[15,20,30,40,60][k]+8};v=G.base*.6;newWave(true)}
function newWave(first){const al=G.wave>0&&(G.script.some(s=>s.w===G.wave&&s.type==='alarm')||Math.random()<.35),gap=al?1.4:1.05,base=norm(a+(first?1.6:1.7)+Math.random()*.8);
 G.T=[0,1,2].map(i=>({p:norm(base+i*gap),ph:Math.random()*6,born:t+i*.09,dead:-1}));G.TR.forEach(r=>{if(r.dead<0)r.dead=t});G.TR=G.TR.filter(r=>t-r.dead<.4);
 if(al)G.TR.push({p:norm(base+gap/2),w:.12,born:t+.2,dead:-1,hit:-9},{p:norm(base+gap*1.5),w:.12,born:t+.29,dead:-1,hit:-9});G.hitsW=0}
const hwOf=g=>G.hw*(.72+.5*(Math.sin(t*2.2+g.ph)+1)/2);
function gTap(){tapFx(CX,650);if(!G||G.dead||G.win)return;
 const al=G.TR.find(r=>r.dead<0&&t-r.born>.1&&ad(a,r.p)<r.w);if(al){al.hit=t;const[px,py]=Pt(al.p,R);sparks(px,py,30,['#FF5C85','#fff','#C0436B'],80,300);RG.push({x:px,y:py,t0:t,c:'#FF5C85',m:110});lose(2,'Alarm! −2 can');return}
 const g=G.T.find(g=>g.dead<0&&t-g.born>.12&&ad(a,g.p)<hwOf(g)+.02);if(g){hit(g);return}
 let nd=9;G.T.forEach(g=>{if(g.dead<0){const d=sd(g.p,a);if(Math.abs(d)<Math.abs(nd))nd=d}});lose(1,nd>0?'Erken!':'Geç!')}
function lose(n,s){G.lives-=n;G.miss+=n;shake=n>1?1.3:.7;red=n>1?1:.6;for(let i=0;i<n;i++)if(G.lives+i>=0&&G.lives+i<3)lifeFx[G.lives+i]=t;
 const[hx,hy]=Pt(a,R);XS.push({x:hx,y:hy,t0:t});txt(s,hx,hy-34,'#E0446B',n>1);
 if(G.lives<=0){G.lives=0;G.dead=true;G.deadT=t;burn()}}
function burn(){for(let i=0;i<200;i++){const q=Math.random()*P2,[px,py]=Pt(q,R+rnd(-13,13));EM.push({x:px,y:py,vx:rnd(-30,30),vy:rnd(-120,-20),l:1,d:rnd(.5,1.1),r:rnd(1,3.2),f:Math.random()*6})}
 for(let i=0;i<16;i++)SH.push({p:i/16*P2,w:P2/32*.92,r:R,vr:rnd(40,160),va:rnd(-.5,.5),l:1,c:i%2?'#E2DDF4':'#D3CAEC',lw:26});G.T.forEach(g=>{if(g.dead<0){g.dead=t;shatter(g.p,hwOf(g),['#FFA77C','#FF7B3F'])}});G.TR.forEach(r=>r.dead=t)}
function hit(g){const w=hwOf(g),perfect=ad(a,g.p)<w*.33;g.dead=t;G.hitsW++;G.lastHit=t;
 const[px,py]=Pt(g.p,R);shatter(g.p,w,perfect?['#FFD36B','#FF9A4D','#fff']:['#FFA77C','#FF7B3F','#FFD9C5']);sparks(px,py,perfect?34:22,perfect?['#FFD36B','#FF7B3F','#fff']:['#FFA77C','#FF7B3F','#fff']);
 RG.push({x:px,y:py,t0:t,c:perfect?'#FFC44D':'#FFA77C',m:perfect?90:65});const[q1,q2]=Pt(g.p,R+44);txt(perfect?'Mükemmel!':'İyi',q1,q2,perfect?'#E39A12':'#E0743C',perfect);
 pulse=perfect?1:.7;pulseC=perfect?'#FFC44D':'#FFA77C';np=1;slosh=1;
 if(G.T.every(g=>g.dead>=0)){G.wave++;sweep=t;wavePop=t;if(G.wave>=G.waves){G.win=true;G.winT=t;pulse=1.5}else newWave(false)}}
function gStep(dt){if(!G)return;const vT=G.dead?0:G.win?G.base*.35:G.base*(1+.05*G.hitsW);v+=(vT-v)*Math.min(1,dt/.16);pa=a;a+=v*dt;
 if(G.dead||G.win||!G.bot)return;
 const sw=G.script.find(s=>s.w===G.wave&&!G.done[s.w+s.type]);
 if(sw&&sw.type==='blank'&&G.hitsW>=1&&t-G.lastHit>.12&&G.T.every(g=>g.dead>=0||ad(a,g.p)>hwOf(g)+.08)&&G.TR.every(r=>ad(a,r.p)>.2)){G.done[sw.w+sw.type]=1;gTap();return}
 if(sw&&sw.type==='alarm'){const r=G.TR.find(r=>r.dead<0&&t-r.born>.1&&sd(r.p,pa)>0&&sd(r.p,a)<=0);if(r){G.done[sw.w+sw.type]=1;gTap();return}}
 const g=G.T.find(g=>g.dead<0&&t-g.born>.12&&sd(g.p,pa)>0&&sd(g.p,a)<=0);if(g)gTap()}
function fxStep(dt){shake=Math.max(0,shake-dt*3.2);red=Math.max(0,red-dt*2.4);pulse=Math.max(0,pulse-dt*2.6);np=Math.max(0,np-dt*5);slosh=Math.max(0,slosh-dt*1.6);flash=Math.max(0,flash-dt*2.5);
 PS.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=1-2.2*dt;q.vy=q.vy*(1-2.2*dt)+120*dt;q.l-=dt*q.d});PS=PS.filter(q=>q.l>0);
 SH.forEach(s=>{s.r+=s.vr*dt;s.vr*=1-1.5*dt;s.p+=s.va*dt;s.l-=dt*1.7});SH=SH.filter(s=>s.l>0);
 EM.forEach(e=>{e.x+=e.vx*dt+Math.sin(t*6+e.f)*14*dt;e.y+=e.vy*dt;e.vy-=30*dt;e.l-=dt*e.d*.7});EM=EM.filter(e=>e.l>0);
 CF.forEach(c=>{c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=1-1.8*dt;c.vy=c.vy*(1-1.8*dt)+420*dt;c.rot+=c.vr*dt;if(c.y>H+20)c.l=0});CF=CF.filter(c=>c.l>0);
 RG=RG.filter(g=>t-g.t0<.6);TX=TX.filter(q=>t-q.t0<.9);XS=XS.filter(q=>t-q.t0<.6);goldShow+=(gold-goldShow)*Math.min(1,dt*5)}
// ---- çizim parçaları ----
function bg(){x.setTransform(2,0,0,2,0,0);x.fillStyle='#F4F1FC';x.fillRect(0,0,W,H);circle(40,60,180,'#ECE7FA');circle(370,520,150,'#EFE6F8')}
function goldChip(){const gl=String(Math.round(goldShow)),cb=t-chip<.25?1+.25*Math.sin((t-chip)/.25*Math.PI):1;x.font='700 15px '+FD;const gw=x.measureText(gl).width+38;x.save();x.translate(W-16-gw/2,40);x.scale(cb,cb);rr(-gw/2,-16,gw,32,16,'#fff');coin(-gw/2+17,0,9);x.font='700 15px '+FD;x.fillStyle=INK;x.textAlign='left';x.textBaseline='middle';x.fillText(gl,-gw/2+30,1);x.restore()}
function hud(title,sub,dotsDone,dotCur,al){x.globalAlpha=al==null?1:al;tx(title,CX,98,'600 25px '+FD,INK);tx(sub,CX,120,'800 12.5px '+FB,SUB);
 for(let i=0;i<5;i++){const on=i<dotsDone,cur=i===dotCur;circle(CX-28+i*14,140,cur?5.5+Math.sin(t*4)*.8:4.5,on||cur?'#6C55E0':'#D3CAEC')}x.globalAlpha=1;
 rr(16,24,76,32,16,'#fff');for(let i=0;i<3;i++){const k=t-lifeFx[i],cx2=36+i*18,on=G&&i<G.lives;if(on)circle(cx2,40,6,'#6C55E0');else{circle(cx2,40,6,'#DAD3F2');if(k<.5){x.globalAlpha=1-k/.5;circle(cx2,40,6+k*22,'rgba(255,92,133,.5)');circle(cx2,40+k*30,6*(1-k),'#6C55E0');x.globalAlpha=1}}}goldChip()}
function ringGame(ringA,showNum){const sx=(Math.random()-.5)*shake*12,sy=(Math.random()-.5)*shake*12;x.save();x.translate(sx,sy);x.globalAlpha=ringA;
 for(let i=0;i<60;i++){const q=i/60*P2,m=i%5===0,[a1,b1]=Pt(q,R+19),[a2,b2]=Pt(q,R+(m?33:26));x.beginPath();x.moveTo(a1,b1);x.lineTo(a2,b2);x.strokeStyle=m?'#B9ADDC':'#D3CAEC';x.lineWidth=m?3:2;x.lineCap='round';x.stroke()}
 if(pulse>0){x.globalAlpha=ringA*Math.min(1,pulse)*.45;x.beginPath();x.arc(CX,CY,R,0,P2);x.strokeStyle=pulseC;x.lineWidth=26+pulse*22;x.stroke();x.globalAlpha=ringA}
 x.beginPath();x.arc(CX,CY,R,0,P2);x.strokeStyle='#E2DDF4';x.lineWidth=26;x.stroke();
 const sk=(t-sweep)/.55;if(sk>=0&&sk<1){for(let i=0;i<14;i++){x.globalAlpha=ringA*(1-sk)*(1-i/14)*.8;arc(a+sk*P2-i*.06,.04,'#fff',26)}x.globalAlpha=ringA}
 if(G){G.TR.forEach(r=>{const s=eob((t-r.born)/.3),f=r.dead>=0?1-cl((t-r.dead)/.3,0,1):1;if(s<=0||f<=0)return;x.globalAlpha=ringA*f;const hk=t-r.hit<.5?1-(t-r.hit)/.5:0,bl=.5+.5*Math.sin(t*9);
  arc(r.p,r.w*s+.03,'rgba(255,92,133,'+(.18+.12*bl+hk*.4)+')',34+hk*16);arc(r.p,r.w*s,'#FF5C85',26);const[px,py]=Pt(r.p,R);tx('!',px,py+1,'800 14px '+FB,'#fff','middle',s*(1+hk*.5));x.globalAlpha=ringA});
 G.T.forEach((g,i)=>{if(g.dead>=0)return;const s=eob((t-g.born)/.32);if(s<=0)return;const w=hwOf(g)*s,br=(Math.sin(t*2.2+g.ph)+1)/2;
  arc(g.p,w+.05,'rgba(255,167,124,'+(.18+.2*br)+')',38);arc(g.p,w+.03,'#FFD9C5',32);arc(g.p-w*2/3,w/3,'#FFA77C',26);arc(g.p,w/3,'#FF7B3F',26);arc(g.p+w*2/3,w/3,'#FFA77C',26);
  const[px,py]=Pt(g.p,R-27);circle(px,py,8*s,'#fff');tx(String(i+1),px,py+.5,'800 10.5px '+FB,'#C77A4E','middle',s)})}
 x.globalAlpha=1;SH.forEach(s=>{x.globalAlpha=Math.max(0,s.l);arc(s.p,s.w*(.4+.6*s.l),s.c,s.lw*(.35+.65*s.l),s.r)});x.globalAlpha=ringA;
 const rv=R-18,ly=CY+rv-rv*2*progV;x.save();x.beginPath();x.arc(CX,CY,rv,0,P2);x.fillStyle='#fff';x.fill();x.clip();
 const amp=3+slosh*9;x.beginPath();x.moveTo(CX-rv,CY+rv+2);for(let u=-rv;u<=rv;u+=4)x.lineTo(CX+u,ly+Math.sin(u/22+t*2.6)*amp+Math.sin(u/9-t*5)*slosh*3);x.lineTo(CX+rv,CY+rv+2);x.closePath();x.fillStyle='#C0B4F8';x.fill();
 x.beginPath();x.moveTo(CX-rv,CY+rv+2);for(let u=-rv;u<=rv;u+=4)x.lineTo(CX+u,ly+6+Math.sin(u/17-t*2)*amp*.7);x.lineTo(CX+rv,CY+rv+2);x.closePath();x.fillStyle='#AE9FF5';x.fill();x.restore();
 x.beginPath();x.arc(CX,CY,rv+4,0,P2);x.strokeStyle='#DAD3F8';x.lineWidth=2.5;x.stroke();
 if(showNum&&G){const wp=t-wavePop<.4?1+.35*Math.sin((t-wavePop)/.4*Math.PI):1;tx(String(Math.min(G.wave+1,G.waves)),CX,CY+14,'700 56px '+FD,INK,'alphabetic',wp);tx('/ '+G.waves+' dalga',CX,CY+40,'800 13px '+FB,SUB)}
 x.restore()}
function needle(al){x.save();x.globalAlpha=al;for(let i=1;i<16;i++){x.globalAlpha=al*(.34-i*.021);arc(a-i*.045*cl(v/2.9,0,1.5),.03,'#8E7BF2',18)}x.globalAlpha=al;
 const[hx,hy]=Pt(a,R),[bx,by]=Pt(a,R-44);x.beginPath();x.moveTo(bx,by);x.lineTo(hx,hy);x.strokeStyle=INK;x.lineWidth=3.5;x.lineCap='round';x.stroke();const hr=15*(1+np*.35);if(np>0)circle(hx,hy,hr+10*np,'rgba(255,167,124,'+np*.5+')');circle(hx,hy,hr,INK);circle(hx,hy,5*(1+np*.4),'#fff');x.restore()}
function fxDraw(){RG.forEach(g=>{const k=(t-g.t0)/.6;if(k<0)return;x.globalAlpha=(1-k)*.9;x.beginPath();x.arc(g.x,g.y,8+eo(k)*g.m,0,P2);x.strokeStyle=g.c;x.lineWidth=6*(1-k)+1;x.stroke()});x.globalAlpha=1;
 PS.forEach(q=>{x.globalAlpha=Math.max(0,Math.min(1,q.l*1.4));if(q.k){x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x-q.vx*.04,q.y-q.vy*.04);x.strokeStyle=q.c;x.lineWidth=q.r*.8;x.lineCap='round';x.stroke()}else circle(q.x,q.y,q.r*q.l,q.c)});x.globalAlpha=1;
 EM.forEach(e=>{x.globalAlpha=Math.max(0,e.l)*(.6+.4*Math.sin(t*20+e.f));circle(e.x,e.y,e.r*(.5+e.l*.5),e.l>.6?'#FFD36B':e.l>.3?'#FF7B3F':'#9C4A3A')});x.globalAlpha=1;
 XS.forEach(q=>{const k=(t-q.t0)/.6,s=eob(k/.4);x.globalAlpha=1-cl((k-.5)*2,0,1);x.save();x.translate(q.x,q.y);x.rotate(Math.sin(k*30)*.25*(1-k));x.scale(s,s);x.strokeStyle='#E0446B';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(-9,-9);x.lineTo(9,9);x.moveTo(9,-9);x.lineTo(-9,9);x.stroke();x.restore()});x.globalAlpha=1;
 TX.forEach(q=>{const k=(t-q.t0)/.9,s=eob(k/.25)*(q.big?1.25:1);x.globalAlpha=1-cl((k-.55)/.45,0,1);x.lineWidth=5;x.strokeStyle='#fff';x.save();x.translate(q.x,q.y-eo(k)*26);x.scale(s,s);x.font='700 '+(q.big?19:16)+'px '+FD;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.strokeText(q.s,0,0);x.fillStyle=q.col;x.fillText(q.s,0,0);x.restore()});x.globalAlpha=1;
 if(red>0){const gr=x.createRadialGradient(CX,CY,140,CX,CY,460);gr.addColorStop(0,'rgba(255,92,133,0)');gr.addColorStop(1,'rgba(255,92,133,'+red*.45+')');x.fillStyle=gr;x.fillRect(0,0,W,H)}
 CF.forEach(c=>{x.save();x.translate(c.x,c.y);x.rotate(c.rot);x.scale(1,Math.cos(c.rot*1.7));x.fillStyle=c.c;x.fillRect(-c.w/2,-c.h/2,c.w,c.h);x.restore()})}
