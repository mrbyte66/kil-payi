apply plugin: 'com.android.application'

/* Play yükleme anahtarı (V0.9.14 sonrası): depo DIŞINDA, ../KilPayi-keys/keystore.properties (storeFile, storePassword, keyAlias, keyPassword). Dosya yoksa release imzasız kalır; debug derlemesi (APK) etkilenmez. */
def ksFile = rootProject.file('../../KilPayi-keys/keystore.properties')
def ksProps = new Properties()
if (ksFile.exists()) { ksFile.withInputStream { ksProps.load(it) } }

/* V0.10.0: oyun dosyalarının mührü (bkz. Integrity.java). Sırayla: oyun (index.html) ve Capacitor ayar dosyaları; yalnızca var olanlar. `npx cap sync` bu dosyaları yazdıktan SONRA derle (tools/release*.sh böyle yapar). */
def kpAssetSha = {
    def md = java.security.MessageDigest.getInstance('SHA-256')
    def main = file('src/main/assets/public/index.html.kpe')
    if (!main.exists()) main = file('src/main/assets/public/index.html')
    [main, file('src/main/assets/capacitor.config.json'), file('src/main/assets/capacitor.plugins.json')].each { f ->
        if (f.exists()) md.update(f.bytes)
    }
    return md.digest().encodeHex().toString()
}

/* V0.10.1: oyun dosyalarının AES anahtarının yarısı (tools/encrypt-assets.mjs her derlemede üretir, depoya girmez); boşsa şifreleme yoktur ve düz dosyalar sunulur (bkz. SecureAssets.java). */
def kpKeyProps = new Properties()
def kpKeyFile = file('kp-key.properties')
if (kpKeyFile.exists()) { kpKeyFile.withInputStream { kpKeyProps.load(it) } }

android {
    namespace = "com.mrbytestudio.kilpayi"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.mrbytestudio.kilpayi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 28
        versionName "0.10.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', 'ASSET_SHA256', "\"${kpAssetSha()}\""
        buildConfigField 'String', 'KP_A', "\"${kpKeyProps.getProperty('a', '')}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            /* V0.10.0: R8 ile Java kodu küçültülür ve adları karıştırılır (Play "kod karartma" önerisi; yeniden paketleyenin işini zorlaştırır). Kurallar proguard-rules.pro'da, Capacitor'ın kendi kuralları kitaplıkla gelir. */
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (ksFile.exists()) { signingConfig signingConfigs.release }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
