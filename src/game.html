<title>Kıl payı</title>
<!--FONTS-START-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<!--FONTS-END-->
<style>
/* Tasarım planı
   Renk: lila (ana) + şeftali (hedef bölge); uyarı için gül. Nötrler lilaya çalar.
   Yazı: Fredoka (başlık, sayılar), Nunito (metin). Yuvarlak formlar, hap butonlar.
   Düzen: kronometre kadranı ortada, üstte süre kapsülü, altta alet çubuğu, üstte duran katmanlar buzlu cam. */
:root{
  --bg:#F5F2FC;--bg-2:#E9E3F7;--surface:#FFFFFF;--track:#E3DCF5;--tick:#B4AAD5;--line:#D8D0EC;
  --ink:#29233F;--ink-2:#615A7C;--ink-3:#8F87AB;
  --lilac:#8E7CF2;--lilac-soft:#DCD5FB;--btn:#6D58E0;--on-btn:#FFFFFF;
  --peach:#FFA473;--peach-deep:#FF7D43;--peach-soft:#FFD9C5;
  --rose:#FF5C84;--rose-soft:#FFD2DC;--life:#27B27A;
  --blob-1:#E2DBFB;--blob-2:#EBDDF9;
  --glass:rgba(255,255,255,.64);--glass-edge:rgba(255,255,255,.85);--scrim:rgba(41,35,63,.18);
  --shadow-s:0 1px 2px rgba(41,35,63,.06),0 6px 16px rgba(41,35,63,.08);
  --shadow-m:0 2px 6px rgba(41,35,63,.07),0 20px 48px rgba(41,35,63,.16);
  --r-s:16px;--r-m:24px;--r-l:32px;--r-pill:999px;
  --fs-12:.75rem;--fs-14:.875rem;--fs-16:1rem;--fs-20:1.25rem;--fs-28:1.75rem;--fs-72:4.5rem;
  --dur-fast:180ms;--dur-base:300ms;--dur-slow:550ms;--ease:cubic-bezier(.2,.8,.2,1);
  --font-display:"Fredoka","SF Pro Rounded",ui-rounded,"Nunito",system-ui,sans-serif;
  --font-body:"Nunito","SF Pro Rounded",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16132E;--bg-2:#0F0D22;--surface:#26204D;--track:#312B5C;--tick:#5E5796;--line:#3D3770;
  --ink:#F4F1FF;--ink-2:#BBB4DC;--ink-3:#8780AE;
  --lilac:#AA9CFF;--lilac-soft:#3B327A;--btn:#BBAEFF;--on-btn:#1B1644;
  --peach:#FFB088;--peach-deep:#FF9560;--peach-soft:#6B4148;
  --rose:#FF7C9E;--rose-soft:#5C2D49;--life:#3BD99B;
  --blob-1:#2B2463;--blob-2:#382A6C;
  --glass:rgba(38,32,77,.62);--glass-edge:rgba(255,255,255,.16);--scrim:rgba(7,5,22,.5);
  --shadow-s:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.28);
  --shadow-m:0 2px 6px rgba(0,0,0,.3),0 20px 48px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16132E;--bg-2:#0F0D22;--surface:#26204D;--track:#312B5C;--tick:#5E5796;--line:#3D3770;
  --ink:#F4F1FF;--ink-2:#BBB4DC;--ink-3:#8780AE;
  --lilac:#AA9CFF;--lilac-soft:#3B327A;--btn:#BBAEFF;--on-btn:#1B1644;
  --peach:#FFB088;--peach-deep:#FF9560;--peach-soft:#6B4148;
  --rose:#FF7C9E;--rose-soft:#5C2D49;--life:#3BD99B;
  --blob-1:#2B2463;--blob-2:#382A6C;
  --glass:rgba(38,32,77,.62);--glass-edge:rgba(255,255,255,.16);--scrim:rgba(7,5,22,.5);
  --shadow-s:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.28);
  --shadow-m:0 2px 6px rgba(0,0,0,.3),0 20px 48px rgba(0,0,0,.45);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;display:flex;justify-content:center;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-16);line-height:1.35;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;background:var(--bg)}
@media (min-width:600px){body{align-items:center;background:var(--bg-2)}#app{height:min(100%,860px);border-radius:var(--r-l);box-shadow:var(--shadow-m)}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:20px;height:20px;flex:none;display:block}
svg.ic .f{fill:currentColor}
svg.ic .s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.amb{position:absolute;inset:0;overflow:hidden;pointer-events:none;transition:opacity var(--dur-slow) var(--ease)}
#app.playing .amb{opacity:.4}
.amb i{position:absolute;display:block;border-radius:50%;will-change:transform}
.amb i:nth-child(1){width:70%;aspect-ratio:1;left:-24%;top:-10%;background:var(--blob-1);animation:drift-a 24s ease-in-out infinite alternate}
.amb i:nth-child(2){width:54%;aspect-ratio:1;right:-18%;top:38%;background:var(--blob-2);animation:drift-b 28s ease-in-out infinite alternate}
.amb i:nth-child(3){width:62%;aspect-ratio:1;left:6%;bottom:-24%;background:var(--blob-1);animation:drift-c 32s ease-in-out infinite alternate}
@keyframes drift-a{to{transform:translate3d(14%,10%,0) scale(1.1)}}
@keyframes drift-b{to{transform:translate3d(-16%,-8%,0) scale(.92)}}
@keyframes drift-c{to{transform:translate3d(12%,-12%,0) scale(1.12)}}

.hud{position:absolute;left:0;right:0;top:0;padding:18px 20px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity var(--dur-base) var(--ease),transform var(--dur-slow) var(--ease)}
.hud.on{opacity:1;transform:none}
.gauge-row{display:flex;align-items:center;gap:12px}
.gauge{position:relative;flex:1;height:30px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:var(--r-pill);background:var(--lilac)}
.gauge.warn .fill{background:var(--peach)}
.gauge.crit .fill{background:var(--rose)}
.notch{position:absolute;top:7px;bottom:7px;width:3px;margin-left:-1px;border-radius:2px;background:var(--rose)}
.tleft{min-width:52px;text-align:right;font-family:var(--font-display);font-weight:600;font-size:var(--fs-20);font-variant-numeric:tabular-nums;color:var(--ink)}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hud-row2{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:24px}
.lvl{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.lprog{display:block;width:100%;height:3px;border-radius:2px;background:var(--track);overflow:hidden}
.lprog b{display:block;height:100%;width:0;border-radius:2px;background:var(--lilac)}
.lprog.x b{background:#D9503A}
.sect{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:var(--r-pill);font-weight:800;font-size:var(--fs-12);white-space:nowrap;opacity:0;transform:translateY(-4px);transition:opacity var(--dur-base) var(--ease),transform var(--dur-base) var(--ease)}
.sect.on{opacity:1;transform:none}
.sect.x{background:#D9503A;color:#fff}
.gauge.hasLife{box-shadow:0 0 0 2.5px var(--life)}
.life{display:none;align-items:center;gap:3px;height:24px;padding:0 9px 0 6px;border-radius:12px;background:var(--life);color:#fff;font:800 12px/1 var(--font-body);flex:none}
.life svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round}
.life.on{display:inline-flex}
.life.pop{animation:lifepop .6s var(--ease)}
@keyframes lifepop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.zone{font-weight:800;font-size:var(--fs-12);color:var(--ink-2);transition:color var(--dur-fast);white-space:nowrap}
.zone.hot{color:var(--rose)}
.fx{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1;min-width:0}

.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface);color:var(--ink-2);font-weight:800;font-size:var(--fs-14);box-shadow:var(--shadow-s)}
.chip b{font-family:var(--font-display);font-weight:600;font-size:var(--fs-16);color:var(--ink);font-variant-numeric:tabular-nums}
.chip{white-space:nowrap}
.chip.sm{min-height:30px;padding:0 12px;font-size:var(--fs-12)}
.chip.sm b{font-size:var(--fs-14)}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:20px 20px 24px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity var(--dur-fast) var(--ease),visibility 0s linear var(--dur-fast)}
.scr.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity var(--dur-base) var(--ease),visibility 0s}
.scr.on .rise{animation:rise var(--dur-slow) var(--ease) both;animation-delay:calc(var(--i,0)*90ms + 80ms)}
@keyframes rise{from{opacity:.5;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

.menu-head{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tb-right{display:flex;gap:10px}
.title{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(2.25rem,10vw,3rem);letter-spacing:-.01em;line-height:1.05;text-align:center}
.tagline{margin:0;max-width:300px;color:var(--ink-2);font-weight:700;font-size:var(--fs-16);text-align:center;text-wrap:balance}
.grow{flex:1}
.menu-foot{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.stat-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}

.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:var(--r-pill);font-family:var(--font-display);font-weight:600;font-size:var(--fs-20);line-height:1;color:var(--ink);background:var(--surface);box-shadow:var(--shadow-s);transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),opacity var(--dur-fast)}
.btn:active{transform:translateY(0) scale(.97);box-shadow:var(--shadow-s)}
.btn:focus-visible,.icon-btn:focus-visible,.tool:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.btn.primary{background:var(--btn);color:var(--on-btn)}
.btn.big{width:min(100%,280px);min-height:64px;font-size:var(--fs-28)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--ink-2);min-height:44px;font-family:var(--font-body);font-weight:800;font-size:var(--fs-16)}
.btn[aria-disabled="true"]{opacity:.55}
@media (hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-m)}.btn.quiet:hover{box-shadow:none;transform:none;color:var(--ink)}}
.icon-btn{appearance:none;border:0;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow-s);transition:transform var(--dur-fast) var(--ease)}
.icon-btn:active{transform:scale(.94)}
@keyframes breathe{50%{transform:scale(1.04)}}
.breathe{animation:breathe 2.4s ease-in-out infinite}

.tools{position:absolute;left:0;right:0;top:0;bottom:auto;padding:0 16px;display:flex;justify-content:center;align-items:flex-end;gap:16px;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity var(--dur-base) var(--ease),transform var(--dur-slow) var(--ease)}
.tools.on{opacity:1;transform:none}
.tools.on.dim{opacity:.3}
.tools.dim .tool{pointer-events:none}
.tool{appearance:none;border:0;position:relative;width:60px;height:60px;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s);display:grid;place-items:center;cursor:pointer;pointer-events:auto;touch-action:none;transition:transform var(--dur-fast) var(--ease),opacity var(--dur-fast),width var(--dur-fast) var(--ease),height var(--dur-fast) var(--ease)}
.tools:not(.on) .tool{pointer-events:none}
.tool:active{transform:scale(.94)}
.tool.empty{opacity:.55}
.tool.adv{width:76px;height:76px;background:#F4B63F;color:#3F2A00;box-shadow:0 0 0 5px rgba(244,182,63,.3),var(--shadow-s);animation:advpulse .9s ease-in-out infinite}
.tool.adv .badge{background:#3F2A00;color:#F4B63F}
@keyframes advpulse{50%{box-shadow:0 0 0 12px rgba(244,182,63,.08),var(--shadow-s);transform:scale(1.05)}}
.tool.bump .badge{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.55)}}
@media (max-height:700px){.tool{width:54px;height:54px}.tool.adv{width:66px;height:66px}}
@media (max-width:340px){.tools{gap:8px}}
.advlbl{position:absolute;top:-36px;transform:translateX(-50%);padding:6px 13px;border-radius:999px;background:#F4B63F;color:#3F2A00;font:800 13px/1 var(--font-body);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.advlbl.on{opacity:1}
.tool svg{width:26px;height:26px;display:block}
.tool .s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool .badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--btn);color:var(--on-btn);font:800 12px/22px var(--font-body);text-align:center;font-variant-numeric:tabular-nums}
.tool.empty .badge{background:var(--track);color:var(--ink-2)}
.mjk{display:flex;gap:10px}
.mj{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow-s);display:grid;place-items:center}
.mj svg{width:22px;height:22px}
.mj .s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mj em{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--btn);color:var(--on-btn);font:800 11px/19px var(--font-body);font-style:normal;text-align:center}
.mj.zero em{background:var(--track);color:var(--ink-2)}
.btn.big small{display:block;font:800 var(--fs-12)/1 var(--font-body);opacity:.85}
.btn.big.two{flex-direction:column;gap:4px;min-height:70px}
.btn.warn{color:var(--rose)}
.ver{font-weight:800;font-size:var(--fs-12);color:var(--ink-3);opacity:.85;margin-top:-4px}
.icon-btn{position:relative}
.icon-btn.dot::after{content:"";position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--surface)}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow-s);text-align:left}
.brow .bt{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--lilac-soft)}
.brow .bt img{display:block}
.brow .bx{min-width:0;display:flex;flex-direction:column;gap:2px}
.brow b{font-family:var(--font-display);font-weight:600;font-size:var(--fs-16)}
.brow small{color:var(--ink-2);font-weight:700;font-size:var(--fs-12);line-height:1.3}
.brow small i{display:block;font-style:normal;color:var(--rose)}
.brow .tg{align-self:flex-start;font-style:normal;font-weight:800;font-size:11px;line-height:1;padding:4px 9px;border-radius:999px;background:var(--peach);color:#3A1D00}
.brow .tg.g{background:var(--track);color:var(--ink-2)}
.brow .tg.nw{background:var(--btn);color:var(--on-btn)}
.brow .try{appearance:none;cursor:pointer;border:1.5px solid var(--lilac);background:transparent;color:var(--ink);font-family:var(--font-body);font-weight:800;font-size:var(--fs-12);padding:8px 14px;border-radius:999px;min-height:34px}
.brow .try:active{transform:scale(.95)}
.brow.lk .bt img,.brow.lk .bx b,.brow.lk .bx small{opacity:.62}
.brow.nx{outline:2px dashed var(--peach);outline-offset:-2px}
.brow.nw{outline:2px solid var(--btn);outline-offset:-2px}
@media (max-width:340px){.brow{grid-template-columns:38px minmax(0,1fr) auto;gap:8px;padding:8px 9px}.brow .bt{width:38px;height:38px}.brow .bt img{width:30px;height:30px}.brow .try{padding:7px 10px}}
.bcap{margin:0;width:100%;color:var(--ink-3);font-weight:700;font-size:var(--fs-12);text-align:left}
.bcnt{font-weight:800;font-size:var(--fs-12);color:var(--ink-2);white-space:nowrap}
.prac-bar{display:none;align-items:center;justify-content:space-between;gap:10px}
#app.prac .gauge-row,#app.prac .hud-row,#app.prac .hud-row2{display:none}
#app.prac .prac-bar{display:flex}
.prac-bar .btn{pointer-events:auto;min-height:40px;padding:0 16px;font-size:var(--fs-14);background:var(--surface);box-shadow:var(--shadow-s);color:var(--ink)}
.pdots{display:flex;gap:8px}
.pdots i{display:block;width:14px;height:14px;border-radius:50%;background:var(--track)}
.pdots i.on{background:var(--peach)}
.pdt{margin:0;font-family:var(--font-display);font-weight:700;font-size:var(--fs-28);color:var(--ink)}
.swapsub{margin:0;max-width:300px;color:var(--ink-2);font-weight:700;font-size:var(--fs-14);line-height:1.5}

.scr.dim{background:var(--scrim);justify-content:center}
.card{width:min(100%,380px);padding:26px 20px 20px;border-radius:var(--r-l);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.scr.on .card{animation:card-in var(--dur-slow) var(--ease) both}
@keyframes card-in{from{opacity:0;transform:translateY(28px) scale(.95)}to{opacity:1;transform:none}}
.glass{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--shadow-m);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--surface)}}
.eyebrow{margin:0;font-weight:800;font-size:var(--fs-14);color:var(--ink-2)}
.big-score{font-family:var(--font-display);font-weight:700;font-size:var(--fs-72);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.delta{margin:0;font-weight:800;font-size:var(--fs-16);color:var(--ink-2)}
.delta.win{color:var(--btn)}
.near-msg{margin:0;padding:7px 14px;border-radius:var(--r-pill);background:var(--rose-soft);color:var(--ink);font-weight:800;font-size:var(--fs-14)}
.cont{width:100%;padding:14px;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:12px;text-align:left}
.cont-head{display:flex;flex-direction:column;gap:2px}
.cont-head b{font-family:var(--font-display);font-weight:600;font-size:var(--fs-20)}
.cont-head span{color:var(--ink-2);font-weight:700;font-size:var(--fs-14)}
.cont-actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.cont-actions .btn{min-height:52px;padding:0 12px;font-size:var(--fs-16);white-space:nowrap;background:var(--bg);box-shadow:none}
.cont-actions .btn.ad{background:var(--btn);color:var(--on-btn)}
.row2{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--shadow-s);width:min(100%,372px)}
.seg button{appearance:none;border:0;cursor:pointer;min-height:40px;padding:0 4px;border-radius:var(--r-pill);background:transparent;color:var(--ink-2);font-family:var(--font-display);font-weight:600;font-size:var(--fs-14);line-height:1;white-space:nowrap;transition:background var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.seg button[aria-checked="true"]{background:var(--btn);color:var(--on-btn)}
.seg button[data-lvl="cehennem"][aria-checked="true"]{background:#D9503A;color:#fff}
.lvhint{margin:-8px 0 0;max-width:320px;min-height:16px;color:var(--ink-3);font-weight:700;font-size:var(--fs-12);text-align:center}
.chip.x{background:#D9503A;color:#fff}
.chip.x b{color:#fff}
@media (max-width:360px){.seg button{font-size:13px;padding:0 2px}}
@media (max-width:330px){.seg button{font-size:12px}}
@media (max-height:700px){.lvhint{display:none}}
.seg button:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

<script>
(() => {
'use strict';

const TAU = Math.PI * 2, HALF = Math.PI / 2;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const norm = a => { a %= TAU; return a < 0 ? a + TAU : a; };
const angd = (a, b) => { const d = norm(a - b); return d > Math.PI ? TAU - d : d; };
const easeOut = p => 1 - Math.pow(1 - p, 3);
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- ayarlar: oyun dengesi ve zorluk eğrisi tek yerde ---------- */
/*TUNE-START*/
const CFG = {
  maxTime: 8, startTime: 6,
  hitGain: 0.95, perfectBonus: 0.08, reliefGain: 0.2, nearGain: 1.5, nearAt: 1.0, missCost: 0.8, trapCost: 1.3,
  perfectFrac: 0.32, grace: 0.05,
  spawnMin: 1.0, spawnMax: 2.2,
  contTime: 4, contCoins: 25, contSlow: 3, contSlowMul: 0.7,
  coinDiv: 4, nearCoin: 2, adSeconds: 3, tutHits: 5, adCoins: 20
};
/* Zorluk dalgalı: taban yavaşça yükselir, her dalga (period vuruş) önce yükselir sonra gevşer.
   adapt: oyuncu iyi oynadıkça yükselir, hata yaptıkça düşer. mercy: hatadan sonra kısa süre nefes verir. */
const DIFF = {
  period: 10, rise: 0.6,
  trendMax: 0.72, trendTau: 75,
  ampMax: 0.2, ampStart: 0.3, ampTau: 20,
  omegaMin: 2.2, omegaMax: 3.8, hwMax: 0.56, hwMin: 0.15,
  adaptUp: 0.01, adaptDown: 0.03, adaptCap: 0.12,
  mercyHit: 0.6, mercyDecay: 0.7, mercyDrop: 0.25,
  fatigueFrom: 100, fatigueRate: 0.004, fatigueCap: 0.6
};
/* Kilit türleri: min = ilk kez açılması için bir oyunda gereken vuruş sayısı, w = seçilme ağırlığı,
   gain = vuruş başına süre çarpanı, hwMul/omMul = hedef genişliği ve ibre hızı çarpanı. */
const KINDS = ['tek', 'cift', 'kayan', 'tuzak', 'iki'];
const KIND = {
  tek:   { min: 0,  w: 0.7, gain: 1.0,  hwMul: 1.0,  omMul: 1.0 },
  cift:  { min: 8,  w: 0.6, gain: 0.8,  hwMul: 1.15, omMul: 1.0 },
  kayan: { min: 16, w: 0.5, gain: 1.0,  hwMul: 1.2,  omMul: 0.92 },
  tuzak: { min: 26, w: 0.5, gain: 1.0,  hwMul: 1.0,  omMul: 1.0 },
  iki:   { min: 38, w: 0.4, gain: 0.65, hwMul: 1.25, omMul: 0.82 }
};
/* Seviyeler: hw = hedef genişliği, om = ibre hızı, gain = vuruş başına süre, miss ve trap = ıska ve tuzak bedeli çarpanı,
   kind = kilit eşiği çarpanı, startT = başlangıç süresi, coin = coin kazancı çarpanı.
   hell = cehennem bölümleri: 'none' (hiç yok: Rahat ve Normal), 'phases' (her seviyenin sonunda açılıp kapanır: Usta), 'always' (baştan sona: Cehennem).
   Yalnızca Cehennem kademesinde: drain = süre erime çarpanı, twins = engel ikizi olasılığının alt sınırı (ikizler kilitle birlikte açılır),
   hellScale = cehennem gücü çarpanı. */
const LEVELS = ['rahat', 'normal', 'usta', 'cehennem'];
const LEVEL = {
  rahat:  { hw: 1.2,  om: 0.9,  gain: 1.15, miss: 0.7,  trap: 0.7,  kind: 1.4, startT: 7,   coin: 0.7, hell: 'none' },
  normal: { hw: 1,    om: 1,    gain: 1,    miss: 1,   trap: 1,    kind: 1,   startT: 6,   coin: 1, hell: 'none' },
  usta:   { hw: 0.9,  om: 1.1,  gain: 0.8,  miss: 1.4,  trap: 1.25, kind: 0.6, startT: 5.5, coin: 1.4, hell: 'phases' },
  cehennem: { hw: 0.82, om: 1.18, gain: 1,  miss: 1.5,  trap: 1.5,  kind: 0.5, startT: 5.5, coin: 2, drain: 1.25, twins: 0.85, hell: 'always', hellScale: 0.64 }
};
/* Seri (kombo): ardışık vuruşlar puan çarpanı kazandırır, ıska seriyi sıfırlar. tiers: çarpanın arttığı seri sayıları. */
const COMBO = { tiers: [5, 10, 20, 35] };
const comboMult = c => { let m = 1; for (const x of COMBO.tiers) if (c >= x) m++; return m; };
const kindMin = (k, unl, km) => Math.round((unl && unl[k] ? 6 + 2 * KINDS.indexOf(k) : KIND[k].min) * (km || 1));
const kindOpen = (k, n, unl, km) => k === 'tek' || n >= kindMin(k, unl, km);
const pickKind = (n, relief, unl, last, r, km) => {
  if (relief) return 'tek';
  const open = KINDS.filter(k => kindOpen(k, n, unl, km) && !(k === last && k !== 'tek'));
  let sum = 0;
  for (const k of open) sum += KIND[k].w;
  let x = r * sum;
  for (const k of open) { x -= KIND[k].w; if (x <= 0) return k; }
  return 'tek';
};
const drainAt = n => 1 + Math.min(DIFF.fatigueCap, Math.max(0, n - DIFF.fatigueFrom) * DIFF.fatigueRate);
const wavePhase = n => (n % DIFF.period) / DIFF.period;
const smooth = p => p * p * (3 - 2 * p);
const waveShape = p => p < DIFF.rise ? smooth(p / DIFF.rise) : 1 - smooth((p - DIFF.rise) / (1 - DIFF.rise));
const intensity = (n, adapt, mercy) => {
  const trend = DIFF.trendMax * (1 - Math.exp(-n / DIFF.trendTau));
  const amp = DIFF.ampMax * (DIFF.ampStart + (1 - DIFF.ampStart) * (1 - Math.exp(-n / DIFF.ampTau)));
  const v = trend + amp * waveShape(wavePhase(n)) + adapt - DIFF.mercyDrop * mercy;
  return Math.max(0, Math.min(1, v));
};
const planGate = (n, adapt, mercy) => {
  const I = intensity(n, adapt, mercy);
  return {
    I,
    omega: DIFF.omegaMin + (DIFF.omegaMax - DIFF.omegaMin) * I,
    hw: DIFF.hwMax - (DIFF.hwMax - DIFF.hwMin) * I,
    relief: wavePhase(n) > DIFF.rise + 1e-9
  };
};
const resolveHit = (S, d) => {

  ink: '#FFE9E2', 'ink-2': '#D6A096', 'ink-3': '#A8706A', lilac: '#FF5C38', 'lilac-soft': '#5A2118', btn: '#FF6A3D', 'on-btn': '#FFFFFF',
  peach: '#FF7A45', 'peach-deep': '#FFC478', 'peach-soft': '#7A2D23', rose: '#FF4D8A', 'rose-soft': '#6A1F3A', life: '#45E0A8',
  'blob-1': '#34101A', 'blob-2': '#481216', glass: 'rgba(52,14,20,.72)', 'glass-edge': 'rgba(255,160,130,.22)', scrim: 'rgba(8,2,4,.55)'
};
const parseCol = str => {
  const s = (str || '').trim();
  if (s.charAt(0) === '#') {
    const h = s.length === 4 ? s.slice(1).replace(/./g, x => x + x) : s.slice(1), v = parseInt(h, 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255, 1];
  }
  const m = s.match(/rgba?\(([^)]+)\)/);
  if (m) { const a = m[1].split(',').map(parseFloat); return [a[0], a[1], a[2], a.length > 3 ? a[3] : 1]; }
  return [136, 136, 136, 1];
};
const toCss = a => {
  const r = Math.round(a[0]), g = Math.round(a[1]), b = Math.round(a[2]);
  if (a[3] >= 0.999) return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a[3].toFixed(3) + ')';
};
const TH_X = {}, BASE = {};
TH_KEYS.forEach(k => { TH_X[k] = parseCol(THEME_X[k]); });
let thWx = 0, thLast = -1;
const applyTheme = force => {
  /* geçiş sürerken en çok ~%1,5'lik adımlarla güncelle (her güncelleme tüm sayfanın stilini yeniden hesaplatır); bitiş değeri her zaman uygulanır */
  const d = Math.abs(thWx - thLast);
  if (!force && (d < 0.002 || (thWx !== G.thT && d < 0.015))) return;
  thLast = thWx;
  const root = document.documentElement, off = thWx < 0.002;
  TH_KEYS.forEach(k => {
    const b = BASE[k], x = TH_X[k], o = [0, 0, 0, 0];
    for (let i = 0; i < 4; i++) o[i] = b[i] * (1 - thWx) + x[i] * thWx;
    const css = toCss(o);
    if (off) root.style.removeProperty('--' + k); else root.style.setProperty('--' + k, css);
    if (P_KEYS[k]) P[k] = css;
  });
};
const readPalette = () => {
  const root = document.documentElement, cs = getComputedStyle(root), had = thWx > 0.002;
  if (had) TH_KEYS.forEach(k => root.style.removeProperty('--' + k));
  TH_KEYS.forEach(k => { BASE[k] = parseCol(cs.getPropertyValue('--' + k)); });
  FD = cs.getPropertyValue('--font-display').trim() || 'sans-serif';
  FB = cs.getPropertyValue('--font-body').trim() || 'sans-serif';
  applyTheme(true);
  onPalette();
};

  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readPalette);
  new MutationObserver(readPalette).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
} catch (e) {}

const Snd = {
  ctx: null, master: null,
  unlock() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) { this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination); }
      } catch (e) {}
    }
    if (this.ctx && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) {} }
  },
  tone(f, d, type, v, to, delay) {
    if (!save.snd || !this.ctx) return;
    try {
      const c = this.ctx, t0 = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
      if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(v || 0.2, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + d + 0.03);
    } catch (e) {}
  },
  hit(combo, perfect) {
    const sc = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
    const f = 392 * Math.pow(2, sc[Math.min(combo, sc.length - 1)] / 12);
    this.tone(f, 0.18, 'triangle', 0.2);
    if (perfect) this.tone(f * 2, 0.22, 'sine', 0.1, null, 0.02);
  },
  near() { this.tone(220, 0.28, 'sawtooth', 0.09, 1100); this.tone(1320, 0.3, 'sine', 0.14, null, 0.08); this.tone(1760, 0.32, 'sine', 0.1, null, 0.15); },
  miss() { this.tone(150, 0.16, 'square', 0.08, 90); },
  alarm() { this.tone(300, 0.14, 'square', 0.09, 180); this.tone(300, 0.14, 'square', 0.09, 180, 0.17); },
  over() { this.tone(440, 0.5, 'sine', 0.18, 110); },
  warn() { this.tone(1180, 0.05, 'sine', 0.05); },
  ui() { this.tone(660, 0.08, 'triangle', 0.12); },
  rev() { this.tone(520, 0.12, 'triangle', 0.1, 780); },
  portalIn() { this.tone(760, 0.16, 'sine', 0.1, 240); },
  portalOut() { this.tone(260, 0.12, 'sine', 0.1, 900); this.tone(1320, 0.14, 'triangle', 0.07, null, 0.07); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.14, null, i * 0.08)); },
  tool() { this.tone(500, 0.1, 'triangle', 0.14, 900); this.tone(900, 0.14, 'sine', 0.1, null, 0.08); },
  life() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.13, null, i * 0.06)); },
  adv() { this.tone(880, 0.09, 'sine', 0.1); this.tone(1320, 0.12, 'sine', 0.08, null, 0.08); },
  hell() { this.tone(110, 0.7, 'sawtooth', 0.12, 55); this.tone(82, 0.9, 'square', 0.07, 41, 0.05); },
  level() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.12, null, i * 0.07)); },
  tick(go) { this.tone(go ? 988 : 660, go ? 0.2 : 0.09, 'triangle', 0.13); },
  boom() {
    this.tone(90, 0.7, 'sawtooth', 0.22, 38); this.tone(150, 0.4, 'square', 0.14, 50, 0.02);
    if (!save.snd || !this.ctx) return;
    try {
      const c = this.ctx, n = Math.floor(c.sampleRate * 0.5), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
      const src = c.createBufferSource(), g = c.createGain(); g.gain.value = 0.28; src.buffer = b; src.connect(g); g.connect(this.master); src.start();
    } catch (e) {}
  },
  combo(m) { const f = [523, 659, 784, 988, 1175][Math.min(4, Math.max(0, m - 1))]; this.tone(f, 0.14, 'triangle', 0.14); this.tone(f * 1.5, 0.2, 'sine', 0.12, null, 0.07); this.tone(f * 2, 0.26, 'sine', 0.1, null, 0.14); }
};

const CAP = window.Capacitor;
const NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
const ADS = { test: true, rewardedId: 'ca-app-pub-3940256099942544/5224354917' };
const plugins = {};
const plugin = name => {
  if (!NATIVE) return null;
  if (!(name in plugins)) {
    try { plugins[name] = CAP.registerPlugin ? CAP.registerPlugin(name) : ((CAP.Plugins && CAP.Plugins[name]) || null); } catch (e) { plugins[name] = null; }
  }
  return plugins[name];
};
let adMobReady = null;
const adMobInit = A => adMobReady || (adMobReady = A.initialize({ initializeForTesting: ADS.test }).then(() => true, () => false));

const Platform = {
  native: NATIVE,
  haptic(kind) {
    if (!save.vib) return;
    const H = plugin('Haptics');
    if (H) {
      try {
        if (kind === 'light') H.impact({ style: 'LIGHT' });
        else if (kind === 'medium') H.impact({ style: 'MEDIUM' });
        else if (kind === 'heavy') H.impact({ style: 'HEAVY' });
        else if (kind === 'warn') H.notification({ type: 'WARNING' });
        else if (kind === 'error') H.notification({ type: 'ERROR' });
      } catch (e) {}
      return;
    }
    const pat = { light: 8, medium: 14, heavy: [18, 30, 40], warn: 28, error: [30, 40, 60] }[kind];
    try {
      if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
      if (navigator.vibrate) navigator.vibrate(pat);
    } catch (e) {}
  },
  track(name, params) { try { if (window.console && console.debug) console.debug('[kp]', name, params || ''); } catch (e) {} },
  rewardedAd(done) {
    const A = plugin('AdMob'), el = $('ad'), bar = $('adFill');
    if (!A) {
      const t0 = performance.now(), dur = CFG.adSeconds * 1000;
      bar.style.width = '0%'; show(el);
      const step = () => {
        const p = Math.min(1, (performance.now() - t0) / dur);
        bar.style.width = (p * 100).toFixed(1) + '%';
        if (p < 1) requestAnimationFrame(step); else { hide(el); done(true); }
      };
      requestAnimationFrame(step);
      return;
    }
    $('adBadgeEl').textContent = t('adBadgeReal'); $('adTextEl').textContent = t('adLoading');
    el.classList.add('real'); bar.style.width = '35%'; show(el);
    const handles = [];
    let settled = false, earned = false, timer = 0;
    const finish = (ok, why) => {
      if (settled) return;
      settled = true; clearTimeout(timer);
      handles.forEach(h => { try { h.remove(); } catch (e) {} });
      el.classList.remove('real'); hide(el);
      $('adBadgeEl').textContent = t('adBadge'); $('adTextEl').textContent = t('adText');
      done(ok, why);
    };
    timer = setTimeout(() => finish(false, 'fail'), 25000);
    (async () => {
      try {
        if (!(await adMobInit(A))) { finish(false, 'fail'); return; }
        handles.push(await A.addListener('onRewardedVideoAdShowed', () => { clearTimeout(timer); }));
        handles.push(await A.addListener('onRewardedVideoAdReward', () => { earned = true; }));
        handles.push(await A.addListener('onRewardedVideoAdDismissed', () => finish(earned, earned ? 'ok' : 'closed')));
        handles.push(await A.addListener('onRewardedVideoAdFailedToShow', () => finish(false, 'fail')));
        handles.push(await A.addListener('onRewardedVideoAdFailedToLoad', () => finish(false, 'fail')));
        await A.prepareRewardVideoAd({ adId: ADS.rewardedId, isTesting: ADS.test });
        const item = await A.showRewardVideoAd();
        if (item) earned = true;
      } catch (e) { finish(false, 'fail'); }
    })();
  }
};

/* Kademeye göre cehennem: 'none' hiç yok, 'phases' her seviyenin sonunda açılıp kapanır, 'always' baştan sona. */

/* Küçük yardımcılar: işaretli açı farkı, ibrenin gidiş yönünde uzaklık, tamamlanması gereken hedefler. */

/* Nesne işaretleri: yeni kilidin ve engelin ilk karşılaşmalarında halkanın dışında küçük ✓ (vur) ve ✕ (dokunma). */

    else if (hp) lab.no = { c0: norm(hp.c0 + hp.dirH * hp.len * MECH.hotFrom), amp: 0, hw: 0.1 };

const spawnChallenge = (first, force) => {

  const plan = PR ? { I: 0.1, omega: PRAC.omega, hw: PRAC.hw, relief: false } : planJourney(G.L, G.ph, G.n, G.adapt, G.mercy);
  if (PR) force = PR.kind;

  if (!first && !force && G.lifeDue && !G.life) { can = true; G.lifeDue = false; }
  else if (!first && !force && !plan.relief && G.mixes.length && Math.random() < 0.28) {

  }

    p.br = { a: clamp(0.22 + 0.4 * plan.I + 0.05 * star, 0.22, 0.62), P: [2.0, 1.5, 1.2][star], ph: rnd(0, TAU) };

  } else if (kind === 'altin') {

  } else if (kind === 'kasa') {
    const hk = hw * 0.85, step = 2 * hk + rnd(0.55, 0.85), a = ahead(G.ang, G.dir, dist(1.0, 1.8));
    for (let i = 0; i < 3; i++) pins.push(Object.assign(gate(0, ahead(a, G.dir, i * step), hk), { kasa: true }));

  } else if (kind === 'ritim') {
    const n = MECH.ritimN[sIx], hr = Math.max(0.12, hw * 0.72), step = 2 * hr + rnd(0.55, 0.75), a = ahead(G.ang, G.dir, dist(1.0, 1.8));

    pins.push(gate(0, ahead(G.ang, G.dir, dist(1.2, 2.4)), hw));
  } else if (kind === 'isin') {
    /* İbre mavi kapıya (A) girer, turuncu kapıdan (B) çıkar; hedef (T) çıkışın ilerisindedir ve çıkışı görüp tepki verilebilecek kadar uzaktadır.
       Hedef, ibrenin ilk yoluna (başlangıç ile A arası) düşmez: o yayı ibre hep ışınlanmadan önce geçer. */
    const om = G.omega * (G.slow > 0 ? G.slowMul : 1), room = TAU - 0.55;
    let gap = Math.max(MECH.isinGapMin, om * MECH.isinGapT[sIx]) + rnd(0, 0.3), skip = rnd(MECH.isinSkip[0], MECH.isinSkip[1]), a = dist(1.3, 2.0);
    if (a + skip + gap > room) {
      skip = Math.max(0.9, room - a - gap);
      if (a + skip + gap > room) { a = Math.max(1.0, room - skip - gap); if (a + skip + gap > room) gap = room - a - skip; }
    }
    const pa = ahead(G.ang, G.dir, a), pb = ahead(pa, G.dir, skip);
    pins.push(gate(0, ahead(pb, G.dir, gap), hw));
    pins.push({ kind: 'portal', portal: 'in', ring: 0, c0: pa, amp: 0, f: 0, ph: 0, hw: MECH.isinPortalHw, done: false, wait: MECH.isinWait[sIx], prev: null });
    pins.push({ kind: 'portal', portal: 'out', ring: 0, c0: pb, amp: 0, f: 0, ph: 0, hw: MECH.isinPortalHw, done: false });
  } else if (kind === 'tutbirak') {
    const len = MECH.holdLen[sIx], s0 = ahead(G.ang, G.dir, dist(1.2, 2.0));
    pins.push({ kind: 'hold', ring: 0, c0: s0, amp: 0, f: 0, ph: 0, hw: Math.max(0.16, hw * 0.8), rw: Math.max(0.14, hw * 0.6), len, dirH: G.dir, st: 'wait', done: false, hot: false });
  } else if (kind === 'sabir') {
    const la = ahead(G.ang, G.dir, dist(1.8, 2.8)), lh = Math.max(0.2, hw * 0.9);
    pins.push({ kind: 'lockpin', ring: 0, c0: la, amp: 0, f: 0, ph: 0, hw: lh, done: false, passes: 0, open: false, openT: 0, prev: null, rattle: 0 });
    const sg = sideGate(pins, hw); if (sg) pins.push(sg);
    G.chal.sabir = true; G.chal.sideHw = hw;
  } else if (kind === 'trafik') {
    const ht = Math.max(0.2, hw * 0.78), a = ahead(G.ang, G.dir, dist(1.2, 2.0)), b = ahead(a, G.dir, 2 * ht + rnd(0.32, 0.5)), g1 = Math.random() < 0.5;
    pins.push(Object.assign(gate(0, a, ht), { light: true, green: g1 }), Object.assign(gate(0, b, ht), { light: true, green: !g1 }));
    G.chal.light = { per: MECH.lightPer[sIx], left: MECH.lightPer[sIx] };
  } else if (kind === 'bomba') {
    const f = MECH.bombFuse[sIx], n = gate(0, ahead(G.ang, G.dir, dist(1.1, 1.9)), hw);
    pins.push(n);
    const bh = Math.max(0.2, hw * 0.85), om = G.omega * (G.slow > 0 ? G.slowMul : 1);
    let ba = norm(n.c0 + G.dir * (hw + bh + rnd(0.6, 1.3)));
    if (aheadOf(ba) / om > f - 0.9) ba = ahead(G.ang, G.dir, Math.max(1.0, om * (f - 1.1)));
    if (angd(ba, n.c0) < hw + bh + 0.25) ba = norm(n.c0 + G.dir * (hw + bh + 0.5));
    pins.push(Object.assign(gate(0, ba, bh), { bomb: { fuse: f, max: f, st: 'arm' } }));
  } else {
    const p = gate(0, ahead(G.ang, G.dir, first ? rnd(1.6, 2.3) : (can ? rnd(1.4, 2.2) : rnd(CFG.spawnMin, CFG.spawnMax))), hw);
    if (can) p.can = true;
    pins.push(p);
  }
  if (mix && mix[1] === 'kayan') for (const p of pins) { p.amp = rnd(0.28, 0.45); p.f = rnd(0.3, 0.42); p.ph = rnd(0, TAU); }
  const tw = PR ? forceTw : (forceTw || (mix && mix[1] === 'tuzak' ? 'tuzak' : JTWIN[kind]));
  if (!first && !can && tw && G.eng[tw] && (mix || forceTw ? true : Math.random() < Math.max(pm.twin, lv.twins || 0))) G.chal.tw = addTwin(tw, pins, hw);
  G.pins = pins; G.gateT = 0; G.lab = null;
  syncPrimary();
  if (!first && !can) {
    if (!PR) { queueIntro(kind); if (G.chal.tw) queueIntro(G.chal.tw); }
    const sk = PR ? 1 : (kind !== 'tek' ? noteSeen(kind) : 99), st = PR ? 1 : (G.chal.tw ? noteSeen(G.chal.tw) : 99);
    G.lab = makeLabels(kind, pins, sk, st);
  }
};

const relayout = snap => {
  const w = view.w, h = view.h, cx = w / 2;
  let cy, r;
  if (G.mode === 'menu') {
    const top = app.getBoundingClientRect().top;
    const hb = $('menuHead').getBoundingClientRect().bottom - top;
    const ft = $('menuFoot').getBoundingClientRect().top - top;
    cy = (hb + ft) / 2;
    r = Math.min(w * 0.29, (ft - hb) / 2 - 54);
  } else {
    /* yukarıdan aşağı: HUD, yeni kilit kartının yeri, halka, halkanın altında joker sırası */
    const hudB = (hudEl.offsetTop + hudEl.offsetHeight) || 140;
    const short = h < 700, prac = !!G.practice;
    const cardH = (short ? 62 : 102) + (short ? INTRO_H.small - CARD_H.small : INTRO_H.normal - CARD_H.normal) * easeOut(clamp(G.introK, 0, 1));
    /* Joker sırası ekranın altında; halka ile arasında parmak boyunda (yaklaşık 1,5 cm) boş alan kalır, oyun dokunuşları jokerlere değmesin (V0.6.1). */
    const dockH = prac ? 0 : (short ? 68 : 80), lblH = prac ? 0 : 34, gapMin = short ? 54 : 70, bottomPad = short ? 14 : 24;
    const top = hudB + 6 + cardH, dockTop = prac ? h : h - bottomPad - dockH;
    const ringMax = prac ? h - 14 : dockTop - lblH - gapMin;
    view.cardB = top;
    r = Math.min(w * 0.33, h * 0.2, (ringMax - top - 12) / 2.2);
    r = Math.max(56, r);
    cy = top + Math.max(r * 1.1 + 6, (ringMax - top) * (prac ? 0.47 : 0.5));

  r = Math.max(56, r);
  view.hudB = G.mode === 'menu' ? 0 : (hudEl.offsetTop + hudEl.offsetHeight);
  view.ik = G.introK;
  view.tcx = cx; view.tcy = cy; view.tr = r;

};

const primaryPin = () => G.pins.find(p => isReq(p) && p.ring === 0) || G.pins.find(p => !p.done && p.kind === 'gate' && p.ring === 0) || null;
const holdRel = p => sdiff(G.ang, p.c0) * p.dirH;
/* Altın pim: ana hedef vurulana kadar kapalı (wait); açıkken ilk dokunuş altına aittir, ıskalanırsa ya da ibre geçerse kaybolur (gone). */
const goldPending = q => !!q.gold && !q.done && !q.gone;
const goneGold = g => { if (!g.gone) { g.gone = true; g.goneAt = G.clock; G.needCheck = true; } };
const loseGold = () => { const g = G.pins.find(q => goldPending(q) && !q.wait); if (g) goneGold(g); };
const openGold = g => {
  g.wait = false; g.enT = 0; g.seen = false;
  const q = pinXY(g); fxRing(q.x, q.y, GOLD, 70, 0.5); burst(q.x, q.y, 10, [GOLD, GOLD_L, '#FFFFFF'], 150);
  pop(t('popGoldOpen'), 'hype'); Snd.adv(); Platform.haptic('light');
};
const tickGold = (p, dt) => {
  if (p.wait || p.gone || p.done) return;

const tickLockpin = (p, dt) => {
  if (p.done) return;

  if (p.prev != null && p.prev < 0 && rel >= 0 && Math.abs(rel) < 0.7 && !p.open) {
    p.passes++;

  if (G.holding) return;

  const hp = G.pins.find(p => p.kind === 'hold' && !p.done);
  if (hp) {
    const rel = holdRel(hp);
    if (Math.abs(rel) <= hp.hw + CFG.grace) {
      hp.st = 'hold'; hp.burned = false; G.holding = true;
      Snd.tone(520, 0.08, 'triangle', 0.12); Platform.haptic('light');

  }

  for (const p of G.pins) {

  }

/* Ortam parçacıkları: cehennemde yükselen közler. Tema ağırlığı kadar görünür. */
const envStep = raw => {
  const w = view.w, h = view.h, k = RM ? 0.5 : 1;
  if (thWx > 0.08 && G.em.length < 34 * k && Math.random() < raw * 22 * thWx * k) {
    G.em.push({ x: rnd(0, w), y: h + 6, vy: rnd(40, 110), r: rnd(1.2, 3), ph: rnd(0, TAU), sw: rnd(10, 30), life: 0, max: rnd(2.2, 4.2) });
  }
  for (const e of G.em) { e.life += raw; e.y -= e.vy * raw * (1 - 0.45 * e.life / e.max); e.x += Math.sin(G.clock * 2.4 + e.ph) * e.sw * raw; }
  G.em = thWx < 0.01 ? [] : G.em.filter(e => e.life < e.max && e.y > -10);
};

/* ---------- güncelleme ---------- */
const COUNT_STEP = 0.75;
/* Cehennem kademesinde (yalnızca) çember nefes alır, bütün çember ibrenin tersine döner, içinde sarmal döner; seviye arttıkça güçlenir.
   Nefes yalnızca küçülüp geri açılır (ayarlanan boyutu aşmaz, kartın altına girmez). Kapanırken çember en yakın tam tura oturur, normal görünüme sıçramaz. */
const hellFx = raw => {
  if (G.mode === 'intro') return;
  const on = !RM && LV().hell === 'always' && !G.practice && (G.mode === 'play' || G.mode === 'count' || G.mode === 'dead');
  const lv = clamp(G.L, 1, 10) - 1, k = Math.min(1, raw * 3);
  HX.s += ((on ? 1 : 0) - HX.s) * Math.min(1, raw * 2.5);
  if (on || HX.s > 0.003) {
    HX.a += (0.015 + 0.012 * lv - HX.a) * k;
    HX.ph += TAU * raw / (3.4 - 0.2 * lv);
    HX.b = 1 - 2 * HX.a * (0.5 - 0.5 * Math.sin(HX.ph)) * HX.s;
    HX.v += ((on ? -G.dir * (0.05 + 0.03 * lv) : 0) - HX.v) * k;
    HX.r += HX.v * raw;
    HX.tr += (on ? -G.dir * (0.25 + 0.06 * lv) : 0) * raw;
    HX.sp += (on ? -G.dir * (0.4 + 0.1 * lv) : 0) * raw;
  } else HX.b = 1;
  if (!on) {
    const kk = Math.min(1, raw * 5), q = TAU / 12;
    HX.r += (Math.round(HX.r / TAU) * TAU - HX.r) * kk; HX.tr += (Math.round(HX.tr / q) * q - HX.tr) * kk;
    if (HX.s <= 0.003 && Math.abs(HX.r - Math.round(HX.r / TAU) * TAU) < 0.002 && Math.abs(HX.tr - Math.round(HX.tr / q) * q) < 0.002) { HX.r = 0; HX.tr = 0; HX.v = 0; }
  }
};
const update = raw => {
  G.clock += raw;
  const k = Math.min(1, raw * 9);
  view.cx += (view.tcx - view.cx) * k; view.cy += (view.tcy - view.cy) * k; view.r += (view.tr - view.r) * k;
  /* tanıtım kartı uzar ve geri kısalır; halka buna göre kayar (V0.8.0) */
  G.introK = clamp(G.introK + (G.mode === 'intro' && G.intro && !G.intro.closing ? raw / 0.45 : -raw / 0.35), 0, 1);
  if (view.ik !== G.introK) relayout(false);
  /* Duraklatmada her şey donar: sayaçlar, tema geçişi, parçacıklar. */
  if (G.mode === 'pause') return;
  if (G.mode === 'play' && G.introQ.length && !G.holding && !G.practice) startIntro();
  hellFx(raw);
  if (G.tsT > 0) { G.tsT -= raw; if (G.tsT <= 0) G.tscale = 1; }
  const dt = raw * G.tscale;

  if (G.mode === 'menu') {
    G.ang = norm(G.ang + 1.0 * dt);
    G.gateT = Math.min(1, G.gateT + raw * 2);
  } else if (G.mode === 'count') {
    const n0 = Math.ceil(G.count);
    G.count -= raw / COUNT_STEP;
    G.gateT = Math.min(1, G.gateT + raw * 4);
    if (G.count <= 0) { G.count = 0; G.mode = 'play'; Snd.tick(true); }
    else if (Math.ceil(G.count) !== n0) Snd.tick(false);
    updateHud();
  } else if (G.mode === 'play') {
    const PR = G.practice, sl = G.slow > 0 ? G.slowMul : 1;
    G.pt += dt;
    if (!PR) {
      G.jt += dt;
      applyEvents(false);
      const pi = jPhaseAt(G.jt), ph = tierPh(pi.ph);
      if (pi.L !== G.L || ph !== G.ph) phaseChange(Object.assign({}, pi, { ph }));
      G.phLeft = pi.left;
      if (G.ph === 'hell') G.hellAge += dt;
      /* can fırsatı: çift seviyelerin ortasında, canın yoksa bir sonraki hedef yeşil "+" olur */
      if (G.ph === 'normal' && G.L % 2 === 0 && G.lifeLevel !== G.L && G.jt - pi.start >= 0.55 * jNormal(G.L)) { G.lifeLevel = G.L; if (!G.life) G.lifeDue = true; }
      if (G.pendingNew) G.pendingT += dt;
    }
    const pm = PR ? JOURNEY.phase.normal : phaseMod(G.ph, G.L);
    G.ang = norm(G.ang + G.dir * G.omega * sl * ptrFactor() * dt);
    if (G.kind === 'iki' && G.lockLeft <= 0) G.ang2 = norm(G.ang2 + G.dir2 * G.omega2 * sl * dt);
    updateChal(dt);
    if (PR) G.time = CFG.maxTime; else G.time -= dt * pm.drain * (LV().drain || 1);
    if (G.slow > 0) G.slow -= raw;
    if (G.boostT > 0) G.boostT = Math.max(0, G.boostT - raw);
    if (G.narrow > 0) G.narrow = Math.max(0, G.narrow - raw);
    if (G.lock > 0) G.lock = Math.max(0, G.lock - raw);
    if (G.revT > 0) G.revT -= raw;
    G.gateT = Math.min(1, G.gateT + raw * 4);
    syncPrimary();
    if (!PR) {
      updateAdvice(dt);
      G.saveT += raw; if (G.saveT > 5) { G.saveT = 0; persistRun(); }
      if (G.time < CFG.nearAt) { G.beep -= raw; if (G.beep <= 0) { G.beep = 0.24; Snd.warn(); } }
      if (G.time <= 0) { G.time = 0; lethal(); }
    }
    updateHud(); updateDock();
  } else if (G.mode === 'intro') {
    /* tanıtım: oyun donuk (süre, ibre, hedefler); kart uzar, animasyon döner, dokunuşla ya da kendiliğinden kapanır, sonra kısa bir "devam" payı */
    const it = G.intro;
    if (!it) G.mode = 'play';
    else if (it.closing) { it.closing += raw; if (it.closing >= 0.7) { G.intro = null; G.mode = 'play'; } }
    else { it.t += raw; if (it.t >= it.auto) closeIntro(false); }
  } else if (G.mode === 'dead') {
    G.deadT -= raw;
    updateHud(); updateDock();
    if (G.deadT <= 0) showOver();
  }

  const live = G.mode === 'play' || G.mode === 'count' || G.mode === 'dead' || G.mode === 'intro';
  if (G.banner && live) { G.banner.t += raw; if (G.banner.t > 2.0) G.banner = null; }
  if (G.card && (G.mode === 'play' || G.mode === 'count')) { G.card.t += raw; if (G.card.t > G.card.max) G.card = null; }
  if (G.lab && G.mode === 'play') { G.lab.t += raw; if (G.lab.t > G.lab.max) G.lab = null; }
  const kT = 1 - Math.exp(-2.6 * raw);
  thWx += (G.thT - thWx) * kT;
  if (Math.abs(thWx - G.thT) < 0.004) thWx = G.thT;
  applyTheme();
  if (G.thDirty && thWx === G.thT) { G.thDirty = false; onPalette(); }
  G.ec += raw;
  envStep(raw);
  G.lifeFx = Math.max(0, G.lifeFx - raw * 1.4);
  G.shake = Math.max(0, G.shake - raw);
  G.flash = Math.max(0, G.flash - raw);
  G.scorePulse = Math.max(0, G.scorePulse - raw * 5);
  G.Ivis += (G.I - G.Ivis) * Math.min(1, raw * 3);
  const decay = Math.exp(-3.2 * raw);
  for (const p of G.parts) { p.life += raw; p.x += p.vx * raw; p.y += p.vy * raw; p.vx *= decay; p.vy = p.vy * decay + 140 * raw; }
  G.parts = G.parts.filter(p => p.life < p.max);
  for (const r of G.rips) r.t += raw;
  G.rips = G.rips.filter(r => r.t < r.max);
  for (const cr of G.craters) cr.t += raw;
  G.craters = G.craters.filter(cr => cr.t < MECH.bombCrater);
  for (const f of G.fxs) f.t += raw;
  G.fxs = G.fxs.filter(f => f.t < f.max);
  for (const p of G.pops) p.t += raw;
  G.pops = G.pops.filter(p => p.t < p.max);
};

/* ---------- çizim ---------- */
const arc = (c, x, y, r, a0, a1) => { c.beginPath(); c.arc(x, y, r, a0, a1); c.stroke(); };
const mixHex = (a, b, k) => {
  if (a.charAt(0) !== '#' || a.length !== 7 || b.charAt(0) !== '#' || b.length !== 7) return a;
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((pa >> s) & 255) * (1 - k) + ((pb >> s) & 255) * k);
  return 'rgb(' + ch(16) + ',' + ch(8) + ',' + ch(0) + ')';
};
const onColor = hex => {

  c.save();
  if (G.shake > 0) { const m = Math.min(9, G.shake * 20); c.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }

  /* Cehennem: bütün çember (çentikler, hedefler, ibre) birlikte döner; etiket ve parçacıklar dönmeyen katmanda kalır */
  const hx = HX.s > 0.003 || HX.r !== 0;
  if (hx) { c.save(); c.translate(cx, cy); c.rotate(HX.r); c.translate(-cx, -cy); drawRot = HX.r; }
  const r0 = R + RW / 2 + 10;
  const iv = G.mode === 'menu' ? 0 : G.Ivis;
  c.lineCap = 'round'; c.strokeStyle = mixHex(P.tick, P.rose, 0.8 * iv);
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * TAU - HALF + HX.tr, long = i % 5 === 0, r1 = r0 + (long ? 13 + 5 * iv : 7 + 3 * iv), ca = Math.cos(a), sa = Math.sin(a);
    c.globalAlpha = long ? 0.95 : 0.55 + 0.3 * iv; c.lineWidth = (long ? 2.6 : 1.6) + 0.6 * iv;
    c.beginPath(); c.moveTo(cx + ca * r0, cy + sa * r0); c.lineTo(cx + ca * r1, cy + sa * r1); c.stroke();
  }
  c.globalAlpha = 1;

  c.lineCap = 'butt'; c.lineWidth = RW; c.strokeStyle = P.track;
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke();
  if (two) { c.lineWidth = RW2; c.beginPath(); c.arc(cx, cy, R2, 0, TAU); c.stroke(); }
  if (HX.s > 0.003) {
    /* hipnoz sarmalı: halkanın içinde üç kol, kendi hızıyla ters döner */
    const lim = two ? 0.46 : 0.62;
    c.save(); c.translate(cx, cy); c.rotate(HX.sp); c.lineCap = 'round'; c.lineWidth = Math.max(2, R * 0.024); c.strokeStyle = mixHex(P.track, P.rose, 0.5); c.globalAlpha = 0.6 * HX.s;
    for (let a = 0; a < 3; a++) {
      c.beginPath();
      for (let n = 0; n <= 48; n++) { const f = n / 48, ang = a * TAU / 3 + f * 3.4, rr = R * (0.16 + (lim - 0.16) * f), x = Math.cos(ang) * rr, y = Math.sin(ang) * rr; if (n) c.lineTo(x, y); else c.moveTo(x, y); }
      c.stroke();
    }
    c.restore(); c.globalAlpha = 1;
  }
  drawTrackFx(c, cx, cy, R, RW, R2, RW2, two);
  const mult = (G.mode === 'play' || G.mode === 'dead' || G.mode === 'count' || G.mode === 'intro') && G.comboOn ? comboMult(G.combo) : 1;
  if (mult >= 2) {
    c.globalAlpha = Math.min(0.4, 0.07 + 0.03 * mult + 0.12 * G.scorePulse); c.fillStyle = tierCol(mult);
    c.beginPath(); c.arc(cx, cy, two ? R2 - RW2 / 2 - 4 : R - RW / 2 - 4, 0, TAU); c.fill();
    c.globalAlpha = 1;
  }

  if (G.mode === 'play' && G.time < CFG.nearAt) {
    const b = 0.5 + 0.5 * Math.sin(G.clock * 16);
    c.globalAlpha = 0.35 + 0.4 * b; c.strokeStyle = P.rose; c.lineWidth = 3;
    c.beginPath(); c.arc(cx, cy, R + RW / 2 + 3 + 3 * b, 0, TAU); c.stroke();
    c.globalAlpha = 1;
  }

  const gk = easeOut(clamp(G.gateT / 0.25, 0, 1));
  const pins = G.mode === 'menu' ? MENU_PINS : G.pins;
  if (gk > 0) {
    let gi = 0;
    for (const p of pins) {
      const num = G.kind === 'cift' && p.kind === 'gate' && G.mode !== 'menu';
      drawPin(c, cx, cy, p.ring ? R2 : R, p.ring ? RW2 : RW, p, gk, gi, num);
      if (p.kind === 'gate') gi++;
    }
  }

  const trail = mult >= 2 ? tierCol(mult) : P.lilac;
  const psc = ptrScale();
  if (psc > 0.03) { c.globalAlpha = psc; drawPointer(c, cx, cy, R, RW, G.ang, G.dir, P.ink, trail, psc); c.globalAlpha = 1; }
  if (two) { if (G.lockLeft > 0) c.globalAlpha = 0.4; drawPointer(c, cx, cy, R2, RW2, G.ang2, G.dir2, P.btn, trail); c.globalAlpha = 1; }
  if (G.mode === 'play') drawBoost(c, cx, cy, R, RW);
  if (G.holding && G.mode === 'play') {
    const q = ptXY(cx, cy, G.ang, R), pu = 0.5 + 0.5 * Math.sin(G.clock * 14);
    c.globalAlpha = 0.5 + 0.3 * pu; c.strokeStyle = P.btn; c.lineWidth = 3; c.beginPath(); c.arc(q[0], q[1], RW * 0.5 + 6 + 2 * pu, 0, TAU); c.stroke(); c.globalAlpha = 1;
  }
  if (hx) { c.restore(); drawRot = 0; }
  drawLabels(c, cx, cy, R, RW);
  drawFxs(c);

  for (const r of G.rips) {
    const p = r.t / r.max;
    c.globalAlpha = (1 - p) * 0.85; c.strokeStyle = r.c; c.lineWidth = 3;
    c.beginPath(); c.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * easeOut(p), 0, TAU); c.stroke();
  }
  for (const p of G.parts) {
    const q = p.life / p.max;
    c.globalAlpha = 1 - q; c.fillStyle = p.c;
    c.beginPath(); c.arc(p.x, p.y, p.r * (1 - 0.45 * q), 0, TAU); c.fill();
  }
  c.globalAlpha = 1;

  c.textAlign = 'center'; c.textBaseline = 'middle';
  const big = Math.round(R * (two ? 0.34 : 0.6));
  const fitFont = (txt, size, maxW) => {
    c.font = '600 ' + size + 'px ' + FD;
    const w = c.measureText(txt).width;
    if (w > maxW) c.font = '600 ' + Math.max(10, Math.floor(size * maxW / w)) + 'px ' + FD;
  };
  if (G.mode === 'menu') {
    const txt = String(bestNow());
    c.fillStyle = P.ink; fitFont(txt, big, R * 1.5);
    c.fillText(txt, cx, cy - R * 0.04);
    c.fillStyle = P['ink-2']; c.font = '800 ' + Math.max(12, Math.round(R * 0.13)) + 'px ' + FB;
    c.fillText(t('best'), cx, cy + R * 0.36);
  } else {
    if (G.practice) drawPracCenter(c, cx, cy, R, two);
    const sc = 1 + (0.2 + 0.04 * mult) * G.scorePulse;
    const txt = String(G.score);
    const cover = G.mode === 'count' ? 1 : 0;
    c.globalAlpha = G.practice ? 0 : 1 - 0.88 * cover;
    c.save(); c.translate(cx, cy - (two ? 0 : R * 0.04)); c.scale(sc, sc);
    c.fillStyle = P.ink; fitFont(txt, big, R * (two ? 0.95 : 1.5));
    c.fillText(txt, 0, 0);
    c.restore();
    if (G.practice) {
    } else if (mult >= 2) {
      const col = tierCol(mult);
      pill(c, '×' + mult + ' · ' + G.combo, cx, cy + R * (two ? 0.3 : 0.4), col, onColor(col), Math.max(11, Math.round(R * (two ? 0.1 : 0.12))));
    } else if (!two) {
      c.fillStyle = P['ink-2']; c.font = '800 ' + Math.max(12, Math.round(R * 0.13)) + 'px ' + FB;
      c.fillText(t('score'), cx, cy + R * 0.36);
    }
    c.globalAlpha = 1;
    if (two && G.lockLeft > 0 && (G.mode === 'play' || G.mode === 'intro')) drawLockTimer(c, cx, cy, R);
    if (G.mode === 'count' && G.count > 0) drawCount(c, cx, cy, R);
    else if (G.banner) drawBanner(c);
  }

  /* tanıtım sırasında oyun alanı hafifçe silinir; yalnızca kart net kalır */
  if (G.introK > 0.001) { c.globalAlpha = 0.55 * easeOut(clamp(G.introK, 0, 1)); c.fillStyle = P.bg; c.fillRect(-20, -20, view.w + 40, view.h + 40); c.globalAlpha = 1; }
  drawCard(c);
  drawIntroPill(c);
  /* puan balonları halkanın iç bölgesinde, ibre halkasının üstüne binmez: en yeni skorun üstünde, eskisi altında */
  G.pops.forEach((p, i) => {
    const k = p.t / p.max, slot = G.pops.length - 1 - i;
    const al = k < 0.12 ? k / 0.12 : (k > 0.65 ? (1 - k) / 0.35 : 1);
    const sc = 0.85 + 0.15 * Math.min(1, k / 0.15);
    let bg = P.surface, fg = P.ink;
    if (p.kind === 'near') { bg = P.rose; fg = '#FFFFFF'; }
    else if (p.kind === 'perfect') { bg = P['peach-soft']; fg = P.ink; }
    else if (p.kind === 'rev') { bg = P['lilac-soft']; fg = P.ink; }
    else if (p.kind === 'miss') { bg = P.track; fg = P['ink-2']; }
    else if (p.kind === 'hype') { bg = P.btn; fg = P['on-btn'] || '#FFFFFF'; }
    else if (p.kind === 'roast') { bg = P['rose-soft']; fg = P.ink; }
    const psz = p.kind === 'near' ? 17 : (p.kind === 'hype' ? 18 : 15);
    c.font = '800 ' + psz + 'px ' + FB;
    const pw = c.measureText(p.txt).width + psz * 1.7;
    c.save(); c.globalAlpha = al; const rise = 6 * easeOut(Math.min(1, k * 1.4)), py = two ? (slot ? Math.min(view.h - 40, cy + R + RW / 2 + 19) : Math.max((view.hudB || 0) + 20, cy - R - RW / 2 - 19 - rise)) : (slot ? cy + R * 0.58 : cy - R * 0.5 - rise);
    c.translate(clamp(cx, pw / 2 + 8, view.w - pw / 2 - 8), py); c.scale(sc, sc);
    pill(c, p.txt, 0, 0, bg, fg, psz, true);
    c.restore();
  });
  c.restore();

  for (const f of G.fxs) {
    if (f.type === 'blast' && f.t < 0.26) { c.globalAlpha = 0.6 * (1 - f.t / 0.26); c.fillStyle = '#FFF1CC'; c.fillRect(0, 0, view.w, view.h); c.globalAlpha = 1; }
  }
  if (G.flash > 0) {
    c.globalAlpha = Math.min(0.22, G.flash * 0.7);
    c.fillStyle = G.flashKind === 'rose' ? P.rose : P.peach;
    c.fillRect(0, 0, view.w, view.h);
    c.globalAlpha = 1;
  }
};

/* ---------- giriş ---------- */
const overlayOpen = () => shopEl.classList.contains('on') || adEl.classList.contains('on') || bookEl.classList.contains('on') || $('swap').classList.contains('on');
app.addEventListener('pointerup', () => { if (G.mode === 'play') release(); });
app.addEventListener('pointercancel', () => { if (G.mode === 'play') release(); });
app.addEventListener('pointerdown', e => {
  Snd.unlock();
  const tg = e.target;
  if (tg.closest && (tg.closest('button') || tg.closest('#tools'))) return;
  if (overlayOpen()) return;
  if (G.mode === 'play') tap(e.clientX - app.getBoundingClientRect().left);
  else if (G.mode === 'menu') { if (!save.run) start(); }
  else if (G.mode === 'over' && performance.now() - G.overAt > 700) start(G.startL);
  else if (G.mode === 'pause') resume();
  else if (G.mode === 'intro') skipIntro();
});
/* Joker düğmeleri: dokununca çalışır (V0.6.1). Yanlışlıkla basılmasın diye sıra ekranın altındadır ve halkayla arasında parmak boyunda boş alan vardır;
   o boşluğa dokunuşlar oyuna gider. */
toolsEl.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('button.tool');
  if (!b) return;
  e.preventDefault(); Snd.unlock();
  useTool(b.getAttribute('data-tool'));
});
window.addEventListener('keyup', e => { if ((e.code === 'Space' || e.code === 'Enter') && G.mode === 'play') release(); });
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const ae = document.activeElement;
  if (ae && ae.tagName === 'BUTTON') return;
  const left = e.code === 'ArrowLeft' || e.code === 'KeyA', right = e.code === 'ArrowRight' || e.code === 'KeyL';
  if (e.code !== 'Space' && e.code !== 'Enter' && !left && !right) return;
  e.preventDefault(); Snd.unlock();
  if (overlayOpen()) return;
  if (G.mode === 'play') tap(right ? view.w : (left ? 0 : null));
  else if (G.mode === 'menu') { if (save.run) resumeSaved(); else start(); }
  else if (G.mode === 'over' && performance.now() - G.overAt > 500) start(G.startL);
  else if (G.mode === 'pause') resume();
  else if (G.mode === 'intro') skipIntro();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
window.addEventListener('pagehide', () => persistRun());

/* Yarım kalan oyundaki henüz coine çevrilmemiş kazanç (oyun bitince verilecek olan). */
const runPending = r => {
  const lv = LEVEL[r.lvl] || LEVEL.normal;
  return Math.max(0, Math.round((Math.floor((r.raw || 0) / CFG.coinDiv) + (r.near || 0) * CFG.nearCoin) * lv.coin) + Math.floor(r.coinsJ || 0) - (r.coinsGiven || 0));
};
const doSetLevel = l => {
  save.lvl = l; persist(); refreshLevel(); refreshStats();
  Platform.track('level', { level: l });
};
let swapTo = '';
/* Başka kademeye geçmek yarım kalan oyunu siler; önce sorulur. */
const setLevel = l => {
  if (LEVELS.indexOf(l) < 0 || l === save.lvl) return;
  if (save.run) {
    const r = save.run, c = runPending(r);
    swapTo = l;
    $('swapSub').textContent = t(c > 0 ? 'swapSub' : 'swapSub0', { lv: t('lv_' + r.lvl), n: r.L, p: Number(r.score || 0).toLocaleString(LANG === 'tr' ? 'tr-TR' : 'en-US'), c });
    show($('swap')); Snd.ui();
    return;
  }
  doSetLevel(l);
};
$('swapYes').addEventListener('click', () => {
  Snd.unlock(); Snd.ui();
  const to = swapTo; hide($('swap'));
  save.run = null; persist(); doSetLevel(to);
  toast(t('lvPicked', { l: t('lv_' + to) }));
});
$('swapNo').addEventListener('click', () => { Snd.unlock(); Snd.ui(); hide($('swap')); });
$('lvlSeg').addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button[data-lvl]');
  if (!b) return;
  Snd.unlock(); Snd.ui(); setLevel(b.getAttribute('data-lvl'));
});
$('ovTipBtn').addEventListener('click', () => {
  const to = $('ovTip').getAttribute('data-to');
  Snd.unlock(); Snd.ui(); setLevel(to); $('ovTip').hidden = true;
  toast(t('lvPicked', { l: t('lv_' + to) }));
});
$('playBtn').addEventListener('click', () => { Snd.unlock(); if (save.run) resumeSaved(); else start(); });
/* Kayıtlı oyun varken "Yeni oyun": önce sorar, 3,5 sn içinde ikinci dokunuşla silip başlar. */
let newAsk = 0;
$('newBtn').addEventListener('click', () => {
  Snd.unlock();
  const nb = $('newBtn');
  if (newAsk && performance.now() - newAsk < 3500) { newAsk = 0; nb.classList.remove('warn'); start(); return; }
  newAsk = performance.now(); nb.classList.add('warn'); nb.textContent = t('newSure'); Snd.ui();
  setTimeout(() => { if (newAsk && performance.now() - newAsk >= 3400) { newAsk = 0; nb.classList.remove('warn'); nb.textContent = t('newGame'); } }, 3500);
});
$('bookBtn').addEventListener('click', () => { Snd.unlock(); if (G.mode === 'menu') openBook(); });
$('bookList').addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button[data-try]');
  if (!b || G.mode !== 'menu') return;
  Snd.unlock(); startPractice(b.getAttribute('data-try'));
});
$('pracEnd').addEventListener('click', () => { Snd.unlock(); Snd.ui(); endPractice(true); });
$('pdAgain').addEventListener('click', () => { Snd.unlock(); if (G.practice) startPractice(G.practice.kind); });
$('pdBack').addEventListener('click', () => { Snd.unlock(); Snd.ui(); endPractice(true); });
$('bookClose').addEventListener('click', closeBook);
$('menuJk').addEventListener('click', () => { Snd.unlock(); if (G.mode === 'menu') openShop('menu'); });
$('pauseMenuBtn').addEventListener('click', () => { Snd.unlock(); Snd.ui(); persistRun(); goMenu(); });
$('againBtn').addEventListener('click', () => { Snd.unlock(); start(G.startL); });
campEl.addEventListener('click', () => { Snd.unlock(); start(save.camp); });
$('homeBtn').addEventListener('click', () => { Snd.unlock(); Snd.ui(); goMenu(); });
$('resumeBtn').addEventListener('click', resume);
$('bagBtn').addEventListener('click', () => { Snd.unlock(); if (G.mode === 'menu') openShop('menu'); });
$('bagBtn2').addEventListener('click', () => { Snd.unlock(); if (G.mode === 'over') openShop('over'); });
$('shopClose').addEventListener('click', closeShop);
$('shopAd').addEventListener('click', () => {
  Snd.unlock();
  Platform.rewardedAd((ok, why) => {
    if (ok) { save.coins += CFG.adCoins; persist(); refreshStats(); renderShop(); toast(t('gotCoins', { n: CFG.adCoins })); Snd.fanfare(); }
    else if (why !== 'closed') toast(t('adFail'));
  });
});
$('sndBtn').addEventListener('click', () => { Snd.unlock(); save.snd = !save.snd; persist(); refreshSound(); Snd.ui(); });
$('adBtn').addEventListener('click', () => {
  if (G.mode !== 'over') return;
  Snd.unlock(); G.mode = 'ad'; hide(overEl);
  Platform.rewardedAd((ok, why) => { if (ok) doContinue(); else { G.mode = 'over'; show(overEl); if (why !== 'closed') toast(t('adFail')); } });
});
$('coinBtn').addEventListener('click', () => {
  if (G.mode !== 'over') return;
  Snd.unlock();
  if (save.coins < CFG.contCoins) { toast(t('notEnough')); return; }
  save.coins -= CFG.contCoins; persist(); refreshStats(); doContinue();
});

/* ---------- açılış ---------- */
applyI18n(); refreshSound(); refreshLevel(); refreshStats();
resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(app); else window.addEventListener('resize', resize);
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('600 40px Fredoka'), document.fonts.load('800 14px Nunito')]).then(() => { readPalette(); relayout(false); }).catch(() => {});
}
setTimeout(() => relayout(true), 120);
const AppP = plugin('App'), StatusP = plugin('StatusBar');
const bgIsDark = () => {
  const v = parseInt((P.bg || '#ffffff').slice(1), 16);
  return (0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255)) < 128;
};
onPalette = () => {
  if (!StatusP) return;
  try { StatusP.setStyle({ style: bgIsDark() ? 'DARK' : 'LIGHT' }); } catch (e) {}
};
onPalette();
if (AppP) {
  try {
    AppP.addListener('pause', () => pause());
    AppP.addListener('backButton', () => {
      if (adEl.classList.contains('on')) return;
      if ($('swap').classList.contains('on')) { hide($('swap')); return; }
      if (G.practice) endPractice(true);
      else if (bookEl.classList.contains('on')) closeBook();
      else if (shopEl.classList.contains('on')) closeShop();
      else if (G.mode === 'intro') closeIntro(true);
      else if (G.mode === 'play' || G.mode === 'count') pause();
      else if (G.mode === 'pause') resume();
      else if (G.mode === 'over') goMenu();
      else if (G.mode === 'menu') AppP.exitApp();
    });
  } catch (e) {}
}
/*DEBUG*/

let last = 0;
const frame = ts => {
  if (!last) last = ts;
  const raw = Math.min(0.05, (ts - last) / 1000); last = ts;
  try { update(raw); render(); } catch (e) {
    if (!frame.failed) { frame.failed = true; try { console.error('[kp] kare hatası', e && e.stack ? e.stack : e); } catch (x) {} }
  }
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
})();
</script>
