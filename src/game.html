<title>Kıl payı</title>
<!--FONTS-START-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<!--FONTS-END-->
<style>
/* Tasarım planı
   Renk: lila (ana) + şeftali (hedef bölge); uyarı için gül. Nötrler lilaya çalar.
   Yazı: Fredoka (başlık, sayılar), Nunito (metin). Yuvarlak formlar, hap butonlar.
   Düzen: kronometre kadranı ortada, üstte süre kapsülü, altta alet çubuğu, üstte duran katmanlar buzlu cam. */
:root{
  --bg:#F5F2FC;--bg-2:#E9E3F7;--surface:#FFFFFF;--track:#E3DCF5;--tick:#B4AAD5;--line:#D8D0EC;
  --ink:#29233F;--ink-2:#615A7C;--ink-3:#8F87AB;
  --lilac:#8E7CF2;--lilac-soft:#DCD5FB;--btn:#6D58E0;--on-btn:#FFFFFF;
  --peach:#FFA473;--peach-deep:#FF7D43;--peach-soft:#FFD9C5;
  --rose:#FF5C84;--rose-soft:#FFD2DC;
  --blob-1:#E2DBFB;--blob-2:#EBDDF9;
  --glass:rgba(255,255,255,.64);--glass-edge:rgba(255,255,255,.85);--scrim:rgba(41,35,63,.18);
  --shadow-s:0 1px 2px rgba(41,35,63,.06),0 6px 16px rgba(41,35,63,.08);
  --shadow-m:0 2px 6px rgba(41,35,63,.07),0 20px 48px rgba(41,35,63,.16);
  --r-s:16px;--r-m:24px;--r-l:32px;--r-pill:999px;
  --fs-12:.75rem;--fs-14:.875rem;--fs-16:1rem;--fs-20:1.25rem;--fs-28:1.75rem;--fs-72:4.5rem;
  --dur-fast:180ms;--dur-base:300ms;--dur-slow:550ms;--ease:cubic-bezier(.2,.8,.2,1);
  --font-display:"Fredoka","SF Pro Rounded",ui-rounded,"Nunito",system-ui,sans-serif;
  --font-body:"Nunito","SF Pro Rounded",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16132E;--bg-2:#0F0D22;--surface:#26204D;--track:#312B5C;--tick:#5E5796;--line:#3D3770;
  --ink:#F4F1FF;--ink-2:#BBB4DC;--ink-3:#8780AE;
  --lilac:#AA9CFF;--lilac-soft:#3B327A;--btn:#BBAEFF;--on-btn:#1B1644;
  --peach:#FFB088;--peach-deep:#FF9560;--peach-soft:#6B4148;
  --rose:#FF7C9E;--rose-soft:#5C2D49;
  --blob-1:#2B2463;--blob-2:#382A6C;
  --glass:rgba(38,32,77,.62);--glass-edge:rgba(255,255,255,.16);--scrim:rgba(7,5,22,.5);
  --shadow-s:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.28);
  --shadow-m:0 2px 6px rgba(0,0,0,.3),0 20px 48px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16132E;--bg-2:#0F0D22;--surface:#26204D;--track:#312B5C;--tick:#5E5796;--line:#3D3770;
  --ink:#F4F1FF;--ink-2:#BBB4DC;--ink-3:#8780AE;
  --lilac:#AA9CFF;--lilac-soft:#3B327A;--btn:#BBAEFF;--on-btn:#1B1644;
  --peach:#FFB088;--peach-deep:#FF9560;--peach-soft:#6B4148;
  --rose:#FF7C9E;--rose-soft:#5C2D49;
  --blob-1:#2B2463;--blob-2:#382A6C;
  --glass:rgba(38,32,77,.62);--glass-edge:rgba(255,255,255,.16);--scrim:rgba(7,5,22,.5);
  --shadow-s:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.28);
  --shadow-m:0 2px 6px rgba(0,0,0,.3),0 20px 48px rgba(0,0,0,.45);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;display:flex;justify-content:center;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-16);line-height:1.35;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;background:var(--bg)}
@media (min-width:600px){body{align-items:center;background:var(--bg-2)}#app{height:min(100%,860px);border-radius:var(--r-l);box-shadow:var(--shadow-m)}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:20px;height:20px;flex:none;display:block}
svg.ic .f{fill:currentColor}
svg.ic .s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.amb{position:absolute;inset:0;overflow:hidden;pointer-events:none;transition:opacity var(--dur-slow) var(--ease)}
#app.playing .amb{opacity:.4}
.amb i{position:absolute;display:block;border-radius:50%;will-change:transform}
.amb i:nth-child(1){width:70%;aspect-ratio:1;left:-24%;top:-10%;background:var(--blob-1);animation:drift-a 24s ease-in-out infinite alternate}
.amb i:nth-child(2){width:54%;aspect-ratio:1;right:-18%;top:38%;background:var(--blob-2);animation:drift-b 28s ease-in-out infinite alternate}
.amb i:nth-child(3){width:62%;aspect-ratio:1;left:6%;bottom:-24%;background:var(--blob-1);animation:drift-c 32s ease-in-out infinite alternate}
@keyframes drift-a{to{transform:translate3d(14%,10%,0) scale(1.1)}}
@keyframes drift-b{to{transform:translate3d(-16%,-8%,0) scale(.92)}}
@keyframes drift-c{to{transform:translate3d(12%,-12%,0) scale(1.12)}}

.hud{position:absolute;left:0;right:0;top:0;padding:18px 20px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity var(--dur-base) var(--ease),transform var(--dur-slow) var(--ease)}
.hud.on{opacity:1;transform:none}
.gauge-row{display:flex;align-items:center;gap:12px}
.gauge{position:relative;flex:1;height:30px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:var(--r-pill);background:var(--lilac)}
.gauge.warn .fill{background:var(--peach)}
.gauge.crit .fill{background:var(--rose)}
.notch{position:absolute;top:7px;bottom:7px;width:3px;margin-left:-1px;border-radius:2px;background:var(--rose)}
.tleft{min-width:52px;text-align:right;font-family:var(--font-display);font-weight:600;font-size:var(--fs-20);font-variant-numeric:tabular-nums;color:var(--ink)}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.zone{font-weight:800;font-size:var(--fs-12);color:var(--ink-2);transition:color var(--dur-fast);white-space:nowrap}
.zone.hot{color:var(--rose)}
.fx{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1;min-width:0}

.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface);color:var(--ink-2);font-weight:800;font-size:var(--fs-14);box-shadow:var(--shadow-s)}
.chip b{font-family:var(--font-display);font-weight:600;font-size:var(--fs-16);color:var(--ink);font-variant-numeric:tabular-nums}
.chip{white-space:nowrap}
.chip.sm{min-height:30px;padding:0 12px;font-size:var(--fs-12)}
.chip.sm b{font-size:var(--fs-14)}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:20px 20px 24px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity var(--dur-fast) var(--ease),visibility 0s linear var(--dur-fast)}
.scr.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity var(--dur-base) var(--ease),visibility 0s}
.scr.on .rise{animation:rise var(--dur-slow) var(--ease) both;animation-delay:calc(var(--i,0)*90ms + 80ms)}
@keyframes rise{from{opacity:.5;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

.menu-head{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tb-right{display:flex;gap:10px}
.title{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(2.25rem,10vw,3rem);letter-spacing:-.01em;line-height:1.05;text-align:center}
.tagline{margin:0;max-width:300px;color:var(--ink-2);font-weight:700;font-size:var(--fs-16);text-align:center;text-wrap:balance}
.grow{flex:1}
.menu-foot{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.stat-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}

.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:var(--r-pill);font-family:var(--font-display);font-weight:600;font-size:var(--fs-20);line-height:1;color:var(--ink);background:var(--surface);box-shadow:var(--shadow-s);transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),opacity var(--dur-fast)}
.btn:active{transform:translateY(0) scale(.97);box-shadow:var(--shadow-s)}
.btn:focus-visible,.icon-btn:focus-visible,.tool:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.btn.primary{background:var(--btn);color:var(--on-btn)}
.btn.big{width:min(100%,280px);min-height:64px;font-size:var(--fs-28)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--ink-2);min-height:44px;font-family:var(--font-body);font-weight:800;font-size:var(--fs-16)}
.btn[aria-disabled="true"]{opacity:.55}
@media (hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-m)}.btn.quiet:hover{box-shadow:none;transform:none;color:var(--ink)}}
.icon-btn{appearance:none;border:0;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow-s);transition:transform var(--dur-fast) var(--ease)}
.icon-btn:active{transform:scale(.94)}
@keyframes breathe{50%{transform:scale(1.04)}}
.breathe{animation:breathe 2.4s ease-in-out infinite}

.tools{position:absolute;left:0;right:0;bottom:0;padding:12px 16px 18px;display:flex;justify-content:center;gap:16px;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity var(--dur-base) var(--ease),transform var(--dur-slow) var(--ease)}
.tools.on{opacity:1;transform:none;pointer-events:auto}
.tool{appearance:none;border:0;position:relative;width:58px;height:58px;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s);display:grid;place-items:center;cursor:pointer;transition:transform var(--dur-fast) var(--ease),opacity var(--dur-fast)}
.tool:active{transform:scale(.92)}
.tool.empty{opacity:.55}
.tool svg{width:28px;height:28px;display:block}
.tool .s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool .badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--btn);color:var(--on-btn);font:800 12px/22px var(--font-body);text-align:center;font-variant-numeric:tabular-nums}
.tool.empty .badge{background:var(--track);color:var(--ink-2)}

.scr.dim{background:var(--scrim);justify-content:center}
.card{width:min(100%,380px);padding:26px 20px 20px;border-radius:var(--r-l);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.scr.on .card{animation:card-in var(--dur-slow) var(--ease) both}
@keyframes card-in{from{opacity:0;transform:translateY(28px) scale(.95)}to{opacity:1;transform:none}}
.glass{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--shadow-m);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--surface)}}
.eyebrow{margin:0;font-weight:800;font-size:var(--fs-14);color:var(--ink-2)}
.big-score{font-family:var(--font-display);font-weight:700;font-size:var(--fs-72);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.delta{margin:0;font-weight:800;font-size:var(--fs-16);color:var(--ink-2)}
.delta.win{color:var(--btn)}
.near-msg{margin:0;padding:7px 14px;border-radius:var(--r-pill);background:var(--rose-soft);color:var(--ink);font-weight:800;font-size:var(--fs-14)}
.cont{width:100%;padding:14px;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow-s);display:flex;flex-direction:column;gap:12px;text-align:left}
.cont-head{display:flex;flex-direction:column;gap:2px}
.cont-head b{font-family:var(--font-display);font-weight:600;font-size:var(--fs-20)}
.cont-head span{color:var(--ink-2);font-weight:700;font-size:var(--fs-14)}
.cont-actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.cont-actions .btn{min-height:52px;padding:0 12px;font-size:var(--fs-16);white-space:nowrap;background:var(--bg);box-shadow:none}
.cont-actions .btn.ad{background:var(--btn);color:var(--on-btn)}
.row2{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}

.shop{max-height:min(100%,760px);gap:10px;padding:20px 16px 14px}
.shop-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.shop-head h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:var(--fs-28);line-height:1.1}
.shop-list{width:100%;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;padding:2px}
.trow{display:grid;grid-template-columns:48px 1fr;gap:2px 12px;padding:12px;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow-s);text-align:left}
.trow .ti{grid-row:1/3;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--lilac-soft);color:var(--btn)}
.trow .ti svg{width:26px;height:26px}
.trow .ti .s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.trow .nm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;font-size:var(--fs-16)}
.trow .ds{color:var(--ink-2);font-weight:700;font-size:var(--fs-12);display:flex;justify-content:space-between;align-items:center;gap:8px}
.trow .ac{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.trow .ac .btn{min-height:42px;font-size:var(--fs-14);padding:0 10px;background:var(--bg);box-shadow:none;white-space:nowrap}
.trow .ac .btn[aria-disabled="true"]{opacity:.5}
.pips{display:inline-flex;gap:4px;align-items:center}
.pips i{width:8px;height:8px;border-radius:50%;background:var(--track)}
.pips i.on{background:var(--lilac)}
.stock{font-family:var(--font-display);font-weight:600;color:var(--ink);font-size:var(--fs-14);white-space:nowrap}

.ad-badge{margin:0;padding:6px 12px;border-radius:var(--r-pill);background:var(--lilac-soft);color:var(--ink);font-weight:800;font-size:var(--fs-12)}
.ad-text{margin:0;color:var(--ink-2);font-weight:700;font-size:var(--fs-14);max-width:280px;text-wrap:balance}
.ad-bar{width:100%;height:12px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.ad-bar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--btn)}
.toast{position:absolute;left:50%;bottom:92px;max-width:calc(100% - 40px);padding:12px 18px;border-radius:var(--r-pill);background:var(--glass);border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow-m);font-weight:800;font-size:var(--fs-14);color:var(--ink);text-align:center;opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity var(--dur-base) var(--ease),transform var(--dur-base) var(--ease);z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-height:640px){.title{font-size:2.25rem}.btn.big{min-height:56px;font-size:var(--fs-20)}.topbar{margin-bottom:6px}.tool{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){.amb i,.breathe{animation:none}.scr.on .rise,.scr.on .card{animation-duration:1ms;animation-delay:0s}.btn,.icon-btn,.hud,.tools,.tool{transition:none}}
</style>

<div id="app">
  <div class="amb" aria-hidden="true"><i></i><i></i><i></i></div>
  <canvas id="cv" role="img" aria-label="Oyun alanı: kronometre kadranında dönen ibre ve şeftali renkli hedef bölge"></canvas>

  <div class="hud" id="hud" aria-hidden="true">
    <div class="gauge-row">
      <div class="gauge"><div class="fill" id="fill"></div><span class="notch" id="notch"></span></div>
      <span class="tleft" id="tleft">6,0</span>
    </div>
    <div class="hud-row">
      <span class="zone" id="zone"></span>
      <span class="fx" id="fx"></span>
      <span class="chip sm" id="hudBest"></span>
    </div>
  </div>

  <div class="tools" id="tools" role="group" aria-label="Aletler">
    <button class="tool" data-tool="steto" type="button" style="color:var(--btn)"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="s" d="M6 3v5a5 5 0 0 0 10 0V3M11 13v2.5a4 4 0 0 0 8 0V14"/><circle class="s" cx="19" cy="12" r="2"/></svg><b class="badge">0</b></button>
    <button class="tool" data-tool="kron" type="button" style="color:var(--peach-deep)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="s" cx="12" cy="13.5" r="7"/><path class="s" d="M12 13.5V10M10 3h4M12 3v3.5"/></svg><b class="badge">0</b></button>
    <button class="tool" data-tool="kalkan" type="button" style="color:var(--rose)"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="s" d="M12 3l7 3v5c0 5-3.2 8.4-7 10-3.8-1.6-7-5-7-10V6l7-3z"/></svg><b class="badge">0</b></button>
    <button class="tool" data-tool="kum" type="button" style="color:var(--lilac)"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="s" d="M7 3h10M7 21h10M8 3c0 5 4 5 4 9s-4 4-4 9M16 3c0 5-4 5-4 9s4 4 4 9"/></svg><b class="badge">0</b></button>
  </div>

  <section class="scr on" id="menu" aria-label="Ana ekran">
    <header class="menu-head" id="menuHead">
      <div class="topbar rise" style="--i:0">
        <span class="chip"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--peach)"><circle class="f" cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.2" fill="none" stroke-width="2.4" style="stroke:var(--peach-soft)"/></svg><b id="coinN">0</b></span>
        <span class="tb-right">
          <button class="icon-btn" id="bagBtn" type="button" aria-label="Alet çantası"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="s" d="M5 8h14l-1 12H6L5 8zM9 8V6.5a3 3 0 0 1 6 0V8"/></svg></button>
          <button class="icon-btn" id="sndBtn" type="button" aria-label="Ses"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path class="f" d="M4 9.5v5h3.6L12.5 19V5L7.6 9.5H4z"/><path class="s" id="sndWaves" d="M16 9a4.2 4.2 0 0 1 0 6M18.6 6.4a8 8 0 0 1 0 11.2"/></svg></button>
        </span>
      </div>
      <h1 class="title rise" style="--i:1" data-i18n="title">Kıl payı</h1>
      <p class="tagline rise" style="--i:2" data-i18n="tagline">Süre bitmek üzereyken vur, puan ×3.</p>
    </header>
    <div class="grow"></div>
    <footer class="menu-foot" id="menuFoot">
      <div class="stat-row rise" style="--i:3">
        <span class="chip"><span data-i18n="best">En iyi</span><b id="menuBest">0</b></span>
        <span class="chip"><span data-i18n="runs">Oyun</span><b id="menuRuns">0</b></span>
      </div>
      <button class="btn primary big breathe rise" style="--i:4" id="playBtn" type="button" data-i18n="play">Oyna</button>
    </footer>
  </section>

  <section class="scr dim" id="over" aria-label="Sonuç" aria-hidden="true">
    <div class="card glass">
      <p class="eyebrow rise" style="--i:0" id="ovTitle"></p>
      <div class="big-score rise" style="--i:1" id="ovScore">0</div>
      <p class="delta rise" style="--i:2" id="ovDelta"></p>
      <p class="near-msg rise" style="--i:3" id="ovNear" hidden></p>
      <div class="stat-row rise" style="--i:4" id="ovStats"></div>
      <div class="cont rise" style="--i:5" id="cont">

  tek:   { min: 0,  w: 0.7, gain: 1.0,  hwMul: 1.0,  omMul: 1.0 },
  cift:  { min: 8,  w: 0.6, gain: 0.8,  hwMul: 1.15, omMul: 1.0 },
  kayan: { min: 16, w: 0.5, gain: 1.0,  hwMul: 1.2,  omMul: 0.92 },

  iki:   { min: 38, w: 0.4, gain: 0.65, hwMul: 1.25, omMul: 0.82 }
};
const kindOpen = (k, n, unl) => k === 'tek' || (unl && unl[k] ? n >= 6 + 2 * KINDS.indexOf(k) : n >= KIND[k].min);
const pickKind = (n, relief, unl, last, r) => {
  if (relief) return 'tek';
  const open = KINDS.filter(k => kindOpen(k, n, unl) && !(k === last && k !== 'tek'));
  let sum = 0;
  for (const k of open) sum += KIND[k].w;
  let x = r * sum;
  for (const k of open) { x -= KIND[k].w; if (x <= 0) return k; }

};
const drainAt = n => 1 + Math.min(DIFF.fatigueCap, Math.max(0, n - DIFF.fatigueFrom) * DIFF.fatigueRate);
const wavePhase = n => (n % DIFF.period) / DIFF.period;
const smooth = p => p * p * (3 - 2 * p);
const waveShape = p => p < DIFF.rise ? smooth(p / DIFF.rise) : 1 - smooth((p - DIFF.rise) / (1 - DIFF.rise));
const intensity = (n, adapt, mercy) => {
  const trend = DIFF.trendMax * (1 - Math.exp(-n / DIFF.trendTau));
  const amp = DIFF.ampMax * (DIFF.ampStart + (1 - DIFF.ampStart) * (1 - Math.exp(-n / DIFF.ampTau)));
  const v = trend + amp * waveShape(wavePhase(n)) + adapt - DIFF.mercyDrop * mercy;
  return Math.max(0, Math.min(1, v));
};

    omega: DIFF.omegaMin + (DIFF.omegaMax - DIFF.omegaMin) * I,

  S.mercy *= DIFF.mercyDecay;
  return { perfect, near, pts };
};

};

      settled = true; clearTimeout(timer);

      el.classList.remove('real'); hide(el);
      $('adBadgeEl').textContent = t('adBadge'); $('adTextEl').textContent = t('adText');
      done(ok, why);
    };
    timer = setTimeout(() => finish(false, 'fail'), 25000);
    (async () => {
      try {
        if (!(await adMobInit(A))) { finish(false, 'fail'); return; }
        handles.push(await A.addListener('onRewardedVideoAdShowed', () => { clearTimeout(timer); }));
        handles.push(await A.addListener('onRewardedVideoAdReward', () => { earned = true; }));
        handles.push(await A.addListener('onRewardedVideoAdDismissed', () => finish(earned, earned ? 'ok' : 'closed')));
        handles.push(await A.addListener('onRewardedVideoAdFailedToShow', () => finish(false, 'fail')));
        handles.push(await A.addListener('onRewardedVideoAdFailedToLoad', () => finish(false, 'fail')));
        await A.prepareRewardVideoAd({ adId: ADS.rewardedId, isTesting: ADS.test });
        const item = await A.showRewardVideoAd();
        if (item) earned = true;
      } catch (e) { finish(false, 'fail'); }
    })();
  }
};

/* ---------- oyun durumu ---------- */
const MENU_PINS = [{ kind: 'gate', ring: 0, c0: 1.0, amp: 0, f: 0, ph: 0, hw: 0.45, done: false }];
const G = {
  mode: 'menu', clock: 0, pt: 0,
  time: 0, n: 0, score: 0, combo: 0, maxCombo: 0, near: 0,
  ang: 0.4, dir: 1, omega: DIFF.omegaMin, ang2: 0, dir2: -1, omega2: 2, slow: 0,
  kind: 'tek', lastKind: 'tek', pins: [], gainMul: 1, gateT: 1,
  ta: 1.0, hw: 0.45,
  adapt: 0, mercy: 0, I: 0, Ivis: 0, relief: false,
  boost: 0, glove: 0, waveSeen: 0, pendingRev: false, introKind: null, hint: null,
  shake: 0, flash: 0, flashKind: 'rose', tscale: 1, tsT: 0,
  parts: [], pops: [], rips: [], revT: 0, beep: 0, scorePulse: 0,
  continued: false, runCounted: false, coinsGiven: 0, gain: 0, deadT: 0, overAt: 0,
  nearMsg: '', newBest: false
};
const view = { w: 0, h: 0, dpr: 1, cx: 0, cy: 0, r: 100, tcx: 0, tcy: 0, tr: 100 };

const pinCenter = p => p.amp ? norm(p.c0 + p.amp * Math.sin(TAU * p.f * G.pt + p.ph)) : p.c0;
const syncPrimary = () => {
  for (const p of G.pins) if (p.kind === 'gate' && !p.done && p.ring === 0) { G.ta = pinCenter(p); G.hw = p.hw; return; }
};
const ahead = (ang, dir, d) => norm(ang + dir * d);

const introduce = (kind, isNew) => {
  const seen = save.seen[kind] || 0;
  if (!isNew && seen >= 2) return;
  save.seen[kind] = seen + 1; persist();
  const lines = [];
  if (isNew) lines.push({ txt: t('introNew', { k: t('k_' + kind) }), bg: 'lilac-soft' });
  lines.push({ txt: t('hint_' + kind), bg: 'surface' });
  G.hint = { lines, t: 0, max: isNew ? 4.4 : 3 };
};

const spawnChallenge = (first, force) => {
  const plan = planGate(G.n, G.adapt, G.mercy);
  const kind = first ? 'tek' : (force || pickKind(G.n, plan.relief, save.unl, G.lastKind, Math.random()));
  const prevKind = G.kind;
  const km = KIND[kind];
  const boost = G.boost > 0 ? 1.4 : 1;
  G.kind = kind; G.lastKind = kind; G.gainMul = km.gain;
  G.I = plan.I; G.relief = plan.relief;
  G.omega = plan.omega * km.omMul;
  const hw = Math.min(0.8, plan.hw * km.hwMul * boost);
  const gate = (ring, c, h) => ({ kind: 'gate', ring, c0: c, amp: 0, f: 0, ph: 0, hw: h, done: false });
  const pins = [];
  if (kind === 'tek') {
    pins.push(gate(0, ahead(G.ang, G.dir, first ? rnd(1.6, 2.3) : rnd(CFG.spawnMin, CFG.spawnMax)), hw));
  } else if (kind === 'cift') {
    const a = ahead(G.ang, G.dir, rnd(1.0, 2.0));
    pins.push(gate(0, a, hw), gate(0, ahead(a, G.dir, hw * 2 + rnd(0.3, 0.8)), hw));
  } else if (kind === 'kayan') {
    const p = gate(0, ahead(G.ang, G.dir, rnd(1.4, 2.6)), hw);
    p.amp = rnd(0.45, 0.8); p.f = rnd(0.32, 0.5); p.ph = rnd(0, TAU);
    pins.push(p);
  } else if (kind === 'tuzak') {
    const a = ahead(G.ang, G.dir, rnd(1.2, 2.4));
    pins.push(gate(0, a, hw));
    const th = hw * 1.1;
    let c = a, tries = 0;
    do {
      const side = Math.random() < 0.5 ? 1 : -1;
      c = norm(a + side * (hw + th + rnd(0.35, 0.9))); tries++;
    } while (tries < 8 && angd(c, G.ang) < th + 0.5);
    pins.push({ kind: 'trap', ring: 0, c0: c, amp: 0, f: 0, ph: 0, hw: th, done: false });
  } else if (kind === 'iki') {
    if (prevKind !== 'iki') G.ang2 = norm(G.ang + Math.PI);
    G.dir2 = -G.dir; G.omega2 = G.omega * 0.85;
    pins.push(gate(0, ahead(G.ang, G.dir, rnd(1.0, 2.2)), hw));
    pins.push(gate(1, ahead(G.ang2, G.dir2, rnd(1.0, 2.0)), Math.min(0.85, hw * 1.15)));
  }
  G.pins = pins; G.gateT = 0;
  syncPrimary();
  if (kind !== 'tek' && !first) introduce(kind, force === kind && !!G.introNew);
  G.introNew = false;
};

const shake = s => { if (!RM) G.shake = Math.max(G.shake, s); };
const flash = (kind, s) => { if (!RM) { G.flashKind = kind; G.flash = s; } };
const ringR = ring => ring ? view.r * 0.6 : view.r;
const pinXY = p => {
  const a = pinCenter(p) - HALF, r = ringR(p.ring);
  return { x: view.cx + Math.cos(a) * r, y: view.cy + Math.sin(a) * r };
};
const burst = (x, y, n, cols, speed) => {
  const k = RM ? 0.4 : 1;
  for (let i = 0; i < Math.round(n * k); i++) {
    const a = rnd(0, TAU), s = rnd(speed * 0.35, speed);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: rnd(0.45, 0.85), r: rnd(2.5, 5.5), c: cols[(Math.random() * cols.length) | 0] });
  }
};
const pop = (txt, kind) => {
  let slot = 0;
  for (const p of G.pops) if (p.t < 0.4) slot++;
  G.pops.push({ txt, kind, t: 0, max: 0.95, off: Math.min(2, slot) * 36 });
};

/* ---------- akış ---------- */
const relayout = snap => {
  const w = view.w, h = view.h, cx = w / 2;
  let cy, r;
  if (G.mode === 'menu') {
    const top = app.getBoundingClientRect().top;
    const hb = $('menuHead').getBoundingClientRect().bottom - top;
    const ft = $('menuFoot').getBoundingClientRect().top - top;
    cy = (hb + ft) / 2;
    r = Math.min(w * 0.29, (ft - hb) / 2 - 36);
  } else {
    cy = h * 0.46;
    r = Math.min(w * 0.33, h * 0.2);
    /* kısa ekranlarda halka + iki satırlık ipucu, HUD ile alet çubuğu arasına sığmalı */
    const hudB = (hudEl.offsetTop + hudEl.offsetHeight) || 88;
    const room = (h - (toolsEl.offsetHeight || 88) + 8) - 4 - (hudB + 8);
    const rFit = (room - 138) / 2.2;
    if (rFit < r) { r = rFit; cy = hudB + 8 + 18 + 1.1 * Math.max(56, r) + 10; }
  }
  r = Math.max(56, r);
  view.tcx = cx; view.tcy = cy; view.tr = r;
  if (snap) { view.cx = cx; view.cy = cy; view.r = r; }
};
const resize = () => {
  const b = app.getBoundingClientRect();
  view.w = b.width; view.h = b.height; view.dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(view.w * view.dpr));
  cv.height = Math.max(1, Math.round(view.h * view.dpr));
  relayout(true);
};

    revT: 0, beep: 0, scorePulse: 0, parts: [], pops: [], rips: [], nearMsg: '',
    adapt: 0, mercy: 0, I: 0, Ivis: 0, relief: false, pt: 0,
    kind: 'tek', lastKind: 'tek', pins: [], gainMul: 1, boost: 0, glove: 0, waveSeen: 0, pendingRev: false,

const goMenu = () => {
  G.mode = 'menu'; G.ta = 1.0; G.hw = 0.45; G.dir = 1; G.gateT = 0; G.I = 0; G.kind = 'tek'; G.hint = null;
  hide(overEl); hide(pauseEl); hide(shopEl);

  toolsEl.classList.remove('on');
  show(menuEl);
  refreshStats();
  requestAnimationFrame(() => relayout(false));
};

const tap = x => {
  if (G.mode !== 'play') return;
  const ring = G.kind === 'iki' && x != null && x >= view.cx ? 1 : 0;
  const ang = ring ? G.ang2 : G.ang;
  let best = null, bd = 9;
  for (const p of G.pins) {
    if (p.kind !== 'gate' || p.done || p.ring !== ring) continue;
    const d = angd(ang, pinCenter(p));
    if (d <= p.hw + CFG.grace && d < bd) { best = p; bd = d; }
  }
  if (best) { hit(bd, best); return; }
  for (const p of G.pins) {
    if (p.kind === 'trap' && p.ring === ring && angd(ang, pinCenter(p)) <= p.hw) { trap(); return; }
  }
  miss();
};

const checkUnlock = () => {
  for (const k of KINDS) {
    if (k === 'tek' || save.unl[k] || G.n < KIND[k].min) continue;
    save.unl[k] = true; persist();
    G.introKind = k; G.introNew = true;
    Snd.fanfare(); Platform.track('unlock', { kind: k, hits: G.n });
    return;
  }
};

const hit = (d, pin) => {
  const wasRelief = G.relief;
  pin.done = true;
  G.hw = pin.hw;
  const { perfect, near, pts } = resolveHit(G, d);
  G.scorePulse = 1;
  if (G.boost > 0) G.boost--;
  const p = pinXY(pin);
  const cols = near ? [P.rose, P['rose-soft'], P.peach] : (perfect ? [P['peach-deep'], P.peach, P.lilac] : [P.peach, P.lilac, P['peach-soft']]);
  burst(p.x, p.y, near ? 26 : (perfect ? 18 : 11), cols, near ? 260 : 190);
  G.rips.push({ x: p.x, y: p.y, t: 0, max: near ? 0.7 : 0.5, r0: 10, r1: near ? 90 : 56, c: near ? P.rose : P.peach });
  if (near) {
    pop(t('near'), 'near'); shake(0.35); flash('rose', 0.22);
    if (!RM) { G.tscale = 0.3; G.tsT = 0.14; }
    Snd.near(); Platform.haptic('heavy');
  } else {
    pop(perfect ? t('perfect') : '+' + pts, perfect ? 'perfect' : 'plain');
    Snd.hit(G.combo - 1, perfect); Platform.haptic(perfect ? 'medium' : 'light');
  }
  const wave = Math.floor(G.n / DIFF.period);
  if (wave > G.waveSeen) { G.waveSeen = wave; if (wave >= 1) G.pendingRev = true; }
  if (G.pins.every(q => q.kind !== 'gate' || q.done)) {
    if (G.pendingRev) {
      G.pendingRev = false;
      G.dir = -G.dir; G.revT = 0.8; pop(t('reverse'), 'rev'); Snd.rev();
    }
    checkUnlock();
    const force = G.introKind; G.introKind = null;
    spawnChallenge(false, force);
    if (G.relief && !wasRelief) pop(t('breath'), 'rev');
  } else {
    syncPrimary();
  }
  if (G.n === 1) refreshStats();
};

const miss = () => {
  if (G.glove > 0) {
    G.glove--; pop(t('shieldSave'), 'perfect'); Snd.ui(); Platform.haptic('light');
    return;
  }
  resolveMiss(G);
  shake(0.2); flash('rose', 0.14);
  pop(t('miss'), 'miss'); Snd.miss(); Platform.haptic('warn');
  if (G.time <= 0) die();
};

const trap = () => {
  if (G.glove > 0) {
    G.glove--; pop(t('shieldSave'), 'perfect'); Snd.ui(); Platform.haptic('light');
    return;
  }
  resolveMiss(G, CFG.trapCost);
  shake(0.4); flash('rose', 0.24);
  pop(t('alarm'), 'near'); Snd.alarm(); Platform.haptic('error');
  if (G.time <= 0) die();
};

const useTool = id => {
  if (G.mode !== 'play') return;
  const s = save.tools[id];
  if (!s) return;
  if (s.n <= 0) { toast(t('toolEmpty')); return; }
  s.n--; persist();
  const e = TOOL[id].eff(s.l);
  if (id === 'steto') {
    G.boost = Math.max(G.boost, e);
    for (const p of G.pins) if (p.kind === 'gate' && !p.done) p.hw = Math.min(0.8, p.hw * 1.4);
  } else if (id === 'kron') {
    G.time = Math.min(CFG.maxTime, G.time + e);
  } else if (id === 'kalkan') {
    G.glove += e;
  } else if (id === 'kum') {
    G.slow = Math.max(G.slow, e);
  }
  pop(toolDesc(id, e), 'perfect');
  Snd.tool(); Platform.haptic('medium');
  updateTools(); updateHud();
  Platform.track('tool_use', { id, level: s.l });
};

const die = () => {
  if (G.mode !== 'play') return;
  G.mode = 'dead'; G.deadT = 0.6;
  toolsEl.classList.remove('on');
  const w = G.omega * (G.slow > 0 ? CFG.contSlowMul : 1);
  const inside = angd(G.ang, G.ta) <= G.hw;
  const secs = (norm((G.ta - G.ang) * G.dir) - G.hw) / w;
  G.nearMsg = inside ? t('overInside') : (secs > 0 && secs <= 0.6 ? t('overClose', { s: f1(Math.max(0.1, secs)) }) : '');
  shake(0.5); flash('rose', 0.3); Snd.over(); Platform.haptic('error');
  G.newBest = G.score > save.best;
  if (G.newBest) save.best = G.score;
  if (!G.runCounted) { save.runs++; G.runCounted = true; }
  const total = Math.floor(G.score / CFG.coinDiv) + G.near * CFG.nearCoin;
  G.gain = total - G.coinsGiven; G.coinsGiven = total; save.coins += G.gain;
  if (!save.tut && G.n >= CFG.tutHits) save.tut = true;
  persist(); refreshStats();
  Platform.track('run_end', { score: G.score, hits: G.n, near: G.near, continued: G.continued, kind: G.kind });
};

const showOver = () => {
  G.mode = 'over'; G.overAt = performance.now();
  $('ovTitle').textContent = t('over');
  countUp($('ovScore'), G.score, 600);
  const d = $('ovDelta');
  d.hidden = G.score === 0;
  if (G.newBest && G.score > 0) { d.textContent = t('newBest'); d.className = 'delta win rise'; }
  else { d.textContent = t('toBest', { n: Math.max(1, save.best - G.score) }); d.className = 'delta rise'; }
  const nm = $('ovNear');

  const coinIcon = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--peach);width:16px;height:16px"><circle class="f" cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.2" fill="none" stroke-width="2.4" style="stroke:var(--peach-soft)"/></svg>';
  const chips = [];

  if (G.maxCombo >= 3) chips.push('<span class="chip sm">' + t('statCombo') + ' <b>' + G.maxCombo + '</b></span>');

  const st = $('ovStats');

  $('live').textContent = t('overSr', { n: G.score });

};

const doContinue = () => {
  G.mode = 'play'; G.continued = true; G.time = CFG.contTime; G.slow = CFG.contSlow;
  G.combo = 0; G.tscale = 1; G.tsT = 0;
  const g0 = G.pins.find(p => p.kind === 'gate' && !p.done && p.ring === 0);
  if (g0) G.ang = norm(pinCenter(g0) - G.dir * 1.3);
  const g1 = G.pins.find(p => p.kind === 'gate' && !p.done && p.ring === 1);
  if (g1) G.ang2 = norm(pinCenter(g1) - G.dir2 * 1.3);
  G.gateT = 0;
  hide(overEl);
  toolsEl.classList.add('on');
  pop('+' + CFG.contTime + ' ' + SN, 'perfect');

};

  const id = b.closest('.trow').getAttribute('data-id'), s = save.tools[id], T = TOOL[id];
  Snd.unlock();
  if (b.getAttribute('data-act') === 'buy') {
    if (save.coins < T.price) { toast(t('coinShort')); return; }
    save.coins -= T.price; s.n++;
  } else {
    if (s.l >= 3) return;
    const cost = T.up[s.l];
    if (save.coins < cost) { toast(t('coinShort')); return; }
    save.coins -= cost; s.l++;
  }
  persist(); refreshStats(); renderShop(); Snd.tool();
  Platform.track('shop', { id, act: b.getAttribute('data-act') });
});

let lastT = '', lastFx = '';
const updateHud = () => {
  const f = clamp(G.time / CFG.maxTime, 0, 1);
  fillEl.style.width = (f * 100).toFixed(1) + '%';
  const s = f1(Math.max(0, G.time));
  if (s !== lastT) { lastT = s; tleftEl.textContent = s; }
  const crit = G.time < CFG.nearAt, warn = !crit && G.time < 2.5;
  gaugeEl.classList.toggle('crit', crit);
  gaugeEl.classList.toggle('warn', warn);
  zoneEl.classList.toggle('hot', crit && G.mode === 'play');
  const fx = [];
  if (G.boost > 0) fx.push(t('fxSteto', { n: G.boost }));
  if (G.glove > 0) fx.push(t('fxShield', { n: G.glove }));
  if (G.slow > 0) fx.push(t('fxSlow', { n: Math.ceil(G.slow) }));
  const key = fx.join('|');
  if (key !== lastFx) { lastFx = key; fxEl.innerHTML = fx.map(x => '<span class="chip sm">' + x + '</span>').join(''); }
};

/* ---------- güncelleme ---------- */
const update = raw => {
  G.clock += raw;
  const k = Math.min(1, raw * 9);
  view.cx += (view.tcx - view.cx) * k; view.cy += (view.tcy - view.cy) * k; view.r += (view.tr - view.r) * k;
  if (G.tsT > 0) { G.tsT -= raw; if (G.tsT <= 0) G.tscale = 1; }
  const dt = raw * G.tscale;

  if (G.mode === 'menu') {
    G.ang = norm(G.ang + 1.0 * dt);
    G.gateT = Math.min(1, G.gateT + raw * 2);
  } else if (G.mode === 'play') {
    const sl = G.slow > 0 ? CFG.contSlowMul : 1;
    G.pt += dt;
    G.ang = norm(G.ang + G.dir * G.omega * sl * dt);
    if (G.kind === 'iki') G.ang2 = norm(G.ang2 + G.dir2 * G.omega2 * sl * dt);
    G.time -= dt * drainAt(G.n);
    if (G.slow > 0) G.slow -= raw;
    if (G.revT > 0) G.revT -= raw;
    G.gateT = Math.min(1, G.gateT + raw * 4);
    syncPrimary();
    if (G.time < CFG.nearAt) { G.beep -= raw; if (G.beep <= 0) { G.beep = 0.24; Snd.warn(); } }
    if (G.time <= 0) { G.time = 0; die(); }
    updateHud();
  } else if (G.mode === 'dead') {
    G.deadT -= raw;
    updateHud();
    if (G.deadT <= 0) showOver();
  }

  if (G.hint) { G.hint.t += raw; if (G.hint.t > G.hint.max) G.hint = null; }
  G.shake = Math.max(0, G.shake - raw);
  G.flash = Math.max(0, G.flash - raw);
  G.scorePulse = Math.max(0, G.scorePulse - raw * 5);
  G.Ivis += (G.I - G.Ivis) * Math.min(1, raw * 3);
  const decay = Math.exp(-3.2 * raw);
  for (const p of G.parts) { p.life += raw; p.x += p.vx * raw; p.y += p.vy * raw; p.vx *= decay; p.vy = p.vy * decay + 140 * raw; }
  G.parts = G.parts.filter(p => p.life < p.max);
  for (const r of G.rips) r.t += raw;
  G.rips = G.rips.filter(r => r.t < r.max);
  for (const p of G.pops) p.t += raw;
  G.pops = G.pops.filter(p => p.t < p.max);
};

/* ---------- çizim ---------- */
const arc = (c, x, y, r, a0, a1) => { c.beginPath(); c.arc(x, y, r, a0, a1); c.stroke(); };
const mixHex = (a, b, k) => {
  if (a.charAt(0) !== '#' || a.length !== 7 || b.charAt(0) !== '#' || b.length !== 7) return a;
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((pa >> s) & 255) * (1 - k) + ((pb >> s) & 255) * k);
  return 'rgb(' + ch(16) + ',' + ch(8) + ',' + ch(0) + ')';
};
const pill = (c, txt, x, y, bg, fg, size) => {
  c.font = '800 ' + size + 'px ' + FB;
  const w = c.measureText(txt).width + size * 1.7, h = size * 2.1;
  const px = clamp(x, w / 2 + 8, view.w - w / 2 - 8);
  c.fillStyle = bg;
  c.beginPath();
  if (c.roundRect) c.roundRect(px - w / 2, y - h / 2, w, h, h / 2);
  else c.rect(px - w / 2, y - h / 2, w, h);
  c.fill();
  c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(txt, px, y + 1);
};
const drawPin = (c, cx, cy, Rr, RWr, p, gk, idx, numbered) => {
  const ce = pinCenter(p), hw = p.hw * (0.35 + 0.65 * gk);
  const a0 = ce - hw - HALF, a1 = ce + hw - HALF;
  c.lineCap = 'butt';
  if (p.kind === 'trap') {
    c.globalAlpha = gk;
    c.lineWidth = RWr + 10; c.strokeStyle = P['rose-soft']; arc(c, cx, cy, Rr, a0, a1);
    c.lineWidth = RWr; c.strokeStyle = P.rose; arc(c, cx, cy, Rr, a0, a1);
    const mx = cx + Math.cos(ce - HALF) * Rr, my = cy + Math.sin(ce - HALF) * Rr, s = RWr * 0.22;
    c.strokeStyle = '#FFFFFF'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(mx - s, my - s); c.lineTo(mx + s, my + s); c.moveTo(mx + s, my - s); c.lineTo(mx - s, my + s); c.stroke();
    c.globalAlpha = 1;
    return;
  }
  if (p.amp) {
    c.globalAlpha = 0.45 * gk; c.strokeStyle = P.lilac; c.lineWidth = 3; c.lineCap = 'round';
    arc(c, cx, cy, Rr - RWr / 2 - 6, p.c0 - p.amp - HALF, p.c0 + p.amp - HALF);
    c.globalAlpha = 1;
  }
  if (p.done) {
    c.globalAlpha = 0.5;
    c.lineWidth = RWr; c.strokeStyle = P.lilac; arc(c, cx, cy, Rr, a0, a1);
    const mx = cx + Math.cos(ce - HALF) * Rr, my = cy + Math.sin(ce - HALF) * Rr, s = RWr * 0.2;
    c.globalAlpha = 0.9; c.strokeStyle = '#FFFFFF'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(mx - s, my + s * 0.1); c.lineTo(mx - s * 0.3, my + s * 0.8); c.lineTo(mx + s, my - s * 0.7); c.stroke();
    c.globalAlpha = 1;
    return;
  }
  c.globalAlpha = gk;
  c.lineWidth = RWr + 10; c.strokeStyle = P['peach-soft']; arc(c, cx, cy, Rr, a0, a1);
  c.lineWidth = RWr; c.strokeStyle = P.peach; arc(c, cx, cy, Rr, a0, a1);
  c.strokeStyle = P['peach-deep']; arc(c, cx, cy, Rr, ce - hw * CFG.perfectFrac - HALF, ce + hw * CFG.perfectFrac - HALF);
  if (numbered) {
    const mx = cx + Math.cos(ce - HALF) * (Rr - RWr * 1.15), my = cy + Math.sin(ce - HALF) * (Rr - RWr * 1.15);
    c.fillStyle = P.surface; c.beginPath(); c.arc(mx, my, RWr * 0.42, 0, TAU); c.fill();
    c.fillStyle = P.ink; c.font = '800 ' + Math.round(RWr * 0.55) + 'px ' + FB; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(idx + 1), mx, my + 1);
  }
  c.globalAlpha = 1;
};
const drawPointer = (c, cx, cy, Rr, RWr, ang, dir, col, trailCol) => {
  const a = ang - HALF;
  c.lineCap = 'butt'; c.lineWidth = RWr * 0.5; c.strokeStyle = trailCol;
  for (let i = 0; i < 10; i++) {
    const s0 = a - dir * i * 0.05, s1 = a - dir * (i + 1) * 0.05;
    c.globalAlpha = (1 - i / 10) * 0.45;
    arc(c, cx, cy, Rr, Math.min(s0, s1), Math.max(s0, s1));
  }
  c.globalAlpha = 1;
  const px = cx + Math.cos(a) * Rr, py = cy + Math.sin(a) * Rr;
  c.lineCap = 'round'; c.lineWidth = 3; c.strokeStyle = col;
  c.beginPath(); c.moveTo(cx + Math.cos(a) * Rr * 0.62, cy + Math.sin(a) * Rr * 0.62); c.lineTo(px, py); c.stroke();
  c.fillStyle = col; c.beginPath(); c.arc(px, py, RWr * 0.5 + 2, 0, TAU); c.fill();
  c.fillStyle = P.surface; c.beginPath(); c.arc(px, py, RWr * 0.17, 0, TAU); c.fill();
};

const render = () => {
  const c = ctx, cx = view.cx, cy = view.cy, R = view.r, RW = Math.max(14, R * 0.2);
  const two = G.mode !== 'menu' && G.kind === 'iki';
  const R2 = R * 0.6, RW2 = RW * 0.8;
  c.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  c.clearRect(0, 0, view.w, view.h);
  c.save();
  if (G.shake > 0) { const m = Math.min(9, G.shake * 20); c.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }

  const r0 = R + RW / 2 + 10;
  const iv = G.mode === 'menu' ? 0 : G.Ivis;
  c.lineCap = 'round'; c.strokeStyle = mixHex(P.tick, P.rose, 0.8 * iv);
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * TAU - HALF, long = i % 5 === 0, r1 = r0 + (long ? 13 + 5 * iv : 7 + 3 * iv), ca = Math.cos(a), sa = Math.sin(a);
    c.globalAlpha = long ? 0.95 : 0.55 + 0.3 * iv; c.lineWidth = (long ? 2.6 : 1.6) + 0.6 * iv;
    c.beginPath(); c.moveTo(cx + ca * r0, cy + sa * r0); c.lineTo(cx + ca * r1, cy + sa * r1); c.stroke();
  }
  c.globalAlpha = 1;

  c.lineCap = 'butt'; c.lineWidth = RW; c.strokeStyle = P.track;
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke();
  if (two) { c.lineWidth = RW2; c.beginPath(); c.arc(cx, cy, R2, 0, TAU); c.stroke(); }

  if (G.mode === 'play' && G.time < CFG.nearAt) {
    const b = 0.5 + 0.5 * Math.sin(G.clock * 16);
    c.globalAlpha = 0.35 + 0.4 * b; c.strokeStyle = P.rose; c.lineWidth = 3;
    c.beginPath(); c.arc(cx, cy, R + RW / 2 + 3 + 3 * b, 0, TAU); c.stroke();
    c.globalAlpha = 1;
  }

  const gk = easeOut(clamp(G.gateT / 0.25, 0, 1));
  const pins = G.mode === 'menu' ? MENU_PINS : G.pins;
  if (gk > 0) {
    let gi = 0;
    for (const p of pins) {
      const num = G.kind === 'cift' && p.kind === 'gate' && G.mode !== 'menu';
      drawPin(c, cx, cy, p.ring ? R2 : R, p.ring ? RW2 : RW, p, gk, gi, num);
      if (p.kind === 'gate') gi++;
    }
  }

  drawPointer(c, cx, cy, R, RW, G.ang, G.dir, P.ink, P.lilac);
  if (two) drawPointer(c, cx, cy, R2, RW2, G.ang2, G.dir2, P.btn, P.lilac);

  for (const r of G.rips) {
    const p = r.t / r.max;
    c.globalAlpha = (1 - p) * 0.85; c.strokeStyle = r.c; c.lineWidth = 3;
    c.beginPath(); c.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * easeOut(p), 0, TAU); c.stroke();
  }
  for (const p of G.parts) {
    const q = p.life / p.max;
    c.globalAlpha = 1 - q; c.fillStyle = p.c;
    c.beginPath(); c.arc(p.x, p.y, p.r * (1 - 0.45 * q), 0, TAU); c.fill();
  }
  c.globalAlpha = 1;

  c.textAlign = 'center'; c.textBaseline = 'middle';
  const big = Math.round(R * (two ? 0.34 : 0.6));
  if (G.mode === 'menu') {
    c.fillStyle = P.ink; c.font = '600 ' + big + 'px ' + FD;
    c.fillText(String(save.best), cx, cy - R * 0.04);
    c.fillStyle = P['ink-2']; c.font = '800 ' + Math.max(12, Math.round(R * 0.13)) + 'px ' + FB;
    c.fillText(t('best'), cx, cy + R * 0.36);
  } else {
    const sc = 1 + 0.2 * G.scorePulse;
    c.save(); c.translate(cx, cy - (two ? 0 : R * 0.04)); c.scale(sc, sc);
    c.fillStyle = P.ink; c.font = '600 ' + big + 'px ' + FD;
    c.fillText(String(G.score), 0, 0);
    c.restore();
    if (!two) {
      c.fillStyle = P['ink-2']; c.font = '800 ' + Math.max(12, Math.round(R * 0.13)) + 'px ' + FB;
      c.fillText(t('score'), cx, cy + R * 0.36);
    }
  }

  const lineY = cy + r0 + 13 + 36;
  if (G.mode === 'play') {
    if (G.hint) {
      const al = G.hint.t < 0.2 ? G.hint.t / 0.2 : (G.hint.t > G.hint.max - 0.5 ? (G.hint.max - G.hint.t) / 0.5 : 1);
      c.globalAlpha = clamp(al, 0, 1);
      G.hint.lines.forEach((ln, i) => pill(c, ln.txt, cx, lineY + i * 36, P[ln.bg], P.ink, 14));
      c.globalAlpha = 1;
    } else if (!save.tut && G.n < CFG.tutHits) {
      pill(c, G.n < 2 ? t('tut1') : t('tut2'), cx, lineY, P.surface, P.ink, 14);
    }
    if (two && !G.hint) {
      pill(c, t('ringL'), cx - view.w * 0.26, lineY, P['lilac-soft'], P.ink, 13);
      pill(c, t('ringR'), cx + view.w * 0.26, lineY, P['lilac-soft'], P.ink, 13);
    }
  }
  const topY = cy - (r0 + 13) - 30;
  for (const p of G.pops) {
    const k = p.t / p.max, rise = 34 * easeOut(Math.min(1, k * 1.4));
    const al = k < 0.12 ? k / 0.12 : (k > 0.65 ? (1 - k) / 0.35 : 1);
    const sc = 0.85 + 0.15 * Math.min(1, k / 0.15);
    let bg = P.surface, fg = P.ink;
    if (p.kind === 'near') { bg = P.rose; fg = '#FFFFFF'; }
    else if (p.kind === 'perfect') { bg = P['peach-soft']; fg = P.ink; }
    else if (p.kind === 'rev') { bg = P['lilac-soft']; fg = P.ink; }
    else if (p.kind === 'miss') { bg = P.track; fg = P['ink-2']; }
    c.save(); c.globalAlpha = al; c.translate(cx, topY - rise - p.off); c.scale(sc, sc);
    pill(c, p.txt, 0, 0, bg, fg, p.kind === 'near' ? 17 : 15);
    c.restore();
  }
  c.restore();

  if (G.flash > 0) {
    c.globalAlpha = Math.min(0.22, G.flash * 0.7);
    c.fillStyle = G.flashKind === 'rose' ? P.rose : P.peach;
    c.fillRect(0, 0, view.w, view.h);
    c.globalAlpha = 1;
  }
};

/* ---------- giriş ---------- */
const overlayOpen = () => shopEl.classList.contains('on') || adEl.classList.contains('on');
app.addEventListener('pointerdown', e => {
  Snd.unlock();
  const tg = e.target;
  if (tg.closest && (tg.closest('button') || tg.closest('#tools'))) return;
  if (overlayOpen()) return;
  if (G.mode === 'play') tap(e.clientX - app.getBoundingClientRect().left);
  else if (G.mode === 'menu') start();
  else if (G.mode === 'over' && performance.now() - G.overAt > 700) start();
  else if (G.mode === 'pause') resume();
});
toolsEl.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('button.tool');
  if (!b) return;
  e.preventDefault(); Snd.unlock();
  useTool(b.getAttribute('data-tool'));
});
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const ae = document.activeElement;
  if (ae && ae.tagName === 'BUTTON') return;
  const left = e.code === 'ArrowLeft' || e.code === 'KeyA', right = e.code === 'ArrowRight' || e.code === 'KeyL';
  if (e.code !== 'Space' && e.code !== 'Enter' && !left && !right) return;
  e.preventDefault(); Snd.unlock();
  if (overlayOpen()) return;
  if (G.mode === 'play') tap(right ? view.w : (left ? 0 : null));
  else if (G.mode === 'menu') start();
  else if (G.mode === 'over' && performance.now() - G.overAt > 500) start();
  else if (G.mode === 'pause') resume();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

$('playBtn').addEventListener('click', () => { Snd.unlock(); start(); });
$('againBtn').addEventListener('click', () => { Snd.unlock(); start(); });
$('homeBtn').addEventListener('click', () => { Snd.unlock(); Snd.ui(); goMenu(); });
$('resumeBtn').addEventListener('click', resume);
$('bagBtn').addEventListener('click', () => { Snd.unlock(); if (G.mode === 'menu') openShop('menu'); });
$('bagBtn2').addEventListener('click', () => { Snd.unlock(); if (G.mode === 'over') openShop('over'); });
$('shopClose').addEventListener('click', closeShop);
$('shopAd').addEventListener('click', () => {
  Snd.unlock();
  Platform.rewardedAd((ok, why) => {
    if (ok) { save.coins += CFG.adCoins; persist(); refreshStats(); renderShop(); toast(t('gotCoins', { n: CFG.adCoins })); Snd.fanfare(); }
    else if (why !== 'closed') toast(t('adFail'));
  });
});
$('sndBtn').addEventListener('click', () => { Snd.unlock(); save.snd = !save.snd; persist(); refreshSound(); Snd.ui(); });
$('adBtn').addEventListener('click', () => {
  if (G.mode !== 'over') return;
  Snd.unlock(); G.mode = 'ad'; hide(overEl);
  Platform.rewardedAd((ok, why) => { if (ok) doContinue(); else { G.mode = 'over'; show(overEl); if (why !== 'closed') toast(t('adFail')); } });
});
$('coinBtn').addEventListener('click', () => {
  if (G.mode !== 'over') return;
  Snd.unlock();
  if (save.coins < CFG.contCoins) { toast(t('notEnough')); return; }
  save.coins -= CFG.contCoins; persist(); refreshStats(); doContinue();
});

/* ---------- açılış ---------- */
applyI18n(); refreshSound(); refreshStats();
resize();
if (window.ResizeObserver) new ResizeObserver(resize).observe(app); else window.addEventListener('resize', resize);
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load('600 40px Fredoka'), document.fonts.load('800 14px Nunito')]).then(() => { readPalette(); relayout(false); }).catch(() => {});
}
setTimeout(() => relayout(true), 120);
const AppP = plugin('App'), StatusP = plugin('StatusBar');
const bgIsDark = () => {
  const v = parseInt((P.bg || '#ffffff').slice(1), 16);
  return (0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255)) < 128;
};
onPalette = () => {
  if (!StatusP) return;
  try { StatusP.setStyle({ style: bgIsDark() ? 'DARK' : 'LIGHT' }); } catch (e) {}
};
onPalette();
if (AppP) {
  try {
    AppP.addListener('pause', () => pause());
    AppP.addListener('backButton', () => {
      if (adEl.classList.contains('on')) return;
      if (shopEl.classList.contains('on')) closeShop();
      else if (G.mode === 'play') pause();
      else if (G.mode === 'pause') resume();
      else if (G.mode === 'over') goMenu();
      else if (G.mode === 'menu') AppP.exitApp();
    });
  } catch (e) {}
}
/*DEBUG*/

let last = 0;
const frame = ts => {
  if (!last) last = ts;
  const raw = Math.min(0.05, (ts - last) / 1000); last = ts;
  try { update(raw); render(); } catch (e) {
    if (!frame.failed) { frame.failed = true; try { console.error('[kp] kare hatası', e && e.stack ? e.stack : e); } catch (x) {} }
  }
  requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
})();
</script>
