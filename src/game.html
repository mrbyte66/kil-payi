const drawBoost = (c, cx, cy, R, RW) => {
  if (G.vort <= 0 && G.lockLeft <= 0) return;
  const col = G.vort > 0 ? P.lilac : P.rose;
  c.globalAlpha = 0.85; chevron(c, cx, cy, G.ang - G.dir * 0.16, R, RW * 0.3, col); c.globalAlpha = 0.5; chevron(c, cx, cy, G.ang - G.dir * 0.32, R, RW * 0.3, col); c.globalAlpha = 1;
};
const drawFxs = (c) => {
  for (const f of G.fxs) {
    if (f.type === 'blast') {
      const k = f.t, fr = Math.min(1, k / 0.3), fa = Math.max(0, 1 - k / 0.6), rad = 24 + 84 * fr * (view.r / 130);
      const fg = c.createRadialGradient(f.x, f.y, 2, f.x, f.y, rad);
      fg.addColorStop(0, 'rgba(255,246,210,' + (0.95 * fa).toFixed(3) + ')'); fg.addColorStop(0.4, 'rgba(255,170,60,' + (0.8 * fa).toFixed(3) + ')'); fg.addColorStop(1, 'rgba(255,70,40,0)');
      c.fillStyle = fg; c.beginPath(); c.arc(f.x, f.y, rad, 0, TAU); c.fill();
      c.lineCap = 'round';
      for (let i = 0; i < 12; i++) {
        const ra = i / 12 * TAU + 0.25, r0 = 10 + k * 150, r1 = 34 * (1 - Math.min(1, k / 0.5));
        c.globalAlpha = Math.max(0, 1 - k / 0.5); c.strokeStyle = '#FFD98A'; c.lineWidth = 3.4;
        c.beginPath(); c.moveTo(f.x + Math.cos(ra) * r0, f.y + Math.sin(ra) * r0); c.lineTo(f.x + Math.cos(ra) * (r0 + r1 * 0.9), f.y + Math.sin(ra) * (r0 + r1 * 0.9)); c.stroke();
      }

      c.globalAlpha = sa * 0.9; c.strokeStyle = '#FFE9B8'; c.lineWidth = 9 * (1 - k / 1.2) + 1; c.beginPath(); c.arc(f.x, f.y, Math.max(0, k * 360), 0, TAU); c.stroke();
      c.globalAlpha = sa * 0.55; c.strokeStyle = '#FF8A4F'; c.lineWidth = 4; c.beginPath(); c.arc(f.x, f.y, Math.max(0, (k - 0.12) * 320), 0, TAU); c.stroke();
      c.globalAlpha = 1;
    } else if (f.type === 'reveal') {
      const k = f.t / f.max, R = view.r * HX.b, RW = Math.max(14, R * 0.2);
      c.globalAlpha = (1 - k) * 0.9; c.lineWidth = RW; c.strokeStyle = P.rose; c.lineCap = 'butt';

};

/* Süre ortada (V0.9.0, "Sıvı seviyesi", kullanıcı seçimi): halkanın içi bir kap; süre azaldıkça sıvı alçalır, ortada kalan süre yazar.
   2,5 sn altında sarıya, 1 sn altında kırmızıya döner (kısa geçişle). Son saniyede dalga, şişme ya da titreşim YOKTUR: kullanıcı "hata yapmaya meyilli olduğu anda ekstra bir şeyle kafasını bulandırma" dedi.
   part 0: gövde (halkanın iç yüzü, ibrenin altında), part 1: yazı (hep dik, en üstte). */
const mixCol = (a, b, k) => { const x = parseCol(a), y = parseCol(b); return toCss([x[0] + (y[0] - x[0]) * k, x[1] + (y[1] - x[1]) * k, x[2] + (y[2] - x[2]) * k, 1]); };
const drawTimeVessel = (c, cx, cy, R, RW, R2, RW2, two, mult, part) => {
  const rin = two ? R2 - RW2 / 2 : R - RW / 2, rv = Math.max(12, rin - Math.max(4, R * 0.05));
  const tl = Math.max(0, G.time), lv = clamp(G.tvis / CFG.maxTime, 0, 1), light = onColor(P.bg) === '#29233F';
  const kw = clamp((2.5 - tl) / 0.12, 0, 1), kc = clamp((CFG.nearAt - tl) / 0.12, 0, 1);   /* sarıya ve kırmızıya hızlı geçiş: uzun karışım çamurlu bir ara renk veriyordu */
  const amp = RM || tl < CFG.nearAt ? 0 : rv * 0.035, top = cy + rv - (2 * rv + 3 * amp) * lv;
  if (part === 0) {
    const liq = mixCol(mixCol(mixCol(P.lilac, P.surface, 0.45), '#F4C24A', kw), P.rose, kc);
    const rim = mixCol(mult >= 2 ? tierCol(mult) : mixCol(P.lilac, P.surface, 0.65), P.rose, kc);
    c.save();
    c.beginPath(); c.arc(cx, cy, rv, 0, TAU); c.fillStyle = P.surface; c.fill(); c.clip();
    const k1 = 4.4 / rv, k2 = 8 / rv;
    c.beginPath(); c.moveTo(cx - rv - 2, cy + rv + 2);
    for (let x = cx - rv - 2; x <= cx + rv + 2; x += 4) { const u = x - cx; c.lineTo(x, top + Math.sin(u * k1 + G.clock * 3) * amp + Math.sin(u * k2 - G.clock * 2.1) * amp * 0.5); }
    c.lineTo(cx + rv + 2, cy + rv + 2); c.closePath(); c.fillStyle = liq; c.fill();
    c.restore();
    c.beginPath(); c.arc(cx, cy, rv, 0, TAU); c.lineWidth = 3; c.strokeStyle = rim; c.stroke();
    return;
  }
  if (G.mode === 'count') return;
  const num = mixCol(mixCol(P.ink, light ? '#B8851C' : '#F4C24A', kw), P.rose, kc);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const txt = f1(tl), sz = Math.round(rv * 0.8);
  c.font = '600 ' + sz + 'px ' + FD;
  const w = c.measureText(txt).width;
  if (w > rv * 1.7) c.font = '600 ' + Math.max(10, Math.floor(sz * rv * 1.7 / w)) + 'px ' + FD;
  c.fillStyle = num; c.fillText(txt, cx, cy - rv * 0.06);
  const hot = tl < 1.2 && G.mode === 'play', lab = hot ? t('zone') : SN, ly = cy + rv * 0.52;
  let fs = Math.max(11, Math.round(rv * 0.17));
  c.font = '800 ' + fs + 'px ' + FB;
  const lw = c.measureText(lab).width;
  if (lw > rv * 1.7) { fs = Math.max(9, Math.floor(fs * rv * 1.7 / lw)); c.font = '800 ' + fs + 'px ' + FB; }
  c.fillStyle = hot ? P.rose : (ly > top ? P.ink : P['ink-2']); c.fillText(lab, cx, ly);
};

const render = () => {
  const c = ctx, cx = view.cx, cy = view.cy, R = view.r * HX.b, RW = Math.max(14, R * 0.2);
  const two = G.mode !== 'menu' && G.kind === 'iki';
  const R2 = R * 0.6, RW2 = RW * 0.8;
  c.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  c.clearRect(0, 0, view.w, view.h);
  drawEnv(c);
  if (G.mode !== 'over') drawConf(c);
  c.save();
  if (G.shake > 0) { const m = Math.min(9, G.shake * 20); c.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }

  /* Cehennem: bütün çember (çentikler, hedefler, ibre) birlikte döner; etiket ve parçacıklar dönmeyen katmanda kalır */
  const bu = G.mode === 'dead' || G.mode === 'over' ? G.burn : null;
  const clipR = bu && bu.t >= BURN.flame ? 0.01 : (G.reform < 1 ? R * 1.6 * easeOut(G.reform) + 0.01 : -1);
  if (clipR >= 0) { c.save(); c.beginPath(); c.arc(cx, cy, clipR, 0, TAU); c.clip(); }
  const hx = HX.s > 0.003 || HX.r !== 0;
  if (hx) { c.save(); c.translate(cx, cy); c.rotate(HX.r); c.translate(-cx, -cy); drawRot = HX.r; }
  const r0 = R + RW / 2 + 10;
  const iv = G.mode === 'menu' ? 0 : G.Ivis;
  c.lineCap = 'round'; c.strokeStyle = mixHex(P.tick, P.rose, 0.8 * iv);
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * TAU - HALF + HX.tr, long = i % 5 === 0, r1 = r0 + (long ? 13 + 5 * iv : 7 + 3 * iv), ca = Math.cos(a), sa = Math.sin(a);
    c.globalAlpha = long ? 0.95 : 0.55 + 0.3 * iv; c.lineWidth = (long ? 2.6 : 1.6) + 0.6 * iv;
    c.beginPath(); c.moveTo(cx + ca * r0, cy + sa * r0); c.lineTo(cx + ca * r1, cy + sa * r1); c.stroke();
  }
  c.globalAlpha = 1;

  c.lineCap = 'butt'; c.lineWidth = RW; c.strokeStyle = P.track;
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke();
  if (two) { c.lineWidth = RW2; c.beginPath(); c.arc(cx, cy, R2, 0, TAU); c.stroke(); }
  const mult = (G.mode === 'play' || G.mode === 'dead' || G.mode === 'count' || G.mode === 'intro') && G.comboOn ? comboMult(G.combo) : 1;
  if (mult >= 2) {
    c.globalAlpha = Math.min(0.4, 0.07 + 0.03 * mult + 0.12 * G.scorePulse); c.fillStyle = tierCol(mult);
    c.beginPath(); c.arc(cx, cy, two ? R2 - RW2 / 2 - 4 : R - RW / 2 - 4, 0, TAU); c.fill();
    c.globalAlpha = 1;
  }
  if (G.mode !== 'menu' && !G.practice) {
    /* sıvı çemberin dönüşünü izlemez (V0.9.6): döndürülmüş bağlamda ters yöne döndürülüp çizilir, yüzeyi hep yatay kalır */
    if (hx) { c.save(); c.translate(cx, cy); c.rotate(-HX.r); c.translate(-cx, -cy); }
    drawTimeVessel(c, cx, cy, R, RW, R2, RW2, two, mult, 0);
    if (hx) c.restore();
  }
  drawTrackFx(c, cx, cy, R, RW, R2, RW2, two);

  /* son saniye (V0.9.0): sabit ince halka; nabız ve dalga yok, kullanıcı o anda ekstra hareketle kafa karıştırılmasın istedi */
  if (G.mode === 'play' && G.time < CFG.nearAt) {
    c.globalAlpha = 0.55; c.strokeStyle = P.rose; c.lineWidth = 3;
    c.beginPath(); c.arc(cx, cy, R + RW / 2 + 4.5, 0, TAU); c.stroke();
    c.globalAlpha = 1;
  }

  const gk = easeOut(clamp(G.gateT / 0.25, 0, 1));
  const pins = G.mode === 'menu' ? MENU_PINS : G.pins;
  if (gk > 0) {
    let gi = 0;
    for (const p of pins) {
      const num = G.kind === 'cift' && p.kind === 'gate' && G.mode !== 'menu';
      drawPin(c, cx, cy, p.ring ? R2 : R, p.ring ? RW2 : RW, p, gk, gi, num);
      if (p.kind === 'gate') gi++;
    }
  }
  const dm = G.mode === 'intro' && G.intro ? demoFrame() : null, dg = { R, RW, R2, RW2, two };
  if (dm) drawSpot(c, cx, cy, dm, dg);

  const trail = mult >= 2 ? tierCol(mult) : P.lilac;
  const psc = ptrScale();
  if (psc > 0.03) { c.globalAlpha = psc; drawPointer(c, cx, cy, R, RW, G.ang, G.dir, P.ink, trail, psc); c.globalAlpha = 1; }
  if (two && !dm) { if (G.lockLeft > 0) c.globalAlpha = 0.4; drawPointer(c, cx, cy, R2, RW2, G.ang2, G.dir2, P.btn, trail); c.globalAlpha = 1; }
  if (G.mode === 'play') drawBoost(c, cx, cy, R, RW);
  if (G.holding && G.mode === 'play') {
    const q = ptXY(cx, cy, G.ang, R), pu = 0.5 + 0.5 * Math.sin(G.clock * 14);
    c.globalAlpha = 0.5 + 0.3 * pu; c.strokeStyle = P.btn; c.lineWidth = 3; c.beginPath(); c.arc(q[0], q[1], RW * 0.5 + 6 + 2 * pu, 0, TAU); c.stroke(); c.globalAlpha = 1;
  }
  if (dm) drawDemoFront(c, cx, cy, dm, dg);
  if (hx) { c.restore(); drawRot = 0; }
  if (clipR >= 0) c.restore();
  if (bu) drawBurn(c, cx, cy, bu, R, RW);
  drawFxs(c);

  for (const r of G.rips) {
    const p = r.t / r.max;
    c.globalAlpha = (1 - p) * 0.85; c.strokeStyle = r.c; c.lineWidth = 3;
    c.beginPath(); c.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * easeOut(p), 0, TAU); c.stroke();
  }
  for (const p of G.parts) {
    const q = p.life / p.max;
    c.globalAlpha = 1 - q; c.fillStyle = p.c;
    c.beginPath(); c.arc(p.x, p.y, p.r * (1 - 0.45 * q), 0, TAU); c.fill();
  }
  c.globalAlpha = 1;

  c.textAlign = 'center'; c.textBaseline = 'middle';
  const big = Math.round(R * (two ? 0.34 : 0.6));
  const fitFont = (txt, size, maxW) => {
    c.font = '600 ' + size + 'px ' + FD;
    const w = c.measureText(txt).width;
    if (w > maxW) c.font = '600 ' + Math.max(10, Math.floor(size * maxW / w)) + 'px ' + FD;
  };
  if (G.mode === 'menu') {
    const txt = String(bestNow());
    c.fillStyle = P.ink; fitFont(txt, big, R * 1.5);
    c.fillText(txt, cx, cy - R * 0.04);
    c.fillStyle = P['ink-2']; c.font = '800 ' + Math.max(12, Math.round(R * 0.13)) + 'px ' + FB;
    c.fillText(t('best'), cx, cy + R * 0.36);
  } else {
    if (G.practice) drawPracCenter(c, cx, cy, R, two);
    else if (!bu || bu.t < 0.3) { if (bu) c.globalAlpha = clamp(1 - bu.t / 0.3, 0, 1); drawTimeVessel(c, cx, cy, R, RW, R2, RW2, two, mult, 1); }   /* yanınca kalan süre yazısı da solar */
    c.globalAlpha = 1;
    if (two && G.lockLeft > 0 && G.mode === 'play') drawLockTimer(c, cx, cy, R);
    if (G.mode === 'count' && G.count > 0) drawCount(c, cx, cy, R);
    else if (G.banner) drawBanner(c);
  }

  drawCard(c);
  drawDemoOver(c, dm, cx, cy, R);
  drawRecPill(c);
  /* puan balonları halkanın iç bölgesinde, ibre halkasının üstüne binmez: en yeni skorun üstünde, eskisi altında */
  G.pops.forEach((p, i) => {
    const k = p.t / p.max, slot = G.pops.length - 1 - i;
    const al = k < 0.12 ? k / 0.12 : (k > 0.65 ? (1 - k) / 0.35 : 1);
    const sc = 0.85 + 0.15 * Math.min(1, k / 0.15);
    let bg = P.surface, fg = P.ink;
    if (p.kind === 'near') { bg = P.rose; fg = '#FFFFFF'; }
    else if (p.kind === 'perfect') { bg = P['peach-soft']; fg = P.ink; }
    else if (p.kind === 'rev') { bg = P['lilac-soft']; fg = P.ink; }
    else if (p.kind === 'miss') { bg = P.track; fg = P['ink-2']; }
    else if (p.kind === 'hype') { bg = P.btn; fg = P['on-btn'] || '#FFFFFF'; }
    else if (p.kind === 'roast') { bg = P['rose-soft']; fg = P.ink; }
    const psz = p.kind === 'near' ? 17 : (p.kind === 'hype' ? 18 : 15);
    c.font = '800 ' + psz + 'px ' + FB;
    const pw = c.measureText(p.txt).width + psz * 1.7;
    c.save(); c.globalAlpha = al; const rise = 6 * easeOut(Math.min(1, k * 1.4)), py = two ? (slot ? Math.min(view.h - 40, cy + R + RW / 2 + 19) : Math.max((view.hudB || 0) + 20, cy - R - RW / 2 - 19 - rise)) : (slot ? cy + R * 0.58 : cy - R * 0.5 - rise);
    c.translate(clamp(cx, pw / 2 + 8, view.w - pw / 2 - 8), py); c.scale(sc, sc);
    pill(c, p.txt, 0, 0, bg, fg, psz, true);
    c.restore();
  });
  c.restore();

  for (const f of G.fxs) {
    if (f.type === 'blast' && f.t < 0.26) { c.globalAlpha = 0.6 * (1 - f.t / 0.26); c.fillStyle = '#FFF1CC'; c.fillRect(0, 0, view.w, view.h); c.globalAlpha = 1; }
  }
  if (G.flash > 0) {
    c.globalAlpha = Math.min(0.22, G.flash * 0.7);
    c.fillStyle = G.flashKind === 'rose' ? P.rose : P.peach;
    c.fillRect(0, 0, view.w, view.h);
    c.globalAlpha = 1;
  }
  drawConfTop();
};

});

/* ---------- kapalı test bildirimleri (V0.9.11) ----------
   Kullanıcı: "kapalı test için bildirim ekle, kapatılamasın (Ayarlar'da anahtarı yok); yüklenince 1 dk sonra bilgilendirme, sonra 17 gün boyunca günde iki kez (09:00 ve 16:30);
   ilkine girilirse ikincisi gitmesin; ekrana gelsin (olmazsa bildirim çubuğu); tıklayınca Gün n/17 görünsün; kısa, teşekkür ve oynamaya teşvik."
   Eklenti: @capacitor/local-notifications. Bildirimler işletim sistemi alarmıyla planlanır (uygulama kapalıyken de gelir, telefon açılınca eklenti yeniden planlar). Kanal önem düzeyi YÜKSEK: ekranın üstünde belirir (heads-up), olmazsa çubukta.
   Tam zamanlı alarm KULLANILMAZ (isExactNotification: false): eklentinin varsayılanı "Alarmlar ve hatırlatıcılar" ayar ekranını açardı; yarım dakikalık sapma kabul. Android 13+ bildirim izni ilk açılışta menüde istenir.
   Her açılışta/dönüşte testSync: o günün ikinci bildirimi iptal edilir (bugün girildi), geçmiş olanlar atlanır, kalanlar aynı kimliklerle yeniden planlanır (aynı kimlik eskisinin yerine geçer).
   Kimlikler: 1 = bilgilendirme, 100+gün = sabah, 200+gün. Test bitince (17. günden sonra) plan boştur. Kaldırmak için: bu blok, #testInfo, save.test ve STR'deki nt/test satırları. */
const TEST = { days: 17, slots: [[9, 0], [16, 30]], infoMs: 60000, chan: 'test', idInfo: 1, idA: 100, idB: 200, nA: 6, nB: 6 };
const dayNo = d => Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
const keyNo = k => { const p = String(k).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); };
const testDay = now => dayNo(now) - keyNo(save.test.d0) + 1;   /* takvim günü (yerel tarih; yaz saati kaymaz): 1..17, 17'den büyükse test bitti */
const testPlan = (now, opened) => {
  const d1 = testDay(now), items = [];
  if (save.test.infoAt > now.getTime()) items.push({ id: TEST.idInfo, at: new Date(save.test.infoAt), kind: 'info', day: 1, slot: 0 });
  for (let d = Math.max(1, d1); d <= TEST.days; d++) {
    TEST.slots.forEach((sl, k) => {
      const at = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (d - d1), sl[0], sl[1], 0);
      if (at.getTime() <= now.getTime() || (d === d1 && k === 1 && opened)) return;   /* geçmiş ya da bugün zaten girilmiş (ikinci bildirim gitmez) */
      items.push({ id: (k ? TEST.idB : TEST.idA) + d, at, kind: 'day', day: d, slot: k });
    });
  }
  return { day: d1, over: d1 > TEST.days, items };
};
const testText = it => it.kind === 'info' ? { title: t('ntInfoT'), body: t('ntInfoB', { m: TEST.days }) }
  : { title: t('ntDayT', { d: it.day, m: TEST.days }), body: t((it.slot ? 'ntB' : 'ntA') + ((it.day + (it.slot ? 2 : -1)) % (it.slot ? TEST.nB : TEST.nA))) };
const testNotif = it => {
  const x = testText(it);
  return { id: it.id, title: x.title, body: x.body, channelId: TEST.chan, schedule: { at: it.at, allowWhileIdle: true }, isExactNotification: false, autoCancel: true, extra: { kind: it.kind, day: it.day } };
};
let testBusy = false;
const testSync = async () => {
  const LN = plugin('LocalNotifications');
  if (!LN || testBusy) return;
  testBusy = true;
  try {
    persist();
    let perm = await LN.checkPermissions();
    if (perm.display !== 'granted' && G.mode === 'menu') perm = await LN.requestPermissions();   /* Android 13+: sistem izin penceresi, yalnızca menüdeyken */
    if (perm.display === 'granted') {
      /* bilgilendirme bildirimi, izin verildiği andan 1 dk sonradır (izin penceresine geç cevap verilse de kaçmaz); bir kez belirlenir */
      if (!(save.test.infoAt > 0)) { save.test.infoAt = Date.now() + TEST.infoMs; persist(); }
      const plan = testPlan(new Date(), true);
      await LN.createChannel({ id: TEST.chan, name: t('ntChan'), description: t('ntChanD'), importance: 4, visibility: 1, vibration: true });
      const keep = {}, stale = [TEST.idInfo];
      plan.items.forEach(x => { keep[x.id] = 1; });
      for (let d = 1; d <= TEST.days; d++) stale.push(TEST.idA + d, TEST.idB + d);
      const drop = stale.filter(id => !keep[id]).map(id => ({ id }));
      if (drop.length) await LN.cancel({ notifications: drop });
      if (plan.items.length) await LN.schedule({ notifications: plan.items.map(testNotif) });
    }
  } catch (e) { /* izin ya da eklenti hatası: bir sonraki açılışta yeniden denenir */ }
  testBusy = false;
};
const closeTestInfo = () => { hide($('testInfo')); Snd.ui(); };
/* Bildirime dokununca: menüdeysek kart (Gün n/17, 17 noktalı ilerleme, teşekkür), oyundaysak oyunu bölmeden kısa bildirim satırı */
const showTestInfo = () => {
  const day = testDay(new Date()), over = day > TEST.days, d = clamp(day, 1, TEST.days);
  if (G.mode !== 'menu' || overlayOpen()) { toast(t('testToast', { d, m: TEST.days })); return; }
  $('tiEye').textContent = t('testT'); $('tiDay').textContent = t('testDay', { d, m: TEST.days });
  $('tiDots').innerHTML = Array.from({ length: TEST.days }, (_, i) => '<i class="' + (i + 1 < d || over ? 'on' : (i + 1 === d ? 'now' : '')) + '"></i>').join('');
  $('tiMsg').textContent = over ? t('testOver') : (d === 1 ? t('ntInfoB', { m: TEST.days }) : t('testMsg'));
  $('tiPlay').textContent = t('testPlay');
  show($('testInfo')); Snd.ui();
};
$('tiClose').addEventListener('click', () => { Snd.unlock(); closeTestInfo(); });
$('tiPlay').addEventListener('click', () => { Snd.unlock(); hide($('testInfo')); if (G.mode === 'menu') { if (save.run) resumeSaved(); else start(); } });

if (document.fonts && document.fonts.load) {

  const TR_SAMPLE = 'ğĞşŞİ';
  Promise.all([document.fonts.load('600 40px Fredoka'), document.fonts.load('800 14px Nunito'), document.fonts.load('500 20px Fredoka', TR_SAMPLE), document.fonts.load('600 40px Fredoka', TR_SAMPLE), document.fonts.load('700 40px Fredoka', TR_SAMPLE), document.fonts.load('800 14px Nunito', TR_SAMPLE)]).then(() => { readPalette(); relayout(false); }).catch(() => {});
}

{

const AppP = plugin('App'), StatusP = plugin('StatusBar');
const bgIsDark = () => {
  const v = parseInt((P.bg || '#ffffff').slice(1), 16);
  return (0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255)) < 128;
};
onPalette = () => {
  if (!StatusP) return;
  try { StatusP.setStyle({ style: bgIsDark() ? 'DARK' : 'LIGHT' }); } catch (e) {}
};
onPalette();
if (AppP) {
  try {

      if (settingsEl.classList.contains('on')) { closeSettings(); return; }
      if (G.practice) endPractice(true);
      else if (bookEl.classList.contains('on')) closeBook();
      else if (shopEl.classList.contains('on')) storeBack();
      else if (G.mode === 'intro') closeIntro(true);
      else if (G.mode === 'play' || G.mode === 'count') pause();
      else if (G.mode === 'pause') resume();
      else if (G.mode === 'over') goMenu();
      else if (G.mode === 'menu') AppP.exitApp();
    });
  } catch (e) {}
}

let last = 0;
const frame = ts => {
  if (!last) last = ts;
  const raw = Math.min(0.05, (ts - last) / 1000); last = ts;
  if ((musicT += raw) > 0.3) { musicT = 0; try { Music.sync(); } catch (e) {} }

};
