<title>Kıl payı</title>
<!--FONTS-START-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<!--FONTS-END-->
<style>
/* Tasarım planı
   Renk: lila (ana) + şeftali (hedef bölge); uyarı için gül. Nötrler lilaya çalar.
   Yazı: Fredoka (başlık, sayılar), Nunito (metin). Yuvarlak formlar, hap butonlar.
   Düzen: kronometre kadranı ortada, üstte süre kapsülü, altta alet çubuğu, üstte duran katmanlar buzlu cam. */
:root{
  --bg:#F5F2FC;--bg-2:#E9E3F7;--surface:#FFFFFF;--track:#E3DCF5;--tick:#B4AAD5;--line:#D8D0EC;
  --ink:#29233F;--ink-2:#615A7C;--ink-3:#8F87AB;
  --lilac:#8E7CF2;--lilac-soft:#DCD5FB;--btn:#6D58E0;--on-btn:#FFFFFF;
  --peach:#FFA473;--peach-deep:#FF7D43;--peach-soft:#FFD9C5;
  --rose:#FF5C84;--rose-soft:#FFD2DC;--life:#27B27A;--gold:#F4B63F;--gold-ink:#9A6B00;
  --blob-1:#E2DBFB;--blob-2:#EBDDF9;
  --glass:rgba(255,255,255,.64);--glass-edge:rgba(255,255,255,.85);--scrim:rgba(41,35,63,.18);
  --shadow-s:0 1px 2px rgba(41,35,63,.06),0 6px 16px rgba(41,35,63,.08);
  --shadow-m:0 2px 6px rgba(41,35,63,.07),0 20px 48px rgba(41,35,63,.16);
  --r-s:16px;--r-m:24px;--r-l:32px;--r-pill:999px;
  --fs-12:.75rem;--fs-14:.875rem;--fs-16:1rem;--fs-20:1.25rem;--fs-28:1.75rem;--fs-72:4.5rem;
  --dur-fast:180ms;--dur-base:300ms;--dur-slow:550ms;--ease:cubic-bezier(.2,.8,.2,1);
  --font-display:"Fredoka","SF Pro Rounded",ui-rounded,"Nunito",system-ui,sans-serif;
  --font-body:"Nunito","SF Pro Rounded",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16132E;--bg-2:#0F0D22;--surface:#26204D;--track:#312B5C;--tick:#5E5796;--line:#3D3770;
  --ink:#F4F1FF;--ink-2:#BBB4DC;--ink-3:#8780AE;
  --lilac:#AA9CFF;--lilac-soft:#3B327A;--btn:#BBAEFF;--on-btn:#1B1644;
  --peach:#FFB088;--peach-deep:#FF9560;--peach-soft:#6B4148;
  --rose:#FF7C9E;--rose-soft:#5C2D49;--life:#3BD99B;--gold:#F4B63F;--gold-ink:#F7CF6B;
  --blob-1:#2B2463;--blob-2:#382A6C;
  --glass:rgba(38,32,77,.62);--glass-edge:rgba(255,255,255,.16);--scrim:rgba(7,5,22,.5);
  --shadow-s:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.28);
  --shadow-m:0 2px 6px rgba(0,0,0,.3),0 20px 48px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16132E;--bg-2:#0F0D22;--surface:#26204D;--track:#312B5C;--tick:#5E5796;--line:#3D3770;
  --ink:#F4F1FF;--ink-2:#BBB4DC;--ink-3:#8780AE;
  --lilac:#AA9CFF;--lilac-soft:#3B327A;--btn:#BBAEFF;--on-btn:#1B1644;
  --peach:#FFB088;--peach-deep:#FF9560;--peach-soft:#6B4148;
  --rose:#FF7C9E;--rose-soft:#5C2D49;--life:#3BD99B;--gold:#F4B63F;--gold-ink:#F7CF6B;
  --blob-1:#2B2463;--blob-2:#382A6C;
  --glass:rgba(38,32,77,.62);--glass-edge:rgba(255,255,255,.16);--scrim:rgba(7,5,22,.5);
  --shadow-s:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.28);
  --shadow-m:0 2px 6px rgba(0,0,0,.3),0 20px 48px rgba(0,0,0,.45);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;display:flex;justify-content:center;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-16);line-height:1.35;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;background:var(--bg)}
@media (min-width:600px){body{align-items:center;background:var(--bg-2)}#app{height:min(100%,860px);border-radius:var(--r-l);box-shadow:var(--shadow-m)}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv2{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
#cv2.on{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:20px;height:20px;flex:none;display:block}
svg.ic .f{fill:currentColor}
svg.ic .s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.amb{position:absolute;inset:0;overflow:hidden;pointer-events:none;transition:opacity var(--dur-slow) var(--ease)}
#app.playing .amb{opacity:.4}
.amb i{position:absolute;display:block;border-radius:50%;will-change:transform}
.amb i:nth-child(1){width:70%;aspect-ratio:1;left:-24%;top:-10%;background:var(--blob-1);animation:drift-a 24s ease-in-out infinite alternate}
.amb i:nth-child(2){width:54%;aspect-ratio:1;right:-18%;top:38%;background:var(--blob-2);animation:drift-b 28s ease-in-out infinite alternate}
.hfx{position:absolute;inset:0;pointer-events:none;opacity:0;visibility:hidden;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) var(--vr0,175px),rgba(0,0,0,.4) var(--vr1,675px)),linear-gradient(to top,rgba(255,80,30,.5),rgba(255,80,30,0) 65%);transition:opacity 1.3s cubic-bezier(.2,.7,.3,1),visibility 0s linear 1.3s}
#app.hellfx .hfx{opacity:1;visibility:visible;transition:opacity 1.3s cubic-bezier(.2,.7,.3,1),visibility 0s}
html.calm .hfx{transition:none}
.amb i:nth-child(3){width:62%;aspect-ratio:1;left:6%;bottom:-24%;background:var(--blob-1);animation:drift-c 32s ease-in-out infinite alternate}
@keyframes drift-a{to{transform:translate3d(14%,10%,0) scale(1.1)}}
@keyframes drift-b{to{transform:translate3d(-16%,-8%,0) scale(.92)}}
@keyframes drift-c{to{transform:translate3d(12%,-12%,0) scale(1.12)}}

.hud{position:absolute;left:0;right:0;top:0;padding:18px 20px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity var(--dur-base) var(--ease),transform var(--dur-slow) var(--ease)}
.hud.on{opacity:1;transform:none}
/* V0.9.0: süre çemberin ortasına (sıvı seviyesi) taşındı; üstte puan, altında rekora yaklaşma çubuğu var. */
.score-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.score{display:flex;align-items:baseline;gap:6px;min-width:0;transform-origin:left bottom}
.score b{font-family:var(--font-display);font-weight:700;font-size:2.5rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.score span{font-weight:800;font-size:var(--fs-14);color:var(--ink-2)}
.sgrp{display:flex;align-items:flex-end;gap:8px;min-width:0}
/* Hedef (V0.9.10): "Rekor 180" çipi kalktı; puanın yanında "128 / (180)" gösterilir, 180 aşılacak hedef gibi çerçevelidir. Rekor geçilince çerçeve altın olur ve tik alır. */
.goalw{display:inline-flex;align-items:center;gap:7px;margin-bottom:7px;min-width:0}
.goalw i{font:600 1.35rem/1 var(--font-display);font-style:normal;color:var(--ink-3)}
.goal{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 10px;border-radius:var(--r-pill);border:2px solid var(--lilac);color:var(--ink-2);font:600 var(--fs-14)/1 var(--font-display);font-style:normal;font-variant-numeric:tabular-nums;transition:background var(--dur-base) var(--ease),border-color var(--dur-base) var(--ease),color var(--dur-base) var(--ease)}
.goal svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.goalw.gold i{color:var(--gold-ink)}
.goalw.gold .goal{border-color:var(--gold);background:var(--gold);color:#5A3C00}
/* Duraklat (V0.9.10): sağ üst köşe; köşelere oyun dokunuşu en az gelir. Düğme olduğu için oyun dokunuşu sayılmaz (#app pointerdown button'ı atlar). */
.pausebtn{pointer-events:auto;appearance:none;border:0;cursor:pointer;position:relative;flex:none;align-self:center;width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow-s);transition:transform var(--dur-fast) var(--ease)}
.pausebtn::before{content:"";position:absolute;inset:-5px}
.pausebtn:active{transform:scale(.92)}
.pausebtn .ic{width:20px;height:20px}
/* Kapalı test kartı (V0.9.11): bildirime dokununca "Gün n/17" ve 17 noktalı ilerleme */
.tdays{margin:0;font-family:var(--font-display);font-weight:700;font-size:2.6rem;line-height:1;letter-spacing:-.02em;color:var(--ink)}
.tdots{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:176px}
.tdots i{display:block;width:12px;height:12px;border-radius:50%;background:var(--track)}
.tdots i.on{background:var(--lilac)}
.tdots i.now{background:var(--peach);box-shadow:0 0 0 3px var(--peach-soft)}
.tmsg{margin:0;max-width:264px;text-align:center;font-weight:700;font-size:var(--fs-14);line-height:1.45;color:var(--ink-2)}
.gauge-row{display:flex;align-items:center;gap:8px;min-height:26px}
.gauge{position:relative;flex:1;height:10px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:var(--r-pill);background:var(--lilac);transition:width .3s var(--ease)}
.fill.gold{background:var(--gold)}
.chip.combo{min-height:26px;padding:0 10px;flex:none}
.hud-row2{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:24px}
.lvl{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.lprog{display:block;width:100%;height:3px;border-radius:2px;background:var(--track);overflow:hidden}
.lprog b{display:block;height:100%;width:0;border-radius:2px;background:var(--lilac)}
.lprog.x b{background:#D9503A}
.sect{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:var(--r-pill);font-weight:800;font-size:var(--fs-12);white-space:nowrap;opacity:0;transform:translateY(-4px);transition:opacity var(--dur-base) var(--ease),transform var(--dur-base) var(--ease)}
.sect.on{opacity:1;transform:none}
.sect.x{background:#D9503A;color:#fff}
.gauge.hasLife{box-shadow:0 0 0 2.5px var(--life)}
.life{display:none;align-items:center;gap:3px;height:24px;padding:0 9px 0 6px;border-radius:12px;background:var(--life);color:#fff;font:800 12px/1 var(--font-body);flex:none}
.life svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round}
.life.on{display:inline-flex}
.life.pop{animation:lifepop .6s var(--ease)}
@keyframes lifepop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.fx{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:1;min-width:0}

.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface);color:var(--ink-2);font-weight:800;font-size:var(--fs-14);box-shadow:var(--shadow-s)}
.chip b{font-family:var(--font-display);font-weight:600;font-size:var(--fs-16);color:var(--ink);font-variant-numeric:tabular-nums}
.chip{white-space:nowrap}
.chip.sm{min-height:30px;padding:0 12px;font-size:var(--fs-12)}
.chip.sm b{font-size:var(--fs-14)}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:20px 20px 24px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity var(--dur-fast) var(--ease),visibility 0s linear var(--dur-fast)}
.scr.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity var(--dur-base) var(--ease),visibility 0s}
.scr.on .rise{animation:rise var(--dur-slow) var(--ease) backwards;animation-delay:calc(var(--i,0)*90ms + 80ms)}
@keyframes rise{from{opacity:.5;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

.menu-head{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;row-gap:8px;margin-bottom:14px}
.tb-right{display:flex;gap:8px;margin-left:auto}
.title{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(2.25rem,10vw,3rem);letter-spacing:-.01em;line-height:1.05;text-align:center}
.tagline{margin:0;max-width:300px;color:var(--ink-2);font-weight:700;font-size:var(--fs-16);text-align:center;text-wrap:balance}
.grow{flex:1}
.menu-foot{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.stat-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}

.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:var(--r-pill);font-family:var(--font-display);font-weight:600;font-size:var(--fs-20);line-height:1;color:var(--ink);background:var(--surface);box-shadow:var(--shadow-s);transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),opacity var(--dur-fast)}
.btn:active{transform:translateY(0) scale(.97);box-shadow:var(--shadow-s)}
.btn:focus-visible,.icon-btn:focus-visible,.tool:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.btn.primary{background:var(--btn);color:var(--on-btn)}
.btn.big{width:min(100%,280px);min-height:64px;font-size:var(--fs-28)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--ink-2);min-height:44px;font-family:var(--font-body);font-weight:800;font-size:var(--fs-16)}
.btn[aria-disabled="true"]{opacity:.55}
@media (hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-m)}.btn.quiet:hover{box-shadow:none;transform:none;color:var(--ink)}}
.icon-btn{appearance:none;border:0;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow-s);transition:transform var(--dur-fast) var(--ease)}
.icon-btn:active{transform:scale(.94)}
@keyframes breathe{50%{transform:scale(1.04)}}
.breathe{animation:breathe 2.4s ease-in-out infinite}

.tools{position:absolute;left:0;right:0;top:0;bottom:auto;padding:0 16px;display:flex;justify-content:center;align-items:flex-end;gap:16px;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity var(--dur-base) var(--ease),transform var(--dur-slow) var(--ease)}
.tools.on{opacity:1;transform:none}
.tools.on.dim{opacity:.3}
.tools.dim .tool{pointer-events:none}
.tool{appearance:none;border:0;position:relative;width:60px;height:60px;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s);display:grid;place-items:center;cursor:pointer;pointer-events:auto;touch-action:none;transition:transform var(--dur-fast) var(--ease),opacity var(--dur-fast),width var(--dur-fast) var(--ease),height var(--dur-fast) var(--ease)}
.tools:not(.on) .tool{pointer-events:none}
.tool:active{transform:scale(.94)}
.tool.empty{opacity:.55}
.tool.adv{width:76px;height:76px;background:#F4B63F;color:#3F2A00;box-shadow:0 0 0 5px rgba(244,182,63,.3),var(--shadow-s);animation:advpulse .9s ease-in-out infinite}
.tool.adv .badge{background:#3F2A00;color:#F4B63F}
@keyframes advpulse{50%{box-shadow:0 0 0 12px rgba(244,182,63,.08),var(--shadow-s);transform:scale(1.05)}}
.tool.bump .badge{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.55)}}
@media (max-height:700px){.tool{width:54px;height:54px}.tool.adv{width:66px;height:66px}}
@media (max-width:340px){.tools{gap:8px}}
.advlbl{position:absolute;top:-36px;transform:translateX(-50%);padding:6px 13px;border-radius:999px;background:#F4B63F;color:#3F2A00;font:800 13px/1 var(--font-body);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.advlbl.on{opacity:1}
.tool svg{width:26px;height:26px;display:block}
.tool .s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool .badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--btn);color:var(--on-btn);font:800 12px/22px var(--font-body);text-align:center;font-variant-numeric:tabular-nums}
.tool.empty .badge{background:var(--track);color:var(--ink-2)}
.btn.big small{display:block;font:800 var(--fs-12)/1 var(--font-body);opacity:.85}
.btn.big.two{flex-direction:column;gap:4px;min-height:70px}
.btn.warn{color:var(--rose)}
.ver{font-weight:800;font-size:var(--fs-12);color:var(--ink-3);opacity:.85;margin-top:-4px}
.icon-btn{position:relative}
.icon-btn.dot::after{content:"";position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--surface)}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow-s);text-align:left}
.brow .bt{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--lilac-soft)}
.brow .bt img{display:block}
.brow .bx{min-width:0;display:flex;flex-direction:column;gap:2px}
.brow b{font-family:var(--font-display);font-weight:600;font-size:var(--fs-16)}
.brow small{color:var(--ink-2);font-weight:700;font-size:var(--fs-12);line-height:1.3}
.brow small i{display:block;font-style:normal;color:var(--rose)}
.brow .tg{align-self:flex-start;font-style:normal;font-weight:800;font-size:11px;line-height:1;padding:4px 9px;border-radius:999px;background:var(--peach);color:#3A1D00}
.brow .tg.g{background:var(--track);color:var(--ink-2)}
.brow .tg.nw{background:var(--btn);color:var(--on-btn)}
.brow .try{appearance:none;cursor:pointer;border:1.5px solid var(--lilac);background:transparent;color:var(--ink);font-family:var(--font-body);font-weight:800;font-size:var(--fs-12);padding:8px 14px;border-radius:999px;min-height:34px}
.brow .try:active{transform:scale(.95)}
.brow.lk .bt img,.brow.lk .bx b,.brow.lk .bx small{opacity:.62}
.brow.nx{outline:2px dashed var(--peach);outline-offset:-2px}
.brow.nw{outline:2px solid var(--btn);outline-offset:-2px}
@media (max-width:340px){.brow{grid-template-columns:38px minmax(0,1fr) auto;gap:8px;padding:8px 9px}.brow .bt{width:38px;height:38px}.brow .bt img{width:30px;height:30px}.brow .try{padding:7px 10px}}
.bcap{margin:0;width:100%;color:var(--ink-3);font-weight:700;font-size:var(--fs-12);text-align:left}
.bcnt{font-weight:800;font-size:var(--fs-12);color:var(--ink-2);white-space:nowrap}
.prac-bar{display:none;align-items:center;justify-content:space-between;gap:10px}
#app.prac .score-row,#app.prac .gauge-row,#app.prac .hud-row2{display:none}
#app.prac .prac-bar{display:flex}
.prac-bar .btn{pointer-events:auto;min-height:40px;padding:0 16px;font-size:var(--fs-14);background:var(--surface);box-shadow:var(--shadow-s);color:var(--ink)}
.pdots{display:flex;gap:8px}
.pdots i{display:block;width:14px;height:14px;border-radius:50%;background:var(--track)}
.pdots i.on{background:var(--peach)}
.pdt{margin:0;font-family:var(--font-display);font-weight:700;font-size:var(--fs-28);color:var(--ink)}
.swapsub{margin:0;max-width:300px;color:var(--ink-2);font-weight:700;font-size:var(--fs-14);line-height:1.5}

.scr.dim{background:var(--scrim);justify-content:center}
.card{width:min(100%,380px);padding:26px 20px 20px;border-radius:var(--r-l);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.scr.on .card{animation:card-in var(--dur-slow) var(--ease) backwards}
@keyframes card-in{from{opacity:0;transform:translateY(28px) scale(.95)}to{opacity:1;transform:none}}

.cont-actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}

/* kayan yıldız: ince bir iz, 6-7 saniyede bir kısa çizer */

#shop .shoot::after{content:"";position:absolute;right:-2px;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,255,255,.85)}
@keyframes aShoot{0%{opacity:0;transform:translate(0,0) rotate(27deg)}1.2%{opacity:1}6%{opacity:0;transform:translate(170px,86px) rotate(27deg)}100%{opacity:0;transform:translate(170px,86px) rotate(27deg)}}
/* geçişler (V0.9.3): mağazaya giriş ve çıkış, dükkâna girip çıkış, dükkânlar arası geçiş, ürün belirişi ve satın alma sıçraması */
#shop,#shop.on{transition:none}
@keyframes stFade{from{opacity:0}to{opacity:1}}
@keyframes stFadeOut{from{opacity:1}to{opacity:0}}
/* V0.9.4: sahne sol-üst köşeden değil ekranın ortasından yakınlaşır (translate telafisi; --vw ve --vh ekranın boyudur) ve daha belirgindir */
@keyframes stIn{from{transform:translate(calc(var(--vw,0px) * -.07),calc(var(--vh,0px) * -.07)) scale(calc(var(--k,1) * 1.14))}to{transform:scale(var(--k,1))}}
@keyframes stOut{from{transform:scale(var(--k,1))}to{transform:translate(calc(var(--vw,0px) * .035),calc(var(--vh,0px) * .035)) scale(calc(var(--k,1) * .93))}}
#shop.on{animation:stFade .38s ease-out backwards}
#shop.leaving{animation:stFadeOut .36s ease-in both}
#shop.on .stg{animation:stIn .85s cubic-bezier(.16,1,.3,1) backwards}
#shop.leaving .stg{animation:stOut .36s cubic-bezier(.45,0,.8,.5) both;pointer-events:none}
/* ısınma (V0.9.9): menü boştayken mağaza bir kez, gözle görünmez (opaklık 0,006) ve dokunulamaz biçimde baştan sona oynatılır; ilk gerçek girişte efektler, yazılar ve katmanlar hazır olur.
   Animasyonlar çalışır (#shop:not(.on) onları durdurur, burada geri açılır); #shop'un kendi opaklığına dokunan stFade/stFadeOut kullanılmaz (tam görünür parlardı). */
.scr.warm{opacity:.006;visibility:visible;pointer-events:none}
.scr.warm *{pointer-events:none!important}
#shop.warm{opacity:.006;visibility:visible;pointer-events:none}
#shop.warm *{pointer-events:none!important;animation-play-state:running!important}
#shop.warm .stg{animation:stIn .85s cubic-bezier(.16,1,.3,1) backwards}
#shop.warm.wout .stg{animation:stOut .36s cubic-bezier(.45,0,.8,.5) both}
/* mağaza ilk açılırken (opening sınıfı ~1,5 sn): başlık yukarıdan iner, cepheler sırayla yükselir, buton zıplayarak gelir, alt şerit aşağıdan çıkar */
@keyframes stDrop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
@keyframes stUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
@keyframes stFcIn{from{opacity:0;transform:translateY(54px) scale(.93)}to{opacity:1;transform:none}}
@keyframes stCtaIn{0%{opacity:0;transform:translateY(16px) scale(.78)}62%{opacity:1;transform:translateY(-2px) scale(1.07)}100%{opacity:1;transform:none}}
#shop.opening .hub .hd{animation:stDrop .55s cubic-bezier(.2,.8,.2,1) .1s backwards}
#shop.opening .hub .fc{animation:stFcIn .75s cubic-bezier(.2,.8,.2,1) calc(.14s + var(--o,0) * .1s) backwards}
#shop.opening .hub .cta{animation:stCtaIn .6s cubic-bezier(.2,.9,.3,1) .46s backwards}
#shop.opening .hub .dock{animation:stUp .6s cubic-bezier(.2,.8,.2,1) .28s backwards}
/* dükkâna girerken kapıdan ışık yayılır, oda ışığın altında belirir, ışık sönerek odayı açar */
#shop .bloom{display:none;position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 56%,rgba(255,250,232,1) 0,rgba(255,226,168,.92) 26%,rgba(255,196,120,.55) 52%,rgba(255,190,120,0) 82%);transition:opacity .26s ease-in}
#shop .bloom.rdy{display:block}
#shop .bloom.on{opacity:1}
#shop .bloom.out{transition:opacity .55s ease-out}
@keyframes hubIn{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:none}}
#shop .vw.hub.ent{animation:hubIn .75s cubic-bezier(.22,.61,.36,1) backwards}
@keyframes stRise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
#shop .rs{animation:stRise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0) * 70ms + 140ms)}
@keyframes stPop{0%{transform:scale(.84)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
#shop .itm.pop,#shop .pch.pop,#shop .dm.pop,#shop .lad span.pop{animation:stPop .7s cubic-bezier(.2,.9,.3,1.2)}
/* hareketli büyük katmanlar önceden katman olur: ölçek animasyonu her karede yeniden çizim istemez (yavaş cihazlarda takılmayı azaltır) */
#shop .stg{will-change:transform}
#shop .vw{will-change:transform,opacity}
#shop .shopv.swap{opacity:0!important;transform:translateX(-18px) scale(.985)!important;transition:opacity .2s,transform .2s}
</style>

<script>

'use strict';

const TAU = Math.PI * 2, HALF = Math.PI / 2;
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const norm = a => { a %= TAU; return a < 0 ? a + TAU : a; };
const angd = (a, b) => { const d = norm(a - b); return d > Math.PI ? TAU - d : d; };
const easeOut = p => 1 - Math.pow(1 - p, 3);
/* Animasyonlar (V0.9.4): kullanıcının telefonunda "animasyonları kaldır" açıktı ve oyun o ayara uyup mağaza geçişlerini, konfetiyi ve sarsıntıyı baştan kapatıyordu ("animasyon yok").
   Artık oyunun kendi anahtarı var (Ayarlar > Animasyonlar, varsayılan AÇIK; telefonun ayarına bakmaz). Kapalıyken RM doğrudur ve eski "sakin" davranış sürer.
   SYS_RM yalnızca bilgi içindir (Ayarlar'da açıklama gösterir). */
const SYS_RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let RM = false;
const applyMotion = () => { RM = !save.anim; document.documentElement.classList.toggle('calm', RM); };

/* ---------- ayarlar: oyun dengesi ve zorluk eğrisi tek yerde ---------- */
/*TUNE-START*/
const CFG = {
  maxTime: 8, startTime: 6,
  hitGain: 0.95, perfectBonus: 0.08, reliefGain: 0.2, nearGain: 1.5, nearAt: 1.0, missCost: 0.8, trapCost: 1.3,
  perfectFrac: 0.32, grace: 0.05,
  spawnMin: 1.0, spawnMax: 2.2,
  contTime: 4, contCoins: 25, contAds: 2, contMax: 3, contWait: 5, contSlow: 3, contSlowMul: 0.7,
  coinDiv: 4, nearCoin: 2, adSeconds: 3, tutHits: 5, recMin: 10, newAfter: 0
};
/* Zorluk dalgalı: taban yavaşça yükselir, her dalga (period vuruş) önce yükselir sonra gevşer.
   adapt: oyuncu iyi oynadıkça yükselir, hata yaptıkça düşer. mercy: hatadan sonra kısa süre nefes verir. */
const DIFF = {
  period: 10, rise: 0.6,
  trendMax: 0.72, trendTau: 75,
  ampMax: 0.2, ampStart: 0.3, ampTau: 20,
  omegaMin: 2.2, omegaMax: 3.8, hwMax: 0.56, hwMin: 0.15,
  adaptUp: 0.01, adaptDown: 0.03, adaptCap: 0.12,
  mercyHit: 0.6, mercyDecay: 0.7, mercyDrop: 0.25,
  fatigueFrom: 100, fatigueRate: 0.004, fatigueCap: 0.6

/* Kademeye göre cehennem: 'none' hiç yok, 'phases' her seviyenin sonunda açılıp kapanır, 'always' baştan sona. */
const tierPh = ph => { const m = LV().hell; return m === 'phases' ? ph : (m === 'always' ? 'hell' : 'normal'); };
const phaseChange = pi => {
  const prev = G.ph, prevL = G.L;
  G.L = pi.L; G.ph = pi.ph; G.lvStart = pi.start; G.ptsMul = phaseMod(pi.ph, pi.L).pts;
  if (pi.L > prevL) { rewardHell(prevL); levelUp(); }

/* Küçük yardımcılar: işaretli açı farkı, ibrenin gidiş yönünde uzaklık, tamamlanması gereken hedefler. */
const sdiff = (a, b) => { const d = norm(a - b); return d > Math.PI ? d - TAU : d; };
const aheadOf = c => norm((c - G.ang) * G.dir);
const sm = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const isReq = p => !p.done && !p.bonus && (p.kind === 'gate' || p.kind === 'hold' || p.kind === 'lockpin');
const mkGate = (ring, c, h) => ({ kind: 'gate', ring, c0: c, amp: 0, f: 0, ph: 0, hw: h, done: false });
/* Tuzağı hedefin yanına koy: başka bir hedefin ya da tuzağın üstüne, ibrenin hemen önüne düşmesin. -1: yer bulunamadı. */
const placeTrap = (pins, g0, hw, th) => {
  const gates = pins.filter(p => p.kind === 'gate' && p.ring === 0);
  for (let tries = 0; tries < 16; tries++) {
    const side = Math.random() < 0.5 ? 1 : -1, cand = norm(g0.c0 + side * (hw + th + rnd(0.35, 1.4)));
    if (angd(cand, G.ang) >= th + 0.5 && gates.every(g => angd(cand, g.c0) >= g.hw + th + 0.2) && pins.every(q => q.kind !== 'trap' || angd(cand, q.c0) >= q.hw + th + 0.2)) return cand;
  }
  return -1;
};
/* Sabır pimi: beklerken vurulacak yan hedef; kilidin üstüne ya da başka hedefe düşmez. */
const sideGate = (pins, hw) => {
  const lock = pins.find(p => p.kind === 'lockpin');
  for (let tries = 0; tries < 24; tries++) {
    const c = ahead(G.ang, G.dir, rnd(0.7, 5.4));
    if (lock && angd(c, lock.c0) < lock.hw + hw + 0.3) continue;
    if (pins.some(q => q.kind === 'gate' && !q.done && angd(c, q.c0) < q.hw + hw + 0.3)) continue;
    return Object.assign(mkGate(0, c, hw), { bonus: true, side: true });
  }
  return null;
};
/* Diken: nefes alan hedefin kenarı hızlı girer, bir süre bekler, yavaş çıkar (V0.5.0). */
const thornF = p => { const w = p.thw, P = w.att + w.hold + w.rel, u = (G.pt + w.o) % P; if (u < w.att) return sm(u / w.att); if (u < w.att + w.hold) return 1; return 1 - sm((u - w.att - w.hold) / w.rel); };

/* Engel ikizi: iyi kilidin yanına ya da üstüne konan engel. Gerçekten eklenen ikizin adını döndürür ('' = eklenemedi). */
const addTwin = (tw, pins, hw) => {
  const g0 = pins.find(p => p.kind === 'gate' && !p.bonus) || pins.find(p => p.kind === 'gate'), th = hw * 1.1;
  if (tw === 'tuzak') {
    if (!g0) return '';
    const c = placeTrap(pins, g0, hw, th);
    if (c < 0) return '';
    pins.push({ kind: 'trap', tw, ring: 0, c0: c, amp: 0, f: 0, ph: 0, hw: th, done: false });
  } else if (tw === 'kayanT') {
    if (!g0) return '';
    /* kayan tuzak hedefin %45'inden dar: hedefin açıkta kalan parçası her zaman var */
    pins.push({ kind: 'trap', tw, ring: 0, c0: g0.c0, amp: 0.95, f: 0.33, ph: rnd(0, TAU), hw: Math.min(0.28, 0.45 * g0.hw), prio: true, pen: 1.0, done: false });
  } else if (tw === 'diken') {
    if (!g0) return '';
    const st = G.stars.nefes | 0, sp = clamp(MECH.thornRef / G.omega, MECH.thornMin, MECH.thornMax);
    const att = (0.3 - 0.03 * st) * sp, hold = (0.8 - 0.1 * st) * sp, rel = (1.5 - 0.2 * st) * sp, P = att + hold + rel;
    /* ibre hızlandıkça diken de hızlanır; diken, ibre hedefe girerken tam kapanmış olacak biçimde zamanlanır (ortası yine hep açık) */
    const om = G.omega * (G.slow > 0 ? G.slowMul : 1), tIn = Math.max(0, (aheadOf(g0.c0) - g0.hw) / om), lead = rnd(MECH.thornLead[0], MECH.thornLead[1]);
    g0.thorn = true; g0.thw = { att, hold, rel, o: (((att + lead - G.pt - tIn) % P) + P) % P };
  } else if (tw === 'lanetli') {
    const gold = pins.find(p => p.gold), m = pins.find(p => p.kind === 'gate' && !p.bonus);
    if (!gold || !m) return '';
    const gh = MECH.goldHw, after = aheadOf(m.c0) + m.hw + gh + 0.3, first = Math.random() < 0.5 ? -1 : 1;
    let c = -1;
    for (let tries = 0; tries < 12 && c < 0; tries++) {
      const side = (tries & 1) ? -first : first, cand = norm(gold.c0 + side * G.dir * (2 * gh + rnd(0.5, 0.9)));
      const d = aheadOf(cand);
      if (d >= after && d <= 5.4 && angd(cand, gold.c0) > 2 * gh + 0.3) c = cand;
    }
    if (c < 0) return '';
    pins.push({ kind: 'trap', tw, ring: 0, c0: c, amp: 0, f: 0, ph: 0, hw: gh, done: false, cursed: true, pen: MECH.cursedPen });
  } else if (tw === 'alarm') {
    const gs = pins.filter(p => p.kind === 'gate' && p.kasa).sort((a, b) => aheadOf(a.c0) - aheadOf(b.c0));
    if (gs.length < 3) return '';
    const i = Math.random() < 0.5 ? 0 : 1, a = gs[i], b = gs[i + 1], gap = norm((b.c0 - a.c0) * G.dir) - a.hw - b.hw;
    pins.push({ kind: 'trap', tw, ring: 0, c0: ahead(a.c0, G.dir, norm((b.c0 - a.c0) * G.dir) / 2), amp: 0, f: 0, ph: 0, hw: Math.max(0.1, Math.min(0.18, gap / 2 - 0.05)), done: false, alarm: true, pen: MECH.alarmPen });
  } else if (tw === 'sahtenota') {
    const gs = pins.filter(p => p.kind === 'gate' && p.note).sort((a, b) => aheadOf(a.c0) - aheadOf(b.c0));
    if (gs.length < 3) return '';
    const i = (Math.random() * (gs.length - 1)) | 0, a = gs[i], b = gs[i + 1], gap = norm((b.c0 - a.c0) * G.dir) - a.hw - b.hw;
    pins.push({ kind: 'trap', tw, ring: 0, c0: ahead(a.c0, G.dir, norm((b.c0 - a.c0) * G.dir) / 2), amp: 0, f: 0, ph: 0, hw: Math.max(0.1, Math.min(0.17, gap / 2 - 0.05)), done: false, fake: true, pen: MECH.notePen });
  } else if (tw === 'kilitli') {
    const g1 = pins.find(p => p.kind === 'gate' && p.ring === 1);
    if (!g1) return '';
    g1.locked = true; G.lockLeft = MECH.lockT; G.chal.lockMax = MECH.lockT;
  } else if (tw === 'hayaletT') {
    const gg = pins.find(p => p.ghost);
    if (!gg) return '';
    const c = placeTrap(pins, gg, hw, th);
    if (c < 0) return '';
    pins.push({ kind: 'trap', tw, ring: 0, c0: c, amp: 0, f: 0, ph: 0, hw: th, done: false, ghost: { vis: gg.ghost.vis }, pen: MECH.ghostTrapPen, spook: true });
  } else if (tw === 'girdap') {
    if (!g0) return '';
    const va = rnd(0.5, 0.9);
    if (aheadOf(g0.c0) < va + 0.9) g0.c0 = ahead(G.ang, G.dir, va + rnd(0.9, 1.6));
    pins.push({ kind: 'vortex', ring: 0, c0: ahead(G.ang, G.dir, va), amp: 0, f: 0, ph: 0, hw: MECH.vortexHw, done: false });
  } else if (tw === 'sicak') {
    const hp = pins.find(p => p.kind === 'hold');
    if (!hp) return '';
    hp.hot = true;
  } else if (tw === 'curuk') {
    const lp = pins.find(p => p.kind === 'lockpin');
    if (!lp) return '';
    lp.curuk = true;
  } else return '';
  return tw;
};

let spawnQuiet = false;   /* start() turu kurarken gösteri hemen başlamasın (kayıtlı oyunda önce 3-2-1 sayılır) */
const spawnChallenge = (first, force) => {
  const PR = G.practice;
  const lv = PR ? LEVEL.normal : LV(), pm = PR ? JOURNEY.phase.normal : phaseMod(G.ph, G.L);
  const plan = PR ? { I: 0.1, omega: PRAC.omega, hw: PRAC.hw, relief: false } : planJourney(G.L, G.ph, G.n, G.adapt, G.mercy);
  if (PR) force = PR.kind;
  let mix = null, can = false, forceTw = '';
  if (!first && !force && G.lifeDue && !G.life) { can = true; G.lifeDue = false; }
  else if (!first && !force && !plan.relief && G.mixes.length && Math.random() < 0.28) {
    mix = G.mixes[(Math.random() * G.mixes.length) | 0];
    if (mix[1] === 'tuzak' && pm.twin === 0) mix = null;
  }
  G.firstOfKind = false;
  if (PR) { PR.spawns++; forceTw = PR.spawns > 1 ? (PRAC_TWIN[PR.kind] || '') : ''; }
  let kind;
  if (first || can) kind = 'tek';
  else if (force) kind = force;
  else if (G.pendingNew && G.pendingN >= CFG.newAfter) { kind = G.pendingNew; forceTw = G.pendingTw; G.pendingNew = ''; G.pendingTw = ''; G.firstOfKind = true; }
  else if (mix) kind = mix[0];
  else kind = pickJ(G.open.filter(k => k !== G.pendingNew), plan.relief, G.lastKind, Math.random(), G.ph);
  if (G.pendingNew && !first && !can && !force) G.pendingN++;
  const prevKind = G.kind;
  const km = JKIND[kind] || JKIND.tek;
  G.kind = kind; G.lastKind = kind; G.gainMul = km.gain * lv.gain;
  G.I = plan.I; G.relief = plan.relief;
  G.omega = plan.omega * km.omMul * lv.om * pm.omM;
  let hw = Math.min(lv.hwCap || 0.8, Math.max(HW_FLOOR, plan.hw * km.hwMul * lv.hw * pm.hwM * (PR ? 1 : wideAt(G.time, G.L, lv))));
  if (can) hw = Math.min(0.8, hw * 1.15);
  const star = G.stars[kind] | 0, sIx = Math.min(2, star);
  G.chal = { kind, t: 0, star, tw: '' };
  G.holding = false; G.lockLeft = 0; G.tun = null; G.emerge = 0;
  const far = (G.firstOfKind || PR) ? [2.0, 2.6] : null;
  const dist = (lo, hi) => far ? rnd(far[0], far[1]) : rnd(lo, hi);
  const gate = mkGate;
  const pins = [];
  if (kind === 'cift') {
    const a = ahead(G.ang, G.dir, dist(1.0, 2.0));
    pins.push(gate(0, a, hw), gate(0, ahead(a, G.dir, hw * 2 + rnd(0.5 - 0.1 * star, 1.0 - 0.2 * star)), hw));
  } else if (kind === 'kayan') {
    const p = gate(0, ahead(G.ang, G.dir, dist(1.4, 2.6)), hw);
    p.amp = rnd(0.45, 0.8) * (1 + 0.1 * star); p.f = rnd(0.32, 0.5) * (1 + 0.08 * star); p.ph = rnd(0, TAU);

    const p = gate(0, ahead(G.ang, G.dir, dist(CFG.spawnMin, CFG.spawnMax)), hw);
    p.br = { a: clamp(0.22 + 0.4 * plan.I + 0.05 * star, 0.22, 0.62), P: [2.0, 1.5, 1.2][star], ph: rnd(0, TAU) };
    pins.push(p);
  } else if (kind === 'iki') {
    if (prevKind !== 'iki') G.ang2 = norm(G.ang + Math.PI);
    G.dir2 = -G.dir; G.omega2 = G.omega * 0.85;
    pins.push(gate(0, ahead(G.ang, G.dir, dist(1.0, 2.2)), hw));
    pins.push(gate(1, ahead(G.ang2, G.dir2, rnd(1.0, 2.0)), Math.min(0.85, hw * 1.15)));
  } else if (kind === 'altin') {
    /* V0.8.0: önce sıradaki hedef, altın ondan sonra gelir ve hedef vurulana kadar kapalıdır (soluk, kilitli); açılınca ilk dokunuş altına aittir, ıskalanırsa altın kaybolur */
    const gh = MECH.goldHw, ma = ahead(G.ang, G.dir, dist(1.0, 1.7));
    pins.push(gate(0, ma, hw));
    pins.push(Object.assign(gate(0, ahead(ma, G.dir, hw + gh + rnd(MECH.goldGap[0], MECH.goldGap[1])), gh), { bonus: true, gold: true, wait: true }));
  } else if (kind === 'kasa') {
    const hk = hw * 0.85, step = 2 * hk + rnd(0.55, 0.85), a = ahead(G.ang, G.dir, dist(1.0, 1.8));
    for (let i = 0; i < 3; i++) pins.push(Object.assign(gate(0, ahead(a, G.dir, i * step), hk), { kasa: true }));
    G.chal.kasa = true;
  } else if (kind === 'ritim') {
    const n = MECH.ritimN[sIx], hr = Math.max(0.12, hw * 0.72), step = 2 * hr + rnd(0.55, 0.75), a = ahead(G.ang, G.dir, dist(1.0, 1.8));
    for (let i = 0; i < n; i++) pins.push(Object.assign(gate(0, ahead(a, G.dir, i * step), hr), { note: true }));
    G.chal.ritim = n; G.chal.chain = 0; G.chal.broken = false;
  } else if (kind === 'hayalet') {
    const lead = MECH.ghostLead[sIx], om = G.omega * (G.slow > 0 ? G.slowMul : 1), ahd = clamp(om * (rnd(0.62, 0.9) + lead), 1.8, 5.4);
    const p = gate(0, ahead(G.ang, G.dir, ahd), hw);
    p.ghost = { vis: Math.max(0.35, ahd / om - lead) };
    pins.push(p);
  } else if (kind === 'gelgit') {
    if (G.tideC == null) G.tideC = rnd(0, TAU);
    pins.push(gate(0, ahead(G.ang, G.dir, dist(1.2, 2.4)), hw));
  } else if (kind === 'isin') {
    /* İbre mavi kapıya (A) girer, turuncu kapıdan (B) çıkar; hedef (T) çıkışın ilerisindedir ve çıkışı görüp tepki verilebilecek kadar uzaktadır.
       Hedef, ibrenin ilk yoluna (başlangıç ile A arası) düşmez: o yayı ibre hep ışınlanmadan önce geçer. */
    const om = G.omega * (G.slow > 0 ? G.slowMul : 1), room = TAU - 0.55;

    if (a + skip + gap > room) {

    pins.push({ kind: 'portal', portal: 'in', ring: 0, c0: pa, amp: 0, f: 0, ph: 0, hw: MECH.isinPortalHw, done: false, wait: MECH.isinWait[sIx], prev: null });
    pins.push({ kind: 'portal', portal: 'out', ring: 0, c0: pb, amp: 0, f: 0, ph: 0, hw: MECH.isinPortalHw, done: false });
  } else if (kind === 'tutbirak') {

  } else if (kind === 'sabir') {
    const la = ahead(G.ang, G.dir, dist(1.8, 2.8)), lh = Math.max(0.2, hw * 0.9);
    pins.push({ kind: 'lockpin', ring: 0, c0: la, amp: 0, f: 0, ph: 0, hw: lh, done: false, passes: 0, open: false, openT: 0, prev: null, rattle: 0 });
    const sg = sideGate(pins, hw); if (sg) pins.push(sg);

  } else if (kind === 'trafik') {
    const ht = Math.max(0.2, hw * 0.78), a = ahead(G.ang, G.dir, dist(1.2, 2.0)), b = ahead(a, G.dir, 2 * ht + rnd(0.32, 0.5)), g1 = Math.random() < 0.5;

    if (angd(ba, n.c0) < hw + bh + 0.25) ba = norm(n.c0 + G.dir * (hw + bh + 0.5));
    pins.push(Object.assign(gate(0, ba, bh), { bomb: { fuse: f, max: f, st: 'arm' } }));
  } else {
    const p = gate(0, ahead(G.ang, G.dir, first ? rnd(1.6, 2.3) : (can ? rnd(1.4, 2.2) : rnd(CFG.spawnMin, CFG.spawnMax))), hw);
    if (can) p.can = true;
    pins.push(p);
  }
  if (mix && mix[1] === 'kayan') for (const p of pins) { p.amp = rnd(0.28, 0.45); p.f = rnd(0.3, 0.42); p.ph = rnd(0, TAU); }
  const tw = PR ? forceTw : (forceTw || (mix && mix[1] === 'tuzak' ? 'tuzak' : JTWIN[kind]));
  if (!first && !can && tw && G.eng[tw] && (mix || forceTw ? true : Math.random() < Math.max(pm.twin, lv.twins || 0))) G.chal.tw = addTwin(tw, pins, hw);

  if (!first && !can && !PR) {

    if (G.chal.tw) noteSeen(G.chal.tw);

};

const relayout = snap => {
  const w = view.w, h = view.h, cx = w / 2;
  let cy, r;
  if (G.mode === 'menu') {
    const top = app.getBoundingClientRect().top;
    const hb = $('menuHead').getBoundingClientRect().bottom - top;
    const ft = $('menuFoot').getBoundingClientRect().top - top;
    cy = (hb + ft) / 2;
    r = Math.min(w * 0.29, (ft - hb) / 2 - 54);
  } else {
    /* yukarıdan aşağı: HUD, kart / haber satırının yeri, halka, halkanın altında joker sırası */
    const hudB = (hudEl.offsetTop + hudEl.offsetHeight) || 140;
    const short = h < 700, prac = !!G.practice;
    const cardH = prac ? (short ? 62 : 102) : (short ? 62 : 56);   /* Dene'de büyük kart, oyunda yalnızca haber satırı ve seviye bandı için yer */
    /* Joker sırası ekranın altında; halka ile arasında parmak boyunda (yaklaşık 1,5 cm) boş alan kalır, oyun dokunuşları jokerlere değmesin (V0.6.1). */
    const dockH = prac ? 0 : (short ? 68 : 80), lblH = prac ? 0 : 34, gapMin = short ? 54 : 70, bottomPad = short ? 14 : 24;
    const top = hudB + 6 + cardH, dockTop = prac ? h : h - bottomPad - dockH;
    const ringMax = prac ? h - 14 : dockTop - lblH - gapMin;
    r = Math.min(w * 0.33, h * 0.2, (ringMax - top - 12) / 2.2);
    r = Math.max(56, r);
    cy = top + Math.max(r * 1.1 + 6, (ringMax - top) * (prac ? 0.47 : 0.5));
    view.dockTop = dockTop;
    toolsEl.style.top = dockTop + 'px';
  }
  r = Math.max(56, r);
  view.hudB = G.mode === 'menu' ? 0 : (hudEl.offsetTop + hudEl.offsetHeight);
  view.tcx = cx; view.tcy = cy; view.tr = r;
  if (snap) { view.cx = cx; view.cy = cy; view.r = r; }
};
const resize = () => {
  const b = app.getBoundingClientRect();
  view.w = b.width; view.h = b.height; view.dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(view.w * view.dpr));
  cv.height = Math.max(1, Math.round(view.h * view.dpr));
  cv2.width = cv.width; cv2.height = cv.height;
  { const hf = $('hfx').style; hf.setProperty('--vr0', Math.round(Math.min(view.w, view.h) * 0.45) + 'px'); hf.setProperty('--vr1', Math.round(Math.max(view.w, view.h) * 0.8) + 'px'); }
  relayout(true);
  if (shopEl.classList.contains('on') && fitStore()) { renderHub(); if (SS.view === 'shop') fillShop(); }
};

/* ---------- yeni kilitlerin işleyişi: kilit, tut-bırak, ışık, bomba, girdap ---------- */
const primaryPin = () => G.pins.find(p => isReq(p) && p.ring === 0) || G.pins.find(p => !p.done && p.kind === 'gate' && p.ring === 0) || null;
const holdRel = p => sdiff(G.ang, p.c0) * p.dirH;
/* Altın pim: ana hedef vurulana kadar kapalı (wait); açıkken ilk dokunuş altına aittir, ıskalanırsa ya da ibre geçerse kaybolur (gone). */
const goldPending = q => !!q.gold && !q.done && !q.gone;
const goneGold = g => { if (!g.gone) { g.gone = true; g.goneAt = G.clock; G.needCheck = true; } };
const loseGold = () => { const g = G.pins.find(q => goldPending(q) && !q.wait); if (g) goneGold(g); };
const openGold = g => {
  g.wait = false; g.enT = 0; g.seen = false;
  const q = pinXY(g); fxRing(q.x, q.y, GOLD, 70, 0.5); burst(q.x, q.y, 10, [GOLD, GOLD_L, '#FFFFFF'], 150);
  pop(t('popGoldOpen'), 'hype'); Snd.adv(); Platform.haptic('light');
};
const tickGold = (p, dt) => {
  if (p.wait || p.gone || p.done) return;
  p.enT = (p.enT || 0) + dt;
  const rel = sdiff(G.ang, p.c0) * G.dir;
  if (rel < -p.hw * 1.2) p.seen = true;
  if ((p.seen && rel > p.hw + CFG.grace + 0.05) || p.enT > 3) goneGold(p);
};
const advance = wasRelief => {
  if (G.practice) { practiceStep(); return; }
  if (G.pendingRev) {
    G.pendingRev = false;
    G.dir = -G.dir; G.revT = 0.8; pop(t('reverse'), 'rev'); Snd.rev();
  }
  spawnChallenge(false);
  if (G.relief && !wasRelief) pop(t('breath'), 'rev');
};
const fxRing = (x, y, col, r1, max) => { G.rips.push({ x, y, t: 0, max: max || 0.6, r0: 10, r1: r1 || 70, c: col }); };
/* Girdap ve kilit sayaçları, sabır pimi, ışıklar, bombalar: her karede çalışır. */
const unlockRing = () => {
  const g1 = G.pins.find(p => p.ring === 1 && p.locked);
  if (g1) { g1.locked = false; g1.c0 = ahead(G.ang2, G.dir2, rnd(1.0, 2.0)); }
  pop(t('popRingFree'), 'rev'); Snd.rev(); Platform.haptic('light');
  if (g1) { const q = pinXY(g1); fxRing(q.x, q.y, P.life, 60, 0.5); }
};
const tickLockpin = (p, dt) => {
  if (p.done) return;
  p.rattle = Math.max(0, p.rattle - dt);
  const rel = sdiff(G.ang, p.c0) * G.dir;
  if (p.prev != null && p.prev < 0 && rel >= 0 && Math.abs(rel) < 0.7 && !p.open) {
    p.passes++;
    const q = pinXY(p);
    if (p.passes >= MECH.sabirNeed) {
      p.open = true; p.openT = 0; p.seen = false;
      pop(t('popUnlock'), 'hype'); Snd.fanfare(); Platform.haptic('medium');
      burst(q.x, q.y, 26, [GOLD, GOLD_L, P.peach, '#FFFFFF'], 260); fxRing(q.x, q.y, GOLD, 90, 0.7);
    } else { Snd.tone(660 + 120 * p.passes, 0.1, 'triangle', 0.1); burst(q.x, q.y, 7, [GOLD_L, P.peach], 120); }
  }
  if (p.open && p.curuk) {
    if (rel < -p.hw * 1.2) p.seen = true;
    if (p.seen && rel > p.hw + 0.05) {
      p.open = false; p.passes = 0; p.seen = false; p.rattle = 0.4;
      pop(t('curukRelock'), 'miss'); Snd.miss();
    }
  }
  p.prev = rel;
};
const holdFail = (p, why) => {
  p.st = 'wait'; G.holding = false;
  miss(); pop(t(why === 'early' ? 'popEarly' : 'popLate'), 'miss');
};
const tickHold = (p, dt) => {
  if (p.st !== 'hold') return;
  const rel = holdRel(p);
  if (p.hot && rel / p.len >= MECH.hotFrom) {
    G.time -= dt * (MECH.hotDrain - 1) * phaseMod(G.ph, G.L).drain;
    if (!p.burned) { p.burned = true; pop(t('popBurn'), 'near'); Snd.alarm(); Platform.haptic('warn'); shake(0.25); }
    if (Math.random() < dt * 28) { const q = pinXY({ c0: norm(G.ang), amp: 0, ring: 0 }); G.parts.push({ x: q.x, y: q.y, vx: rnd(-40, 40), vy: rnd(-120, -40), life: 0, max: rnd(0.4, 0.8), r: rnd(1.8, 3.4), c: Math.random() < 0.5 ? '#FFC24A' : '#FF6A3D' }); }
  }
  if (rel > p.len + p.rw + CFG.grace + MECH.holdGrace) holdFail(p, 'late');
};
const release = () => {
  if (!G.holding) return;
  const p = G.pins.find(q => q.kind === 'hold' && q.st === 'hold');
  G.holding = false;
  if (!p || G.mode !== 'play') return;
  const rel = holdRel(p), e = Math.abs(rel - p.len);
  if (e <= p.rw + CFG.grace) { p.st = 'done'; hit(e, p); }
  else holdFail(p, rel < p.len ? 'early' : 'late');
};
const tickLight = dt => {
  const ch = G.chal.light, ls = G.pins.filter(p => p.light && !p.done);
  if (!ch || !ls.length) return;
  ch.left -= dt;
  /* ibre içerideyken değişmez; Dene modunda ibre yaklaşırken de değişmez (öğretirken adil kalsın) */
  const inside = ls.some(p => angd(G.ang, p.c0) <= pinHw(p) + 0.06 || (G.practice && aheadOf(p.c0) < 1.4 + pinHw(p)));
  if (ch.left <= 0 && !inside) {
    ls.forEach(p => { p.green = !p.green; }); ch.left = ch.per * rnd(0.78, 1.22);
    ls.forEach(p => { const q = pinXY(p); burst(q.x, q.y, 5, ['#FFFFFF', p.green ? P.life : P.rose], 90); });
    Snd.tone(p0Tone(ls[0]), 0.07, 'sine', 0.06);
  }
  ch.warn = ch.left < MECH.lightWarn;
};
const p0Tone = p => p.green ? 880 : 440;
/* Işınlanma pimi: ibre mavi kapıya girince görünmez olur ve açısı donar; rastgele bir süre sonra turuncu kapıdan çıkar. */
const outPortal = () => G.pins.find(q => q.kind === 'portal' && q.portal === 'out');
const enterPortal = p => {
  const out = outPortal();
  if (!out) return;
  const w = p.wait || MECH.isinWait[0];
  G.ang = p.c0; G.tun = { t: 0, d: rnd(w[0], w[1]), to: out.c0 };
  const q = pinXY(p); fxRing(q.x, q.y, P.lilac, 70, 0.45); burst(q.x, q.y, 10, [P.lilac, P['lilac-soft'], '#FFFFFF'], 150);
  Snd.portalIn(); Platform.haptic('light');
};
const exitPortal = () => {
  const out = outPortal();
  G.ang = G.tun.to; G.tun = null; G.emerge = MECH.isinPop;
  if (out) { const q = pinXY(out); fxRing(q.x, q.y, P.peach, 80, 0.5); burst(q.x, q.y, 14, [P.peach, P['peach-soft'], '#FFFFFF'], 190); }
  Snd.portalOut(); Platform.haptic('light');
};
const tickPortal = (p, dt) => {
  if (G.emerge > 0) G.emerge = Math.max(0, G.emerge - dt);
  if (G.tun) {
    G.tun.t += dt;
    if (G.tun.t >= G.tun.d) { exitPortal(); p.prev = null; }
    return;
  }
  const rel = sdiff(G.ang, p.c0) * G.dir;
  if (p.prev != null && p.prev < 0 && rel >= 0 && Math.abs(rel) < 0.7) { enterPortal(p); p.prev = null; return; }
  p.prev = rel;
};
/* İbrenin çizim ölçeği: kapıya girerken küçülür, çıkarken büyür. */
const ptrScale = () => G.tun ? clamp(1 - G.tun.t / MECH.isinFade, 0, 1) : (G.emerge > 0 ? 1 - G.emerge / MECH.isinPop : 1);
const blast = p => {
  G.chal.fail = true;
  p.done = true; p.bomb.st = 'boom';
  const q = pinXY(p), pm = phaseMod(G.ph, G.L);
  G.craters.push({ a: p.c0, t: 0 });
  G.fxs.push({ type: 'blast', x: q.x, y: q.y, t: 0, max: 1.2 });
  burst(q.x, q.y, 60, ['#FFD34D', '#FF9A2E', '#FF5A2E', '#FFFFFF'], 420);
  burst(q.x, q.y, 14, ['#3A3250', '#5A5070'], 200);
  shake(0.9); flash('peach', 0.38); Snd.boom(); Platform.haptic('heavy');
  if (G.glove > 0) { G.glove--; pop(t('shieldSave'), 'perfect'); }
  else {
    const was = G.combo;
    resolveMiss(G, MECH.bombPen * LV().trap * pm.pen);
    G.perf = 0; G.missRun++;
    pop(t('popBoom'), 'near');
    if (was >= COMBO.tiers[0]) pop(pickLine('broke'), 'roast');
  }
  G.needCheck = true;
  if (G.time <= 0) lethal();
};
const updateChal = dt => {
  const ch = G.chal;
  ch.t += dt;
  for (const p of G.pins) {
    p.age = (p.age || 0) + dt;
    if (p.ghost && !p.gfx && p.age >= p.ghost.vis) {
      p.gfx = true; const q = pinXY(p);
      for (let i = 0; i < 12; i++) G.parts.push({ x: q.x + rnd(-8, 8), y: q.y, vx: rnd(-22, 22), vy: rnd(-90, -30), life: 0, max: rnd(0.8, 1.4), r: rnd(2, 4), c: i % 2 ? '#E8E4FF' : '#BDB2FF' });
    }
  }
  if (G.vort > 0) G.vort = Math.max(0, G.vort - dt);
  if (G.lockLeft > 0) { G.lockLeft -= dt; if (G.lockLeft <= 0) { G.lockLeft = 0; unlockRing(); } }
  for (const p of G.pins) {
    if (p.kind === 'vortex') {
      if (G.vort <= 0 && angd(G.ang, p.c0) <= p.hw) { G.vort = MECH.vortexT; pop(t('popVortex'), 'rev'); Snd.rev(); Platform.haptic('medium'); const q = pinXY(p); fxRing(q.x, q.y, P.lilac, 80, 0.6); }
    } else if (p.kind === 'lockpin') tickLockpin(p, dt);
    else if (p.kind === 'hold') tickHold(p, dt);
    else if (p.bomb && !p.done) { p.bomb.fuse -= dt; if (p.bomb.fuse <= 0 && G.mode === 'play') blast(p); }
    else if (p.kind === 'portal' && p.portal === 'in') tickPortal(p, dt);
    else if (p.gold) tickGold(p, dt);
  }
  if (ch.light) tickLight(dt);
  if (G.mode === 'play' && G.needCheck) { G.needCheck = false; if (G.pins.every(q => !isReq(q) && !goldPending(q))) advance(false); }
};
/* İbre hızı: gelgit bandı, girdap ve kilitli halka çarpanları. */
const tideF = a => {
  const w = MECH.tideW, v = MECH.tideV[Math.min(2, G.stars.gelgit | 0)], s = clamp(1 - angd(a, G.tideC) / w, 0, 1);
  return MECH.tideBase + v * s * s * (3 - 2 * s);
};
/* Ibre hızı (V0.9.12): kullanıcı "altını vurunca mı ne aniden hızlanıyor oyun, hızlanma soft olmalı; dönen çubuk bazen saçmalıyor" dedi. Hız her turda yeniden kurulur (tür çarpanı, seviye, Cehennem),
   Kum saati, girdap ve kilit çarpanları ve ters yön olayı bir anda değişirdi. Artık olaylı çarpanlar (hız, kum saati, girdap, kilit, yön) birinci derece gecikmeyle (VEL_TAU) yumuşar: G.vel işaretli hızdır.
   Gelgit sürekli bir çarpandır (açıya bağlı), gecikmeden geçmez ve etaTo ile aynen hesaplanır. Işınlanmada (G.tun) ibre durur, çıkınca eski hızla sürer. */
const VEL_TAU = 0.11;
const ptrTide = () => (G.kind === 'gelgit' && G.tideC != null ? tideF(G.ang) : 1);
const ptrBoost = () => (G.vort > 0 ? MECH.vortexMul : 1) * (G.lockLeft > 0 ? MECH.lockMul : 1);
const ptrFactor = () => (G.tun ? 0 : ptrTide() * ptrBoost());
/* Verilen açıya ibrenin ne kadar sürede varacağı (sn); gelgit ve girdap hızlanmaları hesaba katılır. Bot ve ipuçları için. */
const etaTo = (target, dir, ring) => {
  let a = ring ? G.ang2 : G.ang, t0 = 0, dd = dir == null ? (ring ? G.dir2 : G.dir) : dir;
  const vt = (ring ? G.omega2 : G.omega) * (G.slow > 0 ? G.slowMul : 1) * (ring ? 1 : ptrBoost()), need = norm((target - a) * dd), kv = 1 - Math.exp(-0.01 / VEL_TAU);
  let v = (ring ? G.vel2 : G.vel) * dd, done = 0;   /* şimdiki hız (gidilecek yönde işaretli); ibre hedef hıza VEL_TAU ile yaklaşır */
  if (v !== v) v = vt;
  while (done < need && t0 < 12) {
    v += (vt - v) * kv;
    const f = !ring && G.kind === 'gelgit' && G.tideC != null ? tideF(a) : 1, step = v * f * 0.01;
    done += step; a = norm(a + dd * step); t0 += 0.01;
  }
  return t0;
};

/* Dokunuş: hangi ibre hedefindeyse onu vurur. İki halkada ikisi birden hedefteyse hedefine daha yakın olan sayılır. */
const tap = () => {
  if (G.mode !== 'play' || G.lock > 0) return;
  if (G.holding) return;
  /* tut-bırak: dokunuş basmaktır; yayın başında değilse ıska */
  const hp = G.pins.find(p => p.kind === 'hold' && !p.done);
  if (hp) {
    const rel = holdRel(hp);
    if (Math.abs(rel) <= hp.hw + CFG.grace) {
      hp.st = 'hold'; hp.burned = false; G.holding = true;
      Snd.tone(520, 0.08, 'triangle', 0.12); Platform.haptic('light');
      const q = pinXY({ c0: hp.c0, amp: 0, ring: 0 }); fxRing(q.x, q.y, P.peach, 50, 0.4);
    } else miss();
    return;
  }
  /* hedefin üstüne binen tuzaklar (kayan tuzak, diken) hedeften önce sayılır */
  for (const p of G.pins) {
    if (p.kind === 'trap' && p.prio && angd(G.ang, pinCenter(p)) <= pinHw(p)) { trap(p); return; }
  }
  let best = null, bn = 9, bd = 0;
  for (const p of G.pins) {
    if (p.kind !== 'gate' || p.done || p.locked || p.wait || p.gone) continue;
    const h = pinHw(p), d = angd(p.ring ? G.ang2 : G.ang, pinCenter(p));
    if (d <= h + CFG.grace && d / h < bn) { best = p; bn = d / h; bd = d; }
  }
  if (best) {
    if (best.light && !best.green) { trap({ pen: MECH.lightPen, red: true }); pop(t('popRed'), 'miss'); return; }
    hit(bd, best); return;
  }
  /* sabır pimi: açıksa vurulur, kilitliyken dokunmak kilidi sarsar */
  for (const p of G.pins) {
    if (p.kind === 'lockpin' && !p.done && angd(G.ang, p.c0) <= p.hw + CFG.grace) {
      if (p.open) { hit(angd(G.ang, p.c0), p); return; }
      lockRattle(p); return;
    }
  }
  /* nefes alan hedefin kapanan kenarı dikenliyse (diken ikizi) ceza */
  for (const p of G.pins) {
    if (p.kind === 'gate' && p.thorn && !p.done && angd(p.ring ? G.ang2 : G.ang, pinCenter(p)) <= p.hw + CFG.grace) { trap({ pen: 1.5, narrow: true }); return; }
  }
  for (const p of G.pins) {
    if (p.kind === 'trap' && !p.prio && angd(G.ang, pinCenter(p)) <= pinHw(p)) { trap(p); return; }
  }
  miss();
};
const lockRattle = p => {
  G.chal.fail = true;
  const pm = phaseMod(G.ph, G.L);
  if (G.glove > 0) { G.glove--; pop(t('shieldSave'), 'perfect'); Snd.ui(); Platform.haptic('light'); return; }
  const was = G.combo;
  resolveMiss(G, MECH.sabirPen * LV().trap * pm.pen);
  p.passes = 0; p.rattle = 0.5; G.perf = 0; G.missRun++;
  shake(0.3); flash('rose', 0.16); pop(t('popLockHit'), 'near'); Snd.alarm(); Platform.haptic('error');
  if (was >= COMBO.tiers[0]) pop(pickLine('broke'), 'roast');
  if (G.time <= 0) lethal();
};

const PERF_AT = [3, 6, 10];
const tierCol = m => [P.lilac, P.peach, P['peach-deep'], P.rose, P.btn][Math.min(4, Math.max(0, m - 1))];
/* Seri kilometre taşlarında övgü, çarpan artınca büyük efekt; kıl payında ve art arda mükemmelde ara sıra ek övgü. */
const cheer = (mult, prevMult, near, perfect) => {
  const c = G.combo, key = praiseKey(c);
  if (key) {
    const up = mult > prevMult, col = tierCol(mult);
    pop(pickLine('praise', key) + (up ? '  ×' + mult : ''), 'hype');
    Snd.combo(mult); Platform.haptic('heavy');
    G.rips.push({ x: view.cx, y: view.cy, t: 0, max: 0.8, r0: view.r * 0.35, r1: view.r * 1.3, c: col });
    burst(view.cx, view.cy, up ? 34 : 20, [col, P.peach, P['peach-soft']], 320);
    if (c === COMBO.tiers[0] && G.comboOn && !save.seen.combo) {
      save.seen.combo = 1; persist();
      if (!G.card) G.card = lineCard(t('hint_combo'), 'combo');
    }
  } else if (near && Math.random() < 0.35) {
    pop(pickLine('near'), 'hype');
  } else if (perfect && PERF_AT.indexOf(G.perf) >= 0) {
    pop(pickLine('perf', G.perf), 'hype');
  }
};

const hit = (d, pin) => {
  const wasRelief = G.relief;
  const ghostHidden = !!pin.ghost && ghostAlpha(pin) < 0.2;
  pin.done = true;
  const pm = phaseMod(G.ph, G.L);
  G.hw = pinHw(pin); G.comboOff = !G.comboOn; G.ptsMul = pm.pts;
  /* kilide özgü puan ve süre çarpanları */
  G.ptsX = 1; G.gainX = 1;
  let tag = '';
  if (pin.gold) { G.ptsX = 3; G.gainX = 0; tag = 'gold'; }
  else if (pin.kind === 'lockpin') { G.ptsX = MECH.sabirPts; tag = 'lock'; }
  else if (pin.kind === 'hold') { G.ptsX = pin.hot ? MECH.hotPts : MECH.holdPts; tag = 'hold'; }
  else if (ghostHidden) { G.ptsX = MECH.ghostPts; tag = 'ghost'; }
  else if (pin.bomb) { G.gainX = 0.5; tag = 'bomb'; }
  const { perfect, near, pts, mult } = resolveHit(G, d);
  G.ptsX = 1; G.gainX = 1;
  G.coinsJ += pm.coinHit;
  if (pin.br && G.hw >= pin.hw * 0.93) { G.score += pm.pts; pop(t('breathBonus'), 'perfect'); }
  if (pin.can) grantLife();
  const prevMult = G.comboOn ? comboMult(G.combo - 1) : 1;
  G.scorePulse = 1; G.missRun = 0;
  G.perf = perfect ? G.perf + 1 : 0;
  const p = pinXY(pin);
  const cols = pin.can ? [P.life, P.peach, P.lilac] : (tag === 'gold' || tag === 'lock' ? [GOLD, GOLD_L, '#FFFFFF', P.peach] : (near ? [P.rose, P['rose-soft'], P.peach] : (perfect ? [P['peach-deep'], P.peach, P.lilac] : [P.peach, P.lilac, P['peach-soft']])));
  burst(p.x, p.y, near ? 26 : (perfect ? 18 : 11) + (tag ? 10 : 0), cols, near ? 260 : 190);
  G.rips.push({ x: p.x, y: p.y, t: 0, max: near ? 0.7 : 0.5, r0: 10, r1: near ? 90 : 56, c: near ? P.rose : (tag === 'gold' || tag === 'lock' ? GOLD : P.peach) });
  if (near) {
    /* V0.9.12: yakın vuruşta (son saniye) ekran sarsıntısı ve zamanı 0,3'e düşürüp bir anda 1'e döndüren "vuruş durması" kalktı (kullanıcı: "son saniyelerde vurunca ekran sarsılıyor, oyun aniden hızlanıyor, ibre saçmalıyor"; son saniyede kafa karıştırma). Geri bildirim: parçacık, halka, yazı, ses, titreşim ve gül rengi parlama. */
    pop(t('near'), 'near'); flash('rose', 0.22);
    Snd.near(); Platform.haptic('heavy');
  } else {
    const chain = G.chal.ritim ? G.chal.chain * 2 : G.combo - 1;
    pop(perfect ? t('perfect') : '+' + pts, perfect ? 'perfect' : 'plain');
    Snd.hit(chain, perfect); Platform.haptic(perfect ? 'medium' : 'light');
  }
  /* kilide özgü ödüller ve haberler */
  if (tag === 'gold') { G.coinsJ += MECH.goldCoin; pop(t('popGold'), 'hype'); }
  else if (tag === 'lock') { G.coinsJ += MECH.sabirCoin; pop(t('popGold'), 'hype'); }
  else if (tag === 'ghost') { pop(t('popGhost'), 'hype'); burst(p.x, p.y, 16, ['#FFFFFF', '#E8E4FF', P.lilac], 160); }
  else if (tag === 'hold') { pop(t(pin.hot ? 'popFire' : 'popHoldOk'), 'hype'); }
  else if (tag === 'bomb') { pin.bomb.st = 'def'; G.score += MECH.bombPts; G.scorePulse = 1; pop(t('popDefuse', { n: MECH.bombPts }), 'hype'); burst(p.x, p.y, 24, [P.life, '#9CF5C8', '#FFFFFF'], 220); fxRing(p.x, p.y, P.life, 90, 0.7); }
  if (pin.light) for (const q of G.pins) if (q.light) q.done = true;
  if (pin.note) G.chal.chain++;
  cheer(mult, prevMult, near, perfect);
  const wave = Math.floor(G.n / DIFF.period);
  if (wave > G.waveSeen) { G.waveSeen = wave; if (wave >= 1) G.pendingRev = true; }
  if (pin.side) {
    const sg = sideGate(G.pins.filter(q => !(q.side && q.done)), G.chal.sideHw || pin.hw);
    G.pins = G.pins.filter(q => !(q.side && q.done && q !== pin));
    if (sg) G.pins.push(sg);
    G.gateT = Math.max(G.gateT, 0.9);
  }
  const gw = !pin.gold && G.pins.find(q => q.gold && q.wait && !q.done);
  if (gw) openGold(gw);
  if (G.pins.every(q => !isReq(q) && !goldPending(q))) {
    if (G.chal.kasa && G.pins.filter(q => q.kasa).every(q => q.done)) kasaReward();
    if (G.chal.ritim && !G.chal.broken && G.pins.filter(q => q.note).every(q => q.done)) ritimReward();
    advance(wasRelief);
  } else {
    syncPrimary();
  }
  if (G.n === 1) refreshStats();
};
const kasaReward = () => {
  G.time = Math.min(CFG.maxTime, G.time + MECH.kasaBonusT); G.score += MECH.kasaPts; G.coinsJ += MECH.kasaCoin; G.scorePulse = 1;
  pop(t('popKasa'), 'hype'); Snd.fanfare(); Platform.haptic('medium');
  burst(view.cx, view.cy, 30, [GOLD, GOLD_L, P.peach, '#FFFFFF'], 300); fxRing(view.cx, view.cy, GOLD, view.r * 1.2, 0.8);
};
const ritimReward = () => {
  G.time = Math.min(CFG.maxTime, G.time + MECH.ritimBonusT); G.score += MECH.ritimPts * (G.chal.ritim | 0); G.scorePulse = 1;
  pop(t('popRhythm'), 'hype'); Snd.fanfare(); Platform.haptic('medium');
  burst(view.cx, view.cy, 24, [P.lilac, P.peach, P.btn, '#FFFFFF'], 260);
};

/* Iskada: seri bozulduysa söyle, arka arkaya ıskada ve ara sıra laf at; çoğu zaman düz "Iska". */
const scold = was => {
  const now = G.clock;
  let txt = '', kind = 'roast';
  if (was >= COMBO.tiers[0]) txt = pickLine('broke');
  else if (G.missRun >= 2 && now - G.lastRoast > 2) txt = pickLine('again');
  else if (now - G.lastRoast > 4 && Math.random() < 0.45) txt = pickLine('miss');
  if (txt) G.lastRoast = now; else { txt = t('miss'); kind = 'miss'; }
  pop(txt, kind);
};

/* Can (yedek): halkada yeşil "+" hedefi vurulursa kazanılır, en fazla 1. Süre bitince kendiliğinden devreye girer. */
const grantLife = () => {
  if (G.life) return;
  G.life = true; G.lifeFx = 1; pop(t('lifeGot'), 'hype'); Snd.life(); Platform.haptic('medium');
};
const revive = () => {
  G.life = false; G.time = 3; G.slow = Math.max(G.slow, 3); G.slowMul = CFG.contSlowMul; G.lifeFx = 1;
  pop(t('lifeSaved'), 'hype'); Snd.life(); Platform.haptic('heavy'); flash('peach', 0.22); shake(0.3);
  burst(view.cx, view.cy, 30, [P.life, P.peach, P.lilac], 300);
  G.rips.push({ x: view.cx, y: view.cy, t: 0, max: 0.8, r0: view.r * 0.3, r1: view.r * 1.3, c: P.life });
  Platform.track('life_saved', { level: G.L });
};
const lethal = () => { if (G.practice) { G.time = CFG.maxTime; return; } if (G.life) revive(); else die(); };

const miss = () => {
  loseGold();
  if (G.practice) { pop(t('pracMiss'), 'miss'); Snd.ui(); return; }
  const pm = phaseMod(G.ph, G.L);
  if (G.glove > 0) {
    G.glove--; pop(t('shieldSave'), 'perfect'); Snd.ui(); Platform.haptic('light');
    return;
  }
  const was = G.combo;
  resolveMiss(G, CFG.missCost * LV().miss * pm.pen);
  G.perf = 0; G.missRun++;
  shake(0.2); flash('rose', 0.14);
  scold(was);
  Snd.miss(); Platform.haptic('warn');
  if (G.time <= 0) lethal();
};

const trap = p => {
  loseGold();
  G.chal.fail = true;
  const pm = phaseMod(G.ph, G.L);
  if (G.glove > 0) {
    G.glove--; pop(t('shieldSave'), 'perfect'); Snd.ui(); Platform.haptic('light');
    return;
  }
  const was = G.combo;
  resolveMiss(G, (p && p.pen != null ? p.pen : CFG.trapCost) * LV().trap * pm.pen);
  G.perf = 0; G.missRun++;
  shake(p && p.spook ? 0.6 : 0.4); flash('rose', 0.24);
  pop(t('alarm'), 'near'); Snd.alarm(); Platform.haptic('error');
  if (p && p.narrow) { G.narrow = 3; pop(t('narrow'), 'miss'); }
  if (p && p.cursed) {
    G.coinsJ -= MECH.cursedCoins; pop(t('popCoin', { n: MECH.cursedCoins }), 'miss');
    const q = pinXY(p); burst(q.x, q.y, 22, [TOX, '#3BD654', '#7A3BD6'], 200); fxRing(q.x, q.y, TOX, 70, 0.6);
  }
  if (p && p.fake) { G.chal.broken = true; pop(t('popChain'), 'miss'); }
  if (p && p.spook) { const q = pinXY(p); burst(q.x, q.y, 18, [P.rose, '#FFFFFF', '#FFC2D6'], 200); G.fxs.push({ type: 'reveal', a: p.c0, t: 0, max: 1.0, trap: true }); }
  if (was >= COMBO.tiers[0]) pop(pickLine('broke'), 'roast');
  if (G.time <= 0) { lethal(); return; }
  if (p && p.alarm) { pop(t('popAlarmReset'), 'roast'); spawnChallenge(false, G.kind); }
};

/* auto: otomatik joker ayarı açıkken oyun kendisi kullandı (V0.9.2): "akıllı hamle" puanı yok, yalnızca elle kullanım ödüllenir. */
const useTool = (id, auto) => {
  if (G.mode !== 'play') return;
  const s = save.tools[id];
  if (!s || !isEq(id)) return;
  if (s.n <= 0) { toast(t('toolEmpty')); return; }
  s.n--; persist();
  const e = TOOL[id].eff(s.l);
  if (id === 'steto') G.boostT = Math.max(G.boostT, e);
  else if (id === 'kron') G.time = Math.min(CFG.maxTime, G.time + e);
  else if (id === 'kalkan') G.glove += e;
  else if (id === 'kum') { G.slow = Math.max(G.slow, e); G.slowMul = 0.65; }
  const smart = G.adv === id;
  pop((auto ? t('autoTag') + ' · ' : '') + toolDesc(id, e), 'perfect');
  if (smart) { G.adv = null; G.advT = 0; if (!auto) { G.score += 25; G.scorePulse = 1; pop(t('smartMove'), 'hype'); } }
  G.usedAny = true; if (!auto) save.seen.jokerUse = (save.seen.jokerUse | 0) + 1;
  Snd.tool(); Platform.haptic('medium');
  updateTools(); updateHud();
  const bb = toolsEl.querySelector('.tool[data-tool="' + id + '"]');
  if (bb) { bb.classList.remove('bump'); void bb.offsetWidth; bb.classList.add('bump'); }
  Platform.track('tool_use', { id, level: s.l, smart, auto: !!auto });
};
/* Akıllı joker: işe yarayacağı an parlar ve büyür; aynı anda yalnızca biri önerilir. Otomatik joker ayarı (save.autoJ) açıksa parladıktan AUTO_AT sn sonra kendiliğinden kullanılır;
   o sürede oyuncu kendisi dokunabilir (akıllı hamle puanı onda). Ayar kapalıyken jokerleri yalnızca oyuncu kullanır. */
const AUTO_AT = 0.7;
const adviceFor = () => {
  const have = id => isEq(id) && save.tools[id].n > 0 && (G.advCool[id] || 0) <= G.clock;
  const hellNew = G.ph === 'hell' && G.hellAge < 3 && hellK(G.L) >= 0.2;
  if (have('kron') && G.time <= 2.5) return 'kron';
  if (have('kalkan') && G.glove <= 0 && (G.missRun >= 2 || hellNew)) return 'kalkan';
  if (have('steto') && G.boostT <= 0 && (G.hw < 0.24 || hellNew)) return 'steto';
  if (have('kum') && G.slow <= 0 && (G.omega > 3.3 || G.missRun >= 2)) return 'kum';
  return null;
};
const updateAdvice = dt => {
  if (G.adv) {
    G.advT += dt;
    if (adviceFor() !== G.adv || G.advT > 6) { G.advCool[G.adv] = G.clock + (G.advT > 6 ? 12 : 4); G.adv = null; G.advT = 0; }
    else if (save.autoOwn && save.autoJ && G.advT >= AUTO_AT) useTool(G.adv, true);
  }
  if (!G.adv) {
    const a = adviceFor();
    if (a) { G.adv = a; G.advT = 0; G.lastAdv = a; Snd.adv(); Platform.haptic('light'); }
  }
};

/* Bir koşunun coin kazancı: ham puan, kıl payı ve yolculuk coinleri birlikte kademe çarpanıyla çarpılır (V0.9.0). */
const runCoins = (raw, near, coinsJ, lv) => Math.max(0, Math.round((Math.floor((raw || 0) / CFG.coinDiv) + (near || 0) * CFG.nearCoin + Math.floor(coinsJ || 0)) * lv.coin));
const die = () => {
  if (G.mode !== 'play') return;
  G.mode = 'dead'; G.deadT = RM ? 0.6 : 0.85 * BURN.slow; G.tail = null;
  startBurn();
  toolsEl.classList.remove('on');
  const w = G.omega * (G.slow > 0 ? CFG.contSlowMul : 1);
  /* ışınlanma pininde ibre kapıya varmadan ya da kapıdayken "hedefe şu kadar kala" demek yanıltır */
  const viaGate = G.kind === 'isin' && (!!G.tun || G.pins.some(p => p.kind === 'portal' && p.portal === 'in' && aheadOf(p.c0) < aheadOf(G.ta)));
  const inside = !viaGate && angd(G.ang, G.ta) <= G.hw;
  const secs = viaGate ? 0 : (norm((G.ta - G.ang) * G.dir) - G.hw) / w;
  G.nearMsg = inside ? t('overInside') : (secs > 0 && secs <= 0.6 ? t('overClose', { s: f1(Math.max(0.1, secs)) }) : '');
  shake(0.5); flash('rose', 0.3); Snd.over(); Platform.haptic('error');
  save.run = null; G.adv = null;
  G.newBest = !G.campRun && G.score > bestNow();
  if (G.newBest) save.bests[save.lvl] = G.score;
  save.bestL = Math.max(save.bestL, G.L);
  if (!G.runCounted) {
    save.runs++; G.runCounted = true;
    save.low = G.n < 10 ? save.low + 1 : 0;
    if (save.lvl === 'normal') save.high = G.n >= 60 ? save.high + 1 : 0;
    if (save.lvl === 'usta') save.highU = G.n >= 60 ? save.highU + 1 : 0;
  }
  const total = runCoins(G.raw, G.near, G.coinsJ, LV());
  G.gain = total - G.coinsGiven; G.coinsGiven = total; save.coins += G.gain;
  if (!save.tut && G.n >= CFG.tutHits) save.tut = true;
  persist(); refreshStats();
  Platform.track('run_end', { score: G.score, hits: G.n, near: G.near, combo: G.maxCombo, diff: save.lvl, level: G.L, phase: G.ph, camp: G.campRun, continued: G.continued, kind: G.kind });
};

/* Oyun sonu başlığı: rekor ve uzun oyunda övgü, çok kısa oyunda laf, aksi halde düz "Süre bitti". */
const overMood = () => {
  if (G.newBest && G.n >= 10) return ['gold', pickLine('overGood')];
  if (G.n >= 40) return ['good', pickLine('overGreat')];
  if (G.n < 5) return ['bad', pickLine('overBad')];
  return ['', t('over')];
};
const showOver = () => {
  G.mode = 'over'; G.overAt = performance.now();
  const [mood, line] = overMood();
  const ovT = $('ovTitle'); ovT.textContent = line; ovT.className = 'eyebrow rise' + (mood ? ' mood ' + mood : '');
  const tipEl = $('ovTip');
  let tk = '';
  if (save.lvl !== 'rahat' && save.low >= 3 && !save.tips.easy) tk = 'easy';
  else if (save.lvl === 'normal' && save.high >= 2 && !save.tips.hard) tk = 'hard';

const envStep = raw => {
  const w = view.w, h = view.h, k = RM ? 0.5 : 1;
  if (thWx > 0.08 && G.em.length < 34 * k && Math.random() < raw * 22 * thWx * k) {
    G.em.push({ x: rnd(0, w), y: h + 6, vy: rnd(40, 110), r: rnd(1.2, 3), ph: rnd(0, TAU), sw: rnd(10, 30), life: 0, max: rnd(2.2, 4.2) });
  }
  for (const e of G.em) { e.life += raw; e.y -= e.vy * raw * (1 - 0.45 * e.life / e.max); e.x += Math.sin(G.clock * 2.4 + e.ph) * e.sw * raw; }
  G.em = thWx < 0.01 ? [] : G.em.filter(e => e.life < e.max && e.y > -10);

/* Oyuncu yanınca (her kademede; Animasyonlar kapalıysa yok) çember yanıp küle döner (kullanıcı seçimi "B. Kül ve kor"): 0,45 sn çember turuncu-kırmızı alevlenir, sonra çember kaybolur;
   8 çember parçası yavaşça dağılıp düşer, ~150 kor yukarı sürüklenir ve közden küle solar. Parçacıklar ölüm anındaki çemberin yerinden ve boyundan doğar (ekran koordinatı).
   İkinci şansta (doContinue) kor temizlenir, çember ortadan dışa doğru yeniden belirir (G.reform). Yalnızca görüntü. */
const BURN_SLOW = 2.3;   /* V0.9.7: kullanıcı "ölme animasyonu biraz yavaş geçsin, sonuç ekranı hemen geliyor" dedi: bütün zaman çizelgesi yavaşlatıldı (1,7 → 2,3: kullanıcı "0,5 sn daha yavaşlat" dedi; sonuç kartı 1,95 sn sonra) */
const BURN = { slow: BURN_SLOW, flame: 0.45 * BURN_SLOW, life: 3.2 * BURN_SLOW };
const EMBER_COL = ['#FFD27A', '#FF8A3D', '#E8452C'];
const startBurn = () => {
  G.burn = null;
  if (RM || G.practice) return;
  const R = view.r * HX.b, RW = Math.max(14, R * 0.2), k = R / 88, r0 = HX.r, ch = [], em = [];
  for (let i = 0; i < 8; i++) {
    const a0 = r0 + i * TAU / 8 + 0.05, a1 = r0 + (i + 1) * TAU / 8 - 0.05, am = (a0 + a1) / 2, sp = rnd(30, 80) * k;
    ch.push({ a0, a1, am, vx: Math.cos(am) * sp + rnd(-25, 25) * k, vy: Math.sin(am) * sp + rnd(-25, 25) * k - 40 * k, vr: rnd(-4, 4), g: 140 * k });
  }
  for (let i = 0; i < 150; i++) {
    const a = rnd(0, TAU), r = R + rnd(-RW / 2, RW / 2);
    em.push({ x0: Math.cos(a) * r, y0: Math.sin(a) * r, vx: rnd(-22, 22) * k, vy: -rnd(30, 110) * k, s: rnd(1.5, 4) * Math.min(1.6, k), max: rnd(0.8, 1.8), ph: rnd(0, TAU), del: 0.3 + rnd(0, 0.45) });
  }
  G.burn = { t: 0, ch, em, k };
};
const burnStep = raw => {
  if (G.reform < 1) G.reform = Math.min(1, G.reform + raw / 0.45);
  const b = G.burn;
  if (!b) return;
  if (G.mode !== 'dead' && G.mode !== 'over') { G.burn = null; return; }
  b.t += raw;
  if (b.t > BURN.life) G.burn = null;
};
const drawBurn = (c, cx, cy, b, R, RW) => {
  const te = b.t / BURN.slow, k = b.k;   /* te: tasarım zamanı (alev 0,45 sn, parçalar ve kor buna göre), gerçek süre BURN.slow kat uzar */
  c.save();
  if (te < 0.45) {
    const f = te / 0.45;
    c.lineWidth = RW * (1 - 0.5 * f); c.strokeStyle = Math.random() < 0.5 ? EMBER_COL[1] : EMBER_COL[2]; c.globalAlpha = 0.9 - 0.3 * f;
    c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.stroke(); c.globalAlpha = 1;
  }
  c.lineCap = 'butt'; c.lineWidth = RW; c.strokeStyle = P.track;
  for (const p of b.ch) {
    const tau = te - 0.45;
    if (tau < 0) continue;
    const al = clamp(1 - (tau - 0.7) / 1, 0, 1);
    if (al <= 0) continue;
    const mx = Math.cos(p.am) * R, my = Math.sin(p.am) * R;
    c.save(); c.globalAlpha = al;
    c.translate(cx + p.vx * tau + mx, cy + p.vy * tau + 0.5 * p.g * tau * tau + my); c.rotate(p.vr * tau); c.translate(-mx, -my);
    c.beginPath(); c.arc(0, 0, R, p.a0, p.a1); c.stroke();
    c.restore();
  }
  for (const e of b.em) {
    const tau = te - e.del;
    if (tau < 0) continue;
    const u = tau / e.max;
    if (u >= 1) continue;
    c.globalAlpha = 1 - u * u; c.fillStyle = u < 0.3 ? EMBER_COL[0] : u < 0.6 ? EMBER_COL[1] : u < 0.85 ? EMBER_COL[2] : P['ink-2'];
    c.beginPath(); c.arc(cx + e.x0 + (e.vx + Math.sin(te * 5 + e.ph) * 14 * k) * tau, cy + e.y0 + e.vy * tau, e.s * (1 - 0.5 * u), 0, TAU); c.fill();
  }
  c.restore();
};

/* ---------- güncelleme ---------- */
const COUNT_STEP = 0.75;
/* Cehennem kademesinde (yalnızca) çember nefes alır ve bütün çember (çentikler, hedefler, ibre) ibrenin tersine döner; yalnızca görüntüdür, oyun mantığına dokunmaz.
   Nefes yalnızca küçülüp geri açılır (ayarlanan boyutu aşmaz, kartın altına girmez); kapanırken çember en yakın tam tura oturur, normal görünüme sıçramaz.
   V0.9.6 dönüş programı (kullanıcı seçimi "Yumuşak yön değişimi"; spiral kaldırıldı): Seviye 1-2 dönmez (yalnızca nefes); 3-5 tek yönlü, yavaş (4 → 10 °/sn);
   6-10 iki yönlü karışık (12 → 20 °/sn): yön 5-9 sn'de bir rastgele, yavaşça durup ters yöne döner (HX.sg yumuşak işaret, HX.tg hedef işaret, HX.nx sonraki dönüş). Çentikler halkanın 2,5 katı hızda döner (aynı yönde). */
const HELL_ROT = [0, 0, 4, 7, 10, 12, 14, 16, 18, 20];   /* °/sn, seviye 1..10 */
const hellFx = raw => {
  if (G.mode === 'intro') return;
  const on = !RM && LV().hell === 'always' && !G.practice && (G.mode === 'play' || G.mode === 'count' || G.mode === 'dead');
  const lv = clamp(G.L, 1, 10) - 1, k = Math.min(1, raw * 3);
  HX.s += ((on ? 1 : 0) - HX.s) * Math.min(1, raw * 2.5);
  if (on || HX.s > 0.003) {
    HX.a += (0.015 + 0.012 * lv - HX.a) * k;
    HX.ph += TAU * raw / (3.4 - 0.2 * lv);
    HX.b = 1 - 2 * HX.a * (0.5 - 0.5 * Math.sin(HX.ph)) * HX.s;
    HX.t += raw;
    if (on && lv >= 5) {
      if (!HX.nx) HX.nx = HX.t + 5 + Math.random() * 4;
      if (HX.t > HX.nx) { HX.tg = -HX.tg; HX.nx = HX.t + 5 + Math.random() * 4; }
      HX.sg += (HX.tg - HX.sg) * Math.min(1, raw / 0.9);
    } else if (on) { HX.sg = 1; HX.tg = 1; HX.nx = 0; }
    HX.v += ((on ? -G.dir * HELL_ROT[lv] * Math.PI / 180 * HX.sg : 0) - HX.v) * k;
    HX.r += HX.v * raw;
    HX.tr += HX.v * 2.5 * raw;
  } else HX.b = 1;
  if (!on) {
    const kk = Math.min(1, raw * 5), q = TAU / 12;
    HX.r += (Math.round(HX.r / TAU) * TAU - HX.r) * kk; HX.tr += (Math.round(HX.tr / q) * q - HX.tr) * kk;
    if (HX.s <= 0.003 && Math.abs(HX.r - Math.round(HX.r / TAU) * TAU) < 0.002 && Math.abs(HX.tr - Math.round(HX.tr / q) * q) < 0.002) { HX.r = 0; HX.tr = 0; HX.v = 0; HX.t = 0; HX.sg = 1; HX.tg = 1; HX.nx = 0; }
  }
};
let contLeft = 0;
const setCd = () => { cdArc.style.strokeDashoffset = (176 * (1 - Math.max(0, Math.min(1, contLeft / CFG.contWait)))).toFixed(1); };
const contCost = n => CFG.contCoins * Math.pow(2, n);
const update = raw => {
  G.clock += raw;
  const k = Math.min(1, raw * 9);
  view.cx += (view.tcx - view.cx) * k; view.cy += (view.tcy - view.cy) * k; view.r += (view.tr - view.r) * k;
  /* Duraklatmada her şey donar: sayaçlar, tema geçişi, parçacıklar. */
  if (G.mode === 'pause') return;
  if (G.mode === 'play' && G.introQ.length && !G.holding && !G.practice) startIntro();
  hellFx(raw); burnStep(raw);
  if (G.tsT > 0) { G.tsT -= raw; if (G.tsT <= 0) G.tscale = 1; }
  const dt = raw * G.tscale;

  if (G.mode === 'menu') {
    G.ang = norm(G.ang + 1.0 * dt);
    G.gateT = Math.min(1, G.gateT + raw * 2);
  } else if (G.mode === 'count') {
    const n0 = Math.ceil(G.count);
    G.count -= raw / COUNT_STEP;
    G.gateT = Math.min(1, G.gateT + raw * (G.introQ.length ? 0 : 4));   /* sıradaki gösteri varsa pinler gizli kalır */
    if (G.count <= 0) { G.count = 0; G.mode = 'play'; Snd.tick(true); }
    else if (Math.ceil(G.count) !== n0) Snd.tick(false);
    updateHud();
  } else if (G.mode === 'play') {
    const PR = G.practice, sl = G.slow > 0 ? G.slowMul : 1;

      applyEvents(false);
      const pi = jPhaseAt(G.jt), ph = tierPh(pi.ph);
      if (pi.L !== G.L || ph !== G.ph) phaseChange(Object.assign({}, pi, { ph }));
      G.phLeft = pi.left;
      if (G.ph === 'hell') G.hellAge += dt;
      /* can fırsatı: çift seviyelerin ortasında, canın yoksa bir sonraki hedef yeşil "+" olur */
      if (G.ph === 'normal' && G.L % 2 === 0 && G.lifeLevel !== G.L && G.jt - pi.start >= 0.55 * jNormal(G.L)) { G.lifeLevel = G.L; if (!G.life) G.lifeDue = true; }
    }
    const pm = PR ? JOURNEY.phase.normal : phaseMod(G.ph, G.L);
    if (!G.tun) {
      const vt = G.dir * G.omega * sl * ptrBoost();
      if (G.vel !== G.vel) G.vel = vt;
      G.vel += (vt - G.vel) * (1 - Math.exp(-dt / VEL_TAU));
      G.ang = norm(G.ang + G.vel * ptrTide() * dt);
    }
    if (G.kind === 'iki' && G.lockLeft <= 0) {
      const vt2 = G.dir2 * G.omega2 * sl;
      if (G.vel2 !== G.vel2) G.vel2 = vt2;
      G.vel2 += (vt2 - G.vel2) * (1 - Math.exp(-dt / VEL_TAU));
      G.ang2 = norm(G.ang2 + G.vel2 * dt);

    updateChal(dt);

    if (G.slow > 0) G.slow -= raw;
    if (G.boostT > 0) G.boostT = Math.max(0, G.boostT - raw);
    if (G.narrow > 0) G.narrow = Math.max(0, G.narrow - raw);
    if (G.lock > 0) G.lock = Math.max(0, G.lock - raw);
    if (G.revT > 0) G.revT -= raw;
    G.gateT = Math.min(1, G.gateT + raw * 4);
    syncPrimary();
    if (!PR) {
      updateAdvice(dt);
      G.saveT += raw; if (G.saveT > 5) { G.saveT = 0; persistRun(); }
      if (G.time < CFG.nearAt) { G.beep -= raw; if (G.beep <= 0) { G.beep = 0.24; Snd.warn(); } }
      if (G.time <= 0) { G.time = 0; lethal(); }
    }
    if (!PR && !G.recDone && !G.campRun && G.best0 >= CFG.recMin && G.score > G.best0) celebrateRecord();
    updateHud(); updateDock();
  } else if (G.mode === 'intro') {
    /* tanıtım: oyun donuk (süre, ibre, hedefler); gösteri dokunuşla ya da kendiliğinden biter, sonra 0,5 sn içinde gerçek pinler gelir ve oyun sürer */
    const it = G.intro;
    if (!it) G.mode = 'play';
    else if (it.closing) {
      it.closing += raw; G.gateT = Math.min(1, G.gateT + raw * 4);
      if (it.closing >= IN_BACK) { G.intro = null; G.mode = 'play'; G.tail = { t: 0 }; }
    } else { it.t += raw; if (it.t >= it.total) closeIntro(false); }
  } else if (G.mode === 'dead') {
    G.deadT -= raw;
    updateHud(); updateDock();
    if (G.deadT <= 0) showOver();
  }

  const live = G.mode === 'play' || G.mode === 'count' || G.mode === 'dead' || G.mode === 'intro';
  if (G.banner && live) { G.banner.t += raw; if (G.banner.t > 2.0) G.banner = null; }
  if (G.card && (G.mode === 'play' || G.mode === 'count')) { G.card.t += raw; if (G.card.t > G.card.max) G.card = null; }
  if (G.tail && G.mode === 'play') { G.tail.t += raw; if (G.tail.t > IN_TAIL) G.tail = null; }
  const kT = 1 - Math.exp(-2.6 * raw);
  thWx += (G.thT - thWx) * kT;
  if (Math.abs(thWx - G.thT) < 0.004) thWx = G.thT;
  applyTheme();
  { const on = G.thT > 0.5; if (on !== hfxOn) { hfxOn = on; app.classList.toggle('hellfx', on); } }
  if (G.thDirty && thWx === G.thT) { G.thDirty = false; onPalette(); }
  G.ec += raw;
  envStep(raw);
  G.lifeFx = Math.max(0, G.lifeFx - raw * 1.4);
  G.shake = Math.max(0, G.shake - raw);
  G.flash = Math.max(0, G.flash - raw);
  G.scorePulse = Math.max(0, G.scorePulse - raw * 5);
  G.tvis += (G.time - G.tvis) * Math.min(1, raw * 12);
  G.Ivis += (G.I - G.Ivis) * Math.min(1, raw * 3);

    const pts = []; let x = view.w * (0.06 + 0.88 * (i + rr() * 0.7) / 5), y = view.h + 4;
    const len = view.h * (0.1 + 0.12 * rr());

const drawEnv = c => {

  if (thWx > 0.01) {
    /* V0.9.12: ateş parıltısı ve kenar karartması (ekran boyu iki degrade) artık DOM katmanıdır (#hfx): canvas'ta her karede yeniden çizilmeleri Cehennem'de kareyi 22 ms'ye çıkarıyordu (≈45 fps), katman bir kez çizilir. Çatlaklar ve kor canvas'ta kalır. */
