<title>Kıl Payı</title>
<!--FONTS-START-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<!--FONTS-END-->
<style>
/* Tasarım planı
   Renk: lila (ana) + şeftali (hedef bölge); uyarı için gül. Nötrler lilaya çalar.
   Yazı: Fredoka (başlık, sayılar), Nunito (metin). Yuvarlak formlar, hap butonlar.
   Düzen: kronometre kadranı ortada, üstte süre kapsülü, altta alet çubuğu, üstte duran katmanlar buzlu cam. */
:root{
  --bg:#F5F2FC;--bg-2:#E9E3F7;--surface:#FFFFFF;--track:#E3DCF5;--tick:#B4AAD5;--line:#D8D0EC;
  --ink:#29233F;--ink-2:#615A7C;--ink-3:#8F87AB;
  --lilac:#8E7CF2;--lilac-soft:#DCD5FB;--btn:#6D58E0;--on-btn:#FFFFFF;
  --peach:#FFA473;--peach-deep:#FF7D43;--peach-soft:#FFD9C5;
  --rose:#FF5C84;--rose-soft:#FFD2DC;--life:#27B27A;--gold:#F4B63F;--gold-ink:#9A6B00;
  --blob-1:#E2DBFB;--blob-2:#EBDDF9;
  --glass:rgba(255,255,255,.64);--glass-edge:rgba(255,255,255,.85);--scrim:rgba(41,35,63,.18);
  --shadow-s:0 1px 2px rgba(41,35,63,.06),0 6px 16px rgba(41,35,63,.08);
  --shadow-m:0 2px 6px rgba(41,35,63,.07),0 20px 48px rgba(41,35,63,.16);
  --r-s:16px;--r-m:24px;--r-l:32px;--r-pill:999px;
  --fs-12:.75rem;--fs-14:.875rem;--fs-16:1rem;--fs-20:1.25rem;--fs-28:1.75rem;--fs-72:4.5rem;
  --dur-fast:180ms;--dur-base:300ms;--dur-slow:550ms;--ease:cubic-bezier(.2,.8,.2,1);
  --font-display:"Fredoka","SF Pro Rounded",ui-rounded,"Nunito",system-ui,sans-serif;
  --font-body:"Nunito","SF Pro Rounded",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16132E;--bg-2:#0F0D22;--surface:#26204D;--track:#312B5C;--tick:#5E5796;--line:#3D3770;
  --ink:#F4F1FF;--ink-2:#BBB4DC;--ink-3:#8780AE;
  --lilac:#AA9CFF;--lilac-soft:#3B327A;--btn:#BBAEFF;--on-btn:#1B1644;
  --peach:#FFB088;--peach-deep:#FF9560;--peach-soft:#6B4148;
  --rose:#FF7C9E;--rose-soft:#5C2D49;--life:#3BD99B;--gold:#F4B63F;--gold-ink:#F7CF6B;
  --blob-1:#2B2463;--blob-2:#382A6C;
  --glass:rgba(38,32,77,.62);--glass-edge:rgba(255,255,255,.16);--scrim:rgba(7,5,22,.5);
  --shadow-s:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.28);
  --shadow-m:0 2px 6px rgba(0,0,0,.3),0 20px 48px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16132E;--bg-2:#0F0D22;--surface:#26204D;--track:#312B5C;--tick:#5E5796;--line:#3D3770;
  --ink:#F4F1FF;--ink-2:#BBB4DC;--ink-3:#8780AE;
  --lilac:#AA9CFF;--lilac-soft:#3B327A;--btn:#BBAEFF;--on-btn:#1B1644;
  --peach:#FFB088;--peach-deep:#FF9560;--peach-soft:#6B4148;
  --rose:#FF7C9E;--rose-soft:#5C2D49;--life:#3BD99B;--gold:#F4B63F;--gold-ink:#F7CF6B;
  --blob-1:#2B2463;--blob-2:#382A6C;
  --glass:rgba(38,32,77,.62);--glass-edge:rgba(255,255,255,.16);--scrim:rgba(7,5,22,.5);
  --shadow-s:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.28);
  --shadow-m:0 2px 6px rgba(0,0,0,.3),0 20px 48px rgba(0,0,0,.45);
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;display:flex;justify-content:center;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-16);line-height:1.35;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;max-width:460px;height:100%;overflow:hidden;background:var(--bg)}
@media (min-width:600px){body{align-items:center;background:var(--bg-2)}#app{height:min(100%,860px);border-radius:var(--r-l);box-shadow:var(--shadow-m)}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv2{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
#cv2.on{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:20px;height:20px;flex:none;display:block}
svg.ic .f{fill:currentColor}
svg.ic .s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.amb{position:absolute;inset:0;overflow:hidden;pointer-events:none;transition:opacity var(--dur-slow) var(--ease)}
#app.playing .amb{opacity:.4}
/* öğretici arka planı (kullanıcı 2026-11-18: "öğretici için özel arka plan teması"): öğretim sürerken açılır */
.obbg{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.4s var(--ease)}#app.obth .obbg{opacity:1}#app.obth .amb{opacity:0}
#app .obbg{background:repeating-linear-gradient(135deg,rgba(255,164,115,.10) 0 14px,transparent 14px 28px),#FBF6F2}
.amb i{position:absolute;display:block;border-radius:50%;will-change:transform}
.amb i:nth-child(1){width:70%;aspect-ratio:1;left:-24%;top:-10%;background:var(--blob-1);animation:drift-a 24s ease-in-out infinite alternate}
.amb i:nth-child(2){width:54%;aspect-ratio:1;right:-18%;top:38%;background:var(--blob-2);animation:drift-b 28s ease-in-out infinite alternate}
.hfx{position:absolute;inset:0;pointer-events:none;opacity:0;visibility:hidden;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,0) var(--vr0,175px),rgba(0,0,0,.4) var(--vr1,675px)),linear-gradient(to top,rgba(255,80,30,.5),rgba(255,80,30,0) 65%);transition:opacity 1.3s cubic-bezier(.2,.7,.3,1),visibility 0s linear 1.3s}
#app.hellfx .hfx{opacity:1;visibility:visible;transition:opacity 1.3s cubic-bezier(.2,.7,.3,1),visibility 0s}
html.calm .hfx{transition:none}
.amb i:nth-child(3){width:62%;aspect-ratio:1;left:6%;bottom:-24%;background:var(--blob-1);animation:drift-c 32s ease-in-out infinite alternate}
@keyframes drift-a{to{transform:translate3d(14%,10%,0) scale(1.1)}}
@keyframes drift-b{to{transform:translate3d(-16%,-8%,0) scale(.92)}}
@keyframes drift-c{to{transform:translate3d(12%,-12%,0) scale(1.12)}}

.hud{position:absolute;left:0;right:0;top:0;padding:18px 20px 0;display:flex;flex-direction:column;gap:10px;pointer-events:none;opacity:0;transform:translateY(-10px);transition:opacity var(--dur-base) var(--ease),transform var(--dur-slow) var(--ease)}
.hud.on{opacity:1;transform:none}
/* V0.9.0: süre çemberin ortasına (sıvı seviyesi) taşındı; üstte puan, altında rekora yaklaşma çubuğu var. */
.score-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.score{display:flex;align-items:baseline;gap:6px;min-width:0;transform-origin:left bottom}
.score b{font-family:var(--font-display);font-weight:700;font-size:2.5rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink)}
.score span{font-weight:800;font-size:var(--fs-14);color:var(--ink-2)}
.sgrp{display:flex;align-items:flex-end;gap:8px;min-width:0}
/* Hedef (V0.9.10): "Rekor 180" çipi kalktı; puanın yanında "128 / (180)" gösterilir, 180 aşılacak hedef gibi çerçevelidir. Rekor geçilince çerçeve altın olur ve tik alır. */
.goalw{display:inline-flex;align-items:center;gap:7px;margin-bottom:7px;min-width:0}
.goalw i{font:600 1.35rem/1 var(--font-display);font-style:normal;color:var(--ink-3)}
.goal{display:inline-flex;align-items:center;gap:4px;min-height:26px;padding:0 10px;border-radius:var(--r-pill);border:2px solid var(--lilac);color:var(--ink-2);font:600 var(--fs-14)/1 var(--font-display);font-style:normal;font-variant-numeric:tabular-nums;transition:background var(--dur-base) var(--ease),border-color var(--dur-base) var(--ease),color var(--dur-base) var(--ease)}
.goal svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.goalw.gold i{color:var(--gold-ink)}
.goalw.gold .goal{border-color:var(--gold);background:var(--gold);color:#5A3C00}
/* Duraklat (V0.9.10): sağ üst köşe; köşelere oyun dokunuşu en az gelir. Düğme olduğu için oyun dokunuşu sayılmaz (#app pointerdown button'ı atlar). */
.pausebtn{pointer-events:auto;appearance:none;border:0;cursor:pointer;position:relative;flex:none;align-self:center;width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow-s);transition:transform var(--dur-fast) var(--ease)}
.pausebtn::before{content:"";position:absolute;inset:-5px}
.pausebtn:active{transform:scale(.92)}
.pausebtn .ic{width:20px;height:20px}
/* Kapalı test kartı (V0.9.11): bildirime dokununca "Gün n/17" ve 17 noktalı ilerleme */
.gauge-row{display:flex;align-items:center;gap:8px;min-height:26px}
.gauge{position:relative;flex:1;height:10px;border-radius:var(--r-pill);background:var(--track);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:var(--r-pill);background:var(--lilac);transition:width .3s var(--ease)}
.fill.gold{background:var(--gold)}
.chip.combo{min-height:26px;padding:0 10px;flex:none}
.hud-row2{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-height:24px}
.lvl{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.lprog{display:block;width:100%;height:3px;border-radius:2px;background:var(--track);overflow:hidden}
.lprog b{display:block;height:100%;width:0;border-radius:2px;background:var(--lilac)}
.lprog.x b{background:#D9503A}
.sect{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:var(--r-pill);font-weight:800;font-size:var(--fs-12);white-space:nowrap;opacity:0;transform:translateY(-4px);transition:opacity var(--dur-base) var(--ease),transform var(--dur-base) var(--ease)}
.sect.on{opacity:1;transform:none}
.sect.x{background:#D9503A;color:#fff}
.gauge.hasLife{box-shadow:0 0 0 2.5px var(--life)}
.life{display:none;align-items:center;gap:3px;height:24px;padding:0 9px 0 6px;border-radius:12px;background:var(--life);color:#fff;font:800 12px/1 var(--font-body);flex:none}
.life svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round}
.life.on{display:inline-flex}
.life.pop{animation:lifepop .6s var(--ease)}
@keyframes lifepop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.fx{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:1;min-width:0}

.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface);color:var(--ink-2);font-weight:800;font-size:var(--fs-14);box-shadow:var(--shadow-s)}
.chip b{font-family:var(--font-display);font-weight:600;font-size:var(--fs-16);color:var(--ink);font-variant-numeric:tabular-nums}
.chip{white-space:nowrap}
.chip.sm{min-height:30px;padding:0 12px;font-size:var(--fs-12)}
.chip.sm b{font-size:var(--fs-14)}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:20px 20px 24px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity var(--dur-fast) var(--ease),visibility 0s linear var(--dur-fast)}
.scr.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity var(--dur-base) var(--ease),visibility 0s}
.scr.on .rise{animation:rise var(--dur-slow) var(--ease) backwards;animation-delay:calc(var(--i,0)*90ms + 80ms)}
@keyframes rise{from{opacity:.5;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

.menu-head{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.topbar{width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;row-gap:8px;margin-bottom:14px}
.tb-right{display:flex;gap:8px;margin-left:auto}
.title{margin:0;font-family:var(--font-display);font-weight:700;font-size:clamp(2.25rem,10vw,3rem);letter-spacing:-.01em;line-height:1.05;text-align:center}
.tagline{margin:0;max-width:300px;color:var(--ink-2);font-weight:700;font-size:var(--fs-16);text-align:center;text-wrap:balance}
.grow{flex:1}
.menu-foot{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
.stat-row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}

.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 26px;border-radius:var(--r-pill);font-family:var(--font-display);font-weight:600;font-size:var(--fs-20);line-height:1;color:var(--ink);background:var(--surface);box-shadow:var(--shadow-s);transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-fast) var(--ease),opacity var(--dur-fast)}
.btn:active{transform:translateY(0) scale(.97);box-shadow:var(--shadow-s)}
.btn:focus-visible,.icon-btn:focus-visible,.tool:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.btn.primary{background:var(--btn);color:var(--on-btn)}
.btn.big{width:min(100%,280px);min-height:64px;font-size:var(--fs-28)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--ink-2);min-height:44px;font-family:var(--font-body);font-weight:800;font-size:var(--fs-16)}
.btn[aria-disabled="true"]{opacity:.55}
@media (hover:hover){.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-m)}.btn.quiet:hover{box-shadow:none;transform:none;color:var(--ink)}}
.icon-btn{appearance:none;border:0;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow-s);transition:transform var(--dur-fast) var(--ease)}
.icon-btn:active{transform:scale(.94)}
@keyframes breathe{50%{transform:scale(1.04)}}
.breathe{animation:breathe 2.4s ease-in-out infinite}

.tools{position:absolute;left:0;right:0;top:0;bottom:auto;padding:0 16px;display:flex;justify-content:center;align-items:flex-end;gap:16px;opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity var(--dur-base) var(--ease),transform var(--dur-slow) var(--ease)}
.tools.on{opacity:1;transform:none}
.tools.on.dim{opacity:.3}
.tools.dim .tool{pointer-events:none}
.tool{appearance:none;border:0;position:relative;width:60px;height:60px;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s);display:grid;place-items:center;cursor:pointer;pointer-events:auto;touch-action:none;transition:transform var(--dur-fast) var(--ease),opacity var(--dur-fast),width var(--dur-fast) var(--ease),height var(--dur-fast) var(--ease)}
.tools:not(.on) .tool{pointer-events:none}
.tool:active{transform:scale(.94)}
.tool.empty{opacity:.55}
.tool.adv{width:76px;height:76px;background:#F4B63F;color:#3F2A00;box-shadow:0 0 0 5px rgba(244,182,63,.3),var(--shadow-s);animation:advpulse .9s ease-in-out infinite}
.tool.adv .badge{background:#3F2A00;color:#F4B63F}
@keyframes advpulse{50%{box-shadow:0 0 0 12px rgba(244,182,63,.08),var(--shadow-s);transform:scale(1.05)}}
.tool.bump .badge{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.55)}}
@media (max-height:700px){.tool{width:54px;height:54px}.tool.adv{width:66px;height:66px}}
@media (max-width:340px){.tools{gap:8px}}
.advlbl{position:absolute;top:-36px;transform:translateX(-50%);padding:6px 13px;border-radius:999px;background:#F4B63F;color:#3F2A00;font:800 13px/1 var(--font-body);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.advlbl.on{opacity:1}
.tool svg{width:26px;height:26px;display:block}
.tool .s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool .badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--btn);color:var(--on-btn);font:800 12px/22px var(--font-body);text-align:center;font-variant-numeric:tabular-nums}
.tool.empty .badge{background:var(--track);color:var(--ink-2)}
.btn.big small{display:block;font:800 var(--fs-12)/1 var(--font-body);opacity:.85}
.btn.big.two{flex-direction:column;gap:4px;min-height:70px}
.btn.warn{color:var(--rose)}
.ver{font-weight:800;font-size:var(--fs-12);color:var(--ink-3);opacity:.85;margin-top:-4px}
.icon-btn{position:relative}
.icon-btn.dot::after{content:"";position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 2px var(--surface)}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r-m);background:var(--surface);box-shadow:var(--shadow-s);text-align:left}
.brow .bt{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--lilac-soft)}
.brow .bt img{display:block}
.brow .bx{min-width:0;display:flex;flex-direction:column;gap:2px}
.brow b{font-family:var(--font-display);font-weight:600;font-size:var(--fs-16)}
.brow small{color:var(--ink-2);font-weight:700;font-size:var(--fs-12);line-height:1.3}
.brow small i{display:block;font-style:normal;color:var(--rose)}
.brow .tg{align-self:flex-start;font-style:normal;font-weight:800;font-size:11px;line-height:1;padding:4px 9px;border-radius:999px;background:var(--peach);color:#3A1D00}
.brow .tg.g{background:var(--track);color:var(--ink-2)}
.brow .tg.nw{background:var(--btn);color:var(--on-btn)}
.brow .try{appearance:none;cursor:pointer;border:1.5px solid var(--lilac);background:transparent;color:var(--ink);font-family:var(--font-body);font-weight:800;font-size:var(--fs-12);padding:8px 14px;border-radius:999px;min-height:34px}
.brow .try:active{transform:scale(.95)}
.brow.lk .bt img,.brow.lk .bx b,.brow.lk .bx small{opacity:.62}
.brow.nx{outline:2px dashed var(--peach);outline-offset:-2px}
.brow.nw{outline:2px solid var(--btn);outline-offset:-2px}
@media (max-width:340px){.brow{grid-template-columns:38px minmax(0,1fr) auto;gap:8px;padding:8px 9px}.brow .bt{width:38px;height:38px}.brow .bt img{width:30px;height:30px}.brow .try{padding:7px 10px}}
.bcap{margin:0;width:100%;color:var(--ink-3);font-weight:700;font-size:var(--fs-12);text-align:left}
.bcnt{font-weight:800;font-size:var(--fs-12);color:var(--ink-2);white-space:nowrap}
.prac-bar{display:none;align-items:center;justify-content:space-between;gap:10px}
#app.prac .score-row,#app.prac .gauge-row,#app.prac .hud-row2{display:none}
#app.prac .prac-bar{display:flex}
.prac-bar .btn{pointer-events:auto;min-height:40px;padding:0 16px;font-size:var(--fs-14);background:var(--surface);box-shadow:var(--shadow-s);color:var(--ink)}
.pdots{display:flex;gap:8px}
.pdots i{display:block;width:14px;height:14px;border-radius:50%;background:var(--track)}
.pdots i.on{background:var(--peach)}
.pdt{margin:0;font-family:var(--font-display);font-weight:700;font-size:var(--fs-28);color:var(--ink)}
.swapsub{margin:0;max-width:300px;color:var(--ink-2);font-weight:700;font-size:var(--fs-14);line-height:1.5}

.scr.dim{background:var(--scrim);justify-content:center}
.card{width:min(100%,380px);padding:26px 20px 20px;border-radius:var(--r-l);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.scr.on .card{animation:card-in var(--dur-slow) var(--ease) backwards}

/* sokakta (V0.9.8) küçük süsler kalkar: halkaların simge zıplaması ve pencere yıldızlarının ikisi (cephe başına bir yıldız göz kırpar); her biri ayrı bir katman olup 120 fps'i yiyordu */
#stHub .emc,#shop .fc .tw.t2,#shop .fc .tw.t3{animation:none!important}
#shop .dock .dk:not(.on) *,#shop .dock .dk:not(.on) *::before,#shop .dock .dk:not(.on) *::after{animation:none!important}
/* görünmeyen görünüm (sokak ya da dükkân içi) hareket etmez: eski dükkân içi, sokakta kaydırırken boşuna dönüp duruyordu */
#shop .vw:not(.on) *,#shop .vw:not(.on) *::before,#shop .vw:not(.on) *::after{animation:none!important}

#shop .lts.lg{animation:aGl2 2.6s ease-in-out infinite}
#shop .lts.lg1{animation-delay:-.87s}
#shop .lts.lg2{animation-delay:-1.73s}
@keyframes aGl2{50%{opacity:.35}}
#shop .stars i{animation:none;opacity:.7}
#shop .stars .sg{position:absolute;left:0;top:0;width:100%;height:220px;animation:aTw2 3.2s ease-in-out infinite}
#shop .stars .sg1{animation-delay:-1.07s}
#shop .stars .sg2{animation-delay:-2.13s}
@keyframes aTw2{50%{opacity:.3}}
#shop .fc .cat{width:36px;height:34px}
#shop .fc .cat svg,#shop .fc .cat .tlw,#shop .fc .cat .eyw{position:absolute;left:0;top:0}
#shop .fc .cat .tlw{width:36px;height:34px;transform-origin:24px 30px;animation:aTail 3s ease-in-out infinite;font-style:normal}
#shop .fc .cat .eyw{width:36px;height:34px;transform-origin:18px 13px;animation:aBlink 5s infinite;font-style:normal}
#shop .cta::after{left:-60%;transform:skewX(-18deg);animation:aSh2 3.6s ease-in-out infinite}
@keyframes aSh2{0%,55%{transform:translateX(0) skewX(-18deg)}100%{transform:translateX(475%) skewX(-18deg)}}
/* hareketli içeriği saran süzgeç (filter) her karede yeniden hesaplanır: gölge ve parıltı sabit katmanlarla yapılır */
#shop .itm .pc,#shop .dm .gem{filter:none}
#shop .itm::before{content:"";position:absolute;left:50%;top:86px;width:76px;height:14px;margin-left:-38px;border-radius:50%;background:radial-gradient(ellipse,rgba(8,4,40,.55),rgba(8,4,40,0) 70%);z-index:1}
#shop .rem::before{inset:-9%;box-shadow:none;border-radius:50%;background:radial-gradient(circle closest-side,rgba(0,0,0,0) 68%,var(--nc) 79%,rgba(0,0,0,0) 100%);opacity:.6}
#shop .fc .awn{animation:none}
/* gündüz sahnesi (V0.9.3): ışıklar yanmaz, gökyüzünde güneş, bulut ve kuşlar var */
#shop .hub.day .sky{background:linear-gradient(180deg,#4DA6F5 0%,#79C2FA 36%,#B1E0FF 66%,#E3F5FF 90%,#FFF1CF 100%)}
#shop .hub.day .ground{background:linear-gradient(180deg,#9CA2F0 0%,#7378D6 100%)}
#shop .hub.day .ground::before{background:repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 30px),repeating-linear-gradient(0deg,rgba(255,255,255,.16) 0 1px,transparent 1px 20px)}
#shop .hub.day .fc .lmp{background:#D9D1F4;box-shadow:none}
#shop .hub.day .fc .pool{display:none}
#shop .hub.day .fc .door{box-shadow:inset 0 0 0 4px var(--t1)}
#shop .hub.day .fc .wall::after{background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,0)) left/13px 100% no-repeat,linear-gradient(270deg,rgba(255,255,255,.2),rgba(255,255,255,0)) right/13px 100% no-repeat}
#shop .hub.day .lts.lg{display:none}
#shop .hub.day .lts:not(.lg){opacity:.8;filter:saturate(.55)}
#shop .sun{position:absolute;right:34px;top:70px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 38% 36%,#FFFDE8,#FFE680 55%,#FFC83D)}
#shop .sun::before{content:"";position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(255,238,160,.75),rgba(255,238,160,0) 65%);animation:aSunGlow 6s ease-in-out infinite}
@keyframes aSunGlow{50%{transform:scale(1.18);opacity:.7}}
/* gündüz gökyüzü (V0.9.8, kullanıcı: "bulutlar ve kuşlar dükkânın önünde olmasın, çok hızlı, çok basit, kaydırırken duruyor"): bulutlar ve kuşlar dükkânların ARKASINDA, çatı hattının üstündeki gökyüzünde
   yavaş akar (iki derinlik, üç bulut biçimi, kanat çırpan kuşlar); bulut gölgeleri dükkânların ve sokağın üstüne düşer (aynı hızda). Hepsi bileşende (transform) çalışır ve kaydırırken de akar. */
#shop .skyb,#shop .skyf{position:absolute;left:0;right:0;top:0;pointer-events:none;overflow:hidden}
#shop .skyb{height:150px}
#shop .skyf{height:calc(var(--hz) + 150px);z-index:8}
#shop .skyb .tr,#shop .skyf .tr{position:absolute;left:0;top:0;height:100%;animation:skyDrift 150s linear infinite}
@keyframes skyDrift{to{transform:translateX(-50%)}}
#shop .skyb .cl{position:absolute}
#shop .skyb .cl svg{display:block}
#shop .skyf .csh{position:absolute;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(26,18,96,.4) 0,rgba(26,18,96,.24) 46%,rgba(26,18,96,0) 72%)}
#shop .skyf .csh.g{background:radial-gradient(ellipse at 50% 50%,rgba(40,30,130,.45) 0,rgba(40,30,130,.26) 46%,rgba(40,30,130,0) 72%)}
#shop .skyb .flk{position:absolute;left:0;animation:skyFly 78s linear infinite}
@keyframes skyFly{from{transform:translateX(-130px)}to{transform:translateX(calc(var(--sw,296px) + 50px))}}
#shop .skyb .bird{position:absolute;animation:skyBob 2.6s ease-in-out infinite}
@keyframes skyBob{50%{transform:translateY(-4px) rotate(-3deg)}}
#shop .skyb .bird i{position:absolute;top:0;display:block}
#shop .skyb .bird i svg{display:block}
#shop .skyb .bird .l{transform-origin:100% 100%;animation:wingL .52s ease-in-out infinite alternate}
#shop .skyb .bird .r{transform-origin:0 100%;animation:wingR .52s ease-in-out infinite alternate}
@keyframes wingL{from{transform:rotate(24deg)}to{transform:rotate(-36deg)}}
@keyframes wingR{from{transform:rotate(-24deg)}to{transform:rotate(36deg)}}
/* kayan yıldız: ince bir iz, 6-7 saniyede bir kısa çizer */
#shop .shoot{position:absolute;width:84px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);opacity:0;pointer-events:none;animation:aShoot 19s linear infinite}
#shop .shoot::after{content:"";position:absolute;right:-2px;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgba(255,255,255,.85)}
@keyframes aShoot{0%{opacity:0;transform:translate(0,0) rotate(27deg)}1.2%{opacity:1}6%{opacity:0;transform:translate(170px,86px) rotate(27deg)}100%{opacity:0;transform:translate(170px,86px) rotate(27deg)}}
/* geçişler (V0.9.3): mağazaya giriş ve çıkış, dükkâna girip çıkış, dükkânlar arası geçiş, ürün belirişi ve satın alma sıçraması */
#shop,#shop.on{transition:none}
@keyframes stFade{from{opacity:0}to{opacity:1}}
@keyframes stFadeOut{from{opacity:1}to{opacity:0}}
/* V0.9.4: sahne sol-üst köşeden değil ekranın ortasından yakınlaşır (translate telafisi; --vw ve --vh ekranın boyudur) ve daha belirgindir */
@keyframes stIn{from{transform:translate(calc(var(--vw,0px) * -.07),calc(var(--vh,0px) * -.07)) scale(calc(var(--k,1) * 1.14))}to{transform:scale(var(--k,1))}}
@keyframes stOut{from{transform:scale(var(--k,1))}to{transform:translate(calc(var(--vw,0px) * .035),calc(var(--vh,0px) * .035)) scale(calc(var(--k,1) * .93))}}
#shop.on{animation:stFade .38s ease-out backwards}
#shop.leaving{animation:stFadeOut .36s ease-in both}
#shop.on .stg{animation:stIn .85s cubic-bezier(.16,1,.3,1) backwards}
#shop.leaving .stg{animation:stOut .36s cubic-bezier(.45,0,.8,.5) both;pointer-events:none}
/* ısınma (V0.9.9): menü boştayken mağaza bir kez, gözle görünmez (opaklık 0,006) ve dokunulamaz biçimde baştan sona oynatılır; ilk gerçek girişte efektler, yazılar ve katmanlar hazır olur.
   Animasyonlar çalışır (#shop:not(.on) onları durdurur, burada geri açılır); #shop'un kendi opaklığına dokunan stFade/stFadeOut kullanılmaz (tam görünür parlardı). */
.scr.warm{opacity:.006;visibility:visible;pointer-events:none}
.scr.warm *{pointer-events:none!important}
#shop.warm{opacity:.006;visibility:visible;pointer-events:none}
#shop.warm *{pointer-events:none!important;animation-play-state:running!important}
#shop.warm .stg{animation:stIn .85s cubic-bezier(.16,1,.3,1) backwards}
#shop.warm.wout .stg{animation:stOut .36s cubic-bezier(.45,0,.8,.5) both}
/* Oyun sonu (V0.12.1, kullanıcı seçimi): önce ikinci şans kadranı (dilimler, süre çizgisi), sonra kadran küçülür ve alt sayfa gelir. Duraklatma oyunu kapatmayan alt pencere. */
#app.ovr .hud{opacity:0}
#app.ovr .hud *{pointer-events:none!important}
#over{padding:0}
#cont{display:none!important}
.ovtop{position:absolute;left:16px;right:16px;top:18px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;opacity:0;transition:opacity .25s}
#over.ch .ovtop{opacity:1}
.ovc{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;pointer-events:none;width:var(--ow,170px)}
.ovc .big-score{font-size:var(--os,56px)}
.ovc .eyebrow,.ovc .delta{font-size:var(--fs-14);transition:opacity .2s}
#over.end .ovc .eyebrow,#over.end .ovc .delta{opacity:0;height:0;overflow:hidden}
.ovch{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 20px;text-align:center;pointer-events:none;transition:opacity .2s}
#over.end .ovch{opacity:0}
.ovhc{pointer-events:auto;border:0;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;border-radius:50%;
  background:radial-gradient(circle at 34% 26%,#B7A9FF,#8E7CF2 60%,#7563E6);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 0 0 1.5px rgba(255,255,255,.25),inset 0 -10px 18px rgba(40,20,120,.22),0 10px 22px rgba(109,88,224,.32);transition:transform .18s var(--ease)}
.ovhc[hidden]{display:none}.ovhc:active{transform:scale(.93)}.ovhc svg{fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.ovhc small{font:600 var(--fs-14)/1 var(--font-display);color:#fff}
.ovsay[hidden]{display:none}#over:not(.ch) .ovsay{opacity:0}
#over.hc .ovc .eyebrow,#over.hc .ovc .big-score{display:none}
.ovhc.fine{width:var(--hcd,96px);height:var(--hcd,96px);background:var(--surface);color:var(--btn);box-shadow:0 0 0 1.5px var(--lilac-soft),0 6px 16px rgba(109,88,224,.14)}.ovhc.fine svg{width:30%;stroke:var(--btn);stroke-width:2}.ovhc.fine small{color:var(--ink-2);font-size:var(--fs-12)}
.ovsay{position:absolute;left:0;right:0;margin:0;pointer-events:none;transition:opacity .2s;text-align:center;font:800 var(--fs-16)/1.2 var(--font-body);color:var(--ink-2)}.ovsay .a{color:var(--lilac)}.ovsay .c{color:#E0A21E}
.ovcoin{display:inline-flex;align-items:center;gap:5px;margin-right:auto}.ovcoin .ic{width:15px;height:15px;color:var(--peach)}#over:not(.ch) .ovtop .ovcoin{display:none}
.ovcd{margin:0;font-weight:800;font-size:var(--fs-14);color:var(--btn)}
.ovsheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px 20px 22px;border-radius:30px 30px 0 0;background:var(--surface);box-shadow:0 -8px 28px rgba(40,25,110,.16);transform:translateY(106%);transition:transform .42s var(--ease);visibility:hidden}
#over.end .ovsheet{transform:none;visibility:inherit}
.ovgrab{width:44px;height:5px;border-radius:3px;background:var(--track)}
.ovhead{font-family:var(--font-display);font-weight:600;font-size:var(--fs-20);text-align:center}
.ovhead.gold{color:var(--gold-ink)}
.ovline{margin:-6px 0 0;font-weight:800;font-size:var(--fs-14);color:var(--ink-2);text-align:center}
.ovsheet .btn.big{width:100%}
.ovrow{width:100%;display:flex;gap:10px}
.ovrow .btn{flex:1;min-width:0;padding:0 10px}
.btn.soft{background:var(--bg);color:var(--ink-2);box-shadow:none;font-size:var(--fs-16)}
#pause{justify-content:flex-end;padding-bottom:20px}
.pwin{width:min(100%,380px);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px 16px;border-radius:28px;background:var(--surface);box-shadow:0 12px 30px rgba(40,25,110,.22)}
.scr.on .pwin{animation:pwinIn .26s var(--ease) backwards}
@keyframes pwinIn{from{transform:translateY(30px);opacity:0}}
.pwin #resumeBtn{flex:1.7}
html.calm .scr.on .pwin{animation-duration:1ms}
html.calm .ovsheet{transition:none}
/* Kadran menü (V0.12.0): halka dilimleri canvas'ta (drawMenuRing), etiketler gerçek düğmeler (placeMenu konumlar). Süreli'de Cehennem katmanı bileşende kayar: tek kez çizilir, kare başına yalnız transform yazılır. */
#menu{touch-action:none}
.mset{position:absolute;inset:0;pointer-events:none}
#mSet2{opacity:0}
.mset.live .mback{pointer-events:auto}
/* etiketler görünmez düğmelerdir (ekran okuyucu ve öğretim için): yazı dilimin içinde canvas'tadır (kullanıcı: "yazılar sırıtmış, sığmamış"), dokunuşu dilim alır, yana kaydırma kesilmesin */
.mlab{position:absolute;left:0;top:0;transform:translate(-50%,-50%);border:0;border-radius:15px;padding:0;background:none;color:transparent;font-size:1px;pointer-events:none}
.mlab.dot::after,.mlab.gdot::after{content:'';position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--rose);border:2px solid var(--surface)}
.mlab.gdot::after{background:#F4B63F}
.mcen{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;pointer-events:none}
.mcen .title{font-size:var(--mt,34px)}
.mcen small{font-weight:800;font-size:var(--fs-14);color:var(--ink-2);max-width:var(--mw,160px)}
.mback{border:0;color:#fff;cursor:pointer;padding:0;width:var(--mbd,96px);height:var(--mbd,96px);border-radius:50%;justify-content:center;gap:1px;
  background:radial-gradient(circle at 34% 26%,rgba(255,255,255,.34),rgba(255,255,255,.1) 58%,rgba(255,255,255,.05));
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 0 0 1.5px rgba(255,255,255,.26),inset 0 -10px 18px rgba(0,0,0,.14),0 12px 28px rgba(0,0,0,.3);
  transition:opacity .7s var(--ease),transform .18s var(--ease),box-shadow .3s}
.mback svg{width:38%;height:auto;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.mback small{color:#fff;font-family:var(--font-display);font-weight:600;font-size:calc(var(--mbd,96px) * .15);letter-spacing:.02em}
.mback:active{transform:translate(-50%,-50%) scale(.93)}
/* öğrenilene kadar spot gibi nefes alır (dışa yayılan halka + parıltı); ilk basıştan sonra sakin ve yarı saydam (kullanıcı 2026-11-12) */
.mback.nw::before,.mback.nw::after{content:"";position:absolute;inset:-2px;border-radius:50%;pointer-events:none}
.mback.nw::before{border:2px solid rgba(255,255,255,.7);animation:mbHalo 1.9s var(--ease) infinite}
.mback.nw::after{background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%);animation:mbGlow 1.9s ease-in-out infinite}
@keyframes mbHalo{0%{transform:scale(1);opacity:.85}80%,100%{transform:scale(1.45);opacity:0}}
@keyframes mbGlow{50%{opacity:.25}}
.mback.ln{opacity:.5}
.mback.ln:active{opacity:.95}
html.calm .mback.nw::before,html.calm .mback.nw::after{animation:none}
.mhint{position:absolute;left:0;right:0;margin:0;padding:0 24px;text-align:center;font-weight:800;font-size:var(--fs-14);color:#FFD2C2}
#mGlow{position:absolute;left:var(--mx,50%);top:var(--my,50%);width:560px;height:560px;margin:-280px 0 0 -280px;background:radial-gradient(closest-side,rgba(142,123,242,.22),rgba(142,123,242,0));pointer-events:none;transition:opacity .3s}
#app.playing #mGlow{opacity:0}
#mHell{position:absolute;inset:0;visibility:hidden;transform:translateX(100%);will-change:transform;pointer-events:none;background:radial-gradient(120% 55% at 50% 102%,rgba(255,120,50,.55),rgba(255,120,50,0) 100%),linear-gradient(#2B0E1C,#4A1218 60%,#7A1E14)}
#mHell.fo{transition:opacity .4s;opacity:0}
#mHell svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:36%}
#mHell i{position:absolute;bottom:-6px;width:4px;height:4px;border-radius:50%;background:#FFAA5A;animation:mEmber 7s linear infinite}
#mHell i:nth-of-type(1){left:12%;animation-delay:-1s}
#mHell i:nth-of-type(2){left:30%;animation-delay:-4s;animation-duration:9s}
#mHell i:nth-of-type(3){left:47%;animation-delay:-2.5s;animation-duration:6s}
#mHell i:nth-of-type(4){left:64%;animation-delay:-5.5s}
#mHell i:nth-of-type(5){left:78%;animation-delay:-3s;animation-duration:10s}
#mHell i:nth-of-type(6){left:90%;animation-delay:-6.5s;animation-duration:8s}
@keyframes mEmber{0%{transform:translateY(0);opacity:0}12%{opacity:.8}100%{transform:translateY(-62vh);opacity:0}}
html.calm #mHell i{animation:none;opacity:0}
/* Öğretim (V0.11.1): ince çizgi el dokunulacak yeri gösterir, çevresi düğmenin kendi şeklinde açık kalarak kararır (kullanıcı: "eliptik değil, butonun şeklinde"); katman dokunuşu tutmaz (dokunuşu window yakalaması süzer). Sakin kipte el durur. */
#app.obr #pauseBtn{visibility:hidden}
#obFx{position:absolute;inset:0;z-index:390;display:none;overflow:hidden;pointer-events:none}
#obFx.on{display:block}
#obFx .d{position:absolute;left:var(--sx);top:var(--sy);width:var(--sw);height:var(--sh);border-radius:var(--sr);box-shadow:0 0 5px 200vmax rgba(42,35,71,.36);opacity:0;transition:opacity .22s}
#obFx.dim .d{opacity:1}
/* menü dilimi: spot dilimin kendi yay şeklidir (kullanıcı 2026-11-18: "Maraton'a tıklatırken yuvarlak spot çıkıyor, aydınlattığı bölgenin şeklini almıyor") */
#obFx .s{position:absolute;inset:0;width:100%;height:100%;display:none;opacity:0;transition:opacity .22s}#obFx.arc .s{display:block}#obFx.arc.dim .s{opacity:1}#obFx.arc .d{display:none}
#obFx .s .m{fill:rgba(42,35,71,.36)}#obFx .s .o{fill:none;stroke:rgba(255,255,255,.75);stroke-width:2}
/* ilk vuruş (kullanıcı seçimi 2026-11-12, "C · Dokunma alanı"): pime değil ekrana dokunulduğu, halkanın altında parlayan geniş alanla öğretilir */
#obFx .z{display:none;position:absolute;left:var(--zx);top:var(--zy);width:var(--zw);height:var(--zh);border-radius:28px;box-sizing:border-box;border:2px dashed rgba(255,142,92,.6);background:rgba(255,142,92,.12);animation:obZone 1.25s ease-in-out infinite}
#obFx.zone .z{display:block}
#obFx.zone .d{display:none}
@keyframes obZone{0%,40%,100%{background:rgba(255,142,92,.12);border-color:rgba(255,142,92,.55)}18%{background:rgba(255,142,92,.3);border-color:rgba(255,142,92,.95)}}
html.calm #obFx .z{animation:none}
#obFx .h{position:absolute;left:var(--hx);top:var(--hy);width:0;height:0}
#obFx .h b{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;box-sizing:border-box;border:3px solid rgba(108,85,224,.8);will-change:transform,opacity;animation:obRing 1.25s ease-out infinite}
#obFx .f{position:absolute;left:-24px;top:-8px;width:60px;height:60px;will-change:transform;transform-origin:40% 13%;animation:obTap 1.25s ease-in-out infinite}
#obFx .f svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 6px rgba(42,35,71,.28))}
#obFx .f path{fill:#fff;stroke:#6C55E0;stroke-width:.62;stroke-linejoin:round}
@keyframes obTap{0%,50%,100%{transform:translate(9px,18px) rotate(-10deg)}18%,30%{transform:rotate(-10deg) scale(.95)}}
@keyframes obRing{0%,14%{transform:scale(.6);opacity:0}16%{opacity:1}64%,100%{transform:scale(2.1);opacity:0}}
#obFx.flip .f{left:-36px;transform-origin:60% 13%}

const wideAt = (tm, L, tier) => {
  const x = Math.min(WIDE_TAB.length - 1, Math.max(0, tm / CFG.maxTime * (WIDE_TAB.length - 1))), i = Math.min(WIDE_TAB.length - 2, Math.floor(x)), f = x - i;
  const tb = WIDE_TAB[i] * (1 - f) + WIDE_TAB[i + 1] * f, n = (tb - WIDE_TAB[WIDE_TAB.length - 1]) / (WIDE_TAB[0] - WIDE_TAB[WIDE_TAB.length - 1]);
  const w = tier && tier.wide ? tier.wide : [WIDE_TAB[WIDE_TAB.length - 1], WIDE_TAB[0]];
  let v = w[0] + (w[1] - w[0]) * n;
  if (v < 1) v = 1 - (1 - v) * (0.6 + 0.4 * Math.min(1, Math.max(0, ((L || 10) - 1) / 3)));
  return v;
};

const Platform = {
  native: NATIVE,
  haptic(kind) {
    if (!save.vib) return;
    const H = plugin('Haptics');
    if (H) {
      try {
        if (kind === 'light') H.impact({ style: 'LIGHT' });
        else if (kind === 'medium') H.impact({ style: 'MEDIUM' });
        else if (kind === 'heavy') H.impact({ style: 'HEAVY' });
        else if (kind === 'warn') H.notification({ type: 'WARNING' });
        else if (kind === 'error') H.notification({ type: 'ERROR' });
      } catch (e) {}
      return;
    }
    const pat = { light: 8, medium: 14, heavy: [18, 30, 40], warn: 28, error: [30, 40, 60] }[kind];
    try {
      if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
      if (navigator.vibrate) navigator.vibrate(pat);
    } catch (e) {}
  },
  track(name, params) { try { if (window.console && console.debug) console.debug('[kp]', name, params || ''); } catch (e) {} },
  rewardedAd(done) {
    if (activeReward) { done(false, 'busy'); return; }
    const A = plugin('AdMob'), el = $('ad'), bar = $('adFill');
    if (!A && !DEMO_ADS) { done(false, 'fail'); return; }   /* yayın derlemesinde "reklam gösterilmeden ödül" yolu yoktur (V0.10.3) */
    if (!A) {
      const t0 = performance.now(), dur = CFG.adSeconds * 1000;
      bar.style.width = '0%'; show(el);
      const step = () => {
        const p = Math.min(1, (performance.now() - t0) / dur);
        bar.style.width = (p * 100).toFixed(1) + '%';
        if (p < 1) requestAnimationFrame(step); else { hide(el); done(true); }
      };
      requestAnimationFrame(step);
      return;
    }
    $('adBadgeEl').textContent = t('adBadgeReal'); $('adTextEl').textContent = t('adLoading');
    el.classList.add('real'); bar.style.width = '35%'; show(el);
    const handles = [];
    let settled = false, earned = false, timer = 0, showRequested = false, cancelled = false;
    const finish = (ok, why) => {
      if (settled) return;
      settled = true; clearTimeout(timer);
      handles.forEach(h => { try { h.remove(); } catch (e) {} });
      el.classList.remove('real'); hide(el);
      $('adBadgeEl').textContent = t('adBadge'); $('adTextEl').textContent = t('adText');
      activeReward = null;
      done(ok && !cancelled, cancelled ? 'cancelled' : why);
    };
    /* Native reklam ekrandaysa yeni istek eski olayları tüketmesin: kapanışa kadar kilitli. */
    activeReward = () => { if (showRequested) cancelled = true; else finish(false, 'cancelled'); };
    const listen = async (name, cb) => {
      const h = await A.addListener(name, () => { if (!settled) cb(); });
      if (settled) { try { await h.remove(); } catch (e) {} return false; }
      handles.push(h); return true;
    };
    timer = setTimeout(() => finish(false, 'fail'), 25000);
    (async () => {
      try {
        if (!(await adMobInit(A))) { finish(false, 'fail'); return; }
        if (settled) return;
        if (!(await listen('onRewardedVideoAdShowed', () => { clearTimeout(timer); timer = setTimeout(() => finish(false, 'fail'), 180000); }))) return;
        if (!(await listen('onRewardedVideoAdReward', () => { earned = true; }))) return;
        if (!(await listen('onRewardedVideoAdDismissed', () => finish(earned, earned ? 'ok' : 'closed')))) return;
        if (!(await listen('onRewardedVideoAdFailedToShow', () => finish(false, 'fail')))) return;
        if (!(await listen('onRewardedVideoAdFailedToLoad', () => finish(false, 'fail')))) return;
        await A.prepareRewardVideoAd({ adId: ADS.rewardedId, isTesting: ADS.test });
        if (settled) return;
        showRequested = true;
        const item = await A.showRewardVideoAd();
        if (!settled && item) earned = true;
      } catch (e) { finish(false, 'fail'); }
    })();
  }
};

  else if (G.missRun >= 2 && now - G.lastRoast > 2) txt = pickLine('again');
  else if (now - G.lastRoast > 4 && Math.random() < 0.45) txt = pickLine('miss');
  if (txt) G.lastRoast = now; else { txt = t('miss'); kind = 'miss'; }
  pop(txt, kind);
};

/* Can (yedek): halkada yeşil "+" hedefi vurulursa kazanılır, en fazla 1. Süre bitince kendiliğinden devreye girer. */
const grantLife = () => {
  if (G.life) return;
  G.life = true; G.lifeFx = 1; pop(t('lifeGot'), 'hype'); Snd.life(); Platform.haptic('medium');
};
const revive = () => {
  G.life = false; G.time = 3; G.slow = Math.max(G.slow, 3); G.slowMul = CFG.contSlowMul; G.lifeFx = 1;
  pop(t('lifeSaved'), 'hype'); Snd.life(); Platform.haptic('heavy'); flash('peach', 0.22); shake(0.3);
  burst(view.cx, view.cy, 30, [P.life, P.peach, P.lilac], 300);
  G.rips.push({ x: view.cx, y: view.cy, t: 0, max: 0.8, r0: view.r * 0.3, r1: view.r * 1.3, c: P.life });
  Platform.track('life_saved', { level: G.L });
};
const lethal = () => { if (G.practice) { G.time = CFG.maxTime; return; } if (G.ob) { obLethal(); return; } if (G.life) revive(); else die(); };

const miss = () => {
  const sn = obSnap();
  loseGold();
  if (G.practice) { pop(t('pracMiss'), 'miss'); Snd.ui(); return; }
  const pm = phaseMod(G.ph, G.L);
  if (G.glove > 0) {
    G.glove--; pop(t('shieldSave'), 'perfect'); Snd.ui(); Platform.haptic('light');
    return;
  }
  if (G.bl) { blHurt(1); return; }
  const was = G.combo;
  resolveMiss(G, CFG.missCost * LV().miss * pm.pen);
  G.perf = 0; G.missRun++;
  shake(0.2); flash('rose', 0.14);
  scold(was);
  Snd.miss(); Platform.haptic('warn');
  if (obTeach(1, sn)) return;
  if (G.time <= 0) lethal();
};

const trap = p => {
  const sn = obSnap();
  loseGold();
  G.chal.fail = true;
  const pm = phaseMod(G.ph, G.L);
  if (G.glove > 0) {
    G.glove--; pop(t('shieldSave'), 'perfect'); Snd.ui(); Platform.haptic('light');
    return;
  }
  if (G.bl) {
    if (window.__blLog) window.__blLast = p ? (p.mill != null ? 'kanat' : p.thorn ? 'diken' : p.alarm ? 'alarm' : p.tw === 'kayanT' || (p.amp && p.prio) ? 'kayanT' : p.ghost ? 'hayaletT' : 'tuzak') : '?';   /* ölçüm kancası (tools/bl-fair.mjs), oyunda boş */
    blHurt(p && p.red ? 1 : 2, t('alarm'));
    if (G.mode === 'play' && p && p.alarm) { pop(t('popAlarmReset'), 'roast'); spawnChallenge(false); }
    return;
  }
  const was = G.combo;
  resolveMiss(G, (p && p.pen != null ? p.pen : CFG.trapCost) * LV().trap * pm.pen);
  G.perf = 0; G.missRun++;
  shake(p && p.spook ? 0.6 : 0.4); flash('rose', 0.24);
  pop(t('alarm'), 'near'); Snd.alarm(); Platform.haptic('error');
  if (p && p.narrow) { G.narrow = 3; pop(t('narrow'), 'miss'); }
  if (p && p.cursed) {
    G.coinsJ -= MECH.cursedCoins; pop(t('popCoin', { n: MECH.cursedCoins }), 'miss');
    const q = pinXY(p); burst(q.x, q.y, 22, [TOX, '#3BD654', '#7A3BD6'], 200); fxRing(q.x, q.y, TOX, 70, 0.6);
  }
  if (p && p.fake) { G.chal.broken = true; pop(t('popChain'), 'miss'); }
  if (p && p.spook) { const q = pinXY(p); burst(q.x, q.y, 18, [P.rose, '#FFFFFF', '#FFC2D6'], 200); G.fxs.push({ type: 'reveal', a: p.c0, t: 0, max: 1.0, trap: true }); }
  if (was >= COMBO.tiers[0]) pop(pickLine('broke'), 'roast');
  if (obTeach(2, sn)) return;
  if (G.time <= 0) { lethal(); return; }
  if (p && p.alarm) { pop(t('popAlarmReset'), 'roast'); spawnChallenge(false, G.kind); }
};

/* auto: otomatik joker ayarı açıkken oyun kendisi kullandı (V0.9.2): "akıllı hamle" puanı yok, yalnızca elle kullanım ödüllenir. */
const useTool = (id, auto) => {
  if (G.mode !== 'play' && !(G.mode === 'hold' && G.hold === 'joker' && id === 'kron')) return;
  const s = save.tools[id];
  if (!s || !isEq(id) || (G.bl && id === 'kron')) return;
  if (s.n <= 0) { toast(t('toolEmpty')); return; }
  s.n--; persist();
  const e = TOOL[id].eff(s.l);
  if (id === 'steto') G.boostT = Math.max(G.boostT, e);
  else if (id === 'kron') G.time = Math.min(CFG.maxTime, G.time + e);
  else if (id === 'kalkan') G.glove += e;
  else if (id === 'kum') { G.slow = Math.max(G.slow, e); G.slowMul = 0.65; }
  const smart = G.adv === id;
  pop((auto ? t('autoTag') + ' · ' : '') + toolDesc(id, e), 'perfect');
  if (smart) { G.adv = null; G.advT = 0; if (!auto) { G.score += 25; G.scorePulse = 1; pop(t('smartMove'), 'hype'); } }
  G.usedAny = true; if (!auto) save.seen.jokerUse = (save.seen.jokerUse | 0) + 1;
  Snd.tool(); Platform.haptic('medium');
  updateTools(); updateHud();
  const bb = toolsEl.querySelector('.tool[data-tool="' + id + '"]');
  if (bb) { bb.classList.remove('bump'); void bb.offsetWidth; bb.classList.add('bump'); }
  if (save.ob === OB_JOKER) { G.hold = ''; if (G.mode === 'hold') G.mode = 'play'; if (!G.bl) { G.time = Math.max(G.time, 8); G.tvis = Math.max(G.tvis || 0, G.time); } save.ob = G.bl ? 0 : OB_BL; G.obEnd = G.pt + OB_BL_T; persist(); }   /* joker bir kez gösterilir; süre 8'e çıkar, 3 sn sonra öğretici yumuşakça biter */
  Platform.track('tool_use', { id, level: s.l, smart, auto: !!auto });
};
/* Akıllı joker: işe yarayacağı an parlar ve büyür; aynı anda yalnızca biri önerilir. Otomatik joker ayarı (save.autoJ) açıksa parladıktan AUTO_AT sn sonra kendiliğinden kullanılır;
   o sürede oyuncu kendisi dokunabilir (akıllı hamle puanı onda). Ayar kapalıyken jokerleri yalnızca oyuncu kullanır. */
const AUTO_AT = 0.7;
const adviceFor = () => {
  const have = id => isEq(id) && save.tools[id].n > 0 && (G.advCool[id] || 0) <= G.clock;
  const hellNew = G.ph === 'hell' && G.hellAge < 3 && hellK(G.L) >= 0.2;
  if (have('kron') && G.time <= 2.5) return 'kron';
  if (have('kalkan') && G.glove <= 0 && (G.missRun >= 2 || hellNew)) return 'kalkan';
  if (have('steto') && G.boostT <= 0 && (G.hw < 0.24 || hellNew)) return 'steto';
  if (have('kum') && G.slow <= 0 && (G.omega > 3.3 || G.missRun >= 2)) return 'kum';
  return null;
};
const updateAdvice = dt => {
  if (G.adv) {
    G.advT += dt;
    if (adviceFor() !== G.adv || G.advT > 6) { G.advCool[G.adv] = G.clock + (G.advT > 6 ? 12 : 4); G.adv = null; G.advT = 0; }
    else if (save.autoOwn && save.autoJ && G.advT >= AUTO_AT) useTool(G.adv, true);
  }
  if (!G.adv) {
    const a = adviceFor();
    if (a) { G.adv = a; G.advT = 0; G.lastAdv = a; Snd.adv(); Platform.haptic('light'); }
  }
};

/* Bir koşunun coin kazancı: ham puan, kıl payı ve yolculuk coinleri birlikte kademe çarpanıyla çarpılır (V0.9.0). */
const runCoins = (raw, near, coinsJ, lv) => Math.max(0, Math.round((Math.floor((raw || 0) / CFG.coinDiv) + (near || 0) * CFG.nearCoin + Math.floor(coinsJ || 0)) * lv.coin));
const die = () => {
  if (G.mode !== 'play') return;
  G.mode = 'dead'; G.deadT = RM ? 0.6 : 0.85 * BURN.slow; G.tail = null;
  startBurn();
  toolsEl.classList.remove('on');
  const w = G.omega * (G.slow > 0 ? CFG.contSlowMul : 1);
  /* ışınlanma pininde ibre kapıya varmadan ya da kapıdayken "hedefe şu kadar kala" demek yanıltır */
  const viaGate = G.kind === 'isin' && (!!G.tun || G.pins.some(p => p.kind === 'portal' && p.portal === 'in' && aheadOf(p.c0) < aheadOf(G.ta)));
  const inside = !viaGate && angd(G.ang, G.ta) <= G.hw;
  const secs = viaGate ? 0 : (norm((G.ta - G.ang) * G.dir) - G.hw) / w;
  G.nearMsg = inside ? t('overInside') : (secs > 0 && secs <= 0.6 ? t('overClose', { s: f1(Math.max(0.1, secs)) }) : '');
  shake(0.5); flash('rose', 0.3); Snd.over(); Platform.haptic('error');
  if (G.bl) { blDie(); return; }
  save.run = null; G.adv = null;
  G.newBest = !G.campRun && G.score > bestNow();
  if (G.newBest) save.bests[save.lvl] = G.score;
  save.bestL = Math.max(save.bestL, G.L);
  if (!G.runCounted) {
    save.runs++; G.runCounted = true;
    save.low = G.n < 10 ? save.low + 1 : 0;
    if (save.lvl === 'normal') save.high = G.n >= 60 ? save.high + 1 : 0;
    if (save.lvl === 'usta') save.highU = G.n >= 60 ? save.highU + 1 : 0;
  }
  const total = runCoins(G.raw, G.near, G.coinsJ, LV());
  G.gain = total - G.coinsGiven; G.coinsGiven = total; save.coins += G.gain;
  if (!save.tut && G.n >= CFG.tutHits) save.tut = true;
  persist(); refreshStats();
  Platform.track('run_end', { score: G.score, hits: G.n, near: G.near, combo: G.maxCombo, diff: save.lvl, level: G.L, phase: G.ph, camp: G.campRun, continued: G.continued, kind: G.kind });
};

/* Oyun sonu başlığı: rekor ve uzun oyunda övgü, çok kısa oyunda laf, aksi halde düz "Süre bitti". */
const overMood = () => {
  if (G.newBest && G.n >= 10) return ['gold', pickLine('overGood')];
  if (G.n >= 40) return ['good', pickLine('overGreat')];
  if (G.n < 5) return ['bad', pickLine('overBad')];
  return ['', t('over')];
};
const showOver = () => {
  if (G.bl) { blShowOver(); return; }
  G.mode = 'over'; G.overAt = performance.now();
  const [mood, line] = overMood();
  const ovT = $('ovTitle'); ovT.textContent = line; ovT.className = 'eyebrow' + (mood ? ' mood ' + mood : '');
  $('ovHead').textContent = line; $('ovHead').classList.toggle('gold', mood === 'gold');
  countUp($('ovScore'), G.score, 600);
  const gold = G.newBest && G.score > 0 && G.n >= 10;
  $('ovScore').classList.toggle('gold', gold);
  if (gold && G.score >= CFG.recMin) spawnConf(150, { x0: 10, x1: view.w - 10, y0: -14, vx: 50, vy0: 70, vy1: 70, delay: 0.1, spread: 1.2, life: 3.2 });
  const d = $('ovDelta');
  d.hidden = G.score === 0;
  if (G.newBest && G.score > 0) { d.textContent = t('newBest'); d.className = 'delta win' + (gold ? ' gold' : ''); }
  else if (G.campRun) { d.textContent = t('campRun'); d.className = 'delta'; d.hidden = false; }
  else { d.textContent = t('toBest', { n: Math.max(1, bestNow() - G.score) }); d.className = 'delta'; }
  const nm = $('ovNear');
  if (G.nearMsg) { nm.textContent = G.nearMsg; nm.hidden = false; } else { nm.hidden = true; }
  const coinIcon = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--peach);width:16px;height:16px"><circle class="f" cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="5.2" fill="none" stroke-width="2.4" style="stroke:var(--peach-soft)"/></svg>';
  const isHell = save.lvl === 'cehennem';
  const chips = ['<span class="chip sm' + (isHell ? ' x' : '') + '">' + (isHell ? t('lv_cehennem') + ' · ' : '') + t('overLevel', { n: G.L }) + '</span>'];
  if (G.gain > 0) chips.push('<span class="chip sm">' + coinIcon + '<b>+' + G.gain + '</b></span>');
  const st = $('ovStats');
  st.innerHTML = chips.join(''); st.hidden = chips.length === 0;
  $('ovTop').innerHTML = chips.join('');
  $('ovLine').textContent = (d.hidden ? '' : d.textContent) + (G.nearMsg ? (d.hidden ? '' : ' · ') + G.nearMsg : '');
  const canCont = G.contN < CFG.contMax && G.n >= 3, cost = contCost(G.contN), adOk = G.contN < CFG.contAds;
  contEl.hidden = !canCont; contEl.classList.remove('fade');
  $('contSub').textContent = '+' + CFG.contTime + ' ' + SN + (G.contN >= CFG.contMax - 1 ? ' · ' + t('contLast') : (G.contN >= 1 ? ' · ' + t('contNth', { n: G.contN + 1 }) : ''));
  $('coinCost').textContent = String(cost);
  $('coinBtn').setAttribute('aria-disabled', save.coins < cost ? 'true' : 'false');
  $('adBtn').hidden = !adOk; contActsEl.classList.toggle('one', !adOk);
  contLeft = canCont ? CFG.contWait + 0.4 : 0; setCd();
  $('live').textContent = t('overSr', { n: G.score });
  G.banner = null; G.reform = 0; app.classList.add('ovr');
  if (G.burn) G.burn.ch = [];   /* çember dilimlerle geri gelirken yanan parçalar üstünde uçuşmasın; kor sürer */
  ovStage(canCont ? 'ch' : 'end');
  show(overEl);
};

const contMaxNow = () => (G.bl ? BL_P.cont : CFG.contMax);
const contAdsNow = () => (G.bl ? Math.min(BL_P.contAds, BL_P.cont) : CFG.contAds);   /* reklamla alınabilen ikinci şans: ekran, ödül ve kadran aynı sınıra bakar */
const canContinue = (ad = false) => G.mode === 'over' && (G.bl || G.n >= 3) && G.contN < contMaxNow() && contLeft > 0 && (!ad || G.contN < contAdsNow());
const doContinue = (rewarded = false) => {
  if (rewarded ? (G.mode !== 'ad' || G.contN >= contAdsNow() || G.contN >= contMaxNow() || (!G.bl && G.n < 3)) : !canContinue()) return false;
  if (G.burn) { G.burn = null; G.reform = 0; }
  G.mode = 'play'; G.continued = true; G.contN++; G.time = CFG.contTime; G.slow = CFG.contSlow; G.slowMul = CFG.contSlowMul;
  G.combo = 0; G.tscale = 1; G.tsT = 0; G.holding = false; G.pins.forEach(p => { if (p.st === 'hold') p.st = 'wait'; });
  const g0 = primaryPin();
  if (G.kind === 'isin') {
    /* ışınlanma pininde ibre çıkış kapısından başlar: hedefe giden yol hep serbest */
    G.tun = null; G.emerge = 0; G.pins.forEach(p => { if (p.kind === 'portal') p.prev = null; });
    const po = outPortal(); if (po) G.ang = po.c0;
  } else if (g0) G.ang = norm((g0.kind === 'hold' ? g0.c0 : pinCenter(g0)) - G.dir * 1.3);
  const g1 = G.pins.find(p => p.kind === 'gate' && !p.done && p.ring === 1);
  if (g1) G.ang2 = norm(pinCenter(g1) - G.dir2 * 1.3);
  G.vel = NaN; G.vel2 = NaN;   /* ibre yeni yerinden hedef hızla başlar */
  G.gateT = 0;
  hide(overEl); ovStage(''); app.classList.remove('ovr');
  toolsEl.classList.add('on');
  if (G.bl) blContinue(); else pop('+' + CFG.contTime + ' ' + SN, 'perfect');
  Snd.ui(); relayout(false); updateHud();
  Platform.track('continue', { score: G.score });
};

const pause = () => {
  if ((G.mode !== 'play' && G.mode !== 'count' && G.mode !== 'intro')/*NOPAUSE*/) return;
  if (G.practice) { endPractice(true); return; }

};

    const pts = []; let x = view.w * (0.06 + 0.88 * (i + rr() * 0.7) / 5), y = view.h + 4;
    const len = view.h * (0.1 + 0.12 * rr());

const drawEnv = c => {
  const T = G.ec;
  if (thWx > 0.01) {
    /* V0.9.12: ateş parıltısı ve kenar karartması (ekran boyu iki degrade) artık DOM katmanıdır (#hfx): canvas'ta her karede yeniden çizilmeleri Cehennem'de kareyi 22 ms'ye çıkarıyordu (≈45 fps), katman bir kez çizilir. Çatlaklar ve kor canvas'ta kalır. */

/* ---------- Bölümler (V1.1): 80 bölüm, 16 kilit, dalga ve can; tasarım docs/bolumler-plani.md, canlı görünüm docs/bolumler-80.html ----------
   Bölüm verisi bolumler-80.html'deki phases() kuralının aynısıdır (orada değişirse burada da değişmeli). Dalga, Süreli motorunun tur kurucusunu (spawnChallenge) kullanır:
   her dalgada bir "ana" kilit kurulur, diğer kilitlerin hedefe giydirilen özellikleri (kayma, nefes, hayalet) eklenir, hedef sayısı basamağa göre tamamlanır. Süre yoktur; ıska 1, tuzak 2 can. */
/* YENİ PARKUR (2026-11-24, kullanıcı planı): her hedef çeşidi bir parkur, her parkur 11 bölüm (PK_ROWS). Eski 11 kilitlik düzen (satırlar aşağıda BL_GR_OLD)
   yalnız eski araçlar ve Bölüm kurgusu verisi için durur; oyunda bölümleri pkWave kurar. */
const BL_GR_OLD = [
  ['tek', 'tuzak', 'cift'], ['kayan', 'kayanT', 'kayan2'], ['nefes', 'diken', 'nefes2', 4, 'donen'], ['kasa', 'alarm', 'karisik'], ['gelgit', 'girdap', 'kaybant'], ['degirmen', 'hizkanat', 'degk'], ['ani', 'yalanci', 'yakin', 3, 'nefesc'], ['hayalet cift', 'hayaletT', 'hayalet2'], ['nabiz', 'tuzak', 'nabizk', 3, 'ayna'], ['isin', 'tuzak', 'isin2'], ['serit', 'kilitli', 'seritk']];
const BL_GR = [['sabit'], ['nefes'], ['kayan'], ['hayalet'], ['degirmen']];
const BL_K = 11;   /* parkur başına bölüm */
const blK5 = k => clamp(Math.ceil(k * 5 / BL_K), 1, 5);   /* 11 bölümü eski 5 basamaklı ayar tablolarına (BL_M, BL_P.gold) eşler */
const BL_N = BL_GR.length * BL_K, BL_MODS = ['donen', 'donen2', 'yayilan', 'nefesc', 'ayna'];
const blGi = nm => BL_GR_OLD.findIndex(r => r[0].split(' ')[0] === nm);
const blGName = g => t('pk_g' + g);
const BL_SOON = [];
/* şimdilik hiçbir bölümde olmayan parçalar (kullanıcı 2026-11-17: "kara delik şeysini şimdilik hiçbir bölüme koyma"); kod ve laboratuvar Tool'u yerinde */
const BL_OFF = ['girdap'];
const BL_G0 = [[['tek'], ['tek'], ['tek']], [['tek'], ['cift'], ['cift']], [['cift'], ['cift', 'tuzak'], ['tek', 'cift', 'tuzak']], [['cift', 'tuzak'], ['tek', 'cift', 'tuzak', 'dar'], ['cift', 'tuzak2']], [['cift', 'tuzak'], ['uc3', 'tuzak'], ['uc3', 'tuzak2', 'dar']]];
const blOwn = (g, k) => {
  if (g === 0) return BL_G0[k - 1][2].slice();
  const r = BL_GR_OLD[g], tg = r[0].split(' ');
  if (k >= 2) tg.push(r[1]);
  if (k >= 3) tg.push(r[2]);
  if (k === 5) tg.push('dar', 'tuzak2');
  if (r[3] && k >= r[3]) tg.push(r[4]);
  if (k === 4 && g >= 3) tg.push('donen');
  if (k === 5 && g >= 3) tg.push(g >= 5 ? 'donen2' : 'donen');
  if (r[0] === 'degirmen' && k >= 3) tg.push('deg3');
  if (r[0] === 'kasa' && k >= 2) tg.push('kyon');   /* Kasa'da ibre kendiliğinden yön değiştirir (eski Yön kilidinden, kullanıcı 2026-11-16) */
  if (g === 1 && k === 5) tg.push('tuzakk');
  return tg;
};
const blLv = (g, k) => (g < 0 ? null : { n: g * 5 + k, g, t: blOwn(g, k) });
const blOther = (g, k, ex, salt) => { const c = []; for (let h = (g > 2 ? 1 : 0); h < g; h++) if (h !== ex) c.push(h); return c.length ? c[(g * 7 + k * 3 + salt * 5) % c.length] : null; };
const BL_TRAPT = ['tuzak2', 'tuzak', 'kayanT', 'alarm', 'hayaletT', 'yalanci'], BL_COMP = [['nefes'], ['kayan'], ['hayalet'], ['gelgit']].map(([x]) => [x, blGi(x)]);
const blFixT = (tg, g) => {
  if (!tg.includes('degirmen')) return tg;
  const cap = tg.includes('deg3') ? 0 : 1, out = [];
  let keep = 0, cut = 0;
  for (const x of tg) {
    if (BL_TRAPT.includes(x)) { const n = x === 'tuzak2' ? 2 : 1; if (keep + n <= cap) { keep += n; out.push(x); } else if (keep < cap) { keep++; out.push('tuzak'); cut++; } else cut++; }
    else out.push(x);
  }
  if (cut) { const c = BL_COMP.find(([k, h]) => h <= g && !out.includes(k)); if (c) out.push(c[0]); }
  return out;
};
const blPhases = (g, k) => {
  if (g === 0) return BL_G0[k - 1].map((tg, i) => ({ t: tg.slice(), from: 0 }));
  const me = blOwn(g, k), late = BL_GR_OLD[g][2];
  const bas = me.filter(x => x !== 'tuzak2' && x !== 'dar' && !(k <= 4 && x === late) && x !== 'donen2' && !(k <= 4 && x === 'donen'));
  let A, B;
  const O = (s, e) => blOther(g, k, e, s);
  if (g === 1) { const M = [[[0, 2], [0, 3]], [[0, 3], [0, 4]], [[0, 4], [0, 5]], [[0, 5], [1, 3]], [[1, 4], [0, 5]]][k - 1]; A = blLv(...M[0]); B = blLv(...M[1]); }
  else if (k === 1) { A = blLv(g - 1, 2); B = blLv(g - 1, 3); }
  else if (k === 2) { A = blLv(g - 1, 3); const h = O(1, g - 1); B = h == null ? blLv(g - 1, 4) : blLv(h, 3); }
  else if (k === 3) { A = blLv(g - 1, 4); const h = O(2, g - 1); B = h == null ? blLv(g - 1, 5) : blLv(h, 4); }
  else if (k === 4) { const h1 = O(3, -1); A = blLv(h1 == null ? g - 1 : h1, 4); const h2 = O(4, A.g); B = blLv(h2 == null ? g - 1 : h2, 5); }
  else { A = blLv(g - 1, 5); const h = O(5, g - 1); B = h == null ? blLv(g - 1, 5) : blLv(h, 5); }
  const gI = blGi('isin'), gD = blGi('degirmen');
  if (g === gI && k === 3) A = blLv(blGi('kasa'), 5);
  if (g === gI && k === 5) { const d = blLv(gD, 4); A = { n: d.n, g: gD, t: d.t.filter(x => x !== 'deg3') }; B = blLv(gD, 5); }
  if (A.n > B.n) { const z = A; A = B; B = z; }
  const strip = tg => tg.filter(x => x !== 'dar' && !(k <= 3 && BL_MODS.includes(x)));
  const mix = o => {
    let tg = Array.from(new Set(me.concat(strip(o.t))));
    if (tg.includes('serit') && tg.some(x => x === 'isin' || x === 'isin2')) { tg = tg.filter(x => x !== 'isin' && x !== 'isin2'); if (!tg.includes('nefes')) tg.push('nefes'); }
    return tg;
  };
  const son = mix(B);
  if (g === 2 && (k === 3 || k === 5) && !son.includes('nefes2')) son.push('nefes2');
  return [{ t: blFixT(bas, g), from: 0 }, { t: blFixT(mix(A), g), from: A.n }, { t: blFixT(son, g), from: B.n }].map(p => ({ t: p.t.filter(x => !BL_OFF.includes(x)), from: p.from }));
};
const blGK = n => ({ g: Math.floor((n - 1) / BL_K), k: (n - 1) % BL_K + 1 });
/* Kalıcı kimlik: kilit adı + basamak (yeni kilit sona eklenince numaralar kayabilir, kimlik kaymaz) */
const blId = n => { const { g, k } = blGK(n); return 'p' + BL_GR[g][0] + k; };   /* 'p' öneki: eski kilit kimlikleriyle (kayan3...) karışmasın */
const blSoon = n => !(n >= 1 && n <= BL_N) || BL_SOON.includes(BL_GR[blGK(n).g][0].split(' ')[0]);
const blStars = n => (save.bl.st[blId(n)] | 0);

/* Etiketten motor kilidine: Süreli motorunda karşılığı olan kilitler. Önce yapısal kilitler (turun biçimini belirler), sonra hedefe giydirilenler. */
const BL_KIND = { kasa: 'kasa', isin: 'isin', gelgit: 'gelgit', hayalet: 'hayalet', nefes: 'nefes', kayan: 'kayan', cift: 'cift', tek: 'tek', uc3: 'tek' };
