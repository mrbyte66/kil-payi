<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayar Laboratuvarı</title>
<!-- Kıl payı · AYAR LABORATUVARI (kullanıcı 2026-11-12: "Oyunu her zaman burdan yöneteceğiz, seninle anlaşabilme arayüzümüz").
     Kaynak lab/lab.html; DEBUG derlemesinde build.sh www/lab.html yapar (yayına girmez). Sayfalar: Oyun fiziği, Oyun tasarımı, Görünüm,
     Oyuncular, Analiz, Fikirler, Ayarlar. Solda gerçek oyun (index.html?lab) seçili bölümü oynar; gizli çerçevede (#meas) bot tohumlu ölçer.
     Analiz: koşular sanal canla kaydedilir (hata olayları), can/hasar/ikinci şans/yıldız hesapla yeniden oynatılır, reklam ve bırakma
     kararları ayarlanabilir davranış modeliyle (S.B, oyuncu tipleri S.PS) tohumlu Monte Carlo. Kullanıcı ayarları localStorage 'kp-lab',
     ölçümler 'kp-lab-meas'. Önerilen değerler = oyunun kendi değerleri (açılışta okunur). -->
<style>
:root{--bg:#17132d;--sf:#221d42;--sf2:#2e2757;--ln:#3a3268;--ink:#f3f0ff;--ink2:#b6acdf;--ink3:#8076b0;--lil:#8e7bf2;--pea:#ff8e5c;--gold:#f2b73c;--ok:#7bc8a4;--bad:#f0657a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select{font:inherit;color:inherit;cursor:pointer}
.hd{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:14px;padding:9px 16px 0;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:800;white-space:nowrap}
.top h1 span{color:var(--pea)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{border:0;background:transparent;padding:7px 11px 9px;border-bottom:3px solid transparent;color:var(--ink2);font-weight:600}
.nav button.on{color:var(--ink);border-bottom-color:var(--pea)}
.ctx{display:flex;align-items:center;gap:10px;padding:7px 16px;flex-wrap:wrap;border-top:1px solid rgba(58,50,104,.6)}
.ctx.off{display:none}
.ctx select,.sel{background:var(--sf2);border:1px solid var(--ln);border-radius:9px;padding:4px 8px;color:var(--ink)}
.steps{display:flex;gap:3px;flex-wrap:wrap}
.steps i{width:14px;height:6px;border-radius:3px;background:var(--ln);cursor:pointer}
.steps i.on{background:var(--pea)} .steps i.done{background:var(--lil)}
.chips{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.chips button{border:0;border-radius:11px;padding:4px 10px;background:var(--sf2);line-height:1.15;font-size:13px;text-align:left}
.chips button small{display:block;color:var(--ink3);font-size:10.5px}
.chips button.on{background:var(--lil);color:#fff} .chips button.on small{color:#e6e0ff}
.btn{border:0;border-radius:999px;padding:8px 15px;background:var(--sf2);font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.12)} .btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--pea);color:#2a1408}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn.ghost{background:transparent;border:1px solid var(--ln)}
.main{display:grid;grid-template-columns:minmax(250px,340px) 1fr;gap:16px;padding:14px 16px}
.main.np{grid-template-columns:1fr}.main.np .phone{display:none}
.phone{position:sticky;top:112px;align-self:start}
.phone .fr{width:100%;aspect-ratio:9/18.5;border-radius:26px;overflow:hidden;border:6px solid var(--sf2);background:#000}
.phone iframe{width:100%;height:100%;border:0;display:block}
.pc{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink2)}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--sf);border-radius:16px;padding:12px 15px}
.card.pgoff{display:none}
.card>header{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.card>header h2{font-size:14.5px;margin:0;flex:1}
.card>header .chev{color:var(--ink3);transition:transform .2s}
.card.closed>header .chev{transform:rotate(-90deg)}
.card.closed>.body{display:none}
.card .body{margin-top:8px}
h3.sec{font-size:13px;margin:14px 0 4px;color:var(--ink2);font-weight:700}
p.d{margin:0 0 8px;color:var(--ink2);font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.row{display:grid;grid-template-columns:190px 1fr 74px 68px;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(58,50,104,.5)}
.row:last-child{border-bottom:0}
.row.hid{opacity:.45}
.row label{color:var(--ink2);font-size:13px;line-height:1.25}
.row label small{display:block;color:var(--ink3);font-size:11px}
.row input[type=range]{width:100%;accent-color:var(--pea)}
.rw{position:relative;display:flex;align-items:center}.rw input{position:relative}
.rw::before,.rw::after{content:'';position:absolute;top:50%;height:10px;margin-top:-5px;border-radius:5px;pointer-events:none;z-index:2;background:repeating-linear-gradient(45deg,rgba(240,101,122,.8) 0 3px,rgba(240,101,122,.15) 3px 6px)}
.rw::before{left:0;width:var(--a)}.rw::after{left:var(--b);right:0}.rw.hit::before,.rw.hit::after{background:rgba(240,101,122,.95)}
input[type=number],.row select{width:74px;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;color:var(--ink);padding:4px 6px}
.row .ic{display:flex;gap:2px;justify-content:flex-end}
.row .ic button{border:0;background:transparent;color:var(--ink3);width:22px;height:22px;border-radius:6px;font-size:13px;line-height:1}
.row .ic button:hover{background:var(--sf2);color:var(--ink)}
.row.mod label{color:var(--ink)} .row.mod label::after{content:" •";color:var(--pea)}
.row .pair{display:flex;gap:6px} .row .pair input{width:56px}
.sub{font-size:12px;color:var(--ink3);margin:10px 0 2px;text-transform:uppercase;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px}
th,td{padding:5px 5px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink3);font-weight:600;font-size:11.5px}
tr.on td{background:rgba(142,123,242,.16)}
td input[type=number]{width:62px;padding:3px 5px}
.tw{overflow-x:auto}
.up{color:var(--pea)} .warn{color:var(--bad)} .okc{color:var(--ok)} .amb{color:var(--gold)}
.note{font-size:12px;color:var(--ink3);margin-top:6px}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.g{background:var(--sf2);border-radius:12px;padding:8px 10px}
.g b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.g b small{display:inline;font-size:12px;color:var(--ink3);font-weight:500}
.g small{color:var(--ink3);font-size:11.5px;display:block}
.g i{display:block;height:5px;border-radius:3px;background:var(--ln);margin-top:5px;overflow:hidden}
.g i em{display:block;height:100%;background:var(--lil)}
.ob{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--ln);min-width:120px}.ob.big{height:28px;border-radius:10px;margin-top:8px}
.ob em{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:800;color:#17132d;white-space:nowrap;overflow:hidden}
.obl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 14px;margin-top:8px;font-size:12.5px}.obl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.obl small{display:block;color:var(--ink3);margin-left:15px}
.card2{background:var(--sf2);border-radius:12px;padding:10px 12px;margin-top:8px}
.g.big{grid-column:span 2;background:linear-gradient(135deg,#3b2f72,#2e2757)}
.g.big b{font-size:30px}
.badge{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--ln);color:var(--ink2)}
.badge.st{background:rgba(242,183,60,.2);color:var(--gold)}
.prog{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;flex:1;min-width:120px;max-width:300px}
.prog em{display:block;height:100%;width:0;background:var(--pea);transition:width .15s}
.chk{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:12.5px;padding:3px 0;color:var(--ink2)}
.chk b{font-weight:800}
.honest{border-left:3px solid var(--gold);background:rgba(242,183,60,.08);padding:8px 11px;border-radius:0 10px 10px 0;font-size:12.5px;color:var(--ink2);margin-top:10px}
.advice{background:var(--sf2);border-radius:12px;padding:9px 12px;margin-top:8px;font-size:13px}
.advice li{margin:2px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.idea{background:var(--sf2);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.idea .pic{background:#1b1636;display:flex;justify-content:center;padding:8px 0}
.idea .pic svg{width:150px;height:100px}
.idea .bd{padding:9px 12px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.idea h4{font-size:13.5px;margin:0}
.idea .oz{color:var(--ink2);font-size:12.5px;margin:0}
.idea details{font-size:12px;color:var(--ink3)} .idea details summary{cursor:pointer;color:var(--lil)}
.idea .meta{font-size:11.5px;color:var(--ink3);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:4px}
.idea.hid{opacity:.5}
.tag{font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.flt{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.flt button{border:1px solid var(--ln);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink2)}
.flt button.on{background:var(--lil);color:#fff;border-color:var(--lil)}
textarea{width:100%;height:80px;background:var(--sf2);border:1px solid var(--ln);border-radius:10px;color:var(--ink);font:11.5px/1.4 ui-monospace,monospace;padding:8px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--sf2);border:1px solid var(--ln);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.phone .fr{position:relative}
.dnote{position:absolute;left:8px;right:8px;top:8px;background:rgba(23,19,45,.88);border:1px solid var(--pea);border-radius:12px;padding:7px 10px;font-size:12px;line-height:1.35;color:var(--ink);opacity:0;transition:opacity .25s;pointer-events:none}
.dnote.on{opacity:1} .dnote b{color:var(--pea)}
.hk{border:0;border-radius:999px;padding:5px 11px;font-weight:800;font-size:12.5px;background:var(--sf2)}
.hk small{font-weight:600;margin-left:4px}
.tl{display:block;width:100%;height:auto;margin:4px 0 6px}
.phs{display:flex;gap:6px;margin:8px 0}
.phs button{flex:1;border:0;border-radius:11px;padding:7px;background:var(--sf2);font-weight:700}
.phs button small{display:block;font-weight:500;color:var(--ink3);font-size:11px}
.phs button.on{background:var(--lil);color:#fff}.phs button.on small{color:#e6e0ff}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tg{display:inline-flex;align-items:center;gap:5px;background:var(--sf2);border:1px solid var(--ln);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px}
.tg select{background:var(--bg);border:1px solid var(--ln);border-radius:999px;color:var(--ink);font-size:11.5px;padding:1px 4px}
.tg button{border:0;background:transparent;color:var(--ink3);width:20px;height:20px;border-radius:50%}
.tg button:hover{background:var(--bad);color:#fff}
.tg.off{opacity:.45}
.dx{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:8px}
.dxc{background:var(--sf2);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:54px 1fr;gap:10px;border-left:4px solid var(--ln)}
.dxc.bad{border-left-color:var(--bad)}.dxc.warn{border-left-color:var(--gold)}.dxc.ok{border-left-color:var(--ok)}
.dxc svg{width:54px;height:54px}
.dxc h4{margin:0 0 2px;font-size:13.5px}.dxc p{margin:0 0 6px;font-size:12px;color:var(--ink2)}
.hist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hrow{display:flex;gap:8px;font-size:12px;padding:3px 0;border-bottom:1px solid rgba(58,50,104,.5)}
.hrow>b{min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.anc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mdl{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(15,12,30,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mdl.on{display:flex}
.mbox{background:var(--sf);border:1px solid var(--ln);border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbox .pic{background:#1b1636;display:flex;justify-content:center;padding:14px 0}
.mbox .pic svg{width:300px;height:200px;max-width:90%}
.mbox .in{padding:14px 18px 18px}
.mbox h3{margin:0 0 6px;font-size:18px}
.mbox p{color:var(--ink2);font-size:13.5px;line-height:1.5}
.idea{cursor:pointer}
@media (max-width:780px){.hist{grid-template-columns:1fr}}
@media (max-width:780px){.main{grid-template-columns:1fr}.phone{position:static;max-width:300px;margin:0 auto}.row{grid-template-columns:120px 1fr 60px 64px}.two{grid-template-columns:1fr}.g.big{grid-column:span 1}}
</style>
</head>
<body>
<div class="hd">
  <div class="top"><h1>Ayar <span>Laboratuvarı</span></h1><nav class="nav" id="nav"></nav></div>
  <div class="ctx" id="ctx">
    <select id="stepSel" title="Anket adımı (kilit)"></select>
    <div class="steps" id="steps"></div>
    <div class="chips" id="tabs"></div>
    <button class="hk" id="hk" data-pg="ana" title="Bu bölümün kanca puanı (Analiz)">Kanca –</button>
    <button class="btn sm" id="prev">‹</button>
    <button class="btn sm pri" id="next">Onayla ›</button>
  </div>
</div>
<div class="main" id="main">
  <div class="phone">
    <div class="fr"><iframe id="game" title="Oyun önizlemesi"></iframe><div class="dnote" id="dnote"></div></div>
    <div class="pc">Kim oynasın <select class="sel" id="aim"></select><input type="number" id="aimMs" min="0" max="300" step="1" title="zamanlama hatası (ms)" style="width:64px"></div>
    <div class="pc"><label style="display:flex;gap:5px;align-items:center"><input type="checkbox" id="imm"> can bitmesin</label><button class="btn sm" id="again">Yeniden başlat</button><button class="btn sm ghost" id="rLv" title="Bu bölümü önerilene döndür">Bölümü sıfırla</button><button class="btn sm ghost" id="rStep" title="Bu adımın 5 bölümünü önerilene döndür">5 bölümü sıfırla</button></div>
  </div>
  <div class="panel" id="panel"></div>
</div>
<iframe id="meas" title="ölçüm" style="position:absolute;width:390px;height:844px;left:-5000px;top:0;border:0"></iframe>
<div class="toast" id="toast"></div>
<div class="mdl" id="mod"><div class="mbox" id="mbox"></div></div>
<script>
const $ = id => document.getElementById(id);
const TIER = ['Kolay', 'Orta', 'Usta', 'Usta++', 'Cehennem'], R2D = 180 / Math.PI;
const fr = $('game'), mf = $('meas');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v, d) => Number(v).toFixed(d).replace('.', ',');
const cp = o => JSON.parse(JSON.stringify(o));
const iv = (v, a, b) => clamp(Math.round(v), a, b);
let K = null, S = null, REC = null, step = 0, lv = 1, groups = [], gIdx = {}, restartT = 0, winT = 0, IDEAS = [];
const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800); };

/* ---------- sayfalar ---------- */
const PAGES = [['fizik', 'Oyun fiziği'], ['kurgu', 'Bölüm kurgusu'], ['tasarim', 'Oyun tasarımı'], ['gorunum', 'Görünüm'], ['oyuncu', 'Oyuncular'], ['ana', 'Analiz'], ['fikir', 'Fikirler'], ['yedek', 'Yedekte'], ['ayar', 'Ayarlar']];
const NOPHONE = { ana: 1, fikir: 1, ayar: 1 }, NOCTX = { fikir: 1, ayar: 1 };

/* ---------- oyuncu tipleri ve davranış modeli (önerilenler) ---------- */
/* sg: zamanlama hatası (sn), av: tuzaktan kaçınma, pay: nüfus payı %, ad: reklam eğilimi, pat: sabır, need: zorluk ihtiyacı,
   tg: hedef kitle ağırlığı (kanca ve teşhis bu tipi ne kadar önemsesin: refleks oyununun asıl kitlesi orta-usta arası; çok acemiyi memnun etmek için asıl kitleyi sıkmayalım) */
const PS0 = [
  { id: 'ideal', nm: 'İdealist', sg: 0, av: 1, pay: 0, ad: 0, pat: 0, need: 1, tg: 0 },
  { id: 'kusursuz', nm: 'Kusursuz', sg: 0.012, av: 1, pay: 1, ad: -0.3, pat: 0.6, need: 1, tg: 0.4 },
  { id: 'pro', nm: 'Pro', sg: 0.02, av: 1, pay: 4, ad: -0.2, pat: 0.5, need: 0.9, tg: 0.7 },
  { id: 'usta', nm: 'Usta', sg: 0.03, av: 0.95, pay: 10, ad: 0, pat: 0.4, need: 0.8, tg: 1 },
  { id: 'iyi', nm: 'İyi', sg: 0.05, av: 0.9, pay: 20, ad: 0.1, pat: 0.2, need: 0.6, tg: 1 },
  { id: 'orta', nm: 'Orta', sg: 0.08, av: 0.75, pay: 35, ad: 0.2, pat: 0, need: 0.4, tg: 1 },
  { id: 'acemi', nm: 'Acemi', sg: 0.10, av: 0.65, pay: 20, ad: 0.1, pat: -0.3, need: 0.25, tg: 0.45 },
  { id: 'yeni', nm: 'Yeni başlayan', sg: 0.12, av: 0.5, pay: 10, ad: -0.1, pat: -0.6, need: 0.15, tg: 0.15 }
];
/* önerilenler sektör kaynaklarına göre (Analiz › Gerçeklik çapası): ödüllü reklam teklif kabulü %35-70, bölüm başına kaçak en çok %20 */
const B0 = { gauss: 1, tgt: 1, skMu: 65, skSd: 0.45, sdAd: 0.9, sdPat: 0.7, adBase: 0.40, kProg: 2.0, kInv: 0.6, kStreak: 0.25, kFat: 0.35, fill: 0.92, adLen: 30, coinP: 0.05, adShift: 0,
  quit: 0.12, kEarly: 1.2, kQS: 0.45, maxAtt: 8, boreMiss: 3, tW0: 0.20, tW1: 0.40, tQ: 0.15, tB: 0.20, tK: 0.45,
  /* basamağa göre hedefler (Kolay → Cehennem doğrusal): ilk denemede canı biten, reklam izleyen, bırakan; tDrift: her kilit grubunda biraz daha zor */
  tF1: 0.22, tF5: 0.62, tDrift: 0.003, tWa1: 0.09, tWa5: 0.35, tQ1: 0.04, tQ5: 0.28,
  eCPM: 4, sessions: 2.2, sessMin: 5, blShare: 0.6, players: 5000, churn: 0.5, sens: 0.6 };

/* ---------- adımlar ---------- */
const STEPS = () => [{ g: 0, t: 'Bölüm merdiveni (Tek ve çift)', d: 'Düz pimde 5 basamağın hızı ve genişliği: 1. Kolay → 5. Cehennem. Bu merdiven bütün kilitlerin temeli.' }]
  .concat(groups.slice(1).map(x => ({ g: x.g, t: x.name + ' kilidi', d: x.name + ': her bölüm, merdivendeki aynı basamak kadar zor olmalı.' })))
  .concat([{ g: -1, t: 'Son: efektler, yüzde ve özet', d: 'Ortadaki yüzde, dönen ışık ve diğer efektler.' }]);
const curG = () => { const st = STEPS()[step]; return st && st.g >= 0 ? st.g : 0; };
const curN = () => curG() * 5 + lv;
const idOf = n => K.blId(n);

/* ---------- değer tanımları (tek kayıt: etiket, aralık, okuma, yazma) ---------- */
const P_ = (k, ad, sub, u, min, max, st, get, set) => ({ k, ad, sub, u, min, max, st, get, set });
const physDefs = () => [

const honesty = () => `<details class="note" style="margin-top:10px"><summary style="cursor:pointer;color:var(--lil)">Denklemler</summary>

const dxList = (n, r, s, m, stale) => {

  step = Math.min(saved && saved.step | 0 || 0, STEPS().length - 1); S.step = step;
  normalize(S);

};
